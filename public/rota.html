/* ============================================================
   ROTA — Tasarım Sistemi (Kurumsal Lacivert + Turuncu)
   Referans: ROTA-TASARIM-REFERANS.html / 02-ROTA-TASARIM-TOKENLARI.css
   Değişken ADLARI korunur (1400+ kullanım); yalnız değerler referansa eşlendi.
   Turuncu = marka + bekleyen işlem. Yeşil = olumlu/tahsilat. Kırmızı = gecikme/borç.
   Ölçek: 4px. Yarıçap: 7 / 10 / 14 / 16. Saf siyah yok.
   ============================================================ */
:root{
  /* Lacivert marka tonları (sol menü, vurgu blokları) */
  --navy-950:#101828; --navy-900:#17233A; --navy-800:#344054; --navy-700:#475467;
  --navy-line:#243047; --navy-hover:#1D2939; --navy-text:#CFD7E3; --navy-muted:#98A2B3;

  /* Yüzeyler */
  --canvas:#F6F8FB;
  --surface:#FFFFFF;
  --surface-muted:#F6F8FB;
  --surface-sunk:#EEF2F6;
  --line:#E4E9F0;
  --line-strong:#CFD7E3;

  /* Mürekkep */
  --ink:#101828;
  --ink-2:#657186;
  --ink-3:#7B8799;

  /* Signal — marka turuncusu: "şu an burada / bekleyen işlem" */
  --signal:#FF6B16;
  --signal-soft:#FFF1E8;
  --signal-ink:#E95B0B;

  /* Durum */
  --ok:#0D7A4A;      --ok-soft:#EAF7F0;
  --risk:#B42318;    --risk-soft:#FDF0EE;
  --hold:#B76E00;    --hold-soft:#FFF6E5;
  --hold-glow:#F5B93B;
  --info:#3157B7;    --info-soft:#EDF2FF;

  --shadow-sm:0 2px 8px rgba(11,24,48,.04);
  --shadow-md:0 10px 35px rgba(11,24,48,.07);

  /* Yarıçap ölçeği */
  --radius-sm:7px; --radius-md:10px; --radius-lg:14px; --radius-xl:16px;
  --sidebar-w:248px;

  /* Kategori halkaları — gelir yeşil, gider kırmızı rampası */
  --cat-g1:#14532D; --cat-g2:#15803D; --cat-g3:#16A34A; --cat-g4:#22C55E; --cat-g5:#5BD98B;
  --cat-r1:#7F1D1D; --cat-r2:#B91C1C; --cat-r3:#DC2626; --cat-r4:#EF4444; --cat-r5:#F87171;
  --cat-none:#94A3B8;

  /* Haftalık plan — proje renkleri (dolgu / kenar / yazı) */
  --pj1:#DCFCE7; --pj1b:#86EFAC; --pj1f:#14532D;
  --pj2:#EDE9FE; --pj2b:#C4B5FD; --pj2f:#4C1D95;
  --pj3:#FFEDD5; --pj3b:#FDBA74; --pj3f:#7C2D12;
  --pj4:#DBEAFE; --pj4b:#93C5FD; --pj4f:#1E3A8A;
  --pj5:#FCE7F3; --pj5b:#F9A8D4; --pj5f:#831843;
  --pj6:#CCFBF1; --pj6b:#5EEAD4; --pj6f:#134E4A;

  /* ---- Tipografi ---- */
  /* Arayüz: DM Sans 400–700. Başlıklar ve para/rakamlar: Manrope 700–800 (tabular). */
  --font-family-base:'Inter Variable','Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --font-weight-regular:400; --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
  --font-size-body:14px; --font-size-table:14px; --font-size-caption:13px;
  --font-size-financial:14px; --font-size-kpi:26px;
  /* Eski belirteçler: display/mono → Manrope (başlık + rakam), body → DM Sans */
  --font-display:'Manrope Variable','Manrope','Inter',system-ui,Arial,sans-serif;
  --font-body:var(--font-family-base);
  --font-mono:'Inter Variable','Inter','Segoe UI',system-ui,Arial,sans-serif;   /* finansal rakamlar: Inter 650 tabular */

  /* --- Tipografi belirteçleri --- */
  --fw-regular:var(--font-weight-regular); --fw-medium:var(--font-weight-medium);
  --fw-semibold:var(--font-weight-semibold); --fw-bold:var(--font-weight-bold);
  --fs-kucuk:12px; --fs-ikincil:var(--font-size-caption); --fs-govde:var(--font-size-body);
  --fs-tutar:var(--font-size-financial); --fs-kpi:var(--font-size-kpi);

  /* Eski değişken adları için eşleme (satır içi stiller bozulmasın) */
  --bg:var(--canvas); --sidebar-bg:var(--surface); --card-bg:var(--surface);
  --input-bg:var(--surface); --text:var(--ink); --text-muted:var(--ink-2);
  --accent:var(--ink); --accent-light:var(--surface-sunk); --accent-hover:var(--ink);
  --green:var(--ok); --green-light:var(--ok-soft);
  --red:var(--risk); --red-light:var(--risk-soft);
  --amber:var(--signal); --amber-light:var(--signal-soft);
  --border:var(--line); --shadow:var(--shadow-sm);
}
html.dark{
  --canvas:#101828; --surface:#17233A; --surface-muted:#1D2939; --surface-sunk:#243047;
  --line:#2E3A50; --line-strong:#475467;
  --ink:#F2F4F7; --ink-2:#CFD7E3; --ink-3:#98A2B3;
  --navy-950:#0B1220; --navy-900:#101828; --navy-800:#344054; --navy-700:#475467;
  --navy-line:#1F2A40; --navy-hover:#1D2939;
  --signal:#FF8A4C; --signal-soft:#3A2410; --signal-ink:#FFB380;
  --ok:#4ADE80; --ok-soft:#0F2A1C;
  --risk:#F87171; --risk-soft:#301515;
  --hold:#FACC15; --hold-soft:#2E2408;
  --hold-glow:#FACC15;
  --info:#8DB0FF; --info-soft:#152648;
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 6px 24px rgba(0,0,0,.6);
  --cat-g1:#4ADE80; --cat-g2:#22C55E; --cat-g3:#16A34A; --cat-g4:#15803D; --cat-g5:#0F5F2E;
  --cat-r1:#FCA5A5; --cat-r2:#F87171; --cat-r3:#EF4444; --cat-r4:#DC2626; --cat-r5:#B91C1C;
  --cat-none:#64748B;
  --pj1:#14532D; --pj1b:#166534; --pj1f:#BBF7D0;
  --pj2:#2E1065; --pj2b:#5B21B6; --pj2f:#DDD6FE;
  --pj3:#431407; --pj3b:#9A3412; --pj3f:#FED7AA;
  --pj4:#172554; --pj4b:#1E40AF; --pj4f:#BFDBFE;
  --pj5:#500724; --pj5b:#9D174D; --pj5f:#FBCFE8;
  --pj6:#042F2E; --pj6b:#115E59; --pj6f:#99F6E4;
  --bg:var(--canvas); --sidebar-bg:var(--surface); --card-bg:var(--surface);
  --input-bg:var(--surface); --text:var(--ink); --text-muted:var(--ink-2);
  --accent:var(--ink); --accent-light:var(--surface-sunk); --accent-hover:var(--ink);
  --green:var(--ok); --green-light:var(--ok-soft);
  --red:var(--risk); --red-light:var(--risk-soft);
  --amber:var(--signal); --amber-light:var(--signal-soft);
  --border:var(--line); --shadow:var(--shadow-sm);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);
  font-family:var(--font-family-base);font-size:var(--font-size-body);line-height:20px;
  /* Aynı sütundaki rakamların basamakları hizalansın */
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
  -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}

/* ---------- Kabuk ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:212px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 16px;}
.brand-left{display:flex;align-items:center;gap:10px;font-family:var(--font-display);
  font-weight:700;font-size:15.5px;letter-spacing:-.2px;}
.brand-logo{width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:13px;}
.brand-status{width:6px;height:6px;border-radius:999px;background:var(--ok);}

.sidebar{transition:width .18s ease,padding .18s ease;}
/* Daraltılmış menü (yalnız masaüstü): ikon şeridi */
@media (min-width:881px){
  /* Daraltılmış modda menü şerittir; fare üzerine gelince yana açılır, içerik menünün yanında kalır */
  .shell.menu-dar #menuDarBtn{display:none;}
  .shell.menu-dar .sidebar:not(:hover){width:56px;padding:14px 6px;}
  .shell.menu-dar .sidebar:not(:hover) .brand{flex-direction:column;gap:10px;padding:2px 0 12px;}
  .shell.menu-dar .sidebar:not(:hover) .brand-ad{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .brand-tools{flex-direction:column;gap:6px;}
  .shell.menu-dar .sidebar:not(:hover) .nav button{justify-content:center;padding:0;gap:0;height:34px;}
  .shell.menu-dar .sidebar:not(:hover) .nav-item-label,
  .shell.menu-dar .sidebar:not(:hover) .nav-chevron,
  .shell.menu-dar .sidebar:not(:hover) .badge-new{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .nav-item-icon{width:auto;font-size:15px;opacity:.9;}
  .shell.menu-dar .sidebar:not(:hover) .nav button.active::before{left:-6px;}
  .shell.menu-dar .sidebar:not(:hover) .subnav{display:none !important;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-foot{align-items:center;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-user{justify-content:center;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-user > div:last-child{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .logout-link{display:none;}
}
.nav{display:flex;flex-direction:column;gap:1px;}
.nav button{display:flex;align-items:center;gap:9px;height:31px;padding:0 9px;
  border-radius:6px;font-family:var(--font-body);font-size:12.5px;font-weight:500;
  color:var(--ink-2);background:none;border:none;text-align:left;cursor:pointer;width:100%;
  position:relative;transition:background .12s,color .12s;}
.nav button:hover{background:var(--surface-sunk);color:var(--ink);}
.nav button.active{background:var(--surface-sunk);color:var(--ink);font-weight:600;}
.nav button.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;
  width:2px;background:var(--ink);border-radius:0 2px 2px 0;}
.nav-item-icon{width:18px;text-align:center;font-size:13px;opacity:.75;background:none !important;
  height:auto;display:inline;}
.nav-chevron{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .15s;}
.nav-chevron.rot{transform:rotate(90deg);}
.badge-new{margin-left:auto;font-family:var(--font-mono);font-size:9px;font-weight:600;
  padding:2px 5px;border-radius:4px;background:var(--signal-soft);color:var(--signal);}

.subnav{padding-left:25px;display:none;flex-direction:column;gap:1px;margin:1px 0 3px;}
.subnav.open{display:flex;}
.subnav button{height:27px;padding:0 9px;font-size:12px;border-radius:6px;background:none;
  border:none;text-align:left;cursor:pointer;color:var(--ink-3);font-weight:400;}
.subnav button:hover{background:var(--surface-sunk);color:var(--ink);}
.subnav button.active{color:var(--ink);font-weight:600;background:var(--surface-sunk);}

/* ---------- İçerik ---------- */
.content{flex:1;padding:18px 26px 44px;min-width:0;max-width:1480px;}
.page-head,.list-page-head{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:15px;gap:10px;flex-wrap:wrap;}
.page-title{font-family:var(--font-family-base);font-size:22px;line-height:29px;font-weight:var(--font-weight-semibold);letter-spacing:-.2px;
  letter-spacing:-.3px;margin:0;}
.page-sub{font-size:var(--font-size-caption);line-height:19px;color:var(--ink-2);margin:3px 0 0;}
.gunun-sozu{margin-top:8px;font-size:13.5px;line-height:20px;color:var(--ink);
  font-weight:600;font-style:italic;letter-spacing:.1px;
  border-left:3px solid var(--signal);padding:3px 0 3px 11px;max-width:600px;}
.gunun-sozu .tirnak{font-family:Georgia,'Times New Roman',serif;font-style:normal;
  font-size:23px;line-height:0;color:var(--signal);vertical-align:-7px;padding-right:3px;}
.gunun-sozu .tirnak.kapa{padding:0 0 0 3px;vertical-align:-9px;}

.note{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--ink);
  border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:12px;line-height:18px;color:var(--ink-2);}
.note b{color:var(--ink);font-weight:600;}

/* ---------- Butonlar ---------- */
.primary-btn{height:30px;padding:0 12px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;transition:opacity .12s;}
.primary-btn:hover{opacity:.85;}
.primary-btn:active{transform:translateY(.5px);}
.save-btn{height:30px;padding:0 16px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
.save-btn:hover{opacity:.85;}
.back-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:13px;}
.back-btn:hover{background:var(--surface-sunk);color:var(--ink);}
.btn{height:28px;padding:0 11px;border:1px solid var(--line-strong);border-radius:6px;
  font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);flex:1;}
.btn:hover{background:var(--surface-sunk);}
.btn-approve{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.btn-revise{background:var(--surface);color:var(--ink-2);}
.btn-complete{width:100%;height:34px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:12px;}
.ustlen-btn{width:100%;margin-top:8px;height:28px;border:1.5px dashed var(--signal);border-radius:6px;
  background:var(--signal-soft);color:var(--signal);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.ustlen-btn:hover{background:var(--signal);color:#fff;}
.add-task-btn,.add-line-btn{width:100%;height:30px;background:none;border:1px dashed var(--line-strong);
  border-radius:6px;color:var(--ink-3);font-size:12.5px;cursor:pointer;font-family:inherit;}
.add-task-btn:hover,.add-line-btn:hover{border-color:var(--ink-3);color:var(--ink);}
.collapse-link,.sub-add-link{background:none;border:none;color:var(--ink);font-size:12px;
  font-weight:600;cursor:pointer;padding:7px 0;display:inline-block;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line-strong);}
.collapse-link:hover,.sub-add-link:hover{text-decoration-color:var(--ink);}

/* ---------- Kartlar / ızgara ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:9px;}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:11px;
  box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
.card:hover{border-color:var(--ink-3);box-shadow:var(--shadow-md);}
.card .name{font-family:var(--font-family-base);font-weight:var(--font-weight-medium);
  font-size:var(--font-size-table);letter-spacing:0;margin-bottom:5px;line-height:1.35;}
.card .line{font-size:11.5px;line-height:17px;color:var(--ink-2);display:flex;gap:6px;}
.card .desc{font-size:11.5px;color:var(--ink-2);}
.card .code,.kcard .code{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:0;}

/* ---------- Pano (kanban) ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.board-col{min-width:200px;flex:1 1 226px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:8px;padding:9px;}
.board-col.drop{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink-3);}
.kcard.suruklenen{opacity:.4;}
.kcard[draggable="true"]{cursor:grab;}
.board-col-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;padding:2px 4px;}
.board-col-title{font-family:var(--font-display);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--ink);}
.board-col-count{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--surface);background:var(--ink-3);padding:1px 6px;border-radius:3px;}
.kcard{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px;
  margin-bottom:6px;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
.kcard:hover{border-color:var(--ink);box-shadow:var(--shadow-md);}
.kcard .client{font-family:var(--font-family-base);font-weight:var(--font-weight-medium);
  font-size:13.5px;margin:2px 0 3px;letter-spacing:0;line-height:1.35;}
.kcard .desc{font-size:11.5px;line-height:16px;color:var(--ink-2);margin-bottom:7px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);}
.due{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
.mini-avatar{width:22px;height:22px;border-radius:999px;background:var(--surface-sunk);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:9.5px;font-weight:700;border:1px solid var(--line);}

/* ---------- Rozet / etiket ---------- */
.chip,.tag,.status-pill,.pay-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;
  border-radius:4px;font-size:11px;font-weight:600;margin:0 4px 4px 0;
  font-family:var(--font-body);letter-spacing:0;}
.chip-cost,.tag.cost{font-family:var(--font-mono);background:var(--surface-sunk);color:var(--ink-2);}
.chip-pay-BEKLIYOR,.chip-appr-BEKLIYOR{background:var(--surface-sunk);color:var(--ink-2);}
.chip-pay-KISMI,.chip-appr-REVIZYON{background:var(--hold-soft);color:var(--hold);}
.chip-pay-TAMAMLANDI,.chip-appr-ONAYLANDI{background:var(--ok-soft);color:var(--ok);}
.status-Taslak{background:var(--surface-sunk);color:var(--ink-2);}
.status-Gönderildi{background:var(--signal-soft);color:var(--signal);}
.st-taslak{background:var(--surface-sunk);color:var(--ink-2);}
.st-gonderildi{background:var(--signal-soft);color:var(--signal);}
.st-kabul-edildi{background:var(--ok-soft);color:var(--ok);}
.st-faturalandi{background:var(--ok-soft);color:var(--ok);}
.st-reddedildi{background:var(--risk-soft);color:var(--risk);}
.status-Onaylandı{background:var(--ok-soft);color:var(--ok);}
.stage-badge{display:inline-flex;height:20px;align-items:center;padding:0 8px;border-radius:4px;
  background:var(--surface-sunk);color:var(--ink-2);font-family:var(--font-display);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.locked{margin-top:8px;padding:7px 9px;border-radius:6px;background:var(--signal-soft);
  color:var(--signal);font-size:11.5px;font-weight:500;}

/* ---------- Tablo ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:7px;overflow:hidden;}
th{text-align:left;font-family:var(--font-display);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--ink);padding:7px 11px;
  border-bottom:1px solid var(--line-strong);background:var(--surface-sunk);}
td{padding:0 11px;height:31px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink);}
tbody tr:hover{background:var(--surface-sunk);}
tr:last-child td{border-bottom:none;}

/* ---------- Defter listeleri ---------- */
.ledger-wrap{display:flex;gap:12px;align-items:flex-start;}
.ledger-main{flex:2.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.ledger-side{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;}
.ledger-search,.filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  height:32px;display:flex;align-items:center;gap:14px;padding:0 11px;margin:10px;
  font-size:12px;color:var(--ink-3);}
.filter-bar{margin:0 0 -1px;border-radius:9px 9px 0 0;height:36px;}
.filter-bar span{display:flex;align-items:center;gap:5px;}
.ledger-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 14px;
  border-bottom:1px solid var(--line);gap:12px;}
.ledger-row:hover{background:var(--surface-sunk);}
.ledger-row.highlight{background:var(--signal-soft);}
.ledger-row:last-child{border-bottom:none;}
.ledger-title{font-family:var(--font-family-base);font-weight:var(--font-weight-medium);
  font-size:var(--font-size-table);margin-bottom:1px;letter-spacing:0;line-height:1.4;}
.ledger-sub{font-size:11px;color:var(--ink-2);margin-bottom:1px;}
.ledger-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);}
.ledger-amount{text-align:right;font-family:var(--font-mono);font-size:var(--font-size-financial);
  font-weight:var(--font-weight-semibold);white-space:nowrap;font-variant-numeric:tabular-nums;}
.ledger-amount .kalan{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--risk);}
.ledger-amount .odendi{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--ok);}
.satir-islem{display:flex;gap:12px;justify-content:flex-end;margin-top:5px;font-size:11px;color:var(--ink-3);font-weight:500;}
.satir-islem span{cursor:pointer;user-select:none;}
.satir-islem span:hover{color:var(--ink);text-decoration:underline;}
.satir-islem .sil:hover{color:var(--risk);}
.mini-islem{cursor:pointer;color:var(--ink-3);font-size:12px;padding:0 3px;}
.mini-islem:hover{color:var(--ink);}
.mini-islem.sil:hover{color:var(--risk);}
.ledger-footer{padding:10px 16px;font-size:11.5px;color:var(--ink-3);display:flex;
  justify-content:space-between;align-items:center;border-top:1px solid var(--line);}
.empty-state{padding:22px 16px;font-size:12px;color:var(--ink-3);text-align:center;}
/* Cari Hareketleri */
.ch-liste-arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.ch-sira-sec{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
.ch-sadece{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;}
.ch-liste-toplam{display:flex;gap:18px;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;background:var(--surface-2,#f6f7f9);border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);}
.ch-virman-onizle{margin:-4px 0 12px;}
.ch-vo-satir{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;font-size:12.5px;
  background:var(--surface-sunk,#f6f7f9);border:1px solid var(--line);border-radius:7px;margin-top:6px;}
.ch-vo-satir span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);}
.ch-vo-satir b,.ch-vo-satir span:last-child{font-family:var(--font-mono);white-space:nowrap;}
.cari-ara-kutu{display:flex;align-items:center;gap:8px;margin:10px;padding:0 11px;height:32px;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-3);}
.cari-ara-kutu input{border:none;outline:none;flex:1;font-size:12.5px;background:transparent;color:var(--ink);font-family:inherit;}
.ch-yon{display:block;margin-top:3px;font-size:12px;font-weight:var(--font-weight-medium);letter-spacing:0;}
.ch-yon.tahsil{color:var(--ok);} .ch-yon.odeme{color:var(--risk);} .ch-yon.notr{color:var(--ink-3);}
.ch-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.ch-kart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
.ch-kart.vurgu{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft);}
.ch-kart h4{margin:0 0 4px;font-size:11.5px;font-weight:600;color:var(--ink-3);}
.ch-kart .deger{font-family:var(--font-mono);font-size:18px;font-weight:700;letter-spacing:-.3px;}
.ch-kart .ch-alt{font-size:10.5px;color:var(--ink-3);}
.ch-filtre{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.ch-filtre select,.ch-filtre input[type=date]{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);color:var(--ink);font-size:12px;font-family:inherit;}
.ch-tablo{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
.ch-tablo th{text-align:left;padding:9px 12px;background:var(--surface-sunk);border-bottom:1px solid var(--line);
  font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);}
.ch-tablo td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.ch-tablo tbody tr:hover{background:var(--surface-sunk);}
.ch-tablo tr:last-child td{border-bottom:none;}
.ch-tablo .ch-sag{text-align:right;font-family:var(--font-mono);}
.ch-tablo tr.ch-iptal td{opacity:.5;text-decoration:line-through;}
.ch-rozet{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;}
.ch-rozet.mor{background:#EDE9FE;color:#5B21B6;}
.ch-rozet.turuncu{background:var(--signal-soft);color:var(--signal);}
.ch-rozet.yesil{background:var(--ok-soft);color:var(--ok);}
.ch-rozet.kirmizi{background:var(--risk-soft);color:var(--risk);}
.ch-rozet.gri{background:var(--surface-sunk);color:var(--ink-2);}
.ch-durum{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
  font-weight:var(--font-weight-medium);letter-spacing:0;}
.ch-durum.yesil{background:var(--ok-soft);color:var(--ok);}
.ch-durum.kirmizi{background:var(--risk-soft);color:var(--risk);}
.ch-durum.turuncu{background:var(--signal-soft);color:var(--signal);}
.ch-durum.gri{background:var(--surface-sunk);color:var(--ink-2);}
.ch-durum.iptal{background:var(--surface-sunk);color:var(--ink-3);}
.cari-tablo-kap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.ch-tablo tr.ch-tiklanir{cursor:pointer;}
.ch-satir-btn{background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:26px;
  cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1;font-family:inherit;}
.ch-satir-btn:hover{background:var(--surface-sunk);color:var(--ink);border-color:var(--line-strong);}
.ch-satir-menu{position:fixed;z-index:120;width:212px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-md);overflow:hidden;}
.ch-satir-menu button{display:block;width:100%;text-align:left;padding:10px 13px;background:none;
  border:none;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit;}
.ch-satir-menu button:hover{background:var(--surface-sunk);}
.ch-menu-not{padding:8px 13px;font-size:11px;color:var(--ink-3);background:var(--surface-sunk);line-height:1.45;}
/* Cari aktarımı */
.akt-yol{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:11px;background:var(--surface-sunk);}
.akt-yol-bas{font-family:var(--font-display);font-weight:700;font-size:12.5px;margin-bottom:3px;}
.akt-yol-bas span{font-weight:400;color:var(--ok);font-size:11.5px;}
.akt-yol-ic{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-bottom:8px;}
.akt-alan{width:100%;height:90px;border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;
  font-family:var(--font-mono);font-size:11px;background:var(--surface);color:var(--ink);resize:vertical;margin-bottom:7px;}
.akt-durum{margin-top:4px;}
.akt-hata{background:var(--risk-soft);color:var(--risk);border-radius:7px;padding:9px 12px;font-size:12px;line-height:1.5;margin:8px 0;}
.akt-uyari{background:var(--signal-soft);color:var(--ink-2);border-left:3px solid var(--signal);border-radius:7px;
  padding:9px 12px;font-size:12px;line-height:1.5;margin:8px 0;}
.akt-uyari-liste{margin-top:6px;font-size:11.5px;line-height:1.6;max-height:120px;overflow:auto;}
.akt-denetim{background:var(--surface-sunk);border-radius:8px;padding:9px 12px;margin-top:10px;
  font-size:11.5px;line-height:1.7;color:var(--ink-2);font-family:var(--font-mono);}
.akt-bilgi{background:var(--surface-sunk);color:var(--ink-2);border-radius:7px;padding:9px 12px;font-size:12px;}
.akt-ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;}
.akt-ozet div{background:var(--surface-sunk);border-radius:8px;padding:9px 11px;text-align:center;}
.akt-ozet b{display:block;font-family:var(--font-mono);font-size:17px;font-weight:700;}
.akt-ozet span{font-size:10.5px;color:var(--ink-3);}
.akt-tutar{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-family:var(--font-mono);
  background:var(--surface-sunk);border-radius:8px;padding:9px 12px;}
.akt-tablo-kap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:260px;margin:6px 0 10px;}
.akt-tablo{width:100%;border-collapse:collapse;font-size:11.5px;}
.akt-tablo th{position:sticky;top:0;background:var(--surface-sunk);padding:7px 9px;text-align:left;
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);border-bottom:1px solid var(--line);}
.akt-tablo td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
.akt-tablo td:first-child{max-width:280px;line-height:1.35;}
.akt-tablo th:last-child,.akt-tablo td:last-child{white-space:nowrap;}
.akt-tablo .sag{text-align:right;font-family:var(--font-mono);white-space:nowrap;}
.akt-kod{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);}
.akt-devam{padding:7px 10px;font-size:11px;color:var(--ink-3);text-align:center;background:var(--surface-sunk);}
.akt-secim{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:6px 0;cursor:pointer;}
.akt-secim input{width:15px;height:15px;}
.cari-tablo-kaydir{overflow-x:auto;}
@media (max-width:880px){ .ch-kpi{grid-template-columns:1fr 1fr;} }
.group-header{display:flex;justify-content:space-between;padding:6px 13px;background:var(--surface-sunk);
  font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-2);border-bottom:1px solid var(--line);}
.filter-group{margin-bottom:20px;}
.filter-group h5{font-family:var(--font-display);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);margin:0 0 8px;}
.filter-group div{font-size:13px;padding:6px 0;color:var(--ink-2);cursor:pointer;}
.filter-group div:hover{color:var(--ink);}

/* ---------- Kasa/banka satırları ---------- */
.kb-columns{display:flex;gap:12px;align-items:flex-start;}
.kb-main{flex:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.kb-side{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.kb-row{display:flex;justify-content:space-between;padding:0 16px;height:44px;align-items:center;
  font-size:13px;border-bottom:1px solid var(--line);}
.kb-row:last-child{border-bottom:none;}
.kb-row span:last-child{font-family:var(--font-mono);font-weight:500;}
.kb-row.header{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);height:38px;background:var(--surface);}
.kb-row.header span:last-child{font-family:var(--font-display);}
.kb-row.total{background:var(--surface-sunk);font-weight:600;}
.kb-row .val-green{color:var(--ok);}

/* ---------- Formlar ---------- */
.form-page{max-width:960px;}
.form-block{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:15px 16px;margin-bottom:10px;}
.form-block h4{font-family:var(--font-display);font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);margin:0 0 12px;}
.field{margin-bottom:11px;}
.field label,.form-main-field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px;}
.field input,.field select,.field textarea,.form-main-field input,.repeat-row input,.repeat-row select{
  width:100%;height:31px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;
  font-size:12.5px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s;}
.field textarea{height:auto;padding:7px 10px;line-height:18px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus,.form-main-field input:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,17,22,.06);}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3);}
.field-row{display:flex;gap:9px;}
.field-row .field{flex:1;}
.hint{font-size:11px;color:var(--ink-3);margin:-6px 0 10px;}
.section-label{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line);}
.section-label:first-child{border-top:none;padding-top:0;margin-top:0;}
.avatar-upload{float:left;margin-right:20px;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.avatar-circle{width:80px;height:80px;border-radius:10px;background:var(--surface-sunk);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;}
.avatar-link{font-size:11.5px;color:var(--ink-2);cursor:pointer;font-weight:500;}
.form-main-field{overflow:hidden;}
.form-main-field input{height:40px;font-size:15px;font-family:var(--font-display);font-weight:600;}
.form-page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

.accordion{border-top:1px solid var(--line);}
.accordion:first-child{border-top:none;}
.accordion-head{display:flex;align-items:center;gap:10px;height:48px;cursor:pointer;
  font-family:var(--font-display);font-size:13px;font-weight:600;}
.accordion-plus{width:18px;height:18px;border-radius:4px;background:var(--surface-sunk);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:12px;
  font-weight:600;transition:transform .15s;}
.accordion-head.open .accordion-plus{transform:rotate(45deg);background:var(--ink);color:var(--surface);}
.accordion-body{display:none;padding-bottom:16px;}
.accordion-body.open{display:block;}
.sub-block{margin-bottom:16px;}
.sub-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sub-block-head h4{font-size:12px;margin:0;text-transform:none;letter-spacing:0;color:var(--ink);}
.repeat-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.repeat-row select{flex:0 0 148px;}
.repeat-row input{flex:1;}
.row-remove,.li-remove{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-3);border-radius:6px;cursor:pointer;font-size:12px;}
.row-remove:hover,.li-remove:hover{border-color:var(--risk);color:var(--risk);}
.addr-toggle{width:32px;height:18px;border-radius:999px;background:var(--ok);position:relative;flex:0 0 32px;}
.addr-toggle::after{content:'';width:14px;height:14px;border-radius:999px;background:#fff;
  position:absolute;top:2px;right:2px;}
.char-count{text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:4px;}

.type-choice{display:flex;gap:12px;max-width:520px;margin:24px auto 0;}
.type-card{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;}
.type-card:hover{border-color:var(--ink);background:var(--surface-sunk);}
.type-card .emoji{font-size:26px;margin-bottom:10px;}
.type-card .label{font-family:var(--font-display);font-weight:600;font-size:14px;}

/* ---------- Teklif satırları ---------- */
.tf-table-head{display:grid;grid-template-columns:1fr 70px 78px 100px 70px 98px 30px 24px;gap:7px;
  font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);padding:0 2px 8px;}
.tf-row{display:grid;grid-template-columns:1fr 70px 78px 100px 70px 98px 30px 24px;gap:7px;align-items:center;
  padding:7px;background:var(--surface-sunk);border-radius:7px;margin-bottom:6px;}
.tf-row.li-tasinan{opacity:.45;}
.tf-row.li-hedef{outline:2px dashed var(--signal);outline-offset:1px;}
.li-drag{cursor:grab;color:var(--ink-3);text-align:center;user-select:none;font-size:15px;line-height:1;
  padding:6px 0;border-radius:5px;touch-action:none;}
.li-drag:hover{color:var(--ink);background:var(--surface);}
.li-drag:active{cursor:grabbing;}
.li-detail-wrap{position:relative;margin-top:4px;}
.tf-row textarea.li-detail{display:block;width:100%;height:26px;min-height:26px;padding:4px 30px 4px 8px;
  border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink-2);
  font-size:11.5px;line-height:16px;font-family:inherit;resize:none;overflow:hidden;white-space:pre;box-sizing:border-box;}
.tf-row textarea.li-detail:focus{outline:none;border-color:var(--ink);}
.li-detail-wrap.acik textarea.li-detail{height:auto;min-height:66px;white-space:pre-wrap;overflow-y:auto;resize:vertical;padding-right:34px;}
.li-detail-tgl{position:absolute;right:3px;top:3px;height:20px;min-width:20px;padding:0 5px;border:0;border-radius:5px;
  background:transparent;color:var(--ink-3);font-size:10.5px;line-height:20px;cursor:pointer;display:flex;align-items:center;gap:3px;}
.li-detail-tgl:hover{background:var(--surface-sunk);color:var(--ink);}
.li-detail-tgl .ok{font-size:11px;transition:transform .15s;}
.li-detail-wrap.acik .li-detail-tgl .ok{transform:rotate(180deg);}
.tf-row input,.tf-row select{height:29px;padding:0 8px;border:1px solid var(--line-strong);
  border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;width:100%;}
.tf-row input:focus,.tf-row select:focus{outline:none;border-color:var(--ink);}
.tf-row input:disabled{background:var(--surface-sunk);color:var(--ink-3);cursor:not-allowed;}
.li-dims{grid-column:1 / -1; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:8px; padding-top:9px; border-top:1px dashed var(--line-strong);
  font-size:11.5px; color:var(--ink-3);}
.li-dims-label{font-family:var(--font-display); font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.6px; color:var(--ink-3); margin-right:2px;}
.li-dims input{width:82px !important;}
.li-dims .li-res{margin-left:auto; font-family:var(--font-mono); font-size:12.5px; font-weight:600;
  color:var(--ink); background:var(--surface); border:1px solid var(--line-strong);
  border-radius:6px; padding:6px 11px; white-space:nowrap;}
.qd-sub{display:block; font-size:10px; line-height:14px; color:#777; font-weight:400; margin-top:2px;}
.tf-totals,.totals{display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding:10px 4px 0;}
.tf-totals .grand,.totals b{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--ink);}

.islem-item{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 12px;
  background:none;border:none;text-align:left;cursor:pointer;font-size:12.5px;color:var(--ink);}
.islem-item:hover{background:var(--surface-sunk);}

@media print{
  .sidebar,.page-head,.top-right-bar,.bottom-left-bar,.form-page-footer,#islemlerMenu,.no-print,.mobile-topbar,.sidebar-backdrop{display:none !important;}
  .content{padding:0 !important; max-width:100% !important;}
  .shell{display:block !important;}
  body,html{background:#fff !important;}
  .quote-doc{border:none !important; box-shadow:none !important;}
  .quote-view-row{display:block !important;}
  .not-tab,.not-panel{display:none !important;}
  .main-col,.content,#content{width:auto !important; margin:0 !important; overflow:visible !important;}
}

/* ================= MÜŞTERİYE GİDEN TEKLİF BELGESİ (Dekant profesyonel şablon) =================
   Referans: DEKANT-Profesyonel-Fiyat-Teklifi-P005.pdf — A4 portre, 16 mm kenar boşluğu.
   Ölçüler pt cinsinden verildi: ekran önizlemesi ile yazdırma/PDF aynı oranlarda çıkar.
   Sayfa iskeleti bir tablo: thead (logo + teklif kimliği) her sayfada tekrar eder, tfoot (alt bilgi)
   her sayfanın altına sabitlenir, tbody içeriktir. Tema (gece modu) belgeyi etkilemez. */
.quote-doc{
  --offer-primary:#142033; --offer-secondary:#46556a; --offer-label:#4a586c; --offer-red:#c9271b;
  --offer-orange:#f36b21; --offer-surface:#f3f5f7; --offer-border:#d1dae5; --offer-white:#ffffff;
  --offer-legal:#5f6b7c;
  background:var(--offer-white); color:var(--offer-primary);
  font-family:'Inter Variable','Inter','Segoe UI',Arial,sans-serif; font-weight:500; font-size:7.5pt; line-height:1.45;
  border:1px solid #E4E9F0; border-radius:6px; overflow:hidden; padding:0;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
  -webkit-font-smoothing:antialiased;
}
.quote-doc *{box-sizing:border-box;}
.quote-doc .qd-para,.quote-doc .qd-num{font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1;}
.quote-doc .qd-sag{text-align:right;}
.qd-sayfa{width:100%; border-collapse:collapse; table-layout:fixed;}
.qd-sayfa>thead{display:table-header-group;}
.qd-sayfa>tfoot{display:table-footer-group;}
.qd-sayfa>thead>tr>td,.qd-sayfa>tbody>tr>td,.qd-sayfa>tfoot>tr>td{padding:0; vertical-align:top;}
.qd-govde{padding:0 16mm;}

/* üst şerit: kırmızı · turuncu · açık gri (sayfa kenarına dayalı) */
.qd-serit{display:flex; height:3.5pt; width:100%;}
.qd-serit i{display:block; height:100%;}
.qd-serit .k{width:31.5%; background:var(--offer-red);}
.qd-serit .t{width:7.5%; background:var(--offer-orange);}
.qd-serit .g{flex:1; background:var(--offer-border);}

/* kimlik alanı */
.qd-kimlik{display:flex; justify-content:space-between; align-items:flex-start; gap:24pt;
  padding:14.5mm 16mm 0; }
.qd-logo{display:block; width:58mm; max-width:46%; height:auto; margin-top:0.6mm;}
.qd-belge{text-align:right; flex-shrink:0; min-width:44mm;}
.qd-belge .ozel{font-size:6.2pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--offer-orange); line-height:1.2;}
.qd-belge .tur{font-size:18pt; font-weight:800; letter-spacing:-.01em; color:var(--offer-primary); line-height:1.15; margin:4pt 0 7pt;}
.qd-belge dl{display:grid; grid-template-columns:auto auto; column-gap:14pt; row-gap:4.4pt; justify-content:end; margin:0;}
.qd-belge dt{font-size:7pt; font-weight:500; color:var(--offer-secondary); text-align:right; line-height:1.1;}
.qd-belge dd{margin:0; font-size:7pt; font-weight:700; color:var(--offer-primary); text-align:right; line-height:1.1;}
.qd-kimlik-cizgi{border:0; border-top:1px solid var(--offer-border); margin:5mm 16mm 0;}

/* açılış metni */
.qd-acilis{margin-top:4mm;}
.qd-acilis .ust{font-size:6.5pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--offer-secondary);}
.qd-acilis h2{font-size:12.4pt; font-weight:800; color:var(--offer-primary); margin:3pt 0 4pt; line-height:1.2; letter-spacing:-.005em;}
.qd-acilis p{margin:0; font-size:7.5pt; font-weight:500; color:var(--offer-secondary); line-height:1.45;}

/* taraflar — sabit satır ızgarası: iki kartın etiket / isim satırları aynı Y'de */
.qd-taraflar{display:grid; grid-template-columns:1fr 1fr; gap:4mm; margin-top:5.5mm; align-items:stretch;}
.qd-taraf{display:grid; grid-template-rows:auto auto 1fr; align-content:start; align-items:start;
  background:var(--offer-surface); border:1px solid var(--offer-border); border-radius:4.5pt; padding:11pt 14pt 8pt; min-height:0;}
.qd-taraf .qd-etiket{font-size:6.5pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--offer-secondary); line-height:1.2; height:8pt;}
.qd-taraf .isim{font-size:9.3pt; font-weight:800; color:var(--offer-primary); line-height:1.25; margin-top:6pt; min-height:12pt; white-space:normal; overflow-wrap:anywhere; hyphens:manual;}
.qd-taraf .isim.uzun{font-size:8pt;}
.qd-taraf .satirlar{margin-top:6pt; font-size:6.3pt; font-weight:500; color:var(--offer-secondary); line-height:1.5;}
.qd-taraf .satirlar div{margin-top:3pt;}
.qd-taraf .satirlar div:first-child{margin-top:0;}
.qd-taraf .satirlar .yetkili{font-weight:700; color:var(--offer-primary);}
.qd-taraf .satirlar .ayrac{color:var(--offer-secondary); padding:0 4pt;}

/* bölüm başlığı */
.qd-bolum-bas{display:flex; justify-content:space-between; align-items:baseline; gap:12pt; margin:4mm 0 2.2mm;}
.qd-bolum-bas h3{font-size:9.2pt; font-weight:800; color:var(--offer-primary); margin:0; line-height:1.2;}
.qd-bolum-bas span{font-size:6.7pt; font-weight:500; color:var(--offer-secondary);}

/* ürün tablosu */
.qd-tablo-kap{border:1px solid var(--offer-border); border-radius:4.5pt; overflow:hidden;}
.quote-doc-table{width:100%; border-collapse:collapse; table-layout:fixed;}
.quote-doc-table thead{display:table-header-group;}
.quote-doc-table th{background:var(--offer-surface); color:var(--offer-secondary); font-size:5.9pt; font-weight:800;
  letter-spacing:.04em; text-transform:uppercase; text-align:left; padding:6.5pt 5.6pt; border-bottom:1px solid var(--offer-border); border-right:1px solid var(--offer-border); line-height:1.2;}
.quote-doc-table th:last-child,.quote-doc-table td:last-child{border-right:0;}
.quote-doc-table td{padding:8pt 5.6pt; vertical-align:middle; border-bottom:1px solid var(--offer-border); border-right:1px solid var(--offer-border); font-size:6.5pt; color:var(--offer-secondary); line-height:1.45;}
.quote-doc-table tbody tr:last-child td{border-bottom:0;}
.quote-doc-table tr{break-inside:avoid; page-break-inside:avoid;}
.quote-doc-table .qd-no{color:var(--offer-primary); font-size:7.2pt; font-weight:500;}
.quote-doc-table .qd-urun{display:block; font-size:8.5pt; font-weight:800; color:var(--offer-primary); line-height:1.25;}
.quote-doc-table .qd-alt{display:block; font-size:6.5pt; font-weight:500; color:var(--offer-secondary); margin-top:3pt;}
.quote-doc-table .qd-aciklama{white-space:pre-wrap; font-weight:500;}
.quote-doc-table .qd-sayi{font-size:7.2pt; font-weight:700; color:var(--offer-primary); white-space:nowrap;}
.quote-doc-table .qd-sayi .qd-alt{font-weight:500; white-space:nowrap;}

/* finans özeti — tablonun doğal devamı, kutusuz */
.quote-doc-totals{display:flex; justify-content:flex-end; margin-top:5.5mm;}
.qd-toplam{width:55mm;}
.qd-toplam .sat{display:flex; justify-content:space-between; align-items:baseline; gap:12pt; padding:0 0 7.5pt;}
.qd-toplam .sat span{font-size:7.1pt; font-weight:550; color:var(--offer-secondary);}
.qd-toplam .sat b{font-size:7.1pt; font-weight:700; color:var(--offer-primary);}
.qd-toplam .cizgi{border:0; border-top:1px solid var(--offer-border); margin:1pt 0 8pt;}
.qd-toplam .genel{display:flex; justify-content:space-between; align-items:baseline; gap:12pt;}
.qd-toplam .genel span{font-size:7.6pt; font-weight:750; color:var(--offer-primary);}
.qd-toplam .genel b{font-size:10.8pt; font-weight:750; color:var(--offer-primary); letter-spacing:-.005em;}
.qd-kdv-notu{text-align:right; font-size:5.4pt; font-weight:500; color:var(--offer-secondary); margin-top:3pt;}

/* ticari koşullar — sade satır listesi */
.qd-kosullar{border-top:1px solid var(--offer-border); margin-top:0;}
.qd-kosul{display:grid; grid-template-columns:42mm 1fr; gap:8pt; padding:4pt 5.6pt; border-bottom:1px solid var(--offer-border); break-inside:avoid;}
.qd-kosul b{font-size:7pt; font-weight:700; color:var(--offer-primary); line-height:1.35;}
.qd-kosul span{font-size:6.8pt; font-weight:500; color:var(--offer-secondary); line-height:1.35; white-space:pre-wrap;}

/* banka + onay */
.qd-banka-onay{display:grid; grid-template-columns:1fr 1fr; gap:12mm; margin-top:4mm; break-inside:avoid;}
.qd-mini-bas{font-size:6.5pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--offer-secondary); margin-bottom:4pt; line-height:1.2;}
.qd-banka .b{display:flex; justify-content:space-between; align-items:baseline; gap:8pt; padding:2pt 0; border-bottom:1px solid var(--offer-border);}
.qd-banka .b span:first-child{font-size:6.5pt; font-weight:700; color:var(--offer-primary); white-space:nowrap;}
.qd-banka .iban{font-size:5.9pt; font-weight:500; color:var(--offer-primary); white-space:nowrap; letter-spacing:.01em;}
.qd-onay{display:flex; flex-direction:column;}
.qd-onay .qd-mini-bas{padding-left:0;}
.qd-onay .cizgi{margin-top:auto; border-top:1px solid var(--offer-border); padding-top:6pt; text-align:center; font-size:5.8pt; font-weight:500; color:var(--offer-secondary);}
.qd-onay .bosluk{height:22pt;}

/* hukuki dipnot */
.qd-dipnot{margin:2.2mm 0 0; font-size:5.4pt; font-weight:500; color:var(--offer-legal); line-height:1.5;}
.qd-dipnot p{margin:0 0 2pt;}

/* alt bilgi (tfoot: her sayfada) */
.qd-alt-bilgi{margin:5mm 16mm 0; padding:5pt 0 4mm; border-top:1px solid var(--offer-border);
  display:flex; justify-content:space-between; align-items:flex-start; gap:12pt;}
.qd-alt-bilgi .sol b{display:block; font-size:6.2pt; font-weight:700; color:var(--offer-primary); line-height:1.4;}
.qd-alt-bilgi .sol span{display:block; font-size:5.4pt; font-weight:500; color:var(--offer-secondary); margin-top:2pt;}
.qd-alt-bilgi .sag{font-size:5.4pt; font-weight:500; color:var(--offer-secondary); text-align:right; white-space:nowrap; padding-top:1pt;}
.qd-alt-bilgi .sag .ayrac{padding:0 6pt;}
.qd-alt-bilgi a{color:inherit; text-decoration:none;}

/* ekranda dar alan: tablo iskeleti korunur, içerik kolonları alt alta iner */
@media(max-width:880px){
  .qd-govde{padding:0 6mm;} .qd-kimlik{padding:8mm 6mm 0;} .qd-kimlik-cizgi{margin:6mm 6mm 0;} .qd-alt-bilgi{margin:6mm 6mm 0;}
  .qd-taraflar,.qd-banka-onay{grid-template-columns:1fr;}
  .qd-kimlik{flex-direction:column; gap:10pt;} .qd-belge{text-align:left;} .qd-belge dl{justify-content:start;}
  .qd-belge dt,.qd-belge dd{text-align:left;}
  .qd-alt-bilgi{flex-direction:column;} .qd-alt-bilgi .sag{text-align:left; white-space:normal;}
}

/* yazdırma / PDF */
@media print{
  @page{size:A4 portrait; margin:0 0 4mm 0;}
  .qd-sayfa{height:calc(297mm - 4mm);}   /* tek sayfada alt bilgi sayfanın altına iner; çok sayfada tfoot her sayfanın altında */
  .quote-doc{border:0 !important; border-radius:0 !important; width:210mm !important; max-width:210mm !important; flex:none !important; margin:0 !important;}
  .qd-govde{padding:0 16mm !important;} .qd-kimlik{padding:14.5mm 16mm 0 !important;} .qd-kimlik-cizgi{margin:5mm 16mm 0 !important;} .qd-alt-bilgi{margin:5mm 16mm 0 !important;}
  .qd-taraflar,.qd-banka-onay{grid-template-columns:1fr 1fr !important;}
  .qd-kimlik{flex-direction:row !important;} .qd-belge{text-align:right !important;} .qd-belge dl{justify-content:end !important;}
  .qd-belge dt,.qd-belge dd{text-align:right !important;}
  .qd-alt-bilgi{flex-direction:row !important;} .qd-alt-bilgi .sag{text-align:right !important; white-space:nowrap !important;}
  .qd-son-blok{break-inside:avoid; page-break-inside:avoid;}
  .side-drawer,.not-tab,.not-panel,.toast,#hpTip,#bildirimWrap,.sidebar-backdrop,.hizli-olustur-menu{display:none !important;}
  /* mobil kuralı (table{display:block}) kağıt genişliğinde devreye girmesin */
  .quote-doc table{display:table !important; white-space:normal !important; overflow:visible !important; width:100% !important;}
  .quote-doc thead{display:table-header-group !important;} .quote-doc tfoot{display:table-footer-group !important;}
  .quote-doc tbody{display:table-row-group !important;} .quote-doc tr{display:table-row !important;} .quote-doc td,.quote-doc th{display:table-cell !important;}
  .quote-doc .qd-belge dl{display:grid !important;} .quote-doc .qd-taraflar,.quote-doc .qd-banka-onay{display:grid !important;}
  html,body{margin:0 !important; padding:0 !important; width:210mm !important;}
  .shell,.main-col,.content,#content{position:static !important; padding:0 !important; margin:0 !important; width:210mm !important; max-width:210mm !important; min-height:0 !important;}
}

.line-items{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.li-row{display:grid;grid-template-columns:1fr 60px 90px 90px 28px;gap:8px;padding:8px 10px;
  align-items:center;border-bottom:1px solid var(--line);}
.li-row-full{grid-template-columns:1fr 56px 88px 72px 88px 32px;}
.li-head{background:var(--surface-sunk);font-family:var(--font-display);font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);}
.li-row input,.li-row select,.li-row textarea{height:32px;padding:0 8px;font-size:12.5px;

.kdv-tablo td{border-bottom:1px solid var(--line);padding:9px 10px;}
.kdv-tablo .sag{text-align:right;font-family:var(--font-mono);font-size:var(--fs-tutar);

.kdv-satir{cursor:pointer;}
.kdv-satir:hover td{background:var(--surface-sunk,#f7f8fa);}
.kdv-satir.acik td{background:var(--surface-sunk,#f2f5f7);font-weight:600;}

.kdv-detay-satir td{background:var(--surface-sunk,#fafbfc);padding:0;}
.kdv-detay{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:14px 18px 18px;}
.kdv-detay > div{padding:0 22px;}
.kdv-detay > div:first-child{padding-left:0;}
.kdv-detay > div:last-child{padding-right:0;border-left:1px solid var(--line);}
.kdv-detay h4{margin:0 0 8px;font-family:var(--font-display);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);}
.kdv-detay h4 span{background:var(--line);color:var(--ink-2);border-radius:999px;padding:1px 7px;margin-left:5px;font-size:11px;}
.kdv-belge{display:grid;grid-template-columns:70px minmax(0,1fr) 56px 92px 92px;gap:8px;align-items:center;
  padding:5px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-2);}
.kdv-belge:first-of-type{border-top:none;}
.kdv-belge-ad{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink);}

.kdv-belge .sag{text-align:right;font-family:var(--font-mono);white-space:nowrap;}

  .kdv-detay > div{padding:0;} .kdv-detay > div:last-child{border-left:none;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;} }
/* ---------- Finansal değerler ---------- */
.fin,.fin-lg,.fin-total{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum' 1;white-space:nowrap;letter-spacing:-.1px;}
.fin{font-size:var(--fs-tutar);font-weight:var(--fw-medium);}
.fin-lg{font-size:18px;font-weight:var(--fw-semibold);}
.fin-total{font-size:var(--fs-tutar);font-weight:var(--fw-semibold);}
.fin-pos{color:var(--ok);}
.fin-neg{color:var(--risk);}
.fin-bekleyen{color:var(--signal);}
.fin-notr{color:var(--ink-3);}
/* ---------- Raporlar (cari tabanlı) ---------- */
.rap-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.rap-kpi-kutu{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;}
.rap-kpi-kutu span{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-3);}
.rap-kpi-kutu b{font-size:var(--fs-kpi);font-family:var(--font-mono);font-weight:var(--fw-semibold);
  letter-spacing:-.4px;line-height:1.15;}
.rap-arac{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.rap-tarih{height:32px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px;font-family:inherit;}
.rap-tablo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);}
.rap-baslik,.rap-cari>summary,.rap-cari.rap-duz{display:grid;grid-template-columns:minmax(180px,2.4fr) 70px 1.1fr 1.1fr 1.2fr;gap:10px;align-items:center;padding:9px 14px;}
.rap-baslik{background:var(--surface-sunk,#f4f5f7);font-size:11.5px;font-weight:var(--font-weight-semibold);text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);border-bottom:1px solid var(--line);}
.rap-baslik .sag,.rap-cari .sag,.rap-belge .sag{text-align:right;}
.rap-cari{border-bottom:1px solid var(--line);}
.rap-cari>summary{cursor:pointer;font-size:13px;list-style:none;}
.rap-cari>summary::-webkit-details-marker{display:none;}
.rap-cari>summary:hover,.rap-cari.rap-duz:hover{background:var(--surface-sunk,#f7f8fa);}
.rap-cari.rap-duz{cursor:pointer;font-size:13px;}
.rap-ad{font-weight:var(--font-weight-medium);font-size:var(--font-size-table);letter-spacing:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rap-cari .sag{font-family:var(--font-mono);font-size:var(--font-size-financial);
  font-weight:var(--font-weight-semibold);}
.rap-belge{display:grid;grid-template-columns:minmax(150px,1.4fr) 1.6fr 1fr .9fr .9fr;gap:10px;align-items:center;
  padding:7px 14px 7px 26px;font-size:12px;color:var(--ink-2);background:var(--surface-sunk,#fafbfc);border-top:1px solid var(--line);}
.rap-belge-no{font-family:var(--font-mono);font-size:11px;}
.rap-belge-ac{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rap-git{padding:8px 14px 12px 26px;background:var(--surface-sunk,#fafbfc);}
.rap-bolum-baslik{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:22px 0 10px;font-family:var(--font-display);font-size:14px;font-weight:700;}
.rap-bolum-baslik span{font-size:12px;font-weight:600;color:var(--ink-3);font-family:var(--font-mono);}
@media(max-width:820px){
  .rap-baslik,.rap-cari>summary,.rap-cari.rap-duz{grid-template-columns:minmax(120px,2fr) 46px 1fr 1fr;}
  .rap-baslik span:nth-child(4),.rap-cari>summary span:nth-child(4),.rap-cari.rap-duz span:nth-child(4){display:none;}
  .rap-belge{grid-template-columns:1fr 1fr;}
}

/* ---------- İmza: Kilitli Halka Rayı ---------- */
/* Tamamlanan aşama = "kilitlenmiş şalter" (koyu, kilit ikonlu). Aktif aşama = sarı, parlayan. */
.rail{display:flex;gap:3px;margin:11px 0 3px;}
.rail-seg{flex:1;height:12px;border-radius:3px;background:var(--surface-sunk);border:1.5px solid var(--line-strong);
  position:relative;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.rail-seg.done{background:var(--ink);border-color:var(--ink);}
.rail-seg.done::after{content:'🔒';font-size:7px;line-height:1;filter:grayscale(1) brightness(3);}
.rail-seg.now{background:var(--hold-glow);border-color:var(--hold-glow);
  box-shadow:0 0 0 2px var(--hold-soft), 0 0 9px 1px rgba(250,204,21,.75);}
.rail-seg:not(.done):not(.now)::after{content:'';display:inline-block;width:8px;height:8px;
  background-color:var(--ink);opacity:.5;
  -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2v6l6 4-6 4v6h12v-6l-6-4 6-4V2H6z' fill='black'/></svg>");
  mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2v6l6 4-6 4v6h12v-6l-6-4 6-4V2H6z' fill='black'/></svg>");
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;}
.rail-labels{display:flex;gap:3px;margin-top:4px;}
.rail-labels span{flex:1;font-family:var(--font-mono);font-size:9px;font-weight:700;text-align:center;
  color:var(--ink-3);letter-spacing:.2px;}
.rail-labels span.now{color:var(--ink);background:var(--hold-glow);border-radius:2px;padding:1px 0;}

/* Koyu zeminli sağ panelde (login-right) "done" segment ile arka plan aynı renkte olduğu için görünmüyordu — burada ayrı renk veriyoruz. */
.login-right .rail-seg.done{background:#3A4A63;border-color:#3A4A63;}
.login-right .rail-seg{background:#25314A;border-color:#3A4A63;}
.login-right .rail-seg:not(.done):not(.now)::after{background-color:#FFFFFF;opacity:.85;}
