function mesaiGiderKategoriId(){
  // 'Mesai' gider kategorisi yoksa oluşturulur — mesai tutarları her zaman bu kategoriye işlenir
  let id = kategoriIdByAd('Mesai','gider');
  if(!id){
    id = benzersizId('kd');
    KATEGORILER.push({ id, ad:'Mesai', tip:'gider', sistem:true });
  }
  return id;
}
function saveMesai(){
  const d = mesaiData(mesaiPersonelId);
  const p = PERSONELLER.find(x => x.id === mesaiPersonelId);
  const toplam = mesaiToplam(d);
  if(!toplam){ showToast('Önce mesai saati girin.'); return; }
  d.kayitTarihi = new Date().toLocaleDateString('tr-TR');
  const gidereIsle = document.getElementById('msGider');
  if(!gidereIsle || gidereIsle.checked){
    const mevcut = d.giderId ? GIDERLER.find(g => g.id === d.giderId) : null;
    if(mevcut){
      // aynı personelin mesaisi yeniden kaydedildi → mükerrer satır açma, bağlı gideri güncelle
      const eskiEtki = giderNakitEtkisi(mevcut);
      mevcut.tarih = d.kayitTarihi;
      mevcut.tutar = Math.round(toplam);
      mevcut.client = p ? p.name : mevcut.client;
      mevcut.kategoriId = mesaiGiderKategoriId();
      hesapBakiyeDeltaUygula(mevcut.hesap, eskiEtki - giderNakitEtkisi(mevcut));
    } else {
      const gid = benzersizId('gi');
      const yeniGider = {
        id: gid,
        client: p ? p.name : null,
        hesap: BANK_ACCOUNTS[0] ? BANK_ACCOUNTS[0].name : 'Kasa',
        tur: 'Mesai Ücreti',
        tarih: d.kayitTarihi,
        tutar: Math.round(toplam),
        odendi: false,
        kategoriId: mesaiGiderKategoriId(),
      };
      GIDERLER.unshift(yeniGider);
      hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
      d.giderId = gid;
    }
  }
  mesaiPersonelId = null;
  renderContent();
  showToast(`${p ? p.name : 'Personel'} — ${tl(toplam)} mesai kaydedildi (Giderler → Mesai).`);
}
function mesaiSil(id){
  const p = PERSONELLER.find(x => x.id === id);
  const d = MESAI_KAYIT[id];
  if(!d){ showToast('Silinecek mesai kaydı yok.'); return; }
  const bagliGider = d.giderId ? GIDERLER.find(g => g.id === d.giderId) : null;
  const mesaj = `${p ? p.name : 'Personel'} mesai kaydı silinsin mi?` +
    (bagliGider ? `\n\nGiderler'deki bağlı "Mesai Ücreti" kaydı (${tl0(bagliGider.tutar)}) da silinecek.` : '');
  if(!confirm(mesaj)) return;
  if(bagliGider){ hesapBakiyeDeltaUygula(bagliGider.hesap, giderNakitEtkisi(bagliGider)); GIDERLER = GIDERLER.filter(g => g.id !== d.giderId); }
  delete MESAI_KAYIT[id];
  if(mesaiPersonelId === id) mesaiPersonelId = null;
  renderContent();
  showToast(`${p ? p.name : 'Personel'} mesai kaydı silindi.`);
}

// ============ CARİ AKTARIMI (Zirve / Excel → ROTA) ============
// Üç giriş yolu: Excel'den kopyala-yapıştır (TSV), CSV dosyası, XLSX dosyası (SheetJS varsa).
// Sütunlar başlık adlarından otomatik eşleşir; müşteri kartı + açılış bakiyesi oluşturur.
let AKT = { satirlar: [], eslesme: {}, basliklar: [], hata: '' };

const AKT_ALANLAR = {
  kod:          ['cari kodu','cari kod','kod','hesap kodu','cari hesap kodu'],
  name:         ['cari adi','cari ünvan','cari unvani','unvan','ünvan','müşteri','musteri','cari','firma adi','ad soyad','hesap adi'],
  tip:          ['cari tipi','tip','tür','tur'],
  borc:         ['borc toplami','borç toplamı','borc','borç','toplam borc','toplam borç'],
  alacak:       ['alacak toplami','alacak toplamı','alacak','toplam alacak'],
  bakiye:       ['bakiye','kalan','bakiye (tl)','net bakiye'],
  vkn:          ['vkn/tckn','vkn','tckn','vergi no','vergi kimlik no','tc kimlik no','vkn tckn'],
  vergiDairesi: ['vergi dairesi','vergi d.','vd'],
  semt:         ['semt','ilce','ilçe'],
  sehir:        ['sehir','şehir','il'],
  address:      ['adres','adres(1)','adres 1','adres1','adres (1)'],
  phone:        ['telefon','tel','tel.','gsm','cep'],
  phone2:       ['tel. (2)','tel (2)','telefon 2','tel2','telefon2','diger telefon'],
  email:        ['e-posta','eposta','email','e mail','mail'],
};
function aktNorm(s){
  return String(s || '').toLowerCase()
    .replace(/i̇/g,'i').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/\s+/g,' ').trim();
}
function aktSayi(v){
  if(typeof v === 'number') return v;
  let t = String(v || '').replace(/[₺$€\s ]/g, '').trim();
  if(!t || t === '-' || t === '—') return 0;
  let eksi = false;
  if(/^\(.*\)$/.test(t)){ eksi = true; t = t.slice(1, -1); }
  if(t.startsWith('-')){ eksi = true; t = t.slice(1); }
  if(t.endsWith('-')){ eksi = true; t = t.slice(0, -1); }
  t = t.replace(/[^\d.,]/g, '');
  if(!t) return 0;
  // Hem Turkce (1.141.100,62) hem Ingilizce (1,141,100.62) bicimi okunur:
  // iki ayirici da varsa SONUNCUSU ondaliktir; tek tur varsa adet/hane sayisina bakilir
  const sonV = t.lastIndexOf(','), sonN = t.lastIndexOf('.');
  let sayi;
  if(sonV >= 0 && sonN >= 0){
    sayi = sonV > sonN ? Number(t.replace(/\./g, '').replace(',', '.'))
                       : Number(t.replace(/,/g, ''));
  } else if(sonV >= 0){
    const adet = (t.match(/,/g) || []).length, sonra = t.length - sonV - 1;
    sayi = (adet > 1 || sonra === 3) ? Number(t.replace(/,/g, '')) : Number(t.replace(',', '.'));
  } else if(sonN >= 0){
    const adet = (t.match(/\./g) || []).length, sonra = t.length - sonN - 1;
    sayi = (adet > 1 || sonra === 3) ? Number(t.replace(/\./g, '')) : Number(t);
  } else sayi = Number(t);
  if(!isFinite(sayi)) sayi = 0;
  return eksi ? -sayi : sayi;
}

// Ayırıcıyı otomatik bul (sekme > noktalı virgül > virgül), tırnaklı hücreleri koru
function aktSatirlaraBol(metin){
  const ilk = metin.split(/\r?\n/).find(x => x.trim());
  if(!ilk) return { ayirici: '\t', satirlar: [] };
  const sayim = { '\t': (ilk.match(/\t/g) || []).length, ';': (ilk.match(/;/g) || []).length, ',': (ilk.match(/,/g) || []).length };
  const ayirici = sayim['\t'] >= sayim[';'] && sayim['\t'] >= sayim[','] ? '\t' : (sayim[';'] >= sayim[','] ? ';' : ',');
  const satirlar = [];
  let hucre = '', satir = [], tirnak = false;
  for(let i = 0; i < metin.length; i++){
    const k = metin[i];
    if(tirnak){
      if(k === '"'){ if(metin[i+1] === '"'){ hucre += '"'; i++; } else tirnak = false; }
      else hucre += k;
      continue;
    }
    if(k === '"'){ tirnak = true; continue; }
    if(k === ayirici){ satir.push(hucre); hucre = ''; continue; }
    if(k === '\n'){ satir.push(hucre); satirlar.push(satir); satir = []; hucre = ''; continue; }
    if(k === '\r') continue;
    hucre += k;
  }
  if(hucre || satir.length){ satir.push(hucre); satirlar.push(satir); }
  return { ayirici, satirlar };
}
function aktMetniIsle(metin){
  const { satirlar } = aktSatirlaraBol(metin);
  if(!satirlar.length){ AKT.hata = 'Veri okunamadı.'; return false; }
  // Başlık satırı: "cari" ya da "ad/ünvan" geçen ilk satır
  let bi = satirlar.findIndex(s => s.some(h => {
    const n = aktNorm(h);
    return AKT_ALANLAR.name.includes(n) || AKT_ALANLAR.kod.includes(n);
  }));
  if(bi < 0) bi = 0;
  const basliklar = satirlar[bi].map(x => String(x).trim());
  const eslesme = {};
  basliklar.forEach((b, i) => {
    const n = aktNorm(b);
    for(const alan in AKT_ALANLAR){
      if(eslesme[alan] !== undefined) continue;
      if(AKT_ALANLAR[alan].some(x => aktNorm(x) === n)){ eslesme[alan] = i; break; }
    }
  });
  // Ad sütunu bulunamadıysa: ilk metin ağırlıklı sütunu ad kabul et
  if(eslesme.name === undefined){
    const veri = satirlar.slice(bi + 1, bi + 12);
    let enIyi = -1, enCok = 0;
    basliklar.forEach((_, i) => {
      const harfli = veri.filter(s => /[a-zçğıöşüA-ZÇĞİÖŞÜ]{3,}/.test(String(s[i] || ''))).length;
      if(harfli > enCok){ enCok = harfli; enIyi = i; }
    });
    if(enIyi >= 0) eslesme.name = enIyi;
  }
  if(eslesme.name === undefined){ AKT.hata = 'Cari adı sütunu bulunamadı. Başlık satırının dosyada olduğundan emin olun.'; return false; }
  const kayitlar = [];
  satirlar.slice(bi + 1).forEach(s => {
    const al = a => (eslesme[a] !== undefined ? String(s[eslesme[a]] ?? '').trim() : '');
    const ad = al('name');
    if(!ad || aktNorm(ad) === 'toplam' || aktNorm(ad) === 'genel toplam') return;
    const borc = aktSayi(al('borc')), alacak = aktSayi(al('alacak'));
    let bakiye = eslesme.bakiye !== undefined ? aktSayi(al('bakiye')) : (borc - alacak);
    kayitlar.push({
      kod: al('kod'), name: ad, tip: al('tip'), borc, alacak, bakiye,
      vkn: al('vkn').replace(/\s/g, ''), vergiDairesi: al('vergiDairesi'),
      semt: al('semt'), sehir: al('sehir'), address: al('address'),
      phone: al('phone'), phone2: al('phone2'), email: al('email'),
      uyum: eslesme.bakiye === undefined || Math.abs((borc - alacak) - bakiye) < 0.02
            || Math.abs((borc - alacak) + bakiye) < 0.02,   // işaret farkı = alacak bakiyesi, sorun değil
      fark: eslesme.bakiye === undefined ? 0 : Math.round(((borc - alacak) - bakiye) * 100) / 100,
    });
  });
  if(!kayitlar.length){ AKT.hata = 'Başlık bulundu ama veri satırı yok.'; return false; }
  AKT = { satirlar: kayitlar, eslesme, basliklar, hata: '' };
  return true;
}
function aktDurum(tip){
  const t = aktNorm(tip);
  if(t.includes('satici') || t.includes('tedarik')) return 'Tedarikçi';
  return 'Müşteri';
}
function aktMevcutBul(k){
  // 1) Cari kodu — muhasebede benzersizdir, en güvenilir anahtar
  if(k.kod){
    const v = CUSTOMERS.find(c => (c.cariKodu || '') === k.kod);
    if(v) return v;
  }
  const ad = aktNorm(k.name);
  // 2) VKN + aynı ünvan — ancak iki tarafın da kodu varsa ve kodlar farklıysa AYRI cari sayılır
  if(k.vkn){
    const v = CUSTOMERS.find(c => (c.vkn || '').replace(/\s/g, '') === k.vkn && aktNorm(c.name) === ad
      && !(k.kod && c.cariKodu && c.cariKodu !== k.kod));
    if(v) return v;
  }
  // 3) Cari kodu olmayan kartlarda ünvan eşleşmesi
  return CUSTOMERS.find(c => aktNorm(c.name) === ad && !c.cariKodu) || null;
}

function aktMetindenOku(){
  const t = document.getElementById('aktYapistir').value;
  if(!t.trim()){ showToast('Önce tabloyu yapıştırın.'); return; }
  if(aktMetniIsle(t)) aktOnizleGoster(); else aktHataGoster();
}
function aktHataGoster(){
  const d = document.getElementById('aktDurum');
  if(d) d.innerHTML = `<div class="akt-hata">⚠ ${notEsc(AKT.hata || 'Veri okunamadı.')}</div>`;
}
function aktDosyaOku(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const d = document.getElementById('aktDurum');
  if(d) d.innerHTML = '<div class="akt-bilgi">Dosya okunuyor…</div>';
  const ad = f.name.toLowerCase();
  if(ad.endsWith('.xlsx') || ad.endsWith('.xls')){
    aktXlsxOku(f);
    return;
  }
  const oku = new FileReader();
  oku.onload = () => { if(aktMetniIsle(oku.result)) aktOnizleGoster(); else aktHataGoster(); };
  oku.onerror = () => { AKT.hata = 'Dosya okunamadı.'; aktHataGoster(); };
  // Türkçe Excel CSV'si çoğunlukla Windows-1254 olur; UTF-8 bozuk çıkarsa yeniden dener
  oku.readAsText(f, 'UTF-8');
  oku.onloadend = () => {
    if(typeof oku.result === 'string' && oku.result.includes('�')){
      const o2 = new FileReader();
      o2.onload = () => { if(aktMetniIsle(o2.result)) aktOnizleGoster(); else aktHataGoster(); };
      o2.readAsText(f, 'windows-1254');
    }
  };
}
function aktXlsxOku(f){
  const calistir = () => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(r.result), { type: 'array' });
        const sh = wb.Sheets[wb.SheetNames[0]];
        const csv = XLSX.utils.sheet_to_csv(sh, { FS: '\t' });
        if(aktMetniIsle(csv)) aktOnizleGoster(); else aktHataGoster();
      }catch(e){ AKT.hata = 'Excel dosyası okunamadı: ' + e.message; aktHataGoster(); }
    };
    r.readAsArrayBuffer(f);
  };
  if(typeof XLSX !== 'undefined'){ calistir(); return; }
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = calistir;
  sc.onerror = () => {
    AKT.hata = 'Excel okuyucu yüklenemedi (internet erişimi kısıtlı olabilir). Lütfen 1. yolu kullanın: Excel\'de tabloyu kopyalayıp kutuya yapıştırın.';
    aktHataGoster();
  };
  document.head.appendChild(sc);
}

function aktUygula(){
  const kartYap = document.getElementById('aktKart').checked;
  const bakiyeYap = document.getElementById('aktBakiye').checked;
  const sifirDahil = document.getElementById('aktSifir').checked;
  const bugun = bugunTR();
  const damga = 'zirve-aktarim';
  let yeniKart = 0, guncelKart = 0, acilisYeni = 0, acilisGuncel = 0, atlanan = 0;
  const buAktarimda = new Set();      // bu çalıştırmada açılan kartlar
  const birlesenler = [];             // aynı cariye denk gelen satırlar
  let temizlenen = 0, korunan = 0;
  if(document.getElementById('aktTemiz') && document.getElementById('aktTemiz').checked){
    // Yalnız aktarımla gelen ve hiçbir teklif/işe bağlanmamış kartlar silinir
    const kullanilan = new Set([
      ...QUOTES.map(q => q.customerId),
      ...JOBS.map(j => j.customerId),
      ...GELIRLER.map(g => g.customerId),
    ].filter(Boolean));
    const silinecek = CUSTOMERS.filter(c => c.aktarimKaynak === damga && !kullanilan.has(c.id));
    korunan = CUSTOMERS.filter(c => c.aktarimKaynak === damga && kullanilan.has(c.id)).length;
    const silinenIdler = new Set(silinecek.map(c => c.id));
    CUSTOMERS = CUSTOMERS.filter(c => !silinenIdler.has(c.id));
    CARI_HAREKETLER = CARI_HAREKETLER.filter(h => !(h.aktarim === damga && silinenIdler.has(h.customerId)));
    temizlenen = silinecek.length;
  }

  AKT.satirlar.forEach(k => {
    const bakiyeVar = Math.abs(k.borc) >= 0.01 || Math.abs(k.alacak) >= 0.01;
    if(!sifirDahil && !bakiyeVar && !k.kod){ atlanan++; return; }
    let c = aktMevcutBul(k);
    if(c && buAktarimda.has(c.id)) birlesenler.push({ ad: k.name, kod: k.kod, hedef: c.name, hedefKod: c.cariKodu || '' });
    if(!c && kartYap){
      c = {
        id: benzersizId('c'),
        type: /(a\.ş|ltd|şti|san|tic|a\.s|limited|anonim)/i.test(k.name) ? 'firma' : (k.vkn && k.vkn.length === 11 ? 'sahis' : 'firma'),

      if(d) guncelKart++;
    }
    if(c){

      if(k.vkn) c.vkn = k.vkn;
      if(k.vergiDairesi) c.vergiDairesi = k.vergiDairesi;
      if(k.semt) c.semt = k.semt;
      if(k.sehir) c.sehir = k.sehir;
      if(k.phone2) c.phone2 = k.phone2;
      if(k.tip && aktDurum(k.tip) === 'Tedarikçi' && c.durum !== 'Tedarikçi') c.durum = 'Tedarikçi';
      c.aktarimKaynak = damga;

      const tutarK = Math.round(tutar * 100);
      const eski = CARI_HAREKETLER.find(h => h.customerId === c.id && h.tip === tip && h.aktarim === damga && !h.iptal);
      if(tutarK <= 0){
        if(eski){ eski.iptal = { zaman: new Date().toLocaleString('tr-TR'), kim: chKullanici() }; acilisGuncel++; }
        return;
      }
      if(eski){
        if(eski.tutarK !== tutarK){ eski.tutarK = tutarK; eski.tarih = bugun; acilisGuncel++; }
        return;
      }
      CARI_HAREKETLER.unshift({
        id: benzersizId('ch'), customerId: c.id, musteriAdi: c.name,
        tip, tutarK, para: 'TL', kur: 1, tarih: bugun, vade: '',
        belgeNo: (tip === 'acilis-borc' ? 'ACL-B-' : 'ACL-A-') + (k.kod || c.id).replace(/[^\w.]/g, ''),
        aciklama: 'Zirve devir bakiyesi' + (k.kod ? ' · ' + k.kod : ''),
        notu: 'Excel aktarımı ile geldi (' + bugun + ')',
        aktarim: damga, olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR'),
      });
      acilisYeni++;
    };
    yaz('acilis-borc', k.borc);
    yaz('acilis-alacak', k.alacak);
  });

  if(typeof liveMarkDirty === 'function') liveMarkDirty();   // sunucuya kayıt tetiklenir

  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Aktarım Tamamlandı</h2><button class="modal-close" onclick="closeModal()">✕</button></div>

      <div><b>${guncelKart}</b><span>kart güncellendi</span></div>
      <div><b style="color:var(--ok);">${acilisYeni}</b><span>açılış kaydı</span></div>

    </div>
    ${atlanan ? `<div class="hint">${atlanan} satır bakiyesiz olduğu için atlandı.</div>` : ''}
    ${birlesenler.length ? `<div class="akt-uyari">ℹ ${birlesenler.length} satır, dosyadaki başka bir satırla <b>aynı cariye</b> denk geldiği
      için ayrı kart açılmadı (aynı cari kodu ya da aynı VKN + aynı ünvan). Tutarları o kartta toplandı.
      <div class="akt-uyari-liste">${birlesenler.slice(0, 8).map(x =>
        `<div>• ${notEsc(x.ad)}${x.kod ? ` <span style="opacity:.6;">${notEsc(x.kod)}</span>` : ''} → <b>${notEsc(x.hedef)}</b>${x.hedefKod ? ` <span style="opacity:.6;">${notEsc(x.hedefKod)}</span>` : ''}</div>`).join('')}
        ${birlesenler.length > 8 ? `<div style="opacity:.7;">… ve ${birlesenler.length - 8} satır daha</div>` : ''}</div></div>` : ''}
    ${temizlenen ? `<div class="hint">${temizlenen} eski aktarım kartı temizlendi${korunan ? `, ${korunan} kart teklif/işe bağlı olduğu için korundu` : ''}.</div>` : ''}
    <div class="akt-denetim">
      <div>Dosyadaki satır: <b>${AKT.satirlar.length}</b></div>
      <div>Yeni kart: <b>${yeniKart}</b> · Mevcut karta yazıldı: <b>${guncelKart}</b> · Aynı cariye denk gelen: <b>${birlesenler.length}</b> · Atlanan: <b>${atlanan}</b></div>
      <div>Toplam cari kartı (aktarım sonrası): <b>${CUSTOMERS.length}</b></div>
      ${yeniKart + birlesenler.length + atlanan + guncelKart !== AKT.satirlar.length
        ? `<div style="color:var(--risk);">⚠ Sayılar tutmuyor — ekran görüntüsü alıp iletin.</div>` : ''}
    </div>
    <div class="hint">Açılış kayıtları <b>Zirve devir bakiyesi</b> açıklamasıyla işlendi. Aynı dosyayı tekrar
      aktarırsanız çift kayıt oluşmaz — mevcut açılış tutarları güncellenir.</div>
    <button class="modal-submit" onclick="closeModal()">Tamam</button>`;
  showModal();
  showToast(`Aktarım tamam — ${yeniKart} yeni cari, ${acilisYeni} açılış kaydı.`);
}

function chBelgeNo(onEk){
  const n = CARI_HAREKETLER.filter(h => (h.belgeNo || '').startsWith(onEk)).length + 1;
  return onEk + '-' + String(n).padStart(3, '0');
}

// ---- MERKEZİ SERVİS: tüm kaynaklardan birleşik hareket satırları ----
function cariTumSatirlar(){
  const satirlar = [];
  QUOTES.forEach(q => {
    if(q.status !== 'Kabul Edildi' && q.status !== 'Faturalandı') return;
    const cst = CUSTOMERS.find(x => x.id === q.customerId);
    const ad = (cst && cst.name) || q.musteriAdi || 'Müşteri seçilmedi';
    const ilk = q.items && q.items.find(it => it.title);
    satirlar.push({ key: q.customerId || chAdAnahtar(ad), ad, tip: 'satis-faturasi',
      tarih: q.date, vade: '', belgeNo: q.no || '',
      aciklama: ilk ? (ilk.title + (q.items.filter(it => it.title).length > 1 ? ' +' + (q.items.filter(it => it.title).length - 1) + ' kalem' : '')) : 'Satış',
      borcK: Math.round(quoteTotal(q) * 100), alacakK: 0,
      kaynak: { tip: 'teklif', id: q.id } });
  });
  GELIRLER.forEach(g => {
    if(!g.customerId && !g.client) return;
    satirlar.push({ key: g.customerId || chAdAnahtar(g.client), ad: g.client || '',
      tip: 'tahsilat', tarih: g.tarih, vade: '', belgeNo: g.belgeNo || '',
      aciklama: (g.tur || 'Tahsilat') + (g.hesap ? ' · ' + g.hesap : ''),
      borcK: 0, alacakK: Math.round((Number(g.tutar) || 0) * 100),
      kaynak: { tip: 'gelir', id: g.id } });
  });
  // Giderler → tedarikçi cari hareketleri (yalnızca cari seçilmiş kayıtlar)
  (GIDERLER || []).forEach(g => {
    if(!g.customerId) return;
    const tutarK = Math.round((Number(g.tutar) || 0) * 100);
    if(!tutarK) return;
    const cst = CUSTOMERS.find(x => x.id === g.customerId);
    const ad = (cst && cst.name) || g.client || '';
    // cariTip: 'odeme' → sadece ödeme (borcumuzu azaltır)
    //          'alis'  → sadece alış faturası (borç doğurur)
    //          'alis-odeme' → alış + peşin ödeme (net etkisiz, geçmiş görünür)
    const etki = g.cariTip || (g.odendi ? 'alis-odeme' : 'alis');
    if(etki !== 'odeme'){
      satirlar.push({ key: g.customerId, ad, tip: 'alis-faturasi', tarih: g.tarih, vade: g.vade || '',
        belgeNo: g.belgeNo || '', aciklama: g.tur || 'Alış',
        borcK: 0, alacakK: tutarK, kaynak: { tip: 'gider', id: g.id } });
    }
    if(etki !== 'alis'){
      satirlar.push({ key: g.customerId, ad, tip: 'odeme', tarih: g.tarih, vade: '',
        belgeNo: g.belgeNo || '', aciklama: (etki === 'odeme' ? (g.tur || 'Ödeme') : 'Ödeme') + (g.hesap ? ' · ' + g.hesap : ''),
        borcK: tutarK, alacakK: 0, kaynak: { tip: 'gider', id: g.id } });
    }
  });
  (CARI_HAREKETLER || []).forEach(h => {
    const t = CH_TURLER[h.tip]; if(!t) return;
    satirlar.push({ key: h.customerId || chAdAnahtar(h.musteriAdi), ad: h.musteriAdi || '',
      tip: h.tip, tarih: h.tarih, vade: h.vade || '', belgeNo: h.belgeNo || '',
      aciklama: h.aciklama || '', notu: h.notu || '',
      borcK: t.yon === 'borc' ? (h.tutarK || 0) : 0,
      alacakK: t.yon === 'alacak' ? (h.tutarK || 0) : 0,
      kaynak: { tip: 'manuel', id: h.id }, iptal: !!h.iptal, h });
  });
  return satirlar;
}

// Bir carinin defteri: kronolojik sıra, yürüyen bakiye, FIFO ile fatura kalanları.
// Bakiye = Toplam Borç − Toplam Alacak. Pozitif → Tahsil Edilecek, negatif → Ödeme Yapılacak.
function cariDefter(key){
  const bugun = chTarihSira(new Date().toLocaleDateString('tr-TR'));
  const rows = cariTumSatirlar().filter(r => r.key === key && (!r.iptal || chIptalGoster))
    .sort((a, b) => chTarihSira(a.tarih).localeCompare(chTarihSira(b.tarih)));
  let bakiyeK = 0, borcK = 0, alacakK = 0;
  rows.forEach(r => {
    if(r.iptal){ r.bakiyeK = bakiyeK; return; }
    bakiyeK += r.borcK - r.alacakK;
    borcK += r.borcK; alacakK += r.alacakK;
    r.bakiyeK = bakiyeK;
  });
  // FIFO: alacaklar borç satırlarına kronolojik dağıtılır → kalan + ödeme durumu
  let havuzK = alacakK;
  let vadesiGecenK = 0;
  rows.forEach(r => {
    if(r.iptal || !r.borcK) return;
    const dusen = Math.min(havuzK, r.borcK);
    r.kalanK = r.borcK - dusen;
    havuzK -= dusen;
    // Ödeme durumu yalnız alacak doğuran belgelerde anlamlı (fatura ve borç dekontu)
    if(r.tip !== 'satis-faturasi' && r.tip !== 'borc-dekontu'){ r.durum = 'İşlendi'; return; }
    const vadeGecti = r.vade && chTarihSira(r.vade) < bugun && r.kalanK > 0;
    r.durum = vadeGecti ? 'Vadesi Geçti'
      : (r.kalanK === 0 ? 'Ödendi' : (r.kalanK < r.borcK ? 'Kısmi Ödendi' : (r.vade && chTarihSira(r.vade) >= bugun ? 'Vadesi Gelmedi' : 'Ödenmedi')));
    if(vadeGecti) vadesiGecenK += r.kalanK;
  });
  // Ayna FIFO: borç satırları (ödemeler) alacak doğuran belgelere dağıtılır → tedarikçi tarafı kalanı
  let havuz2K = borcK;
  let vadesiGecenAlacakK = 0;
  rows.forEach(r => {
    if(r.iptal || !r.alacakK) return;
    const dusen = Math.min(havuz2K, r.alacakK);
    r.alacakKalanK = r.alacakK - dusen;
    havuz2K -= dusen;
    if(r.vade && chTarihSira(r.vade) < bugun && r.alacakKalanK > 0) vadesiGecenAlacakK += r.alacakKalanK;
  });
  rows.forEach(r => {
    if(r.iptal){ r.durum = 'İptal Edildi'; return; }
    if(!r.durum) r.durum = r.tip === 'tahsilat' ? 'Tahsil Edildi' : 'İşlendi';
  });
  return { rows, bakiyeK, borcK, alacakK, vadesiGecenK, vadesiGecenAlacakK };
}

// Cari listesi: tüm anahtarların özetleri (ad çözümü CUSTOMERS öncelikli)
function cariOzetListesi(hepsi){
  const map = new Map();
  cariTumSatirlar().forEach(r => {
    if(r.iptal) return;
    if(!map.has(r.key)) map.set(r.key, { key: r.key, ad: r.ad, borcK: 0, alacakK: 0 });
    const c = map.get(r.key);
    if(r.ad && (!c.ad || c.ad === 'Müşteri seçilmedi')) c.ad = r.ad;
    c.borcK += r.borcK; c.alacakK += r.alacakK;
  });
  let sonuc = [...map.values()].map(c => {
    const cst = CUSTOMERS.find(x => x.id === c.key);
    if(cst) c.ad = cst.name;
    c.bakiyeK = c.borcK - c.alacakK;
    return c;
  });
  if(hepsi){
    // Hareketi olmayan cari kartları da listeye katılır (Zirve'den gelen sıfır bakiyeli cariler dahil)
    const varOlan = new Set(sonuc.map(c => c.key));
    CUSTOMERS.forEach(cst => {
      if(varOlan.has(cst.id)) return;
      sonuc.push({ key: cst.id, ad: cst.name, borcK: 0, alacakK: 0, bakiyeK: 0, hareketsiz: true });
    });
  } else {
    sonuc = sonuc.filter(c => c.borcK || c.alacakK);
  }
  return sonuc.sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
}
function chBakiyeMetni(k){
  if(k > 0) return '<span class="ch-yon tahsil">Tahsil Edilecek</span>';
  if(k < 0) return '<span class="ch-yon odeme">Ödeme Yapılacak</span>';
  return '<span class="ch-yon notr">Kapalı</span>';
}

function chKaydet(tur, duzenlenenId){
  const cid = document.getElementById('chCari').value;
  const cst = CUSTOMERS.find(c => c.id === cid);
  const tutarK = chKurus(virgulSayi(document.getElementById('chTutar').value));
  if(!cid){ showToast('Cari seçin.'); return; }
  if(!tutarK){ showToast('Tutar girin.'); return; }
  if(tur === 'tahsilat'){
    // Tahsilat tek yerde tutulur: GELIRLER. Defter bu kaydı otomatik alacak olarak gösterir.
    const hes = document.getElementById('chHesap');
    if(hes && !hes.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
    const acik = document.getElementById('chAciklama').value.trim();
    const yontem = document.getElementById('chYontem') ? document.getElementById('chYontem').value : '';
    const yeniGelir = {
      id: benzersizId('ge'),
      customerId: cid,
      client: cst ? cst.name : 'Müşteri seçilmedi',
      hesap: hes ? hes.value : '',
      tur: acik || ('Tahsilat' + (yontem ? ' · ' + yontem : '')),
      tarih: document.getElementById('chTarih').value || bugunTR(),
      tutar: tutarK / 100,
      kategoriId: (document.getElementById('chKategori') || {}).value || null,
      belgeNo: document.getElementById('chBelge').value.trim() || chBelgeNo('THL'),
      notu: document.getElementById('chNot').value.trim(),
      olusturan: chKullanici(),
    };
    GELIRLER.unshift(yeniGelir);
    hesapBakiyeDeltaUygula(yeniGelir.hesap, gelirNakitEtkisi(yeniGelir));
    closeModal(); renderContent();
    showToast(`Tahsilat kaydedildi — ${chTL(tutarK)} (Gelirler'e de işlendi).`);
    return;
  }
  if(tur === 'odeme' && !duzenlenenId){
    // Ödeme tek yerde tutulur: GİDERLER. Defter bu kaydı otomatik borç (ödeme) olarak gösterir.
    const hes = document.getElementById('chHesap');
    if(hes && !hes.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
    const acik = document.getElementById('chAciklama').value.trim();
    const yontem = document.getElementById('chYontem') ? document.getElementById('chYontem').value : '';
    const yeniGider = {
      id: benzersizId('gi'),
      customerId: cid,
      cariTip: 'odeme',
      client: cst ? cst.name : 'Cari seçilmedi',
      hesap: hes ? hes.value : '',
      tur: acik || ('Ödeme' + (yontem ? ' · ' + yontem : '')),
      tarih: document.getElementById('chTarih').value || bugunTR(),
      tutar: tutarK / 100,
      odendi: true,
      kategoriId: null,
      belgeNo: document.getElementById('chBelge').value.trim() || chBelgeNo('ODM'),
      notu: document.getElementById('chNot').value.trim(),
      olusturan: chKullanici(),
    };
    GIDERLER.unshift(yeniGider);
    hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
    closeModal(); renderContent();
    showToast(`Ödeme kaydedildi — ${chTL(tutarK)} (Giderler'e de işlendi).`);
    return;
  }
  const gercekTur = tur === 'acilis' ? document.getElementById('chAcilisYon').value : tur;
  const onEk = { 'odeme':'ODM', 'borc-dekontu':'BDK', 'alacak-dekontu':'ADK', 'acilis-borc':'ACL', 'acilis-alacak':'ACL' }[gercekTur] || 'CH';
  const vadeEl = document.getElementById('chVade');
  const hesapEl = document.getElementById('chHesap');
  if(tur === 'odeme' && hesapEl && !hesapEl.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
  const kayit = duzenlenenId ? CARI_HAREKETLER.find(h => h.id === duzenlenenId) : null;
  const h = kayit || { id: benzersizId('ch'), olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR') };
  Object.assign(h, {
    customerId: cid, musteriAdi: cst ? cst.name : '',
    tip: gercekTur, tutarK,
    para: 'TL', kur: 1,
    tarih: document.getElementById('chTarih').value || bugunTR(),
    vade: vadeEl ? vadeEl.value.trim() : (h.vade || ''),
    hesap: hesapEl ? hesapEl.value : (h.hesap || ''),
    yontem: document.getElementById('chYontem') ? document.getElementById('chYontem').value : (h.yontem || ''),
    aciklama: document.getElementById('chAciklama').value.trim(),
    belgeNo: document.getElementById('chBelge').value.trim() || h.belgeNo || chBelgeNo(onEk),
    notu: document.getElementById('chNot').value.trim(),
  });
  if(kayit){ h.guncelleyen = chKullanici(); h.guncellemeZamani = new Date().toLocaleString('tr-TR'); }
  else CARI_HAREKETLER.unshift(h);
  closeModal(); renderContent();
  showToast(`${CH_TURLER[gercekTur].ad} kaydedildi — ${chTL(tutarK)}.`);
}
function chDuzenleModal(id){
  const h = CARI_HAREKETLER.find(x => x.id === id); if(!h) return;
  const tur = h.tip.startsWith('acilis') ? 'acilis' : h.tip;
  if(tur === 'virman-cikis' || tur === 'virman-giris'){ showToast('Virman kayıtları düzenlenmez — iptal edip yeniden oluşturun.'); return; }
  chModalAc(tur, h.customerId);
  document.getElementById('chTutar').value = virgulYaz(h.tutarK / 100);
  document.getElementById('chTarih').value = h.tarih || '';
  if(document.getElementById('chVade')) document.getElementById('chVade').value = h.vade || '';
  if(document.getElementById('chHesap')) document.getElementById('chHesap').value = h.hesap || '';
  if(document.getElementById('chYontem')) document.getElementById('chYontem').value = h.yontem || 'Nakit';
  if(document.getElementById('chAcilisYon')) document.getElementById('chAcilisYon').value = h.tip;
  document.getElementById('chAciklama').value = h.aciklama || '';
  document.getElementById('chBelge').value = h.belgeNo || '';
  document.getElementById('chNot').value = h.notu || '';
  document.querySelector('#modalBox .modal-submit').setAttribute('onclick', `chKaydet('${tur}','${id}')`);
}
function chIptalEt(id){
  const h = CARI_HAREKETLER.find(x => x.id === id); if(!h || h.iptal) return;
  if(!confirm(`${CH_TURLER[h.tip].ad} (${h.belgeNo || ''} · ${chTL(h.tutarK)}) iptal edilsin mi?\nKayıt silinmez, iptal olarak işaretlenir ve bakiyeden düşer.`)) return;
  h.iptal = { zaman: new Date().toLocaleString('tr-TR'), kim: chKullanici() };
  if(h.virmanId){
    const es = CARI_HAREKETLER.find(x => x.virmanId === h.virmanId && x.id !== h.id && !x.iptal);
    if(es) es.iptal = { zaman: h.iptal.zaman, kim: h.iptal.kim };
  }
  renderContent();
  showToast('Kayıt iptal edildi (geçmişte saklanır).');
}

// Virman öncesi/sonrası bakiye önizlemesi — yanlış yön seçimini baştan engeller
function chVirmanOnizle(){
  const kutu = document.getElementById('chVOnizle'); if(!kutu) return;
  const k = (document.getElementById('chVKaynak') || {}).value;
  const hd = (document.getElementById('chVHedef') || {}).value;
  const tutarK = chKurus(virgulSayi((document.getElementById('chVTutar') || {}).value || ''));
  if(!k || !hd || k === hd){ kutu.innerHTML = ''; return; }
  const ad = id => { const c = CUSTOMERS.find(x => x.id === id); return c ? c.name : '—'; };
  const bak = id => cariDefter(id).bakiyeK;
  const kb = bak(k), hb = bak(hd);
  const satir = (etiket, once, sonra) => `
    <div class="ch-vo-satir"><span>${notEsc(etiket)}</span>
      <span>${chTL(once)} <span style="color:var(--ink-3);">→</span> <b>${chTL(sonra)}</b></span></div>`;
  kutu.innerHTML = satir(ad(k), kb, kb - tutarK) + satir(ad(hd), hb, hb + tutarK);
}
function chVirmanKaydet(){
  const k = document.getElementById('chVKaynak').value, hd = document.getElementById('chVHedef').value;
  const tutarK = chKurus(virgulSayi(document.getElementById('chVTutar').value));
  if(!k || !hd){ showToast('Kaynak ve hedef cari seçin.'); return; }
  if(k === hd){ showToast('Kaynak ve hedef aynı olamaz.'); return; }
  if(!tutarK){ showToast('Tutar girin.'); return; }
  const kc = CUSTOMERS.find(c => c.id === k), hc = CUSTOMERS.find(c => c.id === hd);
  const virmanId = benzersizId('vr');
  const belgeNo = chBelgeNo('VRM');
  const ortak = {
    tarih: document.getElementById('chVTarih').value || bugunTR(),
    aciklama: document.getElementById('chVAciklama').value.trim() || `Virman: ${kc.name} → ${hc.name}`,
    belgeNo, virmanId, para: 'TL', kur: 1, tutarK,
    olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR'),
  };
  CARI_HAREKETLER.unshift(Object.assign({ id: benzersizId('ch'), customerId: k, musteriAdi: kc.name, tip: 'virman-cikis' }, ortak));
  CARI_HAREKETLER.unshift(Object.assign({ id: benzersizId('ch'), customerId: hd, musteriAdi: hc.name, tip: 'virman-giris' }, ortak));
  closeModal(); renderContent();
  showToast(`Virman kaydedildi — ${chTL(tutarK)} (${belgeNo}).`);
}

function chSatirMenu(e, key, i){
  const eski = document.getElementById('chSatirMenuKat');
  if(eski) eski.remove();
  const d = cariDefter(key);
  const r = d.rows[i]; if(!r) return;
  const kat = document.createElement('div');
  kat.id = 'chSatirMenuKat';
  kat.className = 'ch-satir-menu';
  kat.innerHTML = `
    <button onclick="chMenuKapat(); chDetayModal('${key.replace(/'/g, "\\'")}',${i})">🔎 Detay Görüntüle</button>
    ${r.kaynak.tip === 'teklif' ? `<button onclick="chMenuKapat(); chKaynagaGit('teklif','${r.kaynak.id}')">📄 İlgili Teklifi Aç</button>` : ''}
    ${r.kaynak.tip === 'gelir' ? `<button onclick="chMenuKapat(); chKaynagaGit('gelir','${r.kaynak.id}')">💰 Gelirler'de Aç</button>` : ''}
    ${r.kaynak.tip === 'gider' ? `<button onclick="chMenuKapat(); chKaynagaGit('gider','${r.kaynak.id}')">🧾 Giderler'de Aç</button>` : ''}
    ${r.kaynak.tip === 'manuel' && !r.iptal ? `<button onclick="chMenuKapat(); chDuzenleModal('${r.kaynak.id}')">✏️ Düzenle</button>
      <button style="color:var(--risk);" onclick="chMenuKapat(); chIptalEt('${r.kaynak.id}')">🚫 İptal Et</button>` : ''}
    ${r.kaynak.tip !== 'manuel' ? `<div class="ch-menu-not">Bu satır ${r.kaynak.tip === 'teklif' ? 'teklif' : r.kaynak.tip === 'gider' ? 'gider' : 'tahsilat'} kaydından otomatik gelir — buradan düzenlenmez.</div>` : ''}`;
  document.body.appendChild(kat);
  const kn = e.currentTarget.getBoundingClientRect();
  const yuk = kat.offsetHeight;
  kat.style.left = Math.max(8, kn.right - 220) + 'px';
  kat.style.top = (kn.bottom + yuk + 8 > window.innerHeight ? Math.max(8, kn.top - yuk - 4) : kn.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', chMenuKapat, { once: true }), 0);
}
function chMenuKapat(){

}
function chKaynagaGit(tip, id){
  pushHistory();

  if(tip === 'gider'){
    currentPage = 'on-muhasebe'; onMuhasebeSub = 'giderler'; openSubmenu = 'on-muhasebe'; giderStep = 'list';
    renderNav(); renderContent(); tarayiciGecmisYaz();
    setTimeout(() => openGiderDuzenle(id), 50);
    return;
  }
  currentPage = 'on-muhasebe'; onMuhasebeSub = 'gelirler'; openSubmenu = 'on-muhasebe'; gelirStep = 'list';
  renderNav(); renderContent(); tarayiciGecmisYaz();
}

function chCsvAktar(key){
  const ozet = cariOzetListesi().find(x => x.key === key);
  const cst = CUSTOMERS.find(x => x.id === key);
  const ad = (cst && cst.name) || (ozet && ozet.ad) || 'cari';
  const d = cariDefter(key);
  const say = k => (k / 100).toLocaleString('tr-TR', { minimumFractionDigits: 2 });
  const satirlar = [['Tarih','İşlem Türü','Belge No','Açıklama','Vade','Borç','Alacak','Bakiye','Durum']];
  d.rows.forEach(r => satirlar.push([chTarihTR(r.tarih), CH_TURLER[r.tip] ? CH_TURLER[r.tip].ad : r.tip,
    r.belgeNo, r.aciklama, r.vade ? chTarihTR(r.vade) : '', r.borcK ? say(r.borcK) : '',
    r.alacakK ? say(r.alacakK) : '', r.iptal ? '' : say(r.bakiyeK), r.durum]));
  satirlar.push([]);
  satirlar.push(['Toplam Borç', say(d.borcK)], ['Toplam Alacak', say(d.alacakK)], ['Net Bakiye', say(d.bakiyeK)]);
  const csv = '﻿' + satirlar.map(s => s.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'cari-hareketleri-' + ad.replace(/[^\wğüşıöçĞÜŞİÖÇ ]/g, '').trim().replace(/\s+/g, '-') + '.csv';
  a.click();
  showToast('CSV indirildi — Excel ile açabilirsiniz.');
}

  const bankTl = BANK_ACCOUNTS.filter(a=>a.currency==='TL').reduce((s,a)=>s+a.balance,0);

          <span class="mini-islem" title="Düzenle" onclick="openAccountModal('banka','${a.id}')">✎</span><span class="mini-islem sil" title="Sil" onclick="deleteAccount('banka','${a.id}')">✕</span></span></div>`).join('')}

}
function hesapBul(tur, id){ return (tur === 'kasa' ? KASA_ACCOUNTS : BANK_ACCOUNTS).find(x => x.id === id); }
function openAccountModal(tur, id){
  const a = id ? hesapBul(tur, id) : null;
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>${a ? 'Hesabı Düzenle' : 'Yeni Hesap'}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Hesap Adı</label><input id="accName" value="${a ? notEsc(a.name) : ''}" placeholder="Örn. Merkez Kasa"></div>
    <div class="field-row">
      <div class="field"><label>Tür</label><select id="accType" ${a ? 'disabled' : ''}>
        <option value="kasa" ${tur === 'kasa' ? 'selected' : ''}>Kasa</option>
        <option value="banka" ${tur === 'banka' ? 'selected' : ''}>Banka</option></select></div>
      <div class="field"><label>Para Birimi</label><select id="accCurrency">
        <option value="TL" ${a && a.currency === 'TL' ? 'selected' : ''}>TL</option>
        <option value="$" ${a && a.currency === '$' ? 'selected' : ''}>$</option></select></div>
    </div>
    <div class="field"><label>${a ? 'Bakiye' : 'Başlangıç Bakiyesi'}</label><input id="accBalance" type="number" value="${a ? a.balance : 0}"></div>
    <button class="modal-submit" onclick="submitAccount('${tur || ''}','${a ? a.id : ''}')">${a ? 'Kaydet' : 'Hesabı Ekle'}</button>
  `;
  showModal();
}
function submitAccount(tur, id){
  const name = document.getElementById('accName').value.trim();
  if(!name) return;
  const currency = document.getElementById('accCurrency').value;
  const balance = Number(document.getElementById('accBalance').value) || 0;
  const a = id ? hesapBul(tur, id) : null;
  if(a){ a.name = name; a.currency = currency; a.balance = balance; }
  else {
    const type = document.getElementById('accType').value;
    (type === 'kasa' ? KASA_ACCOUNTS : BANK_ACCOUNTS).push({ id: benzersizId(type === 'kasa' ? 'ka' : 'ba'), name, balance, currency });
  }
  closeModal(); renderContent();
  showToast(a ? `${name} güncellendi.` : `${name} eklendi.`);
}
function deleteAccount(tur, id){
  const a = hesapBul(tur, id); if(!a) return;
  const uyari = a.balance ? ` Hesapta ${a.balance.toLocaleString('tr-TR')}${a.currency} bakiye görünüyor.` : '';
  if(!confirm(`"${a.name}" hesabı silinsin mi?${uyari} Geçmiş gelir/gider kayıtları silinmez.`)) return;
  if(tur === 'kasa') KASA_ACCOUNTS = KASA_ACCOUNTS.filter(x => x.id !== id);
  else BANK_ACCOUNTS = BANK_ACCOUNTS.filter(x => x.id !== id);
  renderContent();
  showToast('Hesap silindi.');
}

function openCekSenetDuzenle(id){
  cekSenetDuzenleId = id;
  cekSenetStep = 'form';
  renderContent();
}
function deleteCekSenet(id){
  const c = CEK_SENET.find(x => x.id === id); if(!c) return;
  if(!confirm(`${c.belgeTipi} · ${c.belgeNo || 'belge'} — ${Number(c.tutar).toLocaleString('tr-TR')} ${c.paraBirimi} kaydı silinsin mi?`)) return;
  CEK_SENET = CEK_SENET.filter(x => x.id !== id);
  renderContent();
  showToast('Çek/Senet kaydı silindi.');
}

        </div>
        <div class="field"><label>Tedarikçi</label><select id="csTedarikci">${custOptions}</select></div>
        <div class="field"><label>Belge No</label><input id="csBelgeNo" value="${e ? notEsc(e.belgeNo || '') : ''}" placeholder="Belge numarası"></div>
        <div class="field"><label>İşlem Tarihi</label><input type="date" id="csIslemTarihi" value="${e ? (e.islemTarihi || '') : ''}"></div>

        <div class="field"><label>Etiketler</label><input id="csEtiket" placeholder="Kendi Etiketini Ekle"></div>
      </div>
      <div class="form-page-footer">
        <button class="back-btn" onclick="cekSenetDuzenleId=null; cekSenetStep='list'; renderContent();">←</button>
        <button class="save-btn" onclick="submitCekSenet()">Kaydet</button>

function submitCekSenet(){
  const veri = {
    belgeTipi: document.getElementById('csTip').value,
    tedarikci: document.getElementById('csTedarikci').value,
    belgeNo: document.getElementById('csBelgeNo').value,
    islemTarihi: document.getElementById('csIslemTarihi').value,
    vadeTarihi: document.getElementById('csVadeTarihi').value,
    tutar: document.getElementById('csTutar').value || 0,
    paraBirimi: document.getElementById('csParaBirimi').value,
    aciklama: document.getElementById('csAciklama').value,
  };
  if(cekSenetDuzenleId){
    const c = CEK_SENET.find(x => x.id === cekSenetDuzenleId);
    if(c) Object.assign(c, veri);
    cekSenetDuzenleId = null;
  } else {
    CEK_SENET.push(Object.assign({ id: benzersizId('cs') }, veri));
  }
  cekSenetStep = 'list';
  renderContent();
  showToast('Çek/Senet kaydedildi.');
}

const STAGE_COLORS = { KESIF:'#94A3B8', TASARIM:'#F59E0B', URETIM:'#FF5A1F', MONTAJ:'#3B82F6', TAHSILAT:'#10B981' };
const STAGE_LABELS_TR = { KESIF:'Keşif', TASARIM:'Tasarım', URETIM:'Üretim', MONTAJ:'Montaj', TAHSILAT:'Tahsilat' };

function departmentDonut(){
  const stages = Object.keys(STAGE_COLORS);
  const counts = stages.map(s => JOBS.filter(j=>j.stage===s).length);
  const total = counts.reduce((a,b)=>a+b,0);
  const bolen = total || 1;
  let cursor = 0;
  const stops = total ? stages.map((s,i) => {
    const start = cursor/bolen*360;
    cursor += counts[i];
    const end = cursor/bolen*360;
    return `${STAGE_COLORS[s]} ${start}deg ${end}deg`;
  }).join(', ') : 'var(--surface-sunk) 0deg 360deg';
  return `
    <div style="padding:22px; display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
      <div class="donut" style="width:168px;height:168px;background:conic-gradient(${stops}); flex-shrink:0;">
        <div class="donut-inner" style="width:114px;height:114px;">
          <b style="font-size:10px;">TOPLAM İŞ</b>
          <span style="font-size:20px;">${total}</span>
        </div>
      </div>
      <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:2px;">
        ${stages.map((s,i) => `
          <div onclick="filterBoardByStage('${s}')" style="display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;" onmouseover="this.style.background='var(--surface-sunk)'" onmouseout="this.style.background='transparent'">
            <span style="width:10px;height:10px;border-radius:3px;background:${STAGE_COLORS[s]}; flex-shrink:0;"></span>
            <span style="flex:1; font-size:13px; font-weight:500;">${STAGE_LABELS_TR[s]}</span>
            <span style="font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--ink-2);">${counts[i]}</span>
            <span style="color:var(--ink-3); font-size:12px;">›</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function filterBoardByStage(stage){
  boardFilterStage = stage;
  gorevSub = 'genel-board';
  currentPage = 'gorev-yonetimi';
  openSubmenu = 'gorev-yonetimi';
  renderNav(); renderContent();
}

    </div>

      ${kpi('Açık İş', openTasks, 'tahsilata gelmemiş')}
      ${kpi('Onay Bekleyen', waitingApproval, 'üretime geçemiyor', waitingApproval>0)}
      ${kpi('Sahada', inMontaj, 'montaj aşamasında')}
      ${kpi('Taslak Teklif', draftQuotes, 'gönderilmeyi bekliyor')}
    </div>
    <div class="ledger-main" style="margin-bottom:16px;">
      <div class="group-header"><span>Departmanlara Göre Dağılım</span><span>tıklayın, o aşamaya gidin</span></div>
      ${departmentDonut()}
    </div>
    <div class="ledger-main">
      <div class="group-header"><span>Rotadaki İşler</span><span>${JOBS.length} kayıt</span></div>
      ${JOBS.map(j => `
        <div class="ledger-row">
          <div style="flex:1;">
            <div class="ledger-title">${j.client}</div>

}

// USERS = giriş hesabı olan personel (PERSONELLER.kullanici) — ayrı liste tutulmaz
Object.defineProperty(window, 'USERS', { get: function(){
  return PERSONELLER.filter(p => p.kullanici && !p.arsiv)
    .map(p => ({ id:p.id, name:p.name, email:p.kullanici.email, role:p.kullanici.rol, unvan:p.unvan }));
}});
function personelByRol(rol){ return PERSONELLER.find(p => p.kullanici && p.kullanici.rol === rol && !p.arsiv); }

        ${USERS.map(u => `<tr><td><b>${u.name}</b></td><td>${u.unvan || '—'}</td><td>${u.email}</td><td>${ROLE_CONFIG[u.role].label}</td>

function openUserModal(){
  const roleOptions = Object.keys(ROLE_CONFIG).map(r => `<option value="${r}">${ROLE_CONFIG[r].label}</option>`).join('');
  const adaylar = PERSONELLER.filter(p => !p.arsiv && !p.kullanici);
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Giriş Hesabı Aç</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="hint" style="margin:0 0 12px;">Kullanıcılar ayrı bir liste değil: bir personele giriş hesabı bağlanır. Listede yoksa önce <b>Ön Muhasebe → Personeller</b>'den ekleyin.</div>
    <div class="field"><label>Personel</label><select id="uPersonel">
      ${adaylar.length ? adaylar.map(p => `<option value="${p.id}">${p.name} — ${p.unvan || p.departman || ''}</option>`).join('')
                       : '<option value="">Hesapsız personel kalmadı</option>'}</select></div>
    <div class="field"><label>E-posta</label><input id="uEmail" type="email" placeholder="ornek@firma.com"></div>
    <div class="field"><label>Geçici şifre</label><input id="uPass" type="text" placeholder="En az 6 karakter"><div class="hint" style="margin-top:4px;">Kullanıcıya iletin; daha sonra buradan değiştirebilirsiniz.</div></div>
    <div class="field"><label>Rol</label><select id="uRole">${roleOptions}</select></div>
    <button class="modal-submit" id="uSubmitBtn" onclick="submitUser()">Hesabı Aç</button>
  `;
  showModal();
}
async function submitUser(){
  const pid = document.getElementById('uPersonel').value;
  const email = document.getElementById('uEmail').value.trim().toLowerCase();
  const pass = document.getElementById('uPass').value;
  const rol = document.getElementById('uRole').value;
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p){ showToast('Personel seçin.'); return; }
  if(!email){ showToast('E-posta girin.'); return; }
  if(pass.length < 6){ showToast('Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('uSubmitBtn'); btn.disabled = true; btn.textContent = 'Açılıyor…';
  const r = await liveApi('POST', '/api/users', { email, name:p.name, password:pass, role:rol });
  if(!r.ok){ btn.disabled = false; btn.textContent = 'Hesabı Aç'; showToast(r.error); return; }
  p.kullanici = { email:email, rol:rol };
  closeModal(); renderContent();
  showToast(`${p.name} için giriş hesabı açıldı (${ROLE_CONFIG[rol].label}).`);
}
async function removeUser(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p || !p.kullanici) return;
  if(p.kullanici.rol === 'YONETICI' && USERS.filter(u => u.role === 'YONETICI').length <= 1){
    showToast('Son yönetici hesabı kaldırılamaz.'); return;
  }
  if(LIVE.user && p.kullanici.email === LIVE.user.email){ showToast('Kendi hesabınızı kaldıramazsınız.'); return; }
  const r = await liveApi('DELETE', '/api/users', { email:p.kullanici.email });
  if(!r.ok && r.status !== 404){ showToast(r.error); return; }
  delete p.kullanici; renderContent(); showToast(`${p.name} — giriş hesabı kaldırıldı.`);
}
function openPasswordModal(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p || !p.kullanici) return;
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Şifre Belirle</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="hint" style="margin:0 0 12px;"><b>${p.name}</b> (${p.kullanici.email}) için yeni şifre.</div>
    <div class="field"><label>Yeni şifre</label><input id="pwNew" type="text" placeholder="En az 6 karakter"></div>
    <button class="modal-submit" id="pwSubmitBtn" onclick="submitPassword('${p.id}')">Şifreyi Kaydet</button>
  `;
  showModal();
}
async function submitPassword(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  const pass = document.getElementById('pwNew').value;
  if(!p || !p.kullanici) return;
  if(pass.length < 6){ showToast('Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('pwSubmitBtn'); btn.disabled = true;
  const r = await liveApi('PATCH', '/api/users', { email:p.kullanici.email, password:pass });
  if(!r.ok){ btn.disabled = false; showToast(r.error); return; }
  closeModal(); showToast(`${p.name} — şifre güncellendi.`);
}

function webUrl(v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://' + s.replace(/^\/+/, '');
}
function socialUrl(base, v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return base + s.replace(/^[\/@]+/, '');
}
function telHref(v){
  const d = String(v || '').replace(/[^\d+]/g, '');
  return d ? 'tel:' + d : '';
}
function waHref(v){
  let d = String(v || '').replace(/\D/g, '').replace(/^0+/, '');
  if(!d) return '';
  if(d.length === 10) d = '90' + d;          // 5xx xxx xx xx → 90 5xx...
  return 'https://wa.me/' + d;
}
function linkOr(href, inner, cls){
  return href
    ? `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

function daysLeft(iso){
  if(!iso) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d - t)/86400000);
}
function dueStatus(n){
  if(n === null)                   return { cls:'none', text:'Tarih girilmedi' };
  if(n < 0)                        return { cls:'late', text:Math.abs(n)+' gün gecikti' };
  if(n === 0)                      return { cls:'late', text:'Bugün son gün' };
  if(n <= 7)                       return { cls:'crit', text:n+' gün kaldı' };
  if(n <= VEHICLE_ALERT_WINDOW)    return { cls:'soon', text:n+' gün kaldı' };
  return { cls:'ok', text:n+' gün kaldı' };
}
function plateHtml(p, sm){
  return '<span class="plate'+(sm?' sm':'')+'"><span class="plate-tr">TR</span><span class="plate-no">'+(p||'—')+'</span></span>';
}
function vehicleLabel(v){ return [v.brand, v.model, v.year].filter(Boolean).join(' ') || 'İsimsiz araç'; }
function money(n){ return '₺'+(Number(n)||0).toLocaleString('tr-TR'); }
function canSeeVehicles(){ return (roleCfg().yonetimSubs||[]).includes('araclarim'); }

function vehicleAlerts(){
  const out = [];
  VEHICLES.forEach(v => DATE_FIELDS.forEach(f => {
    const n = daysLeft(v.dates[f.key]);
    if(n === null || n > VEHICLE_ALERT_WINDOW) return;
    out.push({ v:v, f:f, n:n, st:dueStatus(n) });
  }));
  return out.sort((a,b) => a.n - b.n);
}

function vehicleCardHtml(v){
  const chips = DATE_FIELDS
    .map(f => ({ f:f, n:daysLeft(v.dates[f.key]) }))
    .filter(x => x.n !== null)
    .sort((a,b) => a.n - b.n)
    .slice(0,3)
    .map(x => { const st = dueStatus(x.n);
      return `<span class="v-chip ${st.cls}">${x.f.short}: ${st.text}</span>`; }).join('');
  const totalExp = v.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  return `
    <div class="v-card" onclick="openVehicle('${v.id}')">
      <div class="v-card-top">
        <div>
          <div class="v-card-name">${vehicleLabel(v)}</div>
          <div class="v-card-sub">${v.fuel} · ${(Number(v.km)||0).toLocaleString('tr-TR')} km · ${v.owner || 'Zimmetsiz'}</div>
          <div class="v-card-sub">Toplam gider: <b style="color:var(--ink-2);">${money(totalExp)}</b></div>
        </div>
        ${plateHtml(v.plate)}
      </div>
      <div class="v-card-dates">${chips || '<span class="v-chip none">Tarih girilmedi</span>'}</div>
    </div>`;
}

function saveVehicle(){
  const plate = document.getElementById('vPlate').value.trim().toUpperCase();
  if(!plate){ showToast('Plaka zorunlu.'); return; }
  const dates = {};
  DATE_FIELDS.forEach(f => { const el = document.getElementById('vd_'+f.key); dates[f.key] = el && el.value ? el.value : ''; });
  const kms = {};
  DATE_FIELDS.forEach(f => { if(!f.hasKm) return; const el = document.getElementById('vk_'+f.key);
    kms[f.key] = el && el.value ? Number(el.value) : ''; });
  const data = {
    plate: plate,
    brand: document.getElementById('vBrand').value.trim(),
    model: document.getElementById('vModel').value.trim(),
    year:  document.getElementById('vYear').value,
    fuel:  document.getElementById('vFuel').value,
    km:    Number(document.getElementById('vKm').value) || 0,
    owner: document.getElementById('vOwner').value,
    note:  document.getElementById('vNote').value.trim(),
    dates: dates,
    kms: kms,
  };
  const existing = VEHICLES.find(x => x.id === editingVehicleId);
  if(existing){ Object.assign(existing, data); viewingVehicleId = existing.id; }
  else { const nv = Object.assign({ id:'v'+Date.now(), expenses:[] }, data); VEHICLES.push(nv); viewingVehicleId = nv.id; }
  editingVehicleId = null; aracStep = 'detail'; renderContent();
  showToast(plate + ' kaydedildi.');
}
function deleteVehicle(id){
  const v = VEHICLES.find(x => x.id === id);
  VEHICLES = VEHICLES.filter(x => x.id !== id);
  editingVehicleId = null; viewingVehicleId = null; aracStep = 'list'; renderContent();
  showToast((v ? v.plate : 'Araç') + ' silindi.');
}

}

  const ozel = (AGENCY.sozler || []).map(x => String(x).trim()).filter(Boolean);

function gununSozu(){
  const liste = sozListesi();
  if(sozSirasi === null){
    const bugun = new Date();
    const yilBasi = new Date(bugun.getFullYear(), 0, 1);
    const gunNo = Math.floor((bugun - yilBasi) / 86400000);
    sozSirasi = (gunNo + bugun.getFullYear()) % liste.length;
  }
  return liste[sozSirasi % liste.length];
}

function railHtml(currentStage){
  const idx = STAGES.findIndex(s=>s.key===currentStage);
  const codes = ['KŞF','TSR','ÜRT','MNT','THS'];
  return `
    <div class="rail">
      ${STAGES.map((s,i)=>`<div class="rail-seg ${i<idx?'done':i===idx?'now':''}"></div>`).join('')}
    </div>
    <div class="rail-labels">
      ${codes.map((c,i)=>`<span class="${i===idx?'now':''}">${c}</span>`).join('')}
    </div>
  `;
}
function initials(name){ if(!name) return '?'; return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

function openJobDrawer(id){
  const j = JOBS.find(x=>x.id===id);
  if(!j) return;
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  const nextStage = STAGES[idx+1];
  const isLastStage = idx === STAGES.length-1;
  const isTasarim = j.stage==='TASARIM';
  const locked = isTasarim && j.approval!=='ONAYLANDI';

  let actionHtml = '';
  if(isTasarim){
    actionHtml = `
      <div class="drawer-section-title">✅ Müşteri Onayı</div>
      <div style="font-size:12.5px; margin-bottom:10px; color:${j.approval==='ONAYLANDI'?'var(--ok)':j.approval==='REVIZYON'?'var(--hold)':'var(--signal)'}; font-weight:600;">${APPROVAL_LABEL_JOB[j.approval] || 'Onay Bekliyor'}</div>
      <div class="drawer-footer" style="margin-top:0;">
        <button class="primary" onclick="setJobApproval('${j.id}','ONAYLANDI')">Onaylandı → Üretime Gönder</button>
      </div>
      <div class="drawer-footer">
        <button onclick="setJobApproval('${j.id}','REVIZYON')">Revizyon İstendi</button>
      </div>
      ${locked ? '<div class="locked" style="margin-top:12px;">🔒 Onay gelmeden bu iş Üretim aşamasına geçemez.</div>' : ''}
    `;
  } else if(!isLastStage){
    actionHtml = `
      <div class="drawer-footer" style="margin-top:20px;">
        <button class="primary" onclick="advanceJobStage('${j.id}')">İlerlet → ${nextStage.label}</button>
      </div>
    `;
  } else {
    actionHtml = `<div class="note" style="margin-top:16px;">Bu iş rotanın son aşamasında (Tahsilat).</div>`;
  }
  if(idx > 0){
    actionHtml += `<div class="drawer-footer"><button onclick="revertJobStage('${j.id}')">← Bir Önceki Aşamaya Al</button></div>`;
  }
  if(CURRENT_ROLE === 'YONETICI'){
    actionHtml += `<div class="drawer-footer"><button style="color:var(--risk);border-color:var(--risk);" onclick="deleteJob('${j.id}')">🗑️ İşi Sil</button></div>`;

    <div style="background:var(--surface-sunk); border-radius:6px; padding:9px 11px; margin-bottom:7px;">

      <div style="font-size:12.5px; color:var(--ink); white-space:pre-wrap;">${j.notes[s.key]}</div>
    </div>
  `).join('');
  const notesHtml = `
    <div class="drawer-section-title">📝 Departman Notları</div>
    ${notesLog || '<div style="font-size:12px; color:var(--ink-3); margin-bottom:8px;">Henüz not eklenmemiş.</div>'}

function drNumara(){
  const yil = new Date().getFullYear();
  let enBuyuk = 0;
  JOBS.forEach(j => {
    const m = j.isEmri && j.isEmri.emriNo && j.isEmri.emriNo.match(/^DR-(\d{4})-(\d{5})$/);
    if(m && Number(m[1]) === yil) enBuyuk = Math.max(enBuyuk, Number(m[2]));
  });
  return 'DR-' + yil + '-' + String(enBuyuk + 1).padStart(5, '0');
}
function ieVarsayilan(j){
  if(!j.isEmri) j.isEmri = {};
  const e = j.isEmri;
  const alanlar = {
    projeAdi: j.desc || '', yetkili: '', satinalmaNo: '', siparisAdet: '',
    teslimTarihi: '', montajTarihi: '', montajYeri: '', grafiker: '', koordinator: '',
    aciklama: '', malzemeler: j.material || '', tedarikci: '', tedarikNot: '',
    durum: 'tasarim', oncelik: 'normal', genelAciklama: '',
    dosyaAdi: '', revizyon: '', onaylayan: '', onayTarihi: '',
    montajSaati: '', montajAlan: '', ekipLideri: '', sahaTelefon: '',
    isg: '', calisma: '', elektrik: '', vinc: '', iskeleSec: '', montajOncesiOlcu: '',
    konumLink: '',
    eksikNot: '', montajYapan: '', kontrolEden: '',
  };
  Object.keys(alanlar).forEach(k => { if(e[k] === undefined) e[k] = alanlar[k]; });
  if(!e.emriNo) e.emriNo = drNumara();
  if(!Array.isArray(e.kalemler)) e.kalemler = [];
  if(!Array.isArray(e.gorseller)) e.gorseller = [];
  if(!Array.isArray(e.montajEkibi)) e.montajEkibi = [];
  if(!Array.isArray(e.tedarikListe)){
    e.tedarikListe = [];
    if(e.tedarikci || e.tedarikNot)   // eski tek alanlı kayıtlar taşınır
      e.tedarikListe.push({ malzeme: e.malzemeler || '', tedarikci: e.tedarikci || '', not: e.tedarikNot || '' });
  }
  // Teklifteki kalemler iş emrine otomatik gelir (bir kez)
  if(!e.kalemlerYuklendi){
    e.kalemlerYuklendi = true;
    if(!e.kalemler.length && j.quoteId){
      const q = QUOTES.find(x => x.id === j.quoteId);
      if(q && Array.isArray(q.items)){
        q.items.forEach(it => {
          if(it.title) e.kalemler.push({ tanim: it.title, kod: '', adet: it.qty || '', en: '', boy: '', malzeme: it.detail || '' });
        });
      }
    }
  }
  ['dosyaKontrol','ekipman','kapanis'].forEach(k => { if(!e[k] || typeof e[k] !== 'object') e[k] = {}; });
  return e;
}

}

function ieAlan(id, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j)[ad] = deger;

  ieKirli();
}
function ieCheck(id, grup, ad, deger){

}
function ieKalem(id, i, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.kalemler[i]) return;
  j.isEmri.kalemler[i][ad] = (ad === 'adet' || ad === 'en' || ad === 'boy') ? (deger === '' ? '' : virgulSayi(deger)) : deger;
  ieKirli();

function ieTedarik(id, i, ad, deger){

function ieKalemSil(id, i){

  j.isEmri.kalemler.splice(i, 1);
  ieRender(id); ieKirli();

function ieGorselIsle(id, file){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j);
  if(j.isEmri.gorseller.length >= 8){ showToast('Bir iş emrine en fazla 8 görsel eklenebilir.'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const olcek = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * olcek));
      c.height = Math.max(1, Math.round(img.height * olcek));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      j.isEmri.gorseller.push({ src: c.toDataURL('image/jpeg', 0.72), not: '' });
      ieRender(id); ieKirli();
      showToast('Görsel eklendi.');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function ieGorselNot(id, i, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.gorseller[i]) return;
  j.isEmri.gorseller[i].not = deger;
  ieKirli();
}
function ieGorselSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.gorseller.splice(i, 1);
  ieRender(id); ieKirli();
}

// ---- Pano sürükle-bırak: kartı başka aşamaya taşı (yalnız yönetici) ----
let surukluIsId = null;
function isSurukleBasla(e, id){
  if(CURRENT_ROLE !== 'YONETICI'){ e.preventDefault(); return; }
  surukluIsId = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch(err) {}
  e.currentTarget.classList.add('suruklenen');
}
function isSurukleBitir(e){
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('suruklenen');
  document.querySelectorAll('.board-col.drop').forEach(c => c.classList.remove('drop'));
  surukluIsId = null;
}
function isSurukleUzeri(e){
  if(!surukluIsId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop');
}
function isSurukleCik(e){ e.currentTarget.classList.remove('drop'); }
function isBirak(e, hedef){
  e.preventDefault();
  const id = surukluIsId; surukluIsId = null;
  if(!id) return;
  jobTasi(id, hedef);
}
function jobTasi(id, hedef){
  const j = JOBS.find(x => x.id === id);
  if(!j || j.stage === hedef){ renderContent(); return; }
  const from = STAGES.findIndex(s => s.key === j.stage);
  const to = STAGES.findIndex(s => s.key === hedef);
  if(j.stage === 'TASARIM' && to > from && j.approval !== 'ONAYLANDI'){
    renderContent();
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.');
    return;
  }
  const eski = j.stage;
  jobAsamaAyarla(j, hedef);
  renderContent();
  showToast(`${j.client} — ${STAGE_LABELS_TR[eski]} → ${STAGE_LABELS_TR[hedef]}.`);
}
// Aşama değişince onay bayrağını tutarlı tut:
//  • Tasarım'a giren iş onay bekler (BEKLIYOR)
//  • Tasarım'dan Üretim'e yalnız ONAYLANDI ile çıkılır
//  • Üretim'den Tasarım'a geri alınan iş yeniden onay bekler
//  • Keşif'e dönen işin onayı sıfırlanır
function jobAsamaAyarla(j, yeniStage){
  const eski = j.stage;
  j.stage = yeniStage;
  if(yeniStage === 'TASARIM'){ if(j.approval !== 'REVIZYON') j.approval = 'BEKLIYOR'; }
  else if(yeniStage === 'KESIF'){ j.approval = null; }
  // Üretim / Montaj'a geçen iş: koordinatöre planlama bildirimi
  if(eski !== yeniStage && (yeniStage === 'URETIM' || yeniStage === 'MONTAJ')){
    bildirimYoneticilere(`${j.code} · ${j.client} — ${STAGE_LABELS_TR[yeniStage]} aşamasına geçti, ${yeniStage === 'URETIM' ? 'üretim' : 'montaj'} planlaması gerekiyor.`, 'bilgi', { jobId: j.id });
  }
  if(eski !== yeniStage && yeniStage === 'TAHSILAT'){
    bildirimRole('MUHASEBE', `İş tahsilata geçti: ${j.code} · ${j.client}${j.tutar ? ' — ₺' + Number(j.tutar).toLocaleString('tr-TR') : ''}. Fatura/tahsilat takibi Gelirler ekranında.`, { jobId: j.id });
    bildirimYoneticilere(`${j.code} · ${j.client} tahsilat aşamasına geçti.`, 'bilgi', { jobId: j.id });
  }
}
function deleteJob(id){
  if(CURRENT_ROLE !== 'YONETICI'){ showToast('İş silme yalnızca yönetici yetkisindedir.'); return; }
  const j = JOBS.find(x => x.id === id); if(!j) return;
  if(!confirm(`${j.code} · ${j.client} işini plan kayıtlarıyla birlikte silmek istediğinize emin misiniz?`)) return;
  PLAN_TASKS = PLAN_TASKS.filter(t => t.jobId !== id);
  JOBS = JOBS.filter(x => x.id !== id);
  const q = j.quoteId ? QUOTES.find(x => x.id === j.quoteId) : (j.id ? QUOTES.find(x => x.jobId === j.id) : null);
  if(q){ q.jobId = null; }                       // teklif durur, sadece iş bağlantısı kalkar
  closeDrawer(); renderContent();
  showToast(`${j.code} silindi${q ? ' — ' + q.no + ' teklifi duruyor, bağlantısı kaldırıldı' : ''}.`);
}
function advanceJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx >= STAGES.length-1) return;
  if(j.stage === 'TASARIM' && j.approval !== 'ONAYLANDI'){
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.'); return;
  }
  jobAsamaAyarla(j, STAGES[idx+1].key);
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx+1].label} aşamasına taşındı.`);
}
function revertJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx <= 0) return;
  const hedef = STAGES[idx-1].key;
  j.stage = hedef;
  if(hedef === 'TASARIM') j.approval = 'BEKLIYOR';      // üretimden dönen iş yeniden onaya girer
  if(hedef === 'KESIF') j.approval = null;
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx-1].label} aşamasına geri alındı${hedef==='TASARIM' ? ', onay sıfırlandı' : ''}.`);
}
function setJobApproval(id, status){
  const j = JOBS.find(x=>x.id===id);
  if(j.stage !== 'TASARIM'){ showToast('Onay yalnızca Tasarım aşamasındaki iş için verilir.'); return; }
  j.approval = status;
  if(status==='ONAYLANDI') jobAsamaAyarla(j, 'URETIM');
  closeDrawer();
  renderContent();
  showToast(status==='ONAYLANDI' ? `${j.client} — onaylandı, Üretim aşamasına taşındı.` : `${j.client} için revizyon istendi.`);
}
function saveJobNote(id){
  const j = JOBS.find(x=>x.id===id);

  if(!j.notes) j.notes = {};
  j.notes[j.stage] = document.getElementById('jobNoteInput').value;
  showToast('Not kaydedildi.');
  openJobDrawer(id);
}

function submitPersonForm(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ alert(newCustomerType==='firma' ? 'Firma adı gerekli' : 'Ad Soyad gerekli'); return; }
  const isFirma = newCustomerType === 'firma';

    email: emailRow ? emailRow.value : '',
    address: addr ? [addr.detail, addr.ilce, addr.sehir].filter(Boolean).join(', ') : '',
    kaynak: document.getElementById('pKaynak').value,
    kampanya: document.getElementById('pKampanya').value,
    temsilci: document.getElementById('pTemsilci').value,
    standartGrafikerId: (document.getElementById('pStandartGrafiker') || {}).value || '',
    sektor: document.getElementById('pSektor').value,
    durum: document.getElementById('pDurum').value,
    etiket: document.getElementById('pEtiket').value,
    kisaAciklama: document.getElementById('pKisaAciklama').value,
    hatirlatma: document.getElementById('pHatirlatma').value,
    contactRows: JSON.parse(JSON.stringify(contactRows)),
    addressRows: JSON.parse(JSON.stringify(addressRows)),
    faturaUnvani: document.getElementById('pFaturaUnvani').value,
    vergiNo: document.getElementById('pVergiNo').value,
    vergiDairesi: document.getElementById('pVergiDairesi').value,
    faturaAdresi: document.getElementById('pFaturaAdresi').value,
    fPostaKodu: document.getElementById('pFPostaKodu').value,
    fIlce: document.getElementById('pFIlce').value,
    fSehir: document.getElementById('pFSehir').value,
    fUlke: document.getElementById('pFUlke').value,
    vadeGun: document.getElementById('pVadeGun').value,
    calisanSayisi: document.getElementById('pCalisanSayisi').value,
  };

  if(editingCustomerId){
    const idx = CUSTOMERS.findIndex(c=>c.id===editingCustomerId);
    CUSTOMERS[idx] = { ...CUSTOMERS[idx], ...data };
  } else {
    CUSTOMERS.push({ id:'c'+Date.now(), dateAdded:new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}), ...data });
  }

  kisilerStep = 'list';

  contactRows = [{ type:'İş Telefon No', value:'' }];
  addressRows = [{ type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:'' }];

  renderContent();
  showToast(`${name} kaydedildi.`);
}

let teklifFiltrePanel = false;
let teklifFiltre = { q:'', musteri:'', no:'', durum:'', temsilci:'', tarih:'', etiket:'',
                     tur:'', gecerlilik:'', sonuc:'' };
function teklifFiltreDegistir(alan, deger){ teklifFiltre[alan] = deger; }
function teklifFiltreUygula(){
  ['musteri','no','durum','temsilci','tarih','etiket'].forEach(a => {
    const el = document.getElementById('tf_'+a);
    if(el) teklifFiltre[a] = el.value;
  });
  renderContent();
}
function teklifFiltreTemizle(){
  teklifFiltre = { q:'', musteri:'', no:'', durum:'', temsilci:'', tarih:'', etiket:'', tur:'', gecerlilik:'', sonuc:'' };
  renderContent();
}
function teklifYanFiltre(alan, deger){
  teklifFiltre[alan] = (teklifFiltre[alan] === deger) ? '' : deger;
  renderContent();
}
function teklifMusteriAdi(q){
  const c = CUSTOMERS.find(x => x.id === q.customerId);
  if(c) return c.name;
  if(q.musteriAdi) return q.musteriAdi + ' (silinmiş cari)';
  return 'Müşteri seçilmedi';
}
function teklifGecerlilikDurumu(q){
  if(!q.gecerlilik) return '';
  const n = daysLeft(q.gecerlilik);
  if(n === null) return '';
  if(n < 0)  return 'Süresi Geçmiş';
  if(n === 0) return 'Bugün';
  if(n <= 7) return 'Süresi Dolmak Üzere';
  return 'Hala Geçerli';
}
function teklifleriFiltrele(){
  const f = teklifFiltre;
  const ara = (f.q || '').toLocaleLowerCase('tr');
  return QUOTES.filter(q => {
    const cust = CUSTOMERS.find(c => c.id === q.customerId);
    const ad = cust ? cust.name : '';
    if(ara){
      const havuz = [ad, q.no, q.repName, q.status, q.tur, (q.etiketler||[]).join(' ')]
        .join(' ').toLocaleLowerCase('tr');
      if(!havuz.includes(ara)) return false;
    }
    if(f.musteri && !ad.toLocaleLowerCase('tr').includes(f.musteri.toLocaleLowerCase('tr'))) return false;
    if(f.no && !String(q.no||'').toLocaleLowerCase('tr').includes(f.no.toLocaleLowerCase('tr'))) return false;
    if(f.durum && q.status !== f.durum) return false;
    if(f.temsilci && q.repName !== f.temsilci) return false;
    if(f.tarih && q.date !== f.tarih) return false;
    if(f.etiket && !(q.etiketler||[]).some(e => e.toLocaleLowerCase('tr').includes(f.etiket.toLocaleLowerCase('tr')))) return false;
    if(f.tur && (q.tur || 'Satış Teklifi') !== f.tur) return false;
    if(f.sonuc && (q.sonuc || 'Sonuçlandırılmamış') !== f.sonuc) return false;
    if(f.gecerlilik){
      const g = teklifGecerlilikDurumu(q);
      if(f.gecerlilik === 'Hala Geçerli'){
        if(!['Hala Geçerli','Süresi Dolmak Üzere','Bugün'].includes(g)) return false;
      } else if(g !== f.gecerlilik) return false;
    }
    return true;
  });
}

  return `<h5>${baslik}</h5>${secenekler.map(s =>
    `<button class="${teklifFiltre[alan] === s ? 'on' : ''}" onclick="teklifYanFiltre('${alan}','${s}')">${s}</button>`).join('')}`;
}

    ${teklifFiltrePanel ? `<div class="tk-panel">

    <div class="tk-wrap">

        ${teklifYanGrup('Sonuç','sonuc', TEKLIF_SONUCLARI)}

function yeniTeklifNo(){
  const maks = QUOTES.reduce((m, q) => {
    const n = parseInt(String(q.no || '').replace(/\D/g, ''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 4);
  return 'P' + String(maks + 1).padStart(3, '0');
}

function toggleTeklifCollapse(key){
  teklifCollapse[key] = !teklifCollapse[key];
  renderContent();

function formatDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('tr-TR'); }
// ---------------- ÖLÇÜLÜ SATIRLAR (m² / mtül) ----------------
const LINE_UNITS = [
  { key:'adet', label:'Adet', short:'ad' },
  { key:'m2',   label:'m²',   short:'m²' },
  { key:'mtul', label:'mtül', short:'mtül' },
];
function lineUnit(it){ return it.unit || 'adet'; }
function hasMeasure(it){ return lineUnit(it) !== 'adet'; }
function anyMeasure(items){ return (items||[]).some(hasMeasure); }
function unitShort(it){ const u = LINE_UNITS.find(x=>x.key===lineUnit(it)); return u ? u.short : 'ad'; }
function unitMeasure(it){                       // tek parçanın ölçüsü
  const u = lineUnit(it);
  if(u === 'm2')   return ((Number(it.w)||0) * (Number(it.h)||0)) / 10000;
  if(u === 'mtul') return (Number(it.w)||0) / 100;
  return 0;
}
function lineQty(it){                           // fiyatla çarpılan nihai miktar
  return hasMeasure(it) ? unitMeasure(it) * (Number(it.qty)||0) : (Number(it.qty)||0);
}
function lineNet(it){ return lineQty(it) * (Number(it.price)||0); }
function lineGross(it){ return lineNet(it) * (1 + (Number(it.kdv)||0)/100); }
function fmt2(n){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function dimText(it){                           // "200 × 150 cm"
  const u = lineUnit(it);
  if(u === 'adet') return '';
  const w = (Number(it.w)||0).toLocaleString('tr-TR');
  if(u === 'mtul') return `${w} cm`;
  return `${w} × ${(Number(it.h)||0).toLocaleString('tr-TR')} cm`;
}
function measureText(it){                       // "200 × 150 cm · 3,00 m²"
  const u = lineUnit(it);
  if(u === 'adet') return '';
  const w = (Number(it.w)||0).toLocaleString('tr-TR');
  if(u === 'mtul') return `${w} cm · ${fmt2(lineQty(it))} mtül`;
  const hh = (Number(it.h)||0).toLocaleString('tr-TR');
  return `${w} × ${hh} cm · ${fmt2(lineQty(it))} m²`;
}
// "Folyo Baskı 200x150 cm" / "2,5 x 1,2 m" → { w, h } (cm)
function parseDims(text){
  const m = String(text||'').match(/(\d+(?:[.,]\d+)?)\s*[x×X*]\s*(\d+(?:[.,]\d+)?)\s*(cm|mm|m)?\b/);
  if(!m) return null;
  const num = s => parseFloat(String(s).replace(',', '.'));
  const a = num(m[1]), b = num(m[2]);
  if(!a || !b) return null;
  const u = (m[3]||'').toLowerCase();
  let f = 1;                                     // birim yazılmamışsa cm
  if(u === 'm') f = 100;
  else if(u === 'mm') f = 0.1;
  else if(!u && a <= 20 && b <= 20) f = 100;     // "2x1,5" gibi küçük sayılar metre
  return { w: Math.round(a*f*10)/10, h: Math.round(b*f*10)/10 };
}

function quoteTotal(q){ return q.items.reduce((s,i)=> s + lineGross(i), 0); }
function quoteSub(q){ return q.items.reduce((s,i)=> s + lineNet(i), 0); }
function quoteKdvAmount(q){ return quoteTotal(q) - quoteSub(q); }

// Herhangi bir müşteri seçim kutusundan (Teklif, Görev Ekle vb.) ayrılmadan hızlı müşteri ekleme — Kişiler listesine de kaydedilir.

let quickCustomerType = 'firma';

  document.getElementById('qcTypeSahis').style.background = type==='sahis' ? 'var(--surface-sunk)' : 'var(--surface)';
  document.getElementById('qcTypeFirma').style.borderColor = type==='firma' ? 'var(--ink)' : 'var(--line-strong)';

function submitQuickCustomer(){

  if(!name){ alert('İsim gerekli'); return; }
  const newCustomer = {
    id: 'c'+Date.now(),
    type: quickCustomerType,
    name,
    contact: quickCustomerType==='firma' ? '' : name,
    phone: document.getElementById('qcPhone').value,
    email: document.getElementById('qcEmail').value,
    address: '',
    durum: 'Potansiyel Müşteri',
    dateAdded: new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}),
  };

  closeModal();
  // İstek hangi müşteri seçim kutusundan geldiyse (Teklif, Görev Ekle...) onu yeni listeyle tazele ve yeni kişiyi seçili yap.

    select.innerHTML = customerSelectOptions();
