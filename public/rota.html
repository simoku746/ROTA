function saveVehicle(){
  const plate = document.getElementById('vPlate').value.trim().toUpperCase();
  if(!plate){ showToast('Plaka zorunlu.'); return; }
  const dates = {};
  DATE_FIELDS.forEach(f => { const el = document.getElementById('vd_'+f.key); dates[f.key] = el && el.value ? el.value : ''; });
  const kms = {};
  DATE_FIELDS.forEach(f => { if(!f.hasKm) return; const el = document.getElementById('vk_'+f.key);
    kms[f.key] = el && el.value ? Number(el.value) : ''; });
  const data = {
    plate: plate,
    brand: document.getElementById('vBrand').value.trim(),
    model: document.getElementById('vModel').value.trim(),
    year:  document.getElementById('vYear').value,
    fuel:  document.getElementById('vFuel').value,
    km:    Number(document.getElementById('vKm').value) || 0,
    owner: document.getElementById('vOwner').value,
    note:  document.getElementById('vNote').value.trim(),
    dates: dates,
    kms: kms,
  };
  const existing = VEHICLES.find(x => x.id === editingVehicleId);
  if(existing){ Object.assign(existing, data); viewingVehicleId = existing.id; }
  else { const nv = Object.assign({ id:'v'+Date.now(), expenses:[] }, data); VEHICLES.push(nv); viewingVehicleId = nv.id; }
  editingVehicleId = null; aracStep = 'detail'; renderContent();
  showToast(plate + ' kaydedildi.');
}
function deleteVehicle(id){
  const v = VEHICLES.find(x => x.id === id);
  VEHICLES = VEHICLES.filter(x => x.id !== id);
  editingVehicleId = null; viewingVehicleId = null; aracStep = 'list'; renderContent();
  showToast((v ? v.plate : 'Araç') + ' silindi.');
}

function submitExpense(vid){
  const v = VEHICLES.find(x => x.id === vid);
  if(!v) return;
  const amount = Number(document.getElementById('exAmount').value) || 0;
  if(!amount){ showToast('Tutar girin.'); return; }
  v.expenses.push({
    id: 'e'+Date.now(),
    date: document.getElementById('exDate').value || isoPlus(0),
    type: document.getElementById('exType').value,
    amount: amount,
    desc: document.getElementById('exDesc').value.trim(),
  });
  closeModal(); renderContent();
  showToast(money(amount) + ' gider eklendi.');
}
function deleteExpense(vid, eid){
  const v = VEHICLES.find(x => x.id === vid);
  if(!v) return;
  v.expenses = v.expenses.filter(e => e.id !== eid);
  renderContent(); showToast('Gider kaydı silindi.');
}

function gununSozu(){
  const liste = sozListesi();

function panoFiltreUygula(j){
  if(panoSorumlu && !(j.assignees || []).includes(panoSorumlu)) return false;
  if(panoAra){
    const q = panoAra.toLowerCase();
    const metin = `${j.code || ''} ${j.client || ''} ${j.desc || ''} ${(j.assignees||[]).join(' ')}`.toLowerCase();
    if(!metin.includes(q)) return false;
  }
  return true;
}

  const codes = ['KŞF','TSR','ÜRT','MNT','THS'];

    <div class="rail">
      ${STAGES.map((s,i)=>`<div class="rail-seg ${i<idx?'done':i===idx?'now':''}"></div>`).join('')}
    </div>
    <div class="rail-labels">

    <textarea id="jobNoteInput" rows="2" placeholder="Bir sonraki departmana iletmek istediğiniz not..." style="width:100%; padding:9px 11px; border:1.5px solid var(--line-strong); border-radius:6px; font-size:12.5px; background:var(--surface); color:var(--ink); font-family:inherit;">${j.notes[j.stage]||''}</textarea>
    <button class="save-btn" style="width:100%; margin-top:8px; height:34px; font-size:12.5px;" onclick="saveJobNote('${j.id}')">Notu Kaydet</button>

    ${j.material ? `<div class="drawer-row"><span class="k">Malzeme</span><span class="v" style="text-align:right; max-width:220px;">${j.material}</span></div>` : ''}
    ${j.quoteId ? `<div class="drawer-row"><span class="k">Teklif</span><span class="v" style="text-align:right;">

    ${(() => { const b = planBlogu(j); return b ? `<div class="drawer-row"><span class="k">Planlandı</span><span class="v" style="text-align:right;">📅 ${planBlogMetni(b)}</span></div>` : ''; })()}

function drNumara(){
  const yil = new Date().getFullYear();
  let enBuyuk = 0;
  JOBS.forEach(j => {
    const m = j.isEmri && j.isEmri.emriNo && j.isEmri.emriNo.match(/^DR-(\d{4})-(\d{5})$/);
    if(m && Number(m[1]) === yil) enBuyuk = Math.max(enBuyuk, Number(m[2]));
  });
  return 'DR-' + yil + '-' + String(enBuyuk + 1).padStart(5, '0');
}
function ieVarsayilan(j){
  if(!j.isEmri) j.isEmri = {};
  const e = j.isEmri;
  const alanlar = {
    projeAdi: j.desc || '', yetkili: '', satinalmaNo: '', siparisAdet: '',
    teslimTarihi: '', montajTarihi: '', montajYeri: '', grafiker: '', koordinator: '',
    aciklama: '', malzemeler: j.material || '', tedarikci: '', tedarikNot: '',
    durum: 'tasarim', oncelik: 'normal', genelAciklama: '',
    dosyaAdi: '', revizyon: '', onaylayan: '', onayTarihi: '',
    montajSaati: '', montajAlan: '', ekipLideri: '', sahaTelefon: '',
    isg: '', calisma: '', elektrik: '', vinc: '', iskeleSec: '', montajOncesiOlcu: '',
    konumLink: '',
    eksikNot: '', montajYapan: '', kontrolEden: '',
  };
  Object.keys(alanlar).forEach(k => { if(e[k] === undefined) e[k] = alanlar[k]; });
  if(!e.emriNo) e.emriNo = drNumara();
  if(!Array.isArray(e.kalemler)) e.kalemler = [];
  if(!Array.isArray(e.gorseller)) e.gorseller = [];
  if(!Array.isArray(e.montajEkibi)) e.montajEkibi = [];
  if(!Array.isArray(e.tedarikListe)){
    e.tedarikListe = [];
    if(e.tedarikci || e.tedarikNot)   // eski tek alanlı kayıtlar taşınır
      e.tedarikListe.push({ malzeme: e.malzemeler || '', tedarikci: e.tedarikci || '', not: e.tedarikNot || '' });
  }
  // Teklifteki kalemler iş emrine otomatik gelir (bir kez)
  if(!e.kalemlerYuklendi){
    e.kalemlerYuklendi = true;
    if(!e.kalemler.length && j.quoteId){
      const q = QUOTES.find(x => x.id === j.quoteId);
      if(q && Array.isArray(q.items)){
        q.items.forEach(it => {
          if(it.title) e.kalemler.push({ tanim: it.title, kod: '', adet: it.qty || '', en: '', boy: '', malzeme: it.detail || '' });
        });
      }
    }
  }
  ['dosyaKontrol','ekipman','kapanis'].forEach(k => { if(!e[k] || typeof e[k] !== 'object') e[k] = {}; });
  return e;
}

function ieM2(k){

  return m2 ? m2.toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '—';

function openIsEmri(id){

function ieAlan(id, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j)[ad] = deger;
  if(ad === 'teslimTarihi') j.due = deger ? formatDate(deger) : '';   // kartlarda görünen teslim tarihi
  ieKirli();
}
function ieCheck(id, grup, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j)[grup][ad] = !!deger;
  ieKirli();
}
function ieKalem(id, i, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.kalemler[i]) return;
  j.isEmri.kalemler[i][ad] = (ad === 'adet' || ad === 'en' || ad === 'boy') ? (deger === '' ? '' : virgulSayi(deger)) : deger;
  ieKirli();
}
function ieTedarik(id, i, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.tedarikListe[i]) return;
  j.isEmri.tedarikListe[i][ad] = deger;
  ieKirli();
}
function ieTedarikEkle(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j).tedarikListe.push({ malzeme:'', tedarikci:'', not:'' });
  ieRender(id); ieKirli();
}
function ieTedarikSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.tedarikListe.splice(i, 1);
  ieRender(id); ieKirli();
}
function ieEkipSec(id, ad, secili){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  const e = ieVarsayilan(j);
  e.montajEkibi = e.montajEkibi.filter(x => x !== ad);
  if(secili) e.montajEkibi.push(ad);
  ieKirli();
}
function ieKalemEkle(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j).kalemler.push({ tanim:'', kod:'', adet:'', en:'', boy:'', malzeme:'' });
  ieRender(id); ieKirli();
}
function ieKalemSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.kalemler.splice(i, 1);
  ieRender(id); ieKirli();
}
function ieGorselIsle(id, file){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j);
  if(j.isEmri.gorseller.length >= 8){ showToast('Bir iş emrine en fazla 8 görsel eklenebilir.'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const olcek = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * olcek));
      c.height = Math.max(1, Math.round(img.height * olcek));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      j.isEmri.gorseller.push({ src: c.toDataURL('image/jpeg', 0.72), not: '' });
      ieRender(id); ieKirli();
      showToast('Görsel eklendi.');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function ieGorselNot(id, i, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.gorseller[i]) return;
  j.isEmri.gorseller[i].not = deger;
  ieKirli();
}
function ieGorselSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.gorseller.splice(i, 1);
  ieRender(id); ieKirli();
}

let surukluIsId = null;
function isSurukleBasla(e, id){
  if(CURRENT_ROLE !== 'YONETICI'){ e.preventDefault(); return; }
  surukluIsId = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch(err) {}
  e.currentTarget.classList.add('suruklenen');
}
function isSurukleBitir(e){
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('suruklenen');
  document.querySelectorAll('.board-col.drop').forEach(c => c.classList.remove('drop'));
  surukluIsId = null;
}
function isSurukleUzeri(e){
  if(!surukluIsId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop');
}
function isSurukleCik(e){ e.currentTarget.classList.remove('drop'); }
function isBirak(e, hedef){
  e.preventDefault();
  const id = surukluIsId; surukluIsId = null;
  if(!id) return;
  jobTasi(id, hedef);
}
function jobTasi(id, hedef){
  const j = JOBS.find(x => x.id === id);
  if(!j || j.stage === hedef){ renderContent(); return; }
  const from = STAGES.findIndex(s => s.key === j.stage);
  const to = STAGES.findIndex(s => s.key === hedef);
  if(j.stage === 'TASARIM' && to > from && j.approval !== 'ONAYLANDI'){
    renderContent();
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.');
    return;
  }
  const eski = j.stage;
  jobAsamaAyarla(j, hedef);
  renderContent();
  showToast(`${j.client} — ${STAGE_LABELS_TR[eski]} → ${STAGE_LABELS_TR[hedef]}.`);
}
// Aşama değişince onay bayrağını tutarlı tut:
//  • Tasarım'a giren iş onay bekler (BEKLIYOR)
//  • Tasarım'dan Üretim'e yalnız ONAYLANDI ile çıkılır
//  • Üretim'den Tasarım'a geri alınan iş yeniden onay bekler
//  • Keşif'e dönen işin onayı sıfırlanır
function jobAsamaAyarla(j, yeniStage){
  const eski = j.stage;
  j.stage = yeniStage;
  if(yeniStage === 'TASARIM'){ if(j.approval !== 'REVIZYON') j.approval = 'BEKLIYOR'; }
  else if(yeniStage === 'KESIF'){ j.approval = null; }
  // Üretim / Montaj'a geçen iş: koordinatöre planlama bildirimi
  if(eski !== yeniStage && (yeniStage === 'URETIM' || yeniStage === 'MONTAJ')){
    bildirimYoneticilere(`${j.code} · ${j.client} — ${STAGE_LABELS_TR[yeniStage]} aşamasına geçti, ${yeniStage === 'URETIM' ? 'üretim' : 'montaj'} planlaması gerekiyor.`, 'bilgi', { jobId: j.id });
  }
  if(eski !== yeniStage && yeniStage === 'TAHSILAT'){
    bildirimRole('MUHASEBE', `İş tahsilata geçti: ${j.code} · ${j.client}${j.tutar ? ' — ₺' + Number(j.tutar).toLocaleString('tr-TR') : ''}. Fatura/tahsilat takibi Gelirler ekranında.`, { jobId: j.id });
    bildirimYoneticilere(`${j.code} · ${j.client} tahsilat aşamasına geçti.`, 'bilgi', { jobId: j.id });
  }
}
function deleteJob(id){
  if(CURRENT_ROLE !== 'YONETICI'){ showToast('İş silme yalnızca yönetici yetkisindedir.'); return; }
  const j = JOBS.find(x => x.id === id); if(!j) return;
  if(!confirm(`${j.code} · ${j.client} işini plan kayıtlarıyla birlikte silmek istediğinize emin misiniz?`)) return;
  PLAN_TASKS = PLAN_TASKS.filter(t => t.jobId !== id);
  JOBS = JOBS.filter(x => x.id !== id);
  const q = j.quoteId ? QUOTES.find(x => x.id === j.quoteId) : (j.id ? QUOTES.find(x => x.jobId === j.id) : null);
  if(q){ q.jobId = null; }                       // teklif durur, sadece iş bağlantısı kalkar
  closeDrawer(); renderContent();
  showToast(`${j.code} silindi${q ? ' — ' + q.no + ' teklifi duruyor, bağlantısı kaldırıldı' : ''}.`);
}
function advanceJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx >= STAGES.length-1) return;
  if(j.stage === 'TASARIM' && j.approval !== 'ONAYLANDI'){
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.'); return;
  }
  jobAsamaAyarla(j, STAGES[idx+1].key);
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx+1].label} aşamasına taşındı.`);
}
function revertJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx <= 0) return;
  const hedef = STAGES[idx-1].key;
  j.stage = hedef;
  if(hedef === 'TASARIM') j.approval = 'BEKLIYOR';      // üretimden dönen iş yeniden onaya girer
  if(hedef === 'KESIF') j.approval = null;
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx-1].label} aşamasına geri alındı${hedef==='TASARIM' ? ', onay sıfırlandı' : ''}.`);
}
function setJobApproval(id, status){
  const j = JOBS.find(x=>x.id===id);
  if(j.stage !== 'TASARIM'){ showToast('Onay yalnızca Tasarım aşamasındaki iş için verilir.'); return; }
  j.approval = status;
  if(status==='ONAYLANDI') jobAsamaAyarla(j, 'URETIM');
  closeDrawer();
  renderContent();
  showToast(status==='ONAYLANDI' ? `${j.client} — onaylandı, Üretim aşamasına taşındı.` : `${j.client} için revizyon istendi.`);
}

// --- İletişim Bilgisi çoklu satırlar ---
let contactRows = [{ type:'İş Telefon No', value:'' }];
let addressRows = [{ type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:'' }];
const CONTACT_TYPES = ['İş Telefon No', 'Cep Telefonu', 'E-posta', 'Faks'];
const ADDRESS_TYPES = ['İş Adresi', 'Ev Adresi', 'Diğer'];

function renderContactRows(){
  const box = document.getElementById('contactRowsBox');
  if(!box) return;
  box.innerHTML = contactRows.map((r,i) => `
    <div class="repeat-row">
      <select onchange="contactRows[${i}].type=this.value">
        ${CONTACT_TYPES.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <input value="${r.value}" placeholder="Değer girin" oninput="contactRows[${i}].value=this.value">
      <button class="row-remove" onclick="removeContactRow(${i})">✕</button>
    </div>
  `).join('');
}
function addContactRow(){ contactRows.push({type:'İş Telefon No', value:''}); renderContactRows(); }
function removeContactRow(i){ contactRows.splice(i,1); renderContactRows(); }

function renderAddressRows(){
  const box = document.getElementById('addressRowsBox');
  if(!box) return;
  box.innerHTML = addressRows.map((a,i) => `
    <div style="border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;">
      <div class="repeat-row">
        <div class="addr-toggle"></div>
        <select onchange="addressRows[${i}].type=this.value">
          ${ADDRESS_TYPES.map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <input value="${a.country}" placeholder="Ülke" oninput="addressRows[${i}].country=this.value">
        <button class="row-remove" onclick="removeAddressRow(${i})">✕</button>
      </div>
      <div class="field-row" style="margin-bottom:8px;">
        <input value="${a.postal}" placeholder="Posta Kodu" oninput="addressRows[${i}].postal=this.value">
        <input value="${a.ilce}" placeholder="İlçe" oninput="addressRows[${i}].ilce=this.value">
      </div>
      <div class="field-row" style="margin-bottom:8px;">
        <input value="${a.sehir}" placeholder="Şehir" oninput="addressRows[${i}].sehir=this.value">
        <input value="${a.eyalet}" placeholder="Eyalet" oninput="addressRows[${i}].eyalet=this.value">
      </div>
      <textarea rows="2" placeholder="Adres detayı" oninput="addressRows[${i}].detail=this.value; updateCharCount(${i},this.value)" style="width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); font-size:13px; font-family:inherit;">${a.detail}</textarea>
      <div class="char-count" id="charCount${i}">${a.detail.length} / 250</div>
    </div>
  `).join('');
}
function addAddressRow(){ addressRows.push({type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:''}); renderAddressRows(); }
function removeAddressRow(i){ addressRows.splice(i,1); renderAddressRows(); }
function updateCharCount(i,val){ const el = document.getElementById('charCount'+i); if(el) el.textContent = val.length + ' / 250'; }

let openAccordions = new Set();
function accordionSection(id, title, bodyHtml){
  const isOpen = openAccordions.has(id);
  return `
    <div class="accordion">
      <div class="accordion-head ${isOpen?'open':''}" id="head-${id}" onclick="toggleAccordion('${id}')">
        <span class="accordion-plus">+</span>${title}
      </div>
      <div class="accordion-body ${isOpen?'open':''}" id="body-${id}">${bodyHtml}</div>
    </div>
  `;
}
function toggleAccordion(id){
  if(openAccordions.has(id)) openAccordions.delete(id); else openAccordions.add(id);
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('head-'+id).classList.toggle('open');
  if(id==='acc2' && openAccordions.has('acc2')){ renderContactRows(); renderAddressRows(); }
}

function submitPersonForm(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ alert(newCustomerType==='firma' ? 'Firma adı gerekli' : 'Ad Soyad gerekli'); return; }
  const isFirma = newCustomerType === 'firma';
  const phoneRow = contactRows.find(r => r.type.includes('Telefon'));
  const emailRow = contactRows.find(r => r.type === 'E-posta');
  const addr = addressRows[0];
  const data = {
    type: newCustomerType, name,
    contact: isFirma ? (document.getElementById('pYetkili')?.value || '') : name,
    phone: phoneRow ? phoneRow.value : '',
    email: emailRow ? emailRow.value : '',
    address: addr ? [addr.detail, addr.ilce, addr.sehir].filter(Boolean).join(', ') : '',
    kaynak: document.getElementById('pKaynak').value,
    kampanya: document.getElementById('pKampanya').value,
    temsilci: document.getElementById('pTemsilci').value,
    standartGrafikerId: (document.getElementById('pStandartGrafiker') || {}).value || '',
    sektor: document.getElementById('pSektor').value,
    durum: document.getElementById('pDurum').value,
    etiket: document.getElementById('pEtiket').value,
    kisaAciklama: document.getElementById('pKisaAciklama').value,
    hatirlatma: document.getElementById('pHatirlatma').value,
    contactRows: JSON.parse(JSON.stringify(contactRows)),
    addressRows: JSON.parse(JSON.stringify(addressRows)),
    faturaUnvani: document.getElementById('pFaturaUnvani').value,
    vergiNo: document.getElementById('pVergiNo').value,
    vergiDairesi: document.getElementById('pVergiDairesi').value,
    faturaAdresi: document.getElementById('pFaturaAdresi').value,
    fPostaKodu: document.getElementById('pFPostaKodu').value,
    fIlce: document.getElementById('pFIlce').value,
    fSehir: document.getElementById('pFSehir').value,
    fUlke: document.getElementById('pFUlke').value,
    vadeGun: document.getElementById('pVadeGun').value,
    calisanSayisi: document.getElementById('pCalisanSayisi').value,
  };

  if(editingCustomerId){
    const idx = CUSTOMERS.findIndex(c=>c.id===editingCustomerId);
    CUSTOMERS[idx] = { ...CUSTOMERS[idx], ...data };
  } else {
    CUSTOMERS.push({ id:'c'+Date.now(), dateAdded:new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}), ...data });
  }

  kisilerStep = 'list';
  editingCustomerId = null;
  contactRows = [{ type:'İş Telefon No', value:'' }];
  addressRows = [{ type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:'' }];
  openAccordions = new Set();
  renderContent();
  showToast(`${name} kaydedildi.`);
}

// ---------------- TEKLİF LİSTESİ: ARAMA VE FİLTRE ----------------
let teklifFiltrePanel = false;
let teklifFiltre = { q:'', musteri:'', no:'', durum:'', temsilci:'', tarih:'', etiket:'',
                     tur:'', gecerlilik:'', sonuc:'' };
function teklifFiltreDegistir(alan, deger){ teklifFiltre[alan] = deger; }
function teklifFiltreUygula(){
  ['musteri','no','durum','temsilci','tarih','etiket'].forEach(a => {
    const el = document.getElementById('tf_'+a);
    if(el) teklifFiltre[a] = el.value;
  });
  renderContent();
}
function teklifFiltreTemizle(){
  teklifFiltre = { q:'', musteri:'', no:'', durum:'', temsilci:'', tarih:'', etiket:'', tur:'', gecerlilik:'', sonuc:'' };
  renderContent();
}
function teklifYanFiltre(alan, deger){
  teklifFiltre[alan] = (teklifFiltre[alan] === deger) ? '' : deger;
  renderContent();
}
function teklifMusteriAdi(q){
  const c = CUSTOMERS.find(x => x.id === q.customerId);
  if(c) return c.name;
  if(q.musteriAdi) return q.musteriAdi + ' (silinmiş cari)';
  return 'Müşteri seçilmedi';
}
function teklifGecerlilikDurumu(q){
  if(!q.gecerlilik) return '';
  const n = daysLeft(q.gecerlilik);
  if(n === null) return '';
  if(n < 0)  return 'Süresi Geçmiş';
  if(n === 0) return 'Bugün';
  if(n <= 7) return 'Süresi Dolmak Üzere';
  return 'Hala Geçerli';
}
function teklifleriFiltrele(){
  const f = teklifFiltre;
  const ara = (f.q || '').toLocaleLowerCase('tr');
  return QUOTES.filter(q => {
    const cust = CUSTOMERS.find(c => c.id === q.customerId);
    const ad = cust ? cust.name : '';
    if(ara){
      const havuz = [ad, q.no, q.repName, q.status, q.tur, (q.etiketler||[]).join(' ')]
        .join(' ').toLocaleLowerCase('tr');
      if(!havuz.includes(ara)) return false;
    }
    if(f.musteri && !ad.toLocaleLowerCase('tr').includes(f.musteri.toLocaleLowerCase('tr'))) return false;
    if(f.no && !String(q.no||'').toLocaleLowerCase('tr').includes(f.no.toLocaleLowerCase('tr'))) return false;
    if(f.durum && q.status !== f.durum) return false;
    if(f.temsilci && q.repName !== f.temsilci) return false;
    if(f.tarih && q.date !== f.tarih) return false;
    if(f.etiket && !(q.etiketler||[]).some(e => e.toLocaleLowerCase('tr').includes(f.etiket.toLocaleLowerCase('tr')))) return false;
    if(f.tur && (q.tur || 'Satış Teklifi') !== f.tur) return false;
    if(f.sonuc && (q.sonuc || 'Sonuçlandırılmamış') !== f.sonuc) return false;
    if(f.gecerlilik){
      const g = teklifGecerlilikDurumu(q);
      if(f.gecerlilik === 'Hala Geçerli'){
        if(!['Hala Geçerli','Süresi Dolmak Üzere','Bugün'].includes(g)) return false;
      } else if(g !== f.gecerlilik) return false;
    }
    return true;
  });
}
function teklifYanGrup(baslik, alan, secenekler){
  return `<h5>${baslik}</h5>${secenekler.map(s =>
    `<button class="${teklifFiltre[alan] === s ? 'on' : ''}" onclick="teklifYanFiltre('${alan}','${s}')">${s}</button>`).join('')}`;
}
function teklifListView(){
  const liste = teklifleriFiltrele();
  const f = teklifFiltre;
  const aktifFiltre = Object.keys(f).some(k => f[k]);
  const temsilciler = [...new Set(QUOTES.map(q => q.repName).filter(Boolean))];

  const kabul = QUOTES.filter(q => q.status === 'Kabul Edildi' || q.status === 'Faturalandı');
  const kabulOrani = sonuclanan.length ? Math.round(kabul.length / sonuclanan.length * 100) : 0;

  const finans = finansGorebilir();

  return `
    <div class="page-head">
      <div><div class="eyebrow">SATIŞ YÖNETİMİ</div><div class="page-title">Teklifler</div>
        <div class="page-sub">Teklifleri sonuç, geçerlilik ve sorumlu bazında takip edin.</div></div>
      <div class="action-row"><button class="primary" onclick="yeniTeklifBaslat()">＋ Yeni Teklif</button></div>
    </div>
    ${finans ? `<div class="metric-grid">
      <div class="metric"><div class="metric-top"><span>Açık teklif</span><span class="metric-icon orange">${NAV_SVG.file}</span></div><strong>${acik.length}</strong><small>₺ ${Math.round(acikTutar).toLocaleString('tr-TR')} toplam</small></div>
      <div class="metric"><div class="metric-top"><span>Kabul oranı</span><span class="metric-icon green">${NAV_SVG.chart}</span></div><strong>% ${kabulOrani}</strong><small>${kabul.length} kabul / ${sonuclanan.length} sonuçlanan</small></div>
      <div class="metric"><div class="metric-top"><span>Karar bekleyen</span><span class="metric-icon blue">◷</span></div><strong>${kararBekleyen.length}</strong><small>₺ ${Math.round(kararTutar).toLocaleString('tr-TR')} potansiyel</small></div>
      <div class="metric"><div class="metric-top"><span>Süresi dolacak</span><span class="metric-icon red">!</span></div><strong>${suresiDolacak.length}</strong><small class="${suresiGecmis.length ? 'risk' : ''}">${suresiGecmis.length ? suresiGecmis.length + ' teklifin süresi geçti' : 'Geçerlilik takibi'}</small></div>
    </div>` : ''}
    <div class="table-card">
      <div class="toolbar" style="padding:14px 16px;margin:0;border-bottom:1px solid var(--line);">
        <input class="tb-field" placeholder="Teklif ara (numara, müşteri, temsilci, etiket)" value="${notEsc(f.q)}"
          oninput="teklifFiltre.q=this.value" onkeydown="if(event.key==='Enter') renderContent();" onchange="renderContent();">
        <select class="tb-filter" onchange="teklifFiltre.durum=this.value; renderContent();">
          <option value="">Durum: Tümü</option>
          ${QUOTE_STATUSES.map(st => `<option value="${st}" ${f.durum === st ? 'selected' : ''}>${st}</option>`).join('')}
        </select>
        <select class="tb-filter" onchange="teklifFiltre.temsilci=this.value; renderContent();">

          ${temsilciler.map(t => `<option value="${notEsc(t)}" ${f.temsilci === t ? 'selected' : ''}>${notEsc(t)}</option>`).join('')}
        </select>
        <button class="ghost" onclick="teklifFiltrePanel=!teklifFiltrePanel; renderContent();">${teklifFiltrePanel ? '▴' : '▾'} Detaylı filtre</button>
        ${aktifFiltre ? `<button class="ghost" onclick="teklifFiltreTemizle()">✕ Temizle</button>` : ''}
      </div>
      ${teklifFiltrePanel ? `<div class="tk-panel" style="border-radius:0;border:0;border-bottom:1px solid var(--line);margin:0;">
        <div class="tk-filter-grid">
          <div class="field" style="margin:0;"><label>Müşteri / Tedarikçi</label>
            <input id="tf_musteri" value="${f.musteri}" placeholder="Müşteri / Tedarikçi"></div>
          <div class="field" style="margin:0;"><label>Teklif Numarası</label>
            <input id="tf_no" value="${f.no}" placeholder="Teklif Numarası"></div>
          <div class="field" style="margin:0;"><label>Durum</label>
            <select id="tf_durum"><option value="">Tüm Durumlar</option>
              ${QUOTE_STATUSES.map(st => `<option ${f.durum === st ? 'selected' : ''}>${st}</option>`).join('')}</select></div>
          <div class="field" style="margin:0;"><label>Temsilci</label>

function toggleTeklifCollapse(key){

function formatDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('tr-TR'); }
// ---------------- ÖLÇÜLÜ SATIRLAR (m² / mtül) ----------------
const LINE_UNITS = [
  { key:'adet', label:'Adet', short:'ad' },
  { key:'m2',   label:'m²',   short:'m²' },
  { key:'mtul', label:'mtül', short:'mtül' },
];
function lineUnit(it){ return it.unit || 'adet'; }
function hasMeasure(it){ return lineUnit(it) !== 'adet'; }
function anyMeasure(items){ return (items||[]).some(hasMeasure); }
function unitShort(it){ const u = LINE_UNITS.find(x=>x.key===lineUnit(it)); return u ? u.short : 'ad'; }
function unitMeasure(it){                       // tek parçanın ölçüsü
  const u = lineUnit(it);
  if(u === 'm2')   return ((Number(it.w)||0) * (Number(it.h)||0)) / 10000;
  if(u === 'mtul') return (Number(it.w)||0) / 100;
  return 0;
}
function lineQty(it){                           // fiyatla çarpılan nihai miktar
  return hasMeasure(it) ? unitMeasure(it) * (Number(it.qty)||0) : (Number(it.qty)||0);
}
function lineNet(it){ return lineQty(it) * (Number(it.price)||0); }
function lineGross(it){ return lineNet(it) * (1 + (Number(it.kdv)||0)/100); }
function fmt2(n){ return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function dimText(it){                           // "200 × 150 cm"
  const u = lineUnit(it);
  if(u === 'adet') return '';
  const w = (Number(it.w)||0).toLocaleString('tr-TR');
  if(u === 'mtul') return `${w} cm`;
  return `${w} × ${(Number(it.h)||0).toLocaleString('tr-TR')} cm`;
}
function measureText(it){                       // "200 × 150 cm · 3,00 m²"
  const u = lineUnit(it);
  if(u === 'adet') return '';
  const w = (Number(it.w)||0).toLocaleString('tr-TR');
  if(u === 'mtul') return `${w} cm · ${fmt2(lineQty(it))} mtül`;
  const hh = (Number(it.h)||0).toLocaleString('tr-TR');
  return `${w} × ${hh} cm · ${fmt2(lineQty(it))} m²`;
}
// "Folyo Baskı 200x150 cm" / "2,5 x 1,2 m" → { w, h } (cm)
function parseDims(text){
  const m = String(text||'').match(/(\d+(?:[.,]\d+)?)\s*[x×X*]\s*(\d+(?:[.,]\d+)?)\s*(cm|mm|m)?\b/);
  if(!m) return null;
  const num = s => parseFloat(String(s).replace(',', '.'));
  const a = num(m[1]), b = num(m[2]);
  if(!a || !b) return null;
  const u = (m[3]||'').toLowerCase();
  let f = 1;                                     // birim yazılmamışsa cm
  if(u === 'm') f = 100;
  else if(u === 'mm') f = 0.1;
  else if(!u && a <= 20 && b <= 20) f = 100;     // "2x1,5" gibi küçük sayılar metre
  return { w: Math.round(a*f*10)/10, h: Math.round(b*f*10)/10 };
}

function quoteTotal(q){ return q.items.reduce((s,i)=> s + lineGross(i), 0); }
function quoteSub(q){ return q.items.reduce((s,i)=> s + lineNet(i), 0); }
function quoteKdvAmount(q){ return quoteTotal(q) - quoteSub(q); }

// Açıklama alanı — tek satır (kapalı) / çok satır (açık). Açık/kapalı durumu satır nesnesine bağlı tutulur,
// yeniden çizimlerde (ürün seçimi, sürükleme) kaybolmaz; kayda yazılmaz.
const liDetayAcik = new WeakSet();
function liDetayHtml(idx){
  const it = quoteLineItems[idx];
  const detay = it.detail || '';
  const satir = detay ? detay.split('\n').length : 1;
  if(satir > 1 && !liDetayAcik.has(it) && !it._detayKapatildi) liDetayAcik.add(it);
  const acik = liDetayAcik.has(it);
  return `<div class="li-detail-wrap${acik?' acik':''}" id="liDetayWrap${idx}">
    <textarea class="li-detail" id="liDetay${idx}" rows="1" wrap="${acik?'soft':'off'}"
      placeholder="Açıklama — müşteri belgesindeki Açıklama sütununda görünür"
      oninput="updateLine(${idx},'detail',this.value); liDetayBoyutla(${idx})"
      onkeydown="liDetayTus(event,${idx})">${notEsc(detay)}</textarea>
    <button type="button" class="li-detail-tgl" onclick="liDetayToggle(${idx})"
      title="${acik ? 'Açıklama alanını daralt' : 'Açıklama alanını genişlet (çok satırlı yazım)'}"
      aria-label="${acik ? 'Açıklamayı daralt' : 'Açıklamayı genişlet'}" aria-expanded="${acik}">${!acik && satir > 1 ? `<span>${satir} satır</span>` : ''}<span class="ok">⌄</span></button>
  </div>`;
}
function liDetayToggle(idx, ac){
  const it = quoteLineItems[idx]; if(!it) return;
  const acik = (ac === undefined) ? !liDetayAcik.has(it) : !!ac;
  if(acik){ liDetayAcik.add(it); delete it._detayKapatildi; } else { liDetayAcik.delete(it); it._detayKapatildi = true; }
  const wrap = document.getElementById('liDetayWrap'+idx);
  if(!wrap) return;
  const odakta = document.activeElement === document.getElementById('liDetay'+idx);
  const pos = odakta ? document.activeElement.selectionStart : null;
  wrap.outerHTML = liDetayHtml(idx);
  const ta = document.getElementById('liDetay'+idx);
  if(acik) liDetayBoyutla(idx);
  if(odakta && ta){ ta.focus(); try{ ta.setSelectionRange(pos, pos); }catch(e){} }
}
function liDetayBoyutla(idx){
  const ta = document.getElementById('liDetay'+idx);
  const wrap = document.getElementById('liDetayWrap'+idx);
  if(!ta || !wrap || !wrap.classList.contains('acik')) return;
  ta.style.height = 'auto';
  ta.style.height = Math.max(66, Math.min(320, ta.scrollHeight + 2)) + 'px';
}
function liDetayTus(e, idx){
  // Kapalı alanda Enter → alanı aç ve yeni satıra geç (Shift+Enter de aynı)
  if(e.key === 'Enter'){
    const wrap = document.getElementById('liDetayWrap'+idx);
    if(wrap && !wrap.classList.contains('acik')){
      e.preventDefault();
      const ta = e.target, s = ta.selectionStart, son = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '\n' + ta.value.slice(son);
      updateLine(idx, 'detail', ta.value);
      liDetayToggle(idx, true);
      const yeni = document.getElementById('liDetay'+idx);
      if(yeni){ yeni.focus(); try{ yeni.setSelectionRange(s+1, s+1); }catch(err){} }
    }
  }
}

function updateGrandTotals(){
  const sym = CURRENCY_SYMBOLS[quoteCurrency];
  const sub = quoteLineItems.reduce((s,i)=>s+lineNet(i),0);

    <div class="grand"><span>GENEL TOPLAM</span><strong>${sym}${total.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2})}</strong></div>`;

function onLineTitleInput(idx, value){
  quoteLineItems[idx].title = value;
  const d = parseDims(value);
  const cur = quoteLineItems[idx];
  if(d && lineUnit(cur) === 'adet' && !cur.w && !cur.h){
    cur.unit = 'm2'; cur.w = d.w; cur.h = d.h;
    const us = document.getElementById('liUnit'+idx); if(us) us.value = 'm2';
    refreshDimLine(idx);
    syncRow(idx);
    showToast(`Ölçü algılandı: ${d.w} × ${d.h} cm`);
  }
  const list = document.getElementById('acList'+idx);
  if(!value){ list.classList.remove('show'); return; }
  const matches = PRODUCT_CATALOG.filter(p => p.name.toLowerCase().includes(value.toLowerCase()));
  if(matches.length===0){ list.classList.remove('show'); return; }
  list.innerHTML = matches.map(m => `<div class="ac-item" onmousedown="pickProduct(${idx},'${m.name.replace(/'/g,"\\'")}',${m.price})">${m.name}</div>`).join('');

function pickProduct(idx, name, price){

function hideAc(idx){ const l = document.getElementById('acList'+idx); if(l) l.classList.remove('show'); }
function updateLine(idx, field, value){
  // Sadece o satırın toplamını ve genel toplamı güncelle — input'ları yeniden oluşturma,
  // yoksa yazarken fokus kayboluyor (kullanıcı tekrar tıklamak zorunda kalıyordu).
  quoteLineItems[idx][field] = (field==='title' || field==='unit' || field==='detail')
    ? value

}
let liSurukleIdx = null;

function submitQuote(){
  const customerId = document.getElementById('qCustomer').value;
  if(!customerId){ alert('Lütfen bir müşteri seçin'); return; }
  const repName = document.getElementById('qRep').value;
  const girisMetni = document.getElementById('qGiris').value;
  const notlar = document.getElementById('qNotlar') ? document.getElementById('qNotlar').value : DEFAULT_NOTES;
  const items = quoteLineItems.filter(i=>i.title);
  items.forEach(it => { delete it._detayKapatildi; if(typeof it.detail === 'string') it.detail = it.detail.replace(/\s+$/,''); });
  // Teklifte yazılan yeni ürünler kataloğa eklenir — sonraki tekliflerde ilk harften otomatik tamamlanır
  items.forEach(it => {
    const ad = String(it.title).trim();
    if(!ad) return;
    if(!PRODUCT_CATALOG.some(pr => pr.name.toLowerCase() === ad.toLowerCase())){
      PRODUCT_CATALOG.push({ id: benzersizId('pr'), name: ad, price: Number(it.price) || 0 });
    }
  });

  let targetId;
  if(editingQuoteId){
    const q = QUOTES.find(x=>x.id===editingQuoteId);
    q.customerId = customerId; q.repName = repName; q.girisMetni = girisMetni; q.notlar = notlar; q.items = items; q.currency = quoteCurrency;
    q.musteriAdi = (CUSTOMERS.find(c => c.id === customerId) || {}).name || q.musteriAdi;
    targetId = q.id;
    showToast(`Teklif No: ${q.no} güncellendi.`);
  } else {
    const no = yeniTeklifNo();
    const q = {
      id: benzersizId('q'), no, customerId, repName, currency: quoteCurrency,
      date: new Date().toISOString().slice(0,10), // teklif tarihi her zaman bugün, otomatik
      status:'Taslak', girisMetni, notlar, items,
      tur:'Satış Teklifi', sonuc:'Sonuçlandırılmamış', etiketler:[],
      gecerlilik: isoPlus(60),
      musteriAdi: (CUSTOMERS.find(c => c.id === customerId) || {}).name || '',
    };
    QUOTES.push(q);
    targetId = q.id;
  }

  editingQuoteId = null;
  teklifStep = 'list';
  teklifCollapse = { yetkili:false, ustAlt:false, onKapak:false, dipNot:false };
  quoteLineItems = [blankLine()];
  renderContent();
  openQuoteView(targetId);
}

function paraSimge(pb){ return pb === 'USD' ? '$' : (pb === 'EUR' ? '€' : '₺'); }
// Türkçe ondalık: "15,5" da "15.5" da kabul edilir
function virgulSayi(v){
  if(v === '' || v === null || v === undefined) return 0;
  let t = String(v).trim().replace(/\s/g, '');
  if(!t) return 0;
  if(t.includes(',')){
    t = t.replace(/\./g, '').replace(',', '.');
  } else {
    const parcalar = t.split('.');
    if(parcalar.length > 2 || (parcalar.length === 2 && /^\d{3}$/.test(parcalar[1]))) t = parcalar.join('');
  }
  return Number(t) || 0;
}
function virgulYaz(n){ return (n || n === 0) && n !== '' ? String(n).replace('.', ',') : ''; }
// Para: kuruşa yuvarla (kayan nokta hatasız). Ara hesaplar ham kalır, yuvarlama sonuçta yapılır.
function kurus(n){ n = Number(n) || 0; return Math.round((n + (n >= 0 ? 1e-9 : -1e-9)) * 100) / 100; }
function mxPara(n, para){
  n = Number(n) || 0;
  const s = Math.abs(n).toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return (n < 0 ? '−' : '') + paraSimge(para || 'TL') + s;
}
function mxYuzde(n, hane){ return n === null || n === undefined || !isFinite(n) ? '—' : '%' + (Number(n)).toLocaleString('tr-TR', { minimumFractionDigits:0, maximumFractionDigits: hane === undefined ? 1 : hane }); }
function mxSayi(n, hane){ return (Number(n) || 0).toLocaleString('tr-TR', { maximumFractionDigits: hane === undefined ? 2 : hane }); }
function mxBugunIso(){ return planIso(new Date()); }
function mxIsoTarih(v){                            // "dd.mm.yyyy" ya da ISO → ISO
  if(!v) return '';
  const m = String(v).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return String(v).slice(0, 10);
}
function mxGunFarki(iso){ if(!iso) return null; const d = new Date(mxIsoTarih(iso) + 'T00:00:00'); if(isNaN(d)) return null; return Math.round((new Date(mxBugunIso() + 'T00:00:00') - d) / 86400000); }

// ---- Kur ----
function malzemeTL(mz, kur){
  kur = kur || KURLAR;
  const f = Number(mz.fiyat) || 0;
  return f * mxKurDegeri(mz.para, kur);
}
function mxKurDegeri(para, kur){
  kur = kur || KURLAR;
  if(!para || para === 'TL' || para === 'TRY') return 1;
  if(para === 'USD') return Number(kur.usd) || 0;
  if(para === 'EUR') return Number(kur.eur) || 0;
  return 0;
}
function mxKur(q){ return (q && q.maliyet && q.maliyet.kurSabit && q.maliyet.kurSabit.usd) ? q.maliyet.kurSabit : KURLAR; }
// Günlük kur: canlıda /api/kur (TCMB döviz satış), olmazsa piyasa kuru; elle de girilebilir
async function kurGetir(zorla){
  const bugun = new Date().toLocaleDateString('tr-TR');
  if(!zorla && KURLAR.usd && KURLAR.cekilme === bugun) return;
  try{
    let d = null;
    try{ const r = await fetch('/api/kur', { cache:'no-store' }); if(r.ok) d = await r.json(); }catch(e){}
    if(!d || !d.usd){
      const [ru, re] = await Promise.all([
        fetch('https://open.er-api.com/v6/latest/USD').then(x => x.json()),
        fetch('https://open.er-api.com/v6/latest/EUR').then(x => x.json()),
      ]);
      d = { usd: ru && ru.rates && ru.rates.TRY, eur: re && re.rates && re.rates.TRY, tarih:'', kaynak:'Piyasa (yaklaşık)' };
    }
    if(d && d.usd){
      const eski = { usd:KURLAR.usd, eur:KURLAR.eur };
      KURLAR.usd = Math.round(d.usd * 10000) / 10000;
      KURLAR.eur = Math.round((d.eur || 0) * 10000) / 10000;
      KURLAR.tarih = d.tarih || bugun; KURLAR.kaynak = d.kaynak || 'TCMB Döviz Satış';
      KURLAR.cekilme = bugun;
      mxKurlaYenile();
      if(currentPage === 'teklifler' && teklifStep === 'maliyet'){
        const q = mxAktifTeklif();
        if(q && !(q.maliyet && q.maliyet.kurSabit) && (eski.usd !== KURLAR.usd || eski.eur !== KURLAR.eur))
          mxGecmisYaz(q, 'kur', '', `USD ${mxSayi(eski.usd,4)} · EUR ${mxSayi(eski.eur,4)}`, `USD ${mxSayi(KURLAR.usd,4)} · EUR ${mxSayi(KURLAR.eur,4)}`);
        renderContent();
      }
      showToast(`Kur güncellendi: $${KURLAR.usd.toLocaleString('tr-TR')} · €${KURLAR.eur.toLocaleString('tr-TR')}`);
    } else if(zorla) showToast('Kur alınamadı — elle girebilirsiniz.');
  }catch(e){ if(zorla) showToast('Kur alınamadı — elle girebilirsiniz.'); }
}
function kurElleDegistir(alan, deger){
  KURLAR[alan] = virgulSayi(deger);
  KURLAR.kaynak = 'Elle girildi'; KURLAR.tarih = new Date().toLocaleDateString('tr-TR');
  mxKurlaYenile();
  renderContent();
}
// Kur değişince tüm tekliflerdeki dövizli satırların ₺ birim maliyeti tazelenir (sabit kurlu teklifler hariç)
function mxKurlaYenile(){
  QUOTES.forEach(q => { if(q.maliyet && Array.isArray(q.maliyet.items)) q.maliyet.items.forEach(r => mxSatirHesapla(r, mxKur(q))); });
}

// ---- Veri modeli / geriye uyumlu dönüşüm ----
const HAZIR_MALIYET_KALEMLERI = ['Folyo Baskı','Dijital Baskı','Kutu Harf','Pleksi','Alüminyum Profil','LED Modül','Trafo','Vida','Dübel','Silikon','Boya','Elektrik Malzemesi','Montaj İşçiliği','Nakliye','Vinç Kirası'];
function mxGrupTahmin(ad){
  const a = String(ad || '').toLowerCase();
  if(/işçilik|iscilik|montaj|usta|ekip|atölye|atolye/.test(a)) return 'iscilik';
  if(/nakliye|vinç|vinc|kargo|lojistik|kiral|hizmet|sefer/.test(a)) return 'dis_hizmet';
  return 'malzeme';
}
function mxKalemNormalle(r, q){
  if(!r.id) r.id = benzersizId('mk');
  if(r.aktif === undefined) r.aktif = true;
  if(!r.para){                                    // eski kayıt: ₺ birim fiyat + malzeme bağı
    const mz = r.malzemeId ? MALZEME_FIYATLARI.find(x => x.id === r.malzemeId) : null;
    r.para = mz ? (mz.para || 'TL') : 'TL';
    r.fiyatOrj = mz ? (Number(mz.fiyat) || 0) : (Number(r.fiyat) || 0);
    r.birim = mz ? mz.birim : (r.birim || 'adet');
    r.grup = r.grup || (mz ? 'malzeme' : mxGrupTahmin(r.ad));
    r.hesapTuru = (r.en && r.boy) ? (r.birim === 'mt' ? 'uzunluk' : 'en_boy') : 'dogrudan';
    r.manuel = !mz;
    if(mz){ r.fiyatKaydiId = mz.id; r.tedarikciAd = mz.tedarikci || ''; r.tedarikciId = mz.tedarikciId || null; r.fiyatTarihi = mz.tarih || ''; r.gecerlilik = mz.gecerlilik || ''; }
  }
  if(!r.grup) r.grup = 'diger';
  if(!r.birim) r.birim = 'adet';
  if(!r.hesapTuru) r.hesapTuru = 'dogrudan';
  if(r.fiyatOrj === undefined) r.fiyatOrj = Number(r.fiyat) || 0;
  if(r.sira === undefined) r.sira = 0;
  if(r.miktar === undefined || r.miktar === '') r.miktar = 1;
  return r;
}
function ensureMaliyet(q){
  if(!q.maliyet || !Array.isArray(q.maliyet.items)) q.maliyet = { items: [] };
  const m = q.maliyet;
  if(m.hedefOran === undefined) m.hedefOran = MALIYET_AYAR.varsayilanHedef;
  if(!m.hedefMod) m.hedefMod = 'marj';
  if(!Array.isArray(m.gecmis)) m.gecmis = [];
  if(!Array.isArray(m.gruplar)) m.gruplar = [];   // kullanıcı tanımlı ek gruplar {id, ad}
  m.items.forEach((r, i) => { mxKalemNormalle(r, q); if(!r.sira) r.sira = i + 1; });
  m.items.forEach(r => mxSatirHesapla(r, mxKur(q)));
  return m;
}
function mxFiyatNormalle(mz){
  if(!mz.id) mz.id = benzersizId('mz');
  if(!mz.para) mz.para = 'TL';
  if(!mz.birim) mz.birim = 'adet';
  if(mz.kdvDahil === undefined) mz.kdvDahil = false;
  if(mz.kdvOran === undefined) mz.kdvOran = 20;
  if(mz.tedarikci === undefined) mz.tedarikci = '';
  if(mz.tarih === undefined) mz.tarih = '';
  return mz;
}
function mxGruplar(q){
  const ek = (q && q.maliyet && q.maliyet.gruplar) || [];
  const temel = MX_GRUPLAR.map(g => { const o = ek.find(e => e.id === g.id); return o ? Object.assign({}, g, { ad: o.ad }) : g; });   // yeniden adlandırılmış varsayılan grup
  return temel.concat(ek.filter(e => !MX_GRUPLAR.some(g => g.id === e.id)).map(g => Object.assign({ ikon:'◇', renk:'#667085' }, g)));
}
function mxGrupBul(q, id){ return mxGruplar(q).find(g => g.id === id) || MX_GRUPLAR[MX_GRUPLAR.length - 1]; }
function mxTedarikciler(){
  const adlar = new Set();
  CUSTOMERS.filter(c => c.durum === 'Tedarikçi').forEach(c => adlar.add(c.name));
  MALZEME_FIYATLARI.forEach(mz => { if(mz.tedarikci) adlar.add(mz.tedarikci); });
  return [...adlar].sort((a, b) => a.localeCompare(b, 'tr'));
}
function mxTedarikciIdBul(ad){ const c = CUSTOMERS.find(x => x.name === ad && x.durum === 'Tedarikçi'); return c ? c.id : null; }

// ---- HESAP FONKSİYONLARI (merkezi, test edilebilir) ----
function mxNetMiktar(r){
  const en = Number(r.en) || 0, boy = Number(r.boy) || 0, adet = Number(r.adet) || 1, miktar = Number(r.miktar) || 0;
  switch(r.hesapTuru){
    case 'en_boy':      return en * boy / 10000;
    case 'en_boy_adet': return en * boy * adet / 10000;
    case 'uzunluk':     return (boy / 100) * adet;
    case 'goturu':      return 1;
    default:            return miktar;
  }
}
function mxFireliMiktar(net, fire){ return (Number(net) || 0) * (1 + (Number(fire) || 0) / 100); }
function mxMaliyetMiktar(r){ return r.hesapTuru === 'dogrudan' || r.hesapTuru === 'saat' ? (Number(r.miktar) || 0) : mxFireliMiktar(mxNetMiktar(r), r.fire); }
function mxTLcevir(tutar, para, kur){ return (Number(tutar) || 0) * mxKurDegeri(para, kur); }
function mxSatirToplam(r, kur){
  if(r.aktif === false) return 0;
  return kurus(mxMaliyetMiktar(r) * (Number(r.fiyatOrj) || 0) * mxKurDegeri(r.para, kur));
}
function mxToplamMaliyet(q, kur){
  kur = kur || mxKur(q);
  return kurus(((q.maliyet && q.maliyet.items) || []).filter(r => r.aktif !== false).reduce((s, r) => s + mxSatirToplam(r, kur), 0));
}
function mxBrutKar(satis, maliyet){ return kurus((Number(satis) || 0) - (Number(maliyet) || 0)); }
function mxMarjOrani(kar, satis){ return (Number(satis) || 0) > 0 ? kar / satis * 100 : null; }
function mxMarkupOrani(kar, maliyet){ return (Number(maliyet) || 0) > 0 ? kar / maliyet * 100 : null; }
function mxOneriMarj(maliyet, hedef){ hedef = Number(hedef); return hedef >= 0 && hedef < 100 ? kurus((Number(maliyet) || 0) / (1 - hedef / 100)) : null; }
function mxOneriMarkup(maliyet, oran){ return kurus((Number(maliyet) || 0) * (1 + (Number(oran) || 0) / 100)); }
function mxGrupDagilimi(q, kur){
  kur = kur || mxKur(q);
  const toplam = mxToplamMaliyet(q, kur);
  return mxGruplar(q).map(g => {
    const tutar = kurus(((q.maliyet && q.maliyet.items) || []).filter(r => r.aktif !== false && r.grup === g.id).reduce((s, r) => s + mxSatirToplam(r, kur), 0));
    return { id:g.id, ad:g.ad, renk:g.renk, tutar, yuzde: toplam > 0 ? tutar / toplam * 100 : 0 };
  }).filter(d => d.tutar > 0);
}
// Teklifin KDV hariç satış tutarı ₺ (teklif dövizliyse kurla çevrilir)
function mxSatisTL(q, kur){ return kurus(mxTLcevir(quoteSub(q), q.currency || 'TL', kur || mxKur(q))); }
function mxOzet(q){
  const kur = mxKur(q), m = ensureMaliyet(q);
  const maliyet = mxToplamMaliyet(q, kur), satis = mxSatisTL(q, kur), kar = mxBrutKar(satis, maliyet);
  const oneri = m.hedefMod === 'markup' ? mxOneriMarkup(maliyet, m.hedefOran) : mxOneriMarj(maliyet, m.hedefOran);
  return { maliyet, satis, kar, marj: mxMarjOrani(kar, satis), markup: mxMarkupOrani(kar, maliyet), hedefOran: m.hedefOran, hedefMod: m.hedefMod, oneri, dagilim: mxGrupDagilimi(q, kur), kur };
}
// Satırın türetilmiş alanları: miktar (fireli), fiyat (₺ birim) — eski maliyetToplam ve raporlar bu alanları okur
function mxSatirHesapla(r, kur){
  if(r.hesapTuru !== 'dogrudan' && r.hesapTuru !== 'saat'){ const mm = mxMaliyetMiktar(r); if(mm) r.miktar = Math.round(mm * 10000) / 10000; }
  r.fiyat = kurus((Number(r.fiyatOrj) || 0) * mxKurDegeri(r.para, kur));
  r.toplamTL = mxSatirToplam(r, kur);
  return r;
}
function maliyetToplam(q){ if(!q.maliyet || !Array.isArray(q.maliyet.items)) return 0; return mxToplamMaliyet(q, mxKur(q)); }

// ---- Fiyat durumu / sorunlar ----
function mxFiyatDurumu(r, kur){
  if(!r.tedarikciAd && !r.fiyatKaydiId) return { renk:'gri', metin: r.manuel ? 'Manuel fiyat' : 'Tedarikçisiz kayıt' };
  if(r.manuel) return { renk:'gri', metin:'Manuel fiyat' };
  const gecerlilikFark = mxGunFarki(r.gecerlilik);
  if(r.gecerlilik && gecerlilikFark !== null && gecerlilikFark > 0) return { renk:'kirmizi', metin:'Fiyat geçerliliği dolmuş' };
  const yas = mxGunFarki(r.fiyatTarihi);
  if(yas === null) return { renk:'kirmizi', metin:'Fiyat tarihi yok' };
  if(yas > MALIYET_AYAR.eskimeGun) return { renk:'kirmizi', metin:`Fiyat ${yas} gün eski` };
  if(yas > MALIYET_AYAR.eskimeGun * MALIYET_AYAR.uyariOran) return { renk:'turuncu', metin:`Fiyat ${yas} günlük — eskime sınırına yakın` };
  return { renk:'yesil', metin:`Güncel fiyat (${yas} günlük)` };
}
function mxSatirSorunlari(r, kur){
  const s = [];
  if(r.aktif === false) return s;
  const durum = mxFiyatDurumu(r, kur);
  if(durum.renk === 'kirmizi') s.push({ kod:'eski', metin:durum.metin });
  if(!r.tedarikciAd && !r.fiyatKaydiId) s.push({ kod:'tedarikcisiz', metin:'Tedarikçi seçilmedi' });
  if(r.para !== 'TL' && !mxKurDegeri(r.para, kur)) s.push({ kod:'kurYok', metin:`${r.para} kuru bulunamadı` });
  if(!(Number(r.fiyatOrj) > 0)) s.push({ kod:'sifir', metin:'Birim maliyet sıfır' });
  if(!(mxMaliyetMiktar(r) > 0)) s.push({ kod:'miktar', metin:'Miktar eksik' });
  if(r.manuel && r.fiyatKaydiId) s.push({ kod:'manuel', metin:'Tedarikçi fiyatı elle değiştirildi' });
  return s;
}
function mxSorunOzeti(q){
  const kur = mxKur(q);
  const items = ensureMaliyet(q).items.filter(r => r.aktif !== false);
  const eski = items.filter(r => mxSatirSorunlari(r, kur).some(s => s.kod === 'eski'));
  const diger = items.filter(r => mxSatirSorunlari(r, kur).some(s => s.kod !== 'eski'));
  return { eski, diger, toplam: items.filter(r => mxSatirSorunlari(r, kur).length).length };
}

function mxGorunurKalemler(q){
  const kur = mxKur(q);
  const ara = mxDurum.ara.trim().toLowerCase();
  return ensureMaliyet(q).items.filter(r => r.aktif !== false).filter(r => {
    if(mxDurum.grup && r.grup !== mxDurum.grup) return false;
    if(mxDurum.sadeceSorunlu && !mxSatirSorunlari(r, kur).length) return false;
    if(mxDurum.filtre === 'eksik' && !mxSatirSorunlari(r, kur).some(x => x.kod !== 'tedarikcisiz')) return false;
    if(mxDurum.filtre === 'tedarikcisiz' && r.tedarikciAd) return false;
    if(!ara) return true;
    return [r.ad, r.aciklama, r.not, r.tedarikciAd, r.kod].some(v => String(v || '').toLowerCase().includes(ara));
  }).sort((a, b) => (a.sira || 0) - (b.sira || 0));
}
function mxFiltreSayisi(){ return (mxDurum.grup ? 1 : 0) + (mxDurum.sadeceSorunlu ? 1 : 0) + (mxDurum.filtre ? 1 : 0); }

// Çift tıklamayla miktar / birim maliyet hızlı düzenleme (yalnız bu iki alan)
function mxInlineAc(id, alan){
  const q = mxAktifTeklif(); const r = q && mxKalemBul(q, id); if(!r) return;
  const hucre = document.getElementById((alan === 'miktar' ? 'mxMik_' : 'mxFiy_') + id); if(!hucre || hucre.querySelector('input')) return;
  const deger = alan === 'miktar' ? virgulYaz(r.miktar) : virgulYaz(kurus(r.fiyatOrj));
  hucre.innerHTML = `<input class="mx-inp mx-inline qd-para sag" inputmode="decimal" value="${deger}" data-orj="${deger}" aria-label="${alan === 'miktar' ? 'Miktar' : 'Birim maliyet'}" onclick="event.stopPropagation()" onkeydown="mxTusa(event)" onchange="mxAlanDegis('${id}','${alan}',this.value)" onblur="setTimeout(()=>mxInlineKapat('${id}'),0)">`;
  const i = hucre.querySelector('input'); i.focus(); i.select();
}
function mxInlineKapat(id){ mxSatirYenile(id, true); }
function mxUrunEslesir(mz, r){
  const a = String(mz.ad || '').trim().toLowerCase(), b = String(r.ad || '').trim().toLowerCase();
  if(!a || !b) return false;
  if(mz.id === r.fiyatKaydiId) return true;
  return a === b || a.includes(b) || b.includes(a) || b.split(/\s+/).filter(w => w.length > 3).some(w => a.includes(w));
}
let mxAraZaman = null;
function mxAraYaz(v){ mxDurum.ara = v; clearTimeout(mxAraZaman); mxAraZaman = setTimeout(() => { renderContent(); const i = document.getElementById('mxAra'); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 220); }

document.addEventListener('click', e => { if((mxDurum.menu || mxDurum.filtreAcik) && !e.target.closest('.mx-menu-kap')){ mxDurum.menu = null; mxDurum.filtreAcik = false; if(currentPage === 'teklifler' && teklifStep === 'maliyet') renderContent(); } });

// ---- Satır içi düzenleme ----
function mxTusa(ev){
  if(ev.key === 'Enter'){ ev.preventDefault(); ev.target.blur(); }
  if(ev.key === 'Escape'){ if(ev.target.dataset.orj !== undefined) ev.target.value = ev.target.dataset.orj; ev.target.blur(); ev.stopPropagation(); }
}
function mxKalemBul(q, id){ return ensureMaliyet(q).items.find(x => x.id === id); }
function mxAlanDegis(id, alan, deger){
  const q = mxAktifTeklif(); if(!q) return;
  const r = mxKalemBul(q, id); if(!r) return;
  const kur = mxKur(q);
  const eskiToplam = mxSatirToplam(r, kur);
  if(alan === 'miktar'){
    const v = virgulSayi(deger);
    if(!(v > 0)){ showToast('Miktar sıfır veya negatif olamaz.'); mxSatirYenile(id); return; }
    if(v !== Number(r.miktar)) mxGecmisYaz(q, 'miktar', r.ad, mxSayi(r.miktar), mxSayi(v));
    r.miktar = v;
  } else if(alan === 'fiyatOrj'){
    const v = virgulSayi(deger);
    if(v < 0){ showToast('Negatif fiyat girilemez.'); mxSatirYenile(id); return; }
    if(kurus(v) !== kurus(r.fiyatOrj)){
      mxGecmisYaz(q, 'fiyat', r.ad, mxPara(r.fiyatOrj, r.para), mxPara(v, r.para));
      if(r.fiyatKaydiId) r.manuel = true;
      r.fiyatOrj = v;
    }
  } else if(alan === 'para'){
    if(deger !== r.para){ mxGecmisYaz(q, 'fiyat', r.ad, `${mxPara(r.fiyatOrj, r.para)}`, `${mxPara(r.fiyatOrj, deger)}`); r.para = deger; if(r.fiyatKaydiId) r.manuel = true; }
    if(deger !== 'TL' && !mxKurDegeri(deger, kur)) showToast(`${deger} kuru yok — Kur alanından girin veya TCMB'den getirin.`);
  } else if(alan === 'birim'){
    r.birim = deger;
  } else { r[alan] = deger; }

  const yeniToplam = mxSatirToplam(r, kur);

}
function mxSatirYenile(id, tamSatir){
  const q = mxAktifTeklif(); if(!q) return;

  const kur = mxKur(q);
  const kurYok = r.para !== 'TL' && !mxKurDegeri(r.para, kur);
  const top = document.getElementById('mxTop_' + id); if(top) top.innerHTML = kurYok ? '<span class="kirmizi">—</span>' : mxPara(mxSatirToplam(r, kur));
  const mik = document.getElementById('mxMik_' + id); if(mik && (tamSatir || !mik.querySelector('input'))) mik.innerHTML = `${mxSayi(mxMaliyetMiktar(r), 2)} <span class="birim">${notEsc(r.birim)}</span>`;
  const fiy = document.getElementById('mxFiy_' + id); if(fiy && (tamSatir || !fiy.querySelector('input'))) fiy.innerHTML = `<span class="orj">${mxPara(kurus(r.fiyatOrj), r.para)}</span>${r.para !== 'TL' ? `<span class="tl" id="mxTL_${id}">${kurYok ? '<span class="kirmizi">kur yok</span>' : mxPara(kurus(r.fiyatOrj * mxKurDegeri(r.para, kur)))}</span>` : ''}`;
  const g = document.getElementById('mxGrupToplam_' + r.grup);
  if(g) g.textContent = mxPara(kurus(ensureMaliyet(q).items.filter(x => x.aktif !== false && x.grup === r.grup).reduce((s, x) => s + mxSatirToplam(x, kur), 0)));

// ---- Sürükle-bırak ----
function mxSurukleBasla(ev, id){ mxDurum.surukle = id; ev.dataTransfer.effectAllowed = 'move'; try{ ev.dataTransfer.setData('text/plain', id); }catch(e){} ev.currentTarget.classList.add('surukleniyor'); }
function mxSurukleBitti(){ mxDurum.surukle = null; document.querySelectorAll('.surukleniyor,.hedef').forEach(e => e.classList.remove('surukleniyor', 'hedef')); }
function mxSurukleUzerinde(ev){ if(!mxDurum.surukle) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; }
function mxSiraYenidenNumarala(q){ ensureMaliyet(q).items.filter(r => r.aktif !== false).sort((a, b) => (a.sira || 0) - (b.sira || 0)).forEach((r, i) => r.sira = i + 1); }
function mxBirakSatir(ev, hedefId){
  ev.preventDefault(); ev.stopPropagation();
  const q = mxAktifTeklif(); const kaynakId = mxDurum.surukle; if(!q || !kaynakId || kaynakId === hedefId) return;
  const items = ensureMaliyet(q).items;
  const k = items.find(x => x.id === kaynakId), h = items.find(x => x.id === hedefId); if(!k || !h) return;

  k.sira = (h.sira || 0) - 0.5;

  if(typeof liveMarkDirty === 'function') liveMarkDirty();
  renderContent();
}
function mxBirakGrup(ev, grupId){
  ev.preventDefault();

  const k = mxKalemBul(q, kaynakId); if(!k) return;
  if(k.grup !== grupId) mxGecmisYaz(q, 'tasima', k.ad, mxGrupBul(q, k.grup).ad, mxGrupBul(q, grupId).ad);
  k.grup = grupId; k.sira = 9999;
  mxSiraYenidenNumarala(q); mxDurum.surukle = null;
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
  renderContent();
}
function mxGrubaTasi(id, grupId){
  const q = mxAktifTeklif(); const r = q && mxKalemBul(q, id); if(!r) return;
  mxGecmisYaz(q, 'tasima', r.ad, mxGrupBul(q, r.grup).ad, mxGrupBul(q, grupId).ad);
  r.grup = grupId; r.sira = 9999; mxSiraYenidenNumarala(q); renderContent();
}
function mxSiraTasi(id, yon){
  const q = mxAktifTeklif(); const r = q && mxKalemBul(q, id); if(!r) return;
  const grup = ensureMaliyet(q).items.filter(x => x.aktif !== false && x.grup === r.grup).sort((a, b) => a.sira - b.sira);
  const i = grup.indexOf(r), j = i + yon; if(j < 0 || j >= grup.length) return;
  const t = grup[j].sira; grup[j].sira = r.sira; r.sira = t;
  mxSiraYenidenNumarala(q); if(typeof liveMarkDirty === 'function') liveMarkDirty(); renderContent();
}

function mxModalKayitSec(){

  mxKalemModalCiz();

function mxKalemKaydet(yeniAc){
  const q = mxAktifTeklif(); if(!q) return;
  const v = mxModalOku();
  if(!v.ad || !String(v.ad).trim()){ showToast('Maliyet kalemi adı girin.'); document.getElementById('mxfAd').focus(); return; }
  if(v.hesapTuru === 'dogrudan' || v.hesapTuru === 'saat'){ if(!(Number(v.miktar) > 0)){ showToast('Miktar sıfır veya negatif olamaz.'); return; } }
  if(Number(v.fiyatOrj) < 0){ showToast('Negatif fiyat girilemez.'); return; }
  if(v.grup === '__yeni'){
    const ad = String(v.yeniGrupAd || '').trim();
    if(!ad){ showToast('Yeni grup adı girin.'); const yg = document.getElementById('mxfYeniGrupAd'); if(yg) yg.focus(); return; }
    const g = { id: benzersizId('mg'), ad }; ensureMaliyet(q).gruplar.push(g); v.grup = g.id;
  }
  if(v.hesapTuru === 'en_boy' || v.hesapTuru === 'en_boy_adet') v.birim = 'm²';
  if(v.hesapTuru === 'uzunluk') v.birim = 'mt';
  if(v.hesapTuru === 'saat') v.birim = 'saat';
  if(v.hesapTuru === 'goturu'){ v.birim = 'götürü'; v.miktar = 1; }
  let fiyat = Number(v.fiyatOrj) || 0;
  if(v.kdvDahil){ fiyat = kurus(fiyat / (1 + (Number(v.kdvOran) || 0) / 100)); v.kdvDahil = false; }   // maliyete KDV hariç yazılır
  const kayit = MALZEME_FIYATLARI.find(mz => mz.id === v.fiyatKaydiId);
  const manuel = kayit ? (kurus(fiyat) !== kurus(kayit.kdvDahil ? kayit.fiyat / (1 + (kayit.kdvOran || 0) / 100) : kayit.fiyat) || v.para !== kayit.para) : !v.tedarikciAd ? true : false;
  const m = ensureMaliyet(q);
  const alanlar = { grup:v.grup, ad:String(v.ad).trim(), kod:v.kod || '', aciklama:v.aciklama || '', hesapTuru:v.hesapTuru, miktar:Number(v.miktar) || 1, birim:v.birim, en:v.en, boy:v.boy, adet:Number(v.adet) || 1, fire:Number(v.fire) || 0,
    tedarikciAd:(v.tedarikciAd || '').trim(), tedarikciId: mxTedarikciIdBul((v.tedarikciAd || '').trim()), fiyatKaydiId:v.fiyatKaydiId || null, para:v.para, fiyatOrj:fiyat, fiyatTarihi:v.fiyatTarihi || '', gecerlilik:v.gecerlilik || '', not:v.not || '', manuel };
  if(mxModal.duzenleId){
    const r = mxKalemBul(q, mxModal.duzenleId); if(!r) return;
    const degisim = [];
    if(r.miktar !== alanlar.miktar && alanlar.hesapTuru === 'dogrudan') degisim.push(['miktar', mxSayi(r.miktar), mxSayi(alanlar.miktar)]);
    if(kurus(r.fiyatOrj) !== kurus(alanlar.fiyatOrj) || r.para !== alanlar.para) degisim.push(['fiyat', mxPara(r.fiyatOrj, r.para), mxPara(alanlar.fiyatOrj, alanlar.para)]);
    if((r.tedarikciAd || '') !== alanlar.tedarikciAd) degisim.push(['tedarikci', r.tedarikciAd || '—', alanlar.tedarikciAd || '—']);
    if(!degisim.length) degisim.push(['duzenleme', '', '']);
    degisim.forEach(([islem, e, y]) => mxGecmisYaz(q, islem, alanlar.ad, e, y));
    Object.assign(r, alanlar);
    mxSatirHesapla(r, mxKur(q));
  } else {
    const r = Object.assign({ id: benzersizId('mk'), aktif:true, sira: (m.items.length ? Math.max(...m.items.map(x => x.sira || 0)) : 0) + 1 }, alanlar);
    mxSatirHesapla(r, mxKur(q));
    m.items.push(r);
    mxGecmisYaz(q, 'ekleme', r.ad, '', mxPara(mxSatirToplam(r, mxKur(q))));
  }

  const kullanan = QUOTES.reduce((t, q) => t + (((q.maliyet && q.maliyet.items) || []).filter(r => r.fiyatKaydiId === mz.id || r.malzemeId === mz.id).length), 0);
  if(!confirm(`${mz.ad || 'Fiyat kaydı'} silinsin mi?` + (kullanan ? `\n${kullanan} maliyet satırı bu fiyata bağlı — satırlar kalır ama artık kurla güncellenmez ve "silinmiş tedarikçi fiyatı" olarak işaretlenir.` : ''))) return;
  MALZEME_FIYATLARI.splice(i, 1);
  QUOTES.forEach(q => ((q.maliyet && q.maliyet.items) || []).forEach(r => { if(r.fiyatKaydiId === mz.id){ r.manuel = true; r.not = (r.not ? r.not + ' · ' : '') + 'Bağlı tedarikçi fiyatı silindi'; } }));
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
  renderContent();
}

function mxPanelYenile(){

function mxHedefKaydir(v){ const i = document.getElementById('mxHedefOran'); if(i) i.value = v; const q = mxAktifTeklif(); if(q){ q.maliyet.hedefOran = Number(v); mxPanelYenile(); } }
function mxHedefDegis(v){

function mxTeklifeUygulaModal(){
  const q = mxAktifTeklif(); if(!q) return;
  const o = mxOzet(q); if(o.oneri === null) return;
  const kur = mxKur(q); const kod = q.currency || 'TL'; const kurD = mxKurDegeri(kod, kur);
  const yeniTeklif = kod === 'TL' ? o.oneri : (kurD ? kurus(o.oneri / kurD) : null);
  const eskiTeklif = kurus(quoteSub(q));
  const kalemler = (q.items || []).filter(it => lineQty(it) > 0);
  const fark = yeniTeklif === null ? null : kurus(yeniTeklif - eskiTeklif);
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Önerilen fiyatı teklife uygula</h2><button class="modal-close" aria-label="Kapat" onclick="closeModal()">✕</button></div>
    ${yeniTeklif === null ? `<div class="mx-uyari"><b>⚠</b><span>${kod} kuru bulunamadığı için ₺ öneri teklif dövizine çevrilemiyor. Kur girin.</span></div>` : `
    <div class="mx-karsilastir">
      <div><small>Mevcut teklif (KDV hariç)</small><b class="qd-para">${mxPara(eskiTeklif, kod)}</b></div>
      <div class="ok">→</div>
      <div><small>Yeni teklif (KDV hariç)</small><b class="qd-para">${mxPara(yeniTeklif, kod)}</b><em class="${fark >= 0 ? 'pozitif' : 'negatif'}">${fark >= 0 ? '+' : ''}${mxPara(fark, kod)}</em></div>
    </div>
    <p style="font-size:12.5px;color:var(--ink-2);margin:0 0 10px;">${o.hedefMod === 'markup' ? `Kâr ekleme oranı %${mxSayi(o.hedefOran)}` : `Hedef marj %${mxSayi(o.hedefOran)}`} · toplam maliyet ${mxPara(o.maliyet)}${kod !== 'TL' ? ` · kur ${mxSayi(kurD, 4)}` : ''}</p>
    ${Math.abs(fark) < 0.005 ? '<div class="mx-uyari bilgi"><b>ⓘ</b><span>Teklif tutarı zaten önerilen tutara eşit.</span></div>' : `
    <div class="mx-dagitim">
      <div class="mx-form-bolum">${kalemler.length > 1 ? 'Fark teklif kalemlerine nasıl dağıtılsın?' : 'Uygulama'}</div>
      ${kalemler.length > 1 ? `
      <label><input type="radio" name="mxDagit" value="oran" ${eskiTeklif > 0 ? 'checked' : 'disabled'}> Kalemlere mevcut satış tutarı oranında dağıt${eskiTeklif > 0 ? '' : ' <small>(mevcut tutar sıfır)</small>'}</label>
      <label><input type="radio" name="mxDagit" value="kalem" ${eskiTeklif > 0 ? '' : 'checked'}> Tüm farkı seçilen kaleme uygula:
        <select id="mxDagitKalem" class="mx-inp" style="margin-left:6px;">${kalemler.map((it, i) => `<option value="${q.items.indexOf(it)}">${notEsc(it.title || ('Kalem ' + (i + 1)))} · ${mxPara(lineNet(it), kod)}</option>`).join('')}</select></label>` :
      `<label><input type="radio" name="mxDagit" value="kalem" checked> ${kalemler.length ? `"${notEsc(kalemler[0].title || 'Kalem')}" kaleminin birim fiyatı yeni tutara göre güncellensin` : 'Teklifte kalem yok — önce teklif kalemi ekleyin'}</label>`}
      <label><input type="radio" name="mxDagit" value="yok"> Yalnızca öneriyi göster, teklif tutarını değiştirme</label>
    </div>
    <div class="mx-form-aksiyon"><button class="ghost" onclick="closeModal()">Vazgeç</button><button class="primary" ${kalemler.length ? '' : 'disabled'} onclick="mxTeklifeUygula()">Onayla ve uygula</button></div>`}`}`;
  showModal();
}
function mxTeklifeUygula(){
  const q = mxAktifTeklif(); if(!q) return;
  const o = mxOzet(q); if(o.oneri === null) return;
  const kur = mxKur(q); const kod = q.currency || 'TL'; const kurD = mxKurDegeri(kod, kur); if(!kurD) return;
  const hedef = kod === 'TL' ? o.oneri : kurus(o.oneri / kurD);
  const sec = document.querySelector('input[name="mxDagit"]:checked'); const yontem = sec ? sec.value : 'yok';
  if(yontem === 'yok'){ closeModal(); showToast('Teklif tutarı değiştirilmedi.'); return; }
  const eski = kurus(quoteSub(q));
  const items = q.items.filter(it => lineQty(it) > 0);
  if(!items.length){ showToast('Teklifte kalem yok.'); return; }
  if(yontem === 'oran' && eski > 0){
    const k = hedef / eski;
    items.forEach(it => it.price = kurus((Number(it.price) || 0) * k));
  } else {
    const idx = document.getElementById('mxDagitKalem') ? Number(document.getElementById('mxDagitKalem').value) : q.items.indexOf(items[0]);
    const it = q.items[idx] || items[0];
    const digerleri = kurus(quoteSub(q) - lineNet(it));
    it.price = kurus((hedef - digerleri) / lineQty(it));
  }
  // kuruş artığını en büyük kaleme yaz (yuvarlama farkı)
  const artik = kurus(hedef - quoteSub(q));
  if(Math.abs(artik) >= 0.01){
    const enBuyuk = items.slice().sort((a, b) => lineNet(b) - lineNet(a))[0];
    enBuyuk.price = kurus((Number(enBuyuk.price) || 0) + artik / lineQty(enBuyuk));
  }
  mxGecmisYaz(q, 'uygulama', yontem === 'oran' ? 'oranla dağıtıldı' : 'tek kaleme uygulandı', mxPara(eski, kod), mxPara(kurus(quoteSub(q)), kod));
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
  closeModal(); renderContent(); showToast(`Teklif tutarı güncellendi: ${mxPara(kurus(quoteSub(q)), kod)} (KDV hariç).`);
}

// ---------------- MÜŞTERİYE GİDEN TEKLİF BELGESİ ----------------
// Dekant profesyonel şablon (referans: DEKANT-Profesyonel-Fiyat-Teklifi-P005.pdf).
// Yalnızca görsel katman: tutarlar quoteSub/quoteKdvAmount/quoteTotal/lineNet ile aynı fonksiyonlardan gelir.
function teklifParaMetni(q, n){
  const kod = q.currency || 'TL';
  const sayi = (Number(n) || 0).toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return kod === 'TL' ? `${sayi} TL` : `${sayi} ${kod}`;          // Türkçe biçim: 2.500,00 TL
}
function teklifKdvEtiketi(q){
  const oranlar = [...new Set((q.items || []).map(it => Number(it.kdv) || 0))];
  return oranlar.length === 1 ? `KDV (%${oranlar[0].toLocaleString('tr-TR')})` : 'KDV';
}
function teklifUzunTarih(iso){
  if(!iso) return '';
  const d = new Date(iso + (String(iso).length === 10 ? 'T00:00:00' : ''));
  if(isNaN(d)) return String(iso);
  return d.toLocaleDateString('tr-TR', { day:'2-digit', month:'long', year:'numeric' });
}
// Teklifin "Notlar" alanındaki satırlar: "Etiket: değer" → ticari koşul satırı, diğerleri → hukuki dipnot.
// Geçerlilik tarihi varsa "Teklif geçerliliği" satırı gerçek veriden üretilir.
function teklifKosullari(q){
  const rows = [], dipnot = [];
  String(q.notlar || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
    const m = line.match(/^([^:：\d]{2,40}?)\s*[:：]\s*(.*)$/);
    if(m && m[2].trim()) rows.push({ k: m[1].trim(), v: m[2].trim() });
    else if(m && !m[2].trim()) rows.push({ k: m[1].trim(), v: '—' });
    else dipnot.push(line);
  });
  if(q.gecerlilik && !rows.some(r => /geçerli/i.test(r.k)))
    rows.splice(Math.min(2, rows.length), 0, { k:'Teklif geçerliliği', v:`${teklifUzunTarih(q.gecerlilik)} tarihine kadar geçerlidir.` });
  return { rows, dipnot };
}

function changeQuoteStatus(id, status){
  const q = QUOTES.find(x=>x.id===id);
  if(!q) return;
  q.status = status;
  if(status === 'Kabul Edildi' || status === 'Faturalandı'){
    q.sonuc = 'Kazanıldı';
    if(!q.jobId){ renderContent(); openIsAcModal(q.id); return; }
    renderContent();
    showToast(`Durum "${status}" olarak güncellendi.`);
    return;
  }
  if(status === 'Reddedildi') q.sonuc = 'Kaybedildi';
  else q.sonuc = 'Sonuçlandırılmamış';
  renderContent();
  showToast(`Durum "${status}" olarak güncellendi.`);
}

function submitIsAc(qid){
  const q = QUOTES.find(x => x.id === qid); if(!q) return;

  const asama = document.getElementById('iaAsama').value;
  j.stage = asama;

  if(kesifNotu){ if(!j.notes) j.notes = {}; j.notes.KESIF = kesifNotu; }

    showToast(`${j.code} açıldı — havuzda, grafikerlerden biri üstlenecek.`);
  }
}
function isiUstlen(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  if(j.assignees && j.assignees.length){
    showToast('Bu iş az önce üstlenildi: ' + j.assignees.join(', '));

  if(!p){ showToast('Hesabınıza bağlı personel kartı bulunamadı — atamayı yönetici yapabilir.'); return; }

function daDegisimOzeti(eski, yeni){
  const alanlar = [
    ['tur', 'tür', v => v ? DA_TURLER[v].ad : '—'],
    ['malzeme', 'malzeme', v => v || '—'],
    ['tedarikci', 'tedarikçi', v => v || '—'],
    ['tarih', 'tarih', v => v ? formatDate(v) : '—'],
    ['tutar', 'tutar', v => v ? tl(v) : '—'],
    ['sorumluId', 'sorumlu', v => { const p = PERSONELLER.find(x => x.id === v); return p ? p.name : '—'; }],
    ['aracId', 'araç', v => { const x = VEHICLES.find(y => y.id === v); return x ? x.plate : '—'; }],
    ['jobId', 'iş', v => { const j = JOBS.find(x => x.id === v); return j ? j.code : '—'; }],
    ['not', 'not', v => v || '—'],
  ];
  return alanlar
    .filter(([k]) => (eski[k] || '') !== (yeni[k] || '') && !(k === 'tutar' && Number(eski[k] || 0) === Number(yeni[k] || 0)))
    .map(([k, ad, f]) => `${ad}: ${f(eski[k])} → ${f(yeni[k])}`)
    .join(' · ');
}

function daTarihRozet(a){
  if(a.durum === 'tamam') return '<span class="da-rozet">✓ tamam</span>';
  if(!a.tarih) return '<span class="da-rozet">tarih yok</span>';
  const bugun = planIso(new Date());
  const gunFark = Math.round((new Date(a.tarih+'T00:00:00') - new Date(bugun+'T00:00:00')) / 86400000);
  const d = new Date(a.tarih+'T00:00:00');
  const kisa = d.getDate() + ' ' + PLAN_AYLAR[d.getMonth()];
  if(gunFark < 0)  return `<span class="da-rozet gecikti">${kisa} · ${-gunFark} gün gecikti</span>`;
  if(gunFark === 0) return '<span class="da-rozet bugun">bugün</span>';
  if(gunFark === 1) return '<span class="da-rozet bugun">yarın</span>';
  return `<span class="da-rozet">${kisa}</span>`;

function submitDisAlim(id){
  const malzeme = document.getElementById('daMalzeme').value.trim();
  if(!malzeme){ showToast('Malzeme / sipariş açıklaması girin.'); return; }
  const veri = {
    tur: document.getElementById('daTur').value,
    malzeme: malzeme,
    tedarikci: document.getElementById('daTedarikci').value.trim(),
    tarih: document.getElementById('daTarih').value,
    tutar: document.getElementById('daTutar') ? (Number(document.getElementById('daTutar').value) || 0) : (id ? (Number((DIS_ALIMLAR.find(x => x.id === id) || {}).tutar) || 0) : 0),
    sorumluId: document.getElementById('daSorumlu').value || null,
    aracId: document.getElementById('daArac').value || null,
    jobId: document.getElementById('daJob').value || null,
    not: document.getElementById('daNot').value.trim(),
  };
  let oncekiSorumlu = null;
  if(id){
    const a = DIS_ALIMLAR.find(x => x.id === id);
    if(a){
      oncekiSorumlu = a.sorumluId;
      const degisim = daDegisimOzeti(a, veri);
      Object.assign(a, veri);
      if(degisim) daHareketYaz('guncelleme', a, degisim);
    }
  } else {
    const yeni = Object.assign({ id: benzersizId('da'), durum:'bekliyor' }, veri);
    DIS_ALIMLAR.push(yeni);
    daHareketYaz('ekleme', yeni, veri.tarih ? 'tarih: ' + formatDate(veri.tarih) : '');
  }
  if(veri.sorumluId && veri.sorumluId !== oncekiSorumlu)
    bildirimAtama([veri.sorumluId], `Size dış alım atandı: ${veri.malzeme}${veri.tedarikci ? ' (' + veri.tedarikci + ')' : ''}${veri.tarih ? ' — ' + formatDate(veri.tarih) : ''}`);
  closeModal(); renderContent();
  showToast(id ? 'Dış alım güncellendi.' : 'Dış alım eklendi.');
}
function daToggle(id){
  const a = DIS_ALIMLAR.find(x => x.id === id);
  if(!a) return;
  a.durum = a.durum === 'tamam' ? 'bekliyor' : 'tamam';
  if(a.durum === 'tamam') daTamamAcik = true;
  daHareketYaz(a.durum === 'tamam' ? 'teslim' : 'geri-al', a);
  renderContent();
}
function daSil(id){
  const i = DIS_ALIMLAR.findIndex(x => x.id === id);
  if(i >= 0){
    const a = DIS_ALIMLAR[i];
    DIS_ALIMLAR.splice(i, 1);
    daHareketYaz('silme', a, [DA_TURLER[a.tur] ? DA_TURLER[a.tur].ad : '', a.tarih ? 'tarih: ' + formatDate(a.tarih) : '', a.durum === 'tamam' ? 'durum: tamam' : 'durum: bekliyor'].filter(Boolean).join(' · '));
