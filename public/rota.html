<title>ROTA — İş Akışı Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&family=Chivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ROTA — Tasarım Sistemi
   Grafit + Signal. Turuncu tek anlam taşır: "iş şu an burada".
   Ölçek: 4px. Yarıçap: 4 / 6 / 10 / 999. Saf siyah yok.
   ============================================================ */
:root{
  /* Atölye Panosu — Yüzeyler */
  --canvas:#F1F5F9;
  --surface:#FFFFFF;
  --surface-sunk:#E2E8F0;
  --line:#CBD5E1;
  --line-strong:#94A3B8;

  /* Mürekkep */
  --ink:#0F172A;
  --ink-2:#334155;
  --ink-3:#64748B;

  /* Signal — sadece "şu an burada / dikkat" anlamında */
  --signal:#EA580C;
  --signal-soft:#FFEDD5;

  /* Durum */
  --ok:#15803D;      --ok-soft:#DCFCE7;
  --risk:#DC2626;    --risk-soft:#FEE2E2;
  --hold:#CA8A04;    --hold-soft:#FEF9C3;
  --hold-glow:#FACC15;

  --shadow-sm:0 1px 3px rgba(15,23,42,.12);
  --shadow-md:0 6px 20px rgba(15,23,42,.16);

  /* Kategori halkaları — gelir yeşil, gider kırmızı rampası */
  --cat-g1:#14532D; --cat-g2:#15803D; --cat-g3:#16A34A; --cat-g4:#22C55E; --cat-g5:#5BD98B;
  --cat-r1:#7F1D1D; --cat-r2:#B91C1C; --cat-r3:#DC2626; --cat-r4:#EF4444; --cat-r5:#F87171;
  --cat-none:#94A3B8;

  /* Haftalık plan — proje renkleri (dolgu / kenar / yazı) */
  --pj1:#DCFCE7; --pj1b:#86EFAC; --pj1f:#14532D;
  --pj2:#EDE9FE; --pj2b:#C4B5FD; --pj2f:#4C1D95;
  --pj3:#FFEDD5; --pj3b:#FDBA74; --pj3f:#7C2D12;
  --pj4:#DBEAFE; --pj4b:#93C5FD; --pj4f:#1E3A8A;
  --pj5:#FCE7F3; --pj5b:#F9A8D4; --pj5f:#831843;
  --pj6:#CCFBF1; --pj6b:#5EEAD4; --pj6f:#134E4A;

  --font-display:'Roboto Condensed',-apple-system,sans-serif;
  --font-body:'Chivo',-apple-system,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;

  /* Eski değişken adları için eşleme (satır içi stiller bozulmasın) */
  --bg:var(--canvas); --sidebar-bg:var(--surface); --card-bg:var(--surface);
  --input-bg:var(--surface); --text:var(--ink); --text-muted:var(--ink-2);
  --accent:var(--ink); --accent-light:var(--surface-sunk); --accent-hover:var(--ink);
  --green:var(--ok); --green-light:var(--ok-soft);
  --red:var(--risk); --red-light:var(--risk-soft);
  --amber:var(--signal); --amber-light:var(--signal-soft);
  --border:var(--line); --shadow:var(--shadow-sm);
}
html.dark{
  --canvas:#0B1220; --surface:#141B2E; --surface-sunk:#1B2439;
  --line:#2C374F; --line-strong:#475369;
  --ink:#EEF2F8; --ink-2:#AEB8CC; --ink-3:#78849C;
  --signal:#FB923C; --signal-soft:#3A2410;
  --ok:#4ADE80; --ok-soft:#0F2A1C;
  --risk:#F87171; --risk-soft:#301515;
  --hold:#FACC15; --hold-soft:#2E2408;
  --hold-glow:#FACC15;
  --shadow-sm:0 1px 3px rgba(0,0,0,.5);
  --shadow-md:0 6px 24px rgba(0,0,0,.6);
  --cat-g1:#4ADE80; --cat-g2:#22C55E; --cat-g3:#16A34A; --cat-g4:#15803D; --cat-g5:#0F5F2E;
  --cat-r1:#FCA5A5; --cat-r2:#F87171; --cat-r3:#EF4444; --cat-r4:#DC2626; --cat-r5:#B91C1C;
  --cat-none:#64748B;
  --pj1:#14532D; --pj1b:#166534; --pj1f:#BBF7D0;
  --pj2:#2E1065; --pj2b:#5B21B6; --pj2f:#DDD6FE;
  --pj3:#431407; --pj3b:#9A3412; --pj3f:#FED7AA;
  --pj4:#172554; --pj4b:#1E40AF; --pj4f:#BFDBFE;
  --pj5:#500724; --pj5b:#9D174D; --pj5f:#FBCFE8;
  --pj6:#042F2E; --pj6b:#115E59; --pj6f:#99F6E4;
  --bg:var(--canvas); --sidebar-bg:var(--surface); --card-bg:var(--surface);
  --input-bg:var(--surface); --text:var(--ink); --text-muted:var(--ink-2);
  --accent:var(--ink); --accent-light:var(--surface-sunk); --accent-hover:var(--ink);
  --green:var(--ok); --green-light:var(--ok-soft);
  --red:var(--risk); --red-light:var(--risk-soft);
  --amber:var(--signal); --amber-light:var(--signal-soft);
  --border:var(--line); --shadow:var(--shadow-sm);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);
  font-family:var(--font-body);font-size:13.5px;line-height:19px;
  -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}

/* ---------- Kabuk ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:212px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 16px;}
.brand-left{display:flex;align-items:center;gap:10px;font-family:var(--font-display);
  font-weight:700;font-size:15.5px;letter-spacing:-.2px;}
.brand-logo{width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:13px;}
.brand-status{width:6px;height:6px;border-radius:999px;background:var(--ok);}

.sidebar{transition:width .18s ease,padding .18s ease;}
/* Daraltılmış menü (yalnız masaüstü): ikon şeridi */
@media (min-width:881px){
  /* Daraltılmış modda menü şerittir; fare üzerine gelince yana açılır, içerik menünün yanında kalır */
  .shell.menu-dar #menuDarBtn{display:none;}
  .shell.menu-dar .sidebar:not(:hover){width:56px;padding:14px 6px;}
  .shell.menu-dar .sidebar:not(:hover) .brand{flex-direction:column;gap:10px;padding:2px 0 12px;}
  .shell.menu-dar .sidebar:not(:hover) .brand-ad{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .brand-tools{flex-direction:column;gap:6px;}
  .shell.menu-dar .sidebar:not(:hover) .nav button{justify-content:center;padding:0;gap:0;height:34px;}
  .shell.menu-dar .sidebar:not(:hover) .nav-item-label,
  .shell.menu-dar .sidebar:not(:hover) .nav-chevron,
  .shell.menu-dar .sidebar:not(:hover) .badge-new{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .nav-item-icon{width:auto;font-size:15px;opacity:.9;}
  .shell.menu-dar .sidebar:not(:hover) .nav button.active::before{left:-6px;}
  .shell.menu-dar .sidebar:not(:hover) .subnav{display:none !important;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-foot{align-items:center;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-user{justify-content:center;}
  .shell.menu-dar .sidebar:not(:hover) .sidebar-user > div:last-child{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .logout-link{display:none;}
}
.nav{display:flex;flex-direction:column;gap:1px;}
.nav button{display:flex;align-items:center;gap:9px;height:31px;padding:0 9px;
  border-radius:6px;font-family:var(--font-body);font-size:12.5px;font-weight:500;
  color:var(--ink-2);background:none;border:none;text-align:left;cursor:pointer;width:100%;
  position:relative;transition:background .12s,color .12s;}
.nav button:hover{background:var(--surface-sunk);color:var(--ink);}
.nav button.active{background:var(--surface-sunk);color:var(--ink);font-weight:600;}
.nav button.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;
  width:2px;background:var(--ink);border-radius:0 2px 2px 0;}
.nav-item-icon{width:18px;text-align:center;font-size:13px;opacity:.75;background:none !important;
  height:auto;display:inline;}
.nav-chevron{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .15s;}
.nav-chevron.rot{transform:rotate(90deg);}
.badge-new{margin-left:auto;font-family:var(--font-mono);font-size:9px;font-weight:600;
  padding:2px 5px;border-radius:4px;background:var(--signal-soft);color:var(--signal);}

.subnav{padding-left:25px;display:none;flex-direction:column;gap:1px;margin:1px 0 3px;}
.subnav.open{display:flex;}
.subnav button{height:27px;padding:0 9px;font-size:12px;border-radius:6px;background:none;
  border:none;text-align:left;cursor:pointer;color:var(--ink-3);font-weight:400;}
.subnav button:hover{background:var(--surface-sunk);color:var(--ink);}
.subnav button.active{color:var(--ink);font-weight:600;background:var(--surface-sunk);}

/* ---------- İçerik ---------- */
.content{flex:1;padding:18px 26px 44px;min-width:0;max-width:1480px;}
.page-head,.list-page-head{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:15px;gap:10px;flex-wrap:wrap;}
.page-title{font-family:var(--font-display);font-size:18px;line-height:24px;font-weight:600;
  letter-spacing:-.3px;margin:0;}
.page-sub{font-size:12px;line-height:17px;color:var(--ink-2);margin:2px 0 0;}
.gunun-sozu{margin-top:8px;font-size:13.5px;line-height:20px;color:var(--ink);
  font-weight:600;font-style:italic;letter-spacing:.1px;
  border-left:3px solid var(--signal);padding:3px 0 3px 11px;max-width:600px;}
.gunun-sozu .tirnak{font-family:Georgia,'Times New Roman',serif;font-style:normal;
  font-size:23px;line-height:0;color:var(--signal);vertical-align:-7px;padding-right:3px;}
.gunun-sozu .tirnak.kapa{padding:0 0 0 3px;vertical-align:-9px;}

.note{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--ink);
  border-radius:6px;padding:9px 12px;margin-bottom:14px;font-size:12px;line-height:18px;color:var(--ink-2);}
.note b{color:var(--ink);font-weight:600;}

/* ---------- Butonlar ---------- */
.primary-btn{height:30px;padding:0 12px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;transition:opacity .12s;}
.primary-btn:hover{opacity:.85;}
.primary-btn:active{transform:translateY(.5px);}
.save-btn{height:30px;padding:0 16px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
.save-btn:hover{opacity:.85;}
.back-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:13px;}
.back-btn:hover{background:var(--surface-sunk);color:var(--ink);}
.btn{height:28px;padding:0 11px;border:1px solid var(--line-strong);border-radius:6px;
  font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);flex:1;}
.btn:hover{background:var(--surface-sunk);}
.btn-approve{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.btn-revise{background:var(--surface);color:var(--ink-2);}
.btn-complete{width:100%;height:34px;background:var(--ink);color:var(--surface);border:none;
  border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;margin-top:12px;}
.add-task-btn,.add-line-btn{width:100%;height:30px;background:none;border:1px dashed var(--line-strong);
  border-radius:6px;color:var(--ink-3);font-size:12.5px;cursor:pointer;font-family:inherit;}
.add-task-btn:hover,.add-line-btn:hover{border-color:var(--ink-3);color:var(--ink);}
.collapse-link,.sub-add-link{background:none;border:none;color:var(--ink);font-size:12px;
  font-weight:600;cursor:pointer;padding:7px 0;display:inline-block;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line-strong);}
.collapse-link:hover,.sub-add-link:hover{text-decoration-color:var(--ink);}

/* ---------- Kartlar / ızgara ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:9px;}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:11px;
  box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
.card:hover{border-color:var(--ink-3);box-shadow:var(--shadow-md);}
.card .name{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:0;margin-bottom:5px;text-transform:uppercase;}
.card .line{font-size:11.5px;line-height:17px;color:var(--ink-2);display:flex;gap:6px;}
.card .desc{font-size:11.5px;color:var(--ink-2);}
.card .code,.kcard .code{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:0;}

/* ---------- Pano (kanban) ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
.board-col{min-width:226px;flex:0 0 226px;background:var(--surface-sunk);border:1px solid var(--line);border-radius:8px;padding:9px;}
.board-col.drop{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink-3);}
.kcard.suruklenen{opacity:.4;}
.kcard[draggable="true"]{cursor:grab;}
.board-col-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;padding:2px 4px;}
.board-col-title{font-family:var(--font-display);font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--ink);}
.board-col-count{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--surface);background:var(--ink-3);padding:1px 6px;border-radius:3px;}
.kcard{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:9px;
  margin-bottom:6px;box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
.kcard:hover{border-color:var(--ink);box-shadow:var(--shadow-md);}
.kcard .client{font-family:var(--font-display);font-weight:700;font-size:12.5px;margin:2px 0 3px;letter-spacing:0;text-transform:uppercase;}
.kcard .desc{font-size:11.5px;line-height:16px;color:var(--ink-2);margin-bottom:7px;}
.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);}
.due{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
.mini-avatar{width:22px;height:22px;border-radius:999px;background:var(--surface-sunk);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:9.5px;font-weight:700;border:1px solid var(--line);}

/* ---------- Rozet / etiket ---------- */
.chip,.tag,.status-pill,.pay-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;
  border-radius:4px;font-size:11px;font-weight:600;margin:0 4px 4px 0;
  font-family:var(--font-body);letter-spacing:0;}
.chip-cost,.tag.cost{font-family:var(--font-mono);background:var(--surface-sunk);color:var(--ink-2);}
.chip-pay-BEKLIYOR,.chip-appr-BEKLIYOR{background:var(--surface-sunk);color:var(--ink-2);}
.chip-pay-KISMI,.chip-appr-REVIZYON{background:var(--hold-soft);color:var(--hold);}
.chip-pay-TAMAMLANDI,.chip-appr-ONAYLANDI{background:var(--ok-soft);color:var(--ok);}
.status-Taslak{background:var(--surface-sunk);color:var(--ink-2);}
.status-Gönderildi{background:var(--signal-soft);color:var(--signal);}
.st-taslak{background:var(--surface-sunk);color:var(--ink-2);}
.st-gonderildi{background:var(--signal-soft);color:var(--signal);}
.st-kabul-edildi{background:var(--ok-soft);color:var(--ok);}
.st-faturalandi{background:var(--ok-soft);color:var(--ok);}
.st-reddedildi{background:var(--risk-soft);color:var(--risk);}
.status-Onaylandı{background:var(--ok-soft);color:var(--ok);}
.stage-badge{display:inline-flex;height:20px;align-items:center;padding:0 8px;border-radius:4px;
  background:var(--surface-sunk);color:var(--ink-2);font-family:var(--font-display);
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.locked{margin-top:8px;padding:7px 9px;border-radius:6px;background:var(--signal-soft);
  color:var(--signal);font-size:11.5px;font-weight:500;}

/* ---------- Tablo ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:7px;overflow:hidden;}
th{text-align:left;font-family:var(--font-display);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--ink);padding:7px 11px;
  border-bottom:1px solid var(--line-strong);background:var(--surface-sunk);}
td{padding:0 11px;height:31px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink);}
tbody tr:hover{background:var(--surface-sunk);}
tr:last-child td{border-bottom:none;}

/* ---------- Defter listeleri ---------- */
.ledger-wrap{display:flex;gap:12px;align-items:flex-start;}
.ledger-main{flex:2.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.ledger-side{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;}
.ledger-search,.filter-bar{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  height:32px;display:flex;align-items:center;gap:14px;padding:0 11px;margin:10px;
  font-size:12px;color:var(--ink-3);}
.filter-bar{margin:0 0 -1px;border-radius:9px 9px 0 0;height:36px;}
.filter-bar span{display:flex;align-items:center;gap:5px;}
.ledger-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 14px;
  border-bottom:1px solid var(--line);gap:12px;}
.ledger-row:hover{background:var(--surface-sunk);}
.ledger-row.highlight{background:var(--signal-soft);}
.ledger-row:last-child{border-bottom:none;}
.ledger-title{font-family:var(--font-display);font-weight:600;font-size:12.5px;margin-bottom:1px;letter-spacing:-.1px;}
.ledger-sub{font-size:11px;color:var(--ink-2);margin-bottom:1px;}
.ledger-meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);}
.ledger-amount{text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600;white-space:nowrap;}
.ledger-amount .kalan{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--risk);}
.ledger-amount .odendi{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--ok);}
.satir-islem{display:flex;gap:12px;justify-content:flex-end;margin-top:5px;font-size:11px;color:var(--ink-3);font-weight:500;}
.satir-islem span{cursor:pointer;user-select:none;}
.satir-islem span:hover{color:var(--ink);text-decoration:underline;}
.satir-islem .sil:hover{color:var(--risk);}
.mini-islem{cursor:pointer;color:var(--ink-3);font-size:12px;padding:0 3px;}
.mini-islem:hover{color:var(--ink);}
.mini-islem.sil:hover{color:var(--risk);}
.ledger-footer{padding:10px 16px;font-size:11.5px;color:var(--ink-3);display:flex;
  justify-content:space-between;align-items:center;border-top:1px solid var(--line);}
.empty-state{padding:22px 16px;font-size:12px;color:var(--ink-3);text-align:center;}
.group-header{display:flex;justify-content:space-between;padding:6px 13px;background:var(--surface-sunk);
  font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-2);border-bottom:1px solid var(--line);}
.filter-group{margin-bottom:20px;}
.filter-group h5{font-family:var(--font-display);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);margin:0 0 8px;}
.filter-group div{font-size:13px;padding:6px 0;color:var(--ink-2);cursor:pointer;}
.filter-group div:hover{color:var(--ink);}

/* ---------- Kasa/banka satırları ---------- */
.kb-columns{display:flex;gap:12px;align-items:flex-start;}
.kb-main{flex:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.kb-side{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.kb-row{display:flex;justify-content:space-between;padding:0 16px;height:44px;align-items:center;
  font-size:13px;border-bottom:1px solid var(--line);}
.kb-row:last-child{border-bottom:none;}
.kb-row span:last-child{font-family:var(--font-mono);font-weight:500;}
.kb-row.header{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);height:38px;background:var(--surface);}
.kb-row.header span:last-child{font-family:var(--font-display);}
.kb-row.total{background:var(--surface-sunk);font-weight:600;}
.kb-row .val-green{color:var(--ok);}

/* ---------- Formlar ---------- */
.form-page{max-width:960px;}
.form-block{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:15px 16px;margin-bottom:10px;}
.form-block h4{font-family:var(--font-display);font-size:11.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);margin:0 0 12px;}
.field{margin-bottom:11px;}
.field label,.form-main-field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px;}
.field input,.field select,.field textarea,.form-main-field input,.repeat-row input,.repeat-row select{
  width:100%;height:31px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;
  font-size:12.5px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s;}
.field textarea{height:auto;padding:7px 10px;line-height:18px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus,.form-main-field input:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,17,22,.06);}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3);}
.field-row{display:flex;gap:9px;}
.field-row .field{flex:1;}
.hint{font-size:11px;color:var(--ink-3);margin:-6px 0 10px;}
.section-label{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line);}
.section-label:first-child{border-top:none;padding-top:0;margin-top:0;}
.avatar-upload{float:left;margin-right:20px;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.avatar-circle{width:80px;height:80px;border-radius:10px;background:var(--surface-sunk);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;}
.avatar-link{font-size:11.5px;color:var(--ink-2);cursor:pointer;font-weight:500;}
.form-main-field{overflow:hidden;}
.form-main-field input{height:40px;font-size:15px;font-family:var(--font-display);font-weight:600;}
.form-page-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}

.accordion{border-top:1px solid var(--line);}
.accordion:first-child{border-top:none;}
.accordion-head{display:flex;align-items:center;gap:10px;height:48px;cursor:pointer;
  font-family:var(--font-display);font-size:13px;font-weight:600;}
.accordion-plus{width:18px;height:18px;border-radius:4px;background:var(--surface-sunk);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:12px;
  font-weight:600;transition:transform .15s;}
.accordion-head.open .accordion-plus{transform:rotate(45deg);background:var(--ink);color:var(--surface);}
.accordion-body{display:none;padding-bottom:16px;}
.accordion-body.open{display:block;}
.sub-block{margin-bottom:16px;}
.sub-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sub-block-head h4{font-size:12px;margin:0;text-transform:none;letter-spacing:0;color:var(--ink);}
.repeat-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.repeat-row select{flex:0 0 148px;}
.repeat-row input{flex:1;}
.row-remove,.li-remove{width:32px;height:32px;flex-shrink:0;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink-3);border-radius:6px;cursor:pointer;font-size:12px;}
.row-remove:hover,.li-remove:hover{border-color:var(--risk);color:var(--risk);}
.addr-toggle{width:32px;height:18px;border-radius:999px;background:var(--ok);position:relative;flex:0 0 32px;}
.addr-toggle::after{content:'';width:14px;height:14px;border-radius:999px;background:#fff;
  position:absolute;top:2px;right:2px;}
.char-count{text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:4px;}

.type-choice{display:flex;gap:12px;max-width:520px;margin:24px auto 0;}
.type-card{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;}
.type-card:hover{border-color:var(--ink);background:var(--surface-sunk);}
.type-card .emoji{font-size:26px;margin-bottom:10px;}
.type-card .label{font-family:var(--font-display);font-weight:600;font-size:14px;}

/* ---------- Teklif satırları ---------- */
.tf-table-head{display:grid;grid-template-columns:1fr 70px 78px 100px 70px 98px 30px 24px;gap:7px;
  font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);padding:0 2px 8px;}
.tf-row{display:grid;grid-template-columns:1fr 70px 78px 100px 70px 98px 30px 24px;gap:7px;align-items:center;
  padding:7px;background:var(--surface-sunk);border-radius:7px;margin-bottom:6px;}
.tf-row.li-tasinan{opacity:.45;}
.tf-row.li-hedef{outline:2px dashed var(--signal);outline-offset:1px;}
.li-drag{cursor:grab;color:var(--ink-3);text-align:center;user-select:none;font-size:15px;line-height:1;
  padding:6px 0;border-radius:5px;touch-action:none;}
.li-drag:hover{color:var(--ink);background:var(--surface);}
.li-drag:active{cursor:grabbing;}
.li-detail{margin-top:4px;height:26px !important;font-size:11.5px !important;color:var(--ink-2);}
.tf-row input,.tf-row select{height:29px;padding:0 8px;border:1px solid var(--line-strong);
  border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;width:100%;}
.tf-row input:focus,.tf-row select:focus{outline:none;border-color:var(--ink);}
.tf-row input:disabled{background:var(--surface-sunk);color:var(--ink-3);cursor:not-allowed;}
.li-dims{grid-column:1 / -1; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:8px; padding-top:9px; border-top:1px dashed var(--line-strong);
  font-size:11.5px; color:var(--ink-3);}
.li-dims-label{font-family:var(--font-display); font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.6px; color:var(--ink-3); margin-right:2px;}
.li-dims input{width:82px !important;}
.li-dims .li-res{margin-left:auto; font-family:var(--font-mono); font-size:12.5px; font-weight:600;
  color:var(--ink); background:var(--surface); border:1px solid var(--line-strong);
  border-radius:6px; padding:6px 11px; white-space:nowrap;}
.qd-sub{display:block; font-size:10px; line-height:14px; color:#777; font-weight:400; margin-top:2px;}
.tf-totals,.totals{display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding:10px 4px 0;}
.tf-totals .grand,.totals b{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--ink);}

.mx-head{display:grid;grid-template-columns:minmax(240px,1fr) 76px 106px 112px 32px;gap:8px;
  font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);padding:0 4px 8px;}
.mx-row{display:grid;grid-template-columns:minmax(240px,1fr) 76px 106px 112px 32px;gap:8px;align-items:center;
  padding:7px;background:var(--surface-sunk);border-radius:7px;margin-bottom:6px;}
.mx-row .mx-aciklama{grid-column:1 / -1;height:28px;font-size:11.5px;color:var(--ink-2);
  border:1px dashed var(--line-strong);background:var(--surface);}
.mx-row .mx-aciklama:focus{border-style:solid;}
.mx-row .mx-aciklama::placeholder{color:var(--ink-3);}
.mx-row input{height:30px;padding:0 9px;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--surface);color:var(--ink);font-size:12.5px;width:100%;}
.mx-row input:focus{outline:none;border-color:var(--ink);}
.mx-row .mx-tutar{font-family:var(--font-mono);font-weight:600;text-align:right;background:var(--surface-sunk);border-color:var(--line);}
.mx-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
.mx-chip{height:26px;padding:0 11px;border:1px dashed var(--line-strong);border-radius:999px;
  background:var(--surface);color:var(--ink-2);font-size:11.5px;cursor:pointer;font-family:inherit;}
.mx-chip:hover{border-style:solid;border-color:var(--ink);color:var(--ink);}
.mx-ozet{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:14px 16px;}
.mx-ozet .t-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);padding:5px 0;}
.mx-ozet .t-row span:last-child{font-family:var(--font-mono);color:var(--ink);font-weight:600;}
.mx-ozet .t-row.final{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:13.5px;}
.islem-item{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 12px;
  background:none;border:none;text-align:left;cursor:pointer;font-size:12.5px;color:var(--ink);}
.islem-item:hover{background:var(--surface-sunk);}

@media print{
  .sidebar,.page-head,.top-right-bar,.bottom-left-bar,.form-page-footer,#islemlerMenu,.no-print,.mobile-topbar,.sidebar-backdrop{display:none !important;}
  .content{padding:0 !important; max-width:100% !important;}
  .shell{display:block !important;}
  body,html{background:#fff !important;}
  .quote-doc{border:none !important; box-shadow:none !important;}
  /* Yazdırma kağıdı genişliği (~800px) mobil eşiğimizin (880px) altında kaldığı için
     taraf bilgileri yanlışlıkla alt alta yığılıyordu — burada zorla yan yana tutuyoruz. */
  .quote-doc-parties{flex-direction:row !important; gap:32px !important;}
}

/* ---------- Teklif Belgesi (PDF çıktısı) — her zaman açık/beyaz, temadan bağımsız ---------- */
.quote-doc{background:#fff; color:#1a1a1a; border:1px solid #E2E2E2; border-radius:14px;
  overflow:hidden; font-family:'Chivo',-apple-system,sans-serif;}
.quote-doc-banner{margin:20px; padding:28px 20px; text-align:center; background:#0F172A;
  border:2px solid #EA580C; border-radius:10px;}
.quote-doc-banner-name{font-family:'Roboto Condensed',-apple-system,sans-serif; font-size:27px; font-weight:700;
  letter-spacing:3px; color:#fff; text-transform:uppercase;}
.quote-doc-banner-slogan{font-family:'Space Mono',ui-monospace,monospace; font-size:10.5px; color:#FDBA74;
  margin-top:6px; letter-spacing:2px; text-transform:uppercase;}
.quote-doc-banner.has-logo{background:#fff; border:none; border-radius:0;
  border-bottom:2px solid #C8211D; margin:20px 24px 20px; padding:4px 0 16px;}
.quote-doc-logo{height:54px; width:auto; display:block; margin:0 auto;}
.quote-doc-toprow{display:flex; justify-content:space-between; padding:0 24px; font-size:12.5px; color:#333; margin-bottom:18px;}
.quote-doc-parties{display:flex; gap:32px; padding:0 24px; margin-bottom:20px;}
.quote-doc-party{flex:1; font-size:12.5px; line-height:19px; color:#333;}
.quote-doc-party b{display:block; font-size:13px; font-weight:700; color:#1a1a1a; margin-bottom:3px;}
.quote-doc-intro{font-size:12.5px; line-height:19px; padding:0 24px 18px; color:#333; margin:0;}
.quote-doc-intro b{display:block; margin-bottom:4px; color:#1a1a1a;}
.quote-doc-table{width:calc(100% - 48px); margin:0 24px 4px; border-collapse:collapse; table-layout:fixed;}
.quote-doc-table col.col-no{width:5%;} .quote-doc-table col.col-urun{width:20%;} .quote-doc-table col.col-aciklama{width:30%;}
.quote-doc-table col.col-miktar{width:12%;} .quote-doc-table col.col-fiyat{width:16%;} .quote-doc-table col.col-toplam{width:17%;}
.quote-doc-table th{text-align:left; font-size:10.5px; font-weight:700; color:#0F172A; background:#FBEDEC;
  text-transform:uppercase; letter-spacing:.4px; padding:9px 10px; border:1px solid #EBCFCD;}
.quote-doc-table td{font-size:12px; color:#1a1a1a; padding:9px 10px; border:1px solid #E2E2E2; vertical-align:top;}
.quote-doc-totals{display:flex; flex-direction:column; align-items:flex-end; gap:2px; padding:6px 24px 20px; font-size:12.5px; color:#333;}
.quote-doc-totals span{display:flex; gap:18px; width:220px; justify-content:space-between;}
.quote-doc-totals span b, .quote-doc-totals .grand{font-weight:700; color:#1a1a1a;}
.quote-doc-totals .grand{font-size:14px; padding-top:6px; border-top:2px solid #C8211D; margin-top:4px; color:#C8211D;}
.quote-doc-totals .grand b{color:#C8211D;}
.quote-doc-section{padding:0 24px 20px;}
.quote-doc-section h4{font-size:13px; font-weight:700; color:#1a1a1a; margin:0 0 8px;}
.quote-doc-notes{margin:0; padding-left:18px; font-size:11.5px; line-height:19px; color:#444;}
.quote-doc-footer{text-align:center; font-size:11px; color:#666; padding:16px 24px; border-top:1px solid #E2E2E2;}
.quote-doc-foot{padding:8px 24px 12px; margin-top:2px; border-top:1px solid #ECECEC;}
.quote-doc-banks{max-width:320px;}
.quote-doc-banks-title{color:#C8211D; font-weight:700; font-size:8.5px; letter-spacing:.5px;
  text-transform:uppercase; margin-bottom:2px;}
.quote-doc-bank-row{display:flex; font-size:9px; line-height:14px; color:#666;}
.quote-doc-bank-name{width:92px; flex-shrink:0; font-weight:600; color:#333;}
.quote-doc-bank-iban{font-variant-numeric:tabular-nums; white-space:nowrap;}
.quote-doc-foot-rule{border:0; border-top:1px solid #EBCFCD; margin:7px 0;}
.quote-doc-foot a{color:inherit; text-decoration:none;}
.quote-doc-foot-contact a{display:inline-flex; align-items:center; gap:4px;}
.quote-doc-foot-contact svg{width:11px; height:11px; flex-shrink:0;}
.quote-doc-foot a:hover{text-decoration:underline;}
.quote-doc-foot a:focus-visible{outline:2px solid #C8211D; outline-offset:2px; border-radius:2px;}
@media print{ .quote-doc-foot a{text-decoration:none;} }
.quote-doc-foot-bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
.quote-doc-social{display:flex; flex-direction:column; gap:1px;}
.quote-doc-social-row{display:flex; align-items:center; gap:5px; font-size:8.5px; font-weight:600; color:#666;}
.quote-doc-social-row svg{width:10px; height:10px; flex-shrink:0;}
.quote-doc-foot-right{text-align:right; font-size:10px; color:#555; line-height:15px;}
.quote-doc-foot-contact{margin-top:1px; display:flex; gap:14px; justify-content:flex-end;
  color:#C8211D; font-weight:600; font-size:10px; flex-wrap:wrap;}
@media(max-width:520px){
  .quote-doc-bank-row{flex-direction:column; margin-bottom:6px;}
  .quote-doc-bank-name{width:auto;}
  .quote-doc-foot-bottom{flex-direction:column; align-items:flex-start;}
  .quote-doc-foot-right{text-align:left;}
  .quote-doc-foot-contact{justify-content:flex-start; gap:14px;}
}
.line-items{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.li-row{display:grid;grid-template-columns:1fr 60px 90px 90px 28px;gap:8px;padding:8px 10px;

.li-row-full{grid-template-columns:1fr 56px 88px 72px 88px 32px;}
.li-head{background:var(--surface-sunk);font-family:var(--font-display);font-size:10.5px;

.li-row input,.li-row select,.li-row textarea{height:32px;padding:0 8px;font-size:12.5px;
  border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);}

.rte-toolbar{display:flex;gap:14px;height:34px;align-items:center;padding:0 12px;
  border:1px solid var(--line-strong);border-bottom:none;border-radius:6px 6px 0 0;
  background:var(--surface-sunk);font-size:12.5px;color:var(--ink-2);font-weight:600;}
.rte-box textarea{border-radius:0 0 6px 6px !important;border-top:none !important;width:100%;

.checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:16px 0 8px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;}
.checkbox-row input{width:14px;height:14px;accent-color:var(--ink);}
.collapse-body{padding-bottom:8px;}

/* ---------- Otomatik tamamlama ---------- */
.ac-wrap{position:relative;}
/* ---------- Haftalık plan (zaman bloklama) ---------- */
.hp-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.hp-nav{width:28px;height:28px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);
  color:var(--ink-2);cursor:pointer;font-size:13px;line-height:1;}
.hp-nav:hover{background:var(--surface-sunk);color:var(--ink);}
.hp-hafta{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--ink);}
.hp-board{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
.hp-head{position:sticky;top:0;z-index:3;background:var(--surface-sunk);
  border-bottom:1px solid var(--line-strong);padding:7px 8px;}
.hp-head.corner{border-right:1px solid var(--line);}
.hp-head + .hp-head{border-left:1px solid var(--line);}
.hp-gun{font-family:var(--font-display);font-size:11.5px;font-weight:700;color:var(--ink);}
.hp-gun.bugun{color:var(--signal);}
.hp-tarih{font-size:10px;color:var(--ink-3);}
.hp-ozet{font-family:var(--font-mono);font-size:10px;color:var(--ink-2);margin-top:3px;}
.hp-gutter{border-right:1px solid var(--line);position:relative;background:var(--surface);}
.hp-saat{position:absolute;right:6px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--ink-3);transform:translateY(-6px);}
.hp-col{position:relative;border-left:1px solid var(--line);background:var(--surface);}
.hp-col.drop{background:var(--surface-sunk);box-shadow:inset 0 0 0 2px var(--ink-3);}
.hp-cizgi{position:absolute;left:0;right:0;height:1px;background:var(--line);}
.hp-simdi{position:absolute;left:0;right:0;height:2px;background:var(--signal);z-index:2;}
.hp-simdi::before{content:'';position:absolute;left:-3px;top:-2px;width:6px;height:6px;
  border-radius:999px;background:var(--signal);}
.hp-task{position:absolute;left:3px;right:3px;border-radius:6px;padding:5px 7px;overflow:hidden;
  cursor:grab;border:1px solid;display:flex;flex-direction:column;z-index:1;
  transition:box-shadow .12s,transform .12s;}
.hp-task:hover{box-shadow:var(--shadow-md);z-index:4;}
.hp-task.suruklenen{opacity:.4;}
.hp-task.resizing{box-shadow:var(--shadow-md);z-index:6;}
.hp-resize{position:absolute;left:0;right:0;bottom:0;height:14px;cursor:ns-resize;
  border-radius:0 0 6px 6px;touch-action:none;}
.hp-resize::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:3px;
  width:26px;height:3px;border-radius:3px;background:currentColor;opacity:.35;transition:opacity .12s;}
.hp-task:hover .hp-resize::after,.hp-task.resizing .hp-resize::after{opacity:.75;}
.hp-resize-tag{position:fixed;z-index:130;pointer-events:none;background:var(--ink);color:var(--surface);
  font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:5px;box-shadow:var(--shadow-md);}
.hp-task-proje{font-family:var(--font-display);font-size:11px;font-weight:700;line-height:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp-task-ad{font-size:10.5px;line-height:14px;opacity:.85;overflow:hidden;}
.hp-task-alt{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;
  font-family:var(--font-mono);font-size:9.5px;opacity:.9;padding-top:3px;}
.hp-tip{position:fixed;z-index:120;width:236px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow-md);
  padding:11px 12px;font-size:11.5px;color:var(--ink-2);pointer-events:none;}
.hp-tip h6{font-family:var(--font-display);font-size:12.5px;font-weight:700;color:var(--ink);margin:0 0 2px;}
.hp-tip-row{display:flex;justify-content:space-between;gap:10px;margin-top:4px;}
.hp-tip-bar{height:5px;border-radius:999px;background:var(--surface-sunk);margin-top:8px;overflow:hidden;}
.hp-tip-bar span{display:block;height:100%;background:var(--ink);border-radius:999px;}
.hp-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink-2);}
/* Planlanmamış işler tepsisi */
.hp-tepsi{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);
  border:1px dashed var(--line-strong);border-radius:8px;padding:8px 10px;margin-bottom:10px;min-height:44px;}
.hp-tepsi.drop{background:var(--surface-sunk);border-style:solid;}
.hp-tepsi-baslik{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--ink-3);margin-right:4px;white-space:nowrap;}
.hp-tepsi-baslik b{color:var(--signal);}
.hp-is{border:1px solid;border-radius:6px;padding:4px 9px;font-size:11px;line-height:14px;cursor:grab;
  display:flex;flex-direction:column;max-width:210px;}
.hp-is[draggable="false"]{cursor:default;}
.hp-is b{font-family:var(--font-display);font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp-is i{font-style:normal;font-size:10px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp-is u{text-decoration:none;font-family:var(--font-mono);font-size:9px;opacity:.75;}
.hp-tepsi-bos{font-size:11.5px;color:var(--ink-3);}
.kcard .plan-rozet{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 7px;border-radius:4px;
  background:var(--ok-soft);color:var(--ok);font-family:var(--font-mono);font-size:9.5px;font-weight:600;}
/* Ekip (personel × gün) görünümü */
.hp-ekip{display:grid;grid-template-columns:186px repeat(7,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
.hp-ek-head{background:var(--surface-sunk);border-bottom:1px solid var(--line-strong);padding:6px 8px;}
.hp-ek-head + .hp-ek-head{border-left:1px solid var(--line);}
.hp-ek-kisi{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:7px 9px;background:var(--surface);display:flex;flex-direction:column;justify-content:center;}
.hp-ek-ad{font-size:12px;font-weight:600;color:var(--ink);line-height:15px;}
.hp-ek-unvan{font-size:10px;color:var(--ink-3);}
.hp-ek-yuk{display:flex;align-items:center;gap:6px;margin-top:4px;}
.hp-ek-bar{flex:1;height:4px;border-radius:999px;background:var(--surface-sunk);overflow:hidden;}
.hp-ek-bar span{display:block;height:100%;border-radius:999px;background:var(--ok);}
.hp-ek-bar span.dolu{background:var(--hold);} .hp-ek-bar span.asiri{background:var(--risk);}
.hp-ek-saat{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);white-space:nowrap;}
.hp-ek-hucre{border-left:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:4px;min-height:46px;display:flex;flex-direction:column;gap:3px;background:var(--surface);}
.hp-ek-hucre.drop{background:var(--surface-sunk);box-shadow:inset 0 0 0 2px var(--ink-3);}
.hp-ek-hucre.bugun{background:var(--signal-soft);}
.hp-chip{border:1px solid;border-radius:5px;padding:3px 6px;cursor:grab;font-size:10px;line-height:13px;}
.hp-chip:hover{box-shadow:var(--shadow-sm);}
.hp-chip.suruklenen{opacity:.4;}
.hp-chip b{display:block;font-family:var(--font-display);font-size:10.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp-chip i{font-style:normal;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp-chip u{text-decoration:none;font-family:var(--font-mono);font-size:9.5px;opacity:.8;}
.hp-mod{display:flex;gap:2px;background:var(--surface-sunk);border-radius:7px;padding:2px;}
.hp-mod button{border:none;background:none;padding:4px 11px;border-radius:5px;font-size:11.5px;
  font-weight:600;color:var(--ink-3);cursor:pointer;font-family:inherit;}
.hp-mod button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
.hp-kim{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;}
.hp-kim span{font-family:var(--font-display);font-size:8.5px;font-weight:700;
  padding:1px 4px;border-radius:3px;background:rgba(0,0,0,.08);}
html.dark .hp-kim span{background:rgba(255,255,255,.12);}
.hp-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;border:1px solid;}
@media(max-width:900px){ .hp-board{grid-template-columns:40px repeat(7,minmax(78px,1fr));overflow-x:auto;} }
.tk-search{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;height:36px;margin-bottom:10px;}
.tk-search input{flex:1;border:none;background:none;color:var(--ink);font-size:12.5px;outline:none;font-family:inherit;}
.tk-chev{cursor:pointer;color:var(--ink-3);font-size:14px;user-select:none;transition:transform .15s;}
.tk-chev.open{transform:rotate(180deg);}
.tk-panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;
  padding:14px 15px;margin-bottom:10px;}
.tk-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;margin-bottom:12px;}
.tk-btn{height:29px;padding:0 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;
  cursor:pointer;color:#fff;font-family:inherit;}
.tk-btn.go{background:var(--ok);} .tk-btn.clear{background:var(--risk);}
.tk-wrap{display:flex;align-items:stretch;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
.tk-list{flex:1;min-width:0;}
.tk-side{width:184px;flex-shrink:0;background:var(--surface-sunk);
  border-left:1px solid var(--line);padding:12px 12px 15px;}
.tk-side h5{font-family:var(--font-display);font-size:11.5px;font-weight:700;margin:13px 0 4px;color:var(--ink);}
.tk-side h5:first-child{margin-top:0;}
.tk-side button{display:block;width:100%;text-align:left;background:none;border:none;padding:4px 7px;
  border-radius:5px;font-size:11.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;}
.tk-side button:hover{background:var(--surface);}
.tk-side button.on{background:var(--ink);color:var(--surface);font-weight:600;}
.tk-row{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.tk-row:hover{background:var(--surface-sunk);}
.tk-av{width:28px;height:28px;border-radius:999px;background:var(--surface-sunk);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:10.5px;font-weight:700;flex-shrink:0;}
.tk-main{flex:1;min-width:0;}
.tk-name{font-size:12.5px;font-weight:600;color:var(--ink);}
.tk-meta{font-size:10.5px;color:var(--ink-3);margin-top:1px;}
.tk-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
.tk-tur{font-size:11.5px;color:var(--signal);font-weight:600;}
.tk-foot{padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);}
@media(max-width:820px){ .tk-wrap{flex-direction:column;} .tk-side{width:auto;border-left:none;border-top:1px solid var(--line);} }
.kat-panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
  padding:15px;box-shadow:var(--shadow-sm);}
.kat-donut{width:158px;height:158px;border-radius:999px;position:relative;margin:2px auto 16px;}
.kat-donut::after{content:'';position:absolute;inset:28px;border-radius:999px;background:var(--surface);}
.kat-donut-hole{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:2;text-align:center;padding:0 26px;}
.kat-donut-hole b{font-family:var(--font-display);font-size:12px;line-height:15px;color:var(--ink);}
.kat-donut-hole span{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);margin-top:2px;}
.kat-panel-head{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px;}
.kat-panel-head h4{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0;color:var(--ink);}
.kat-panel-head b{font-family:var(--font-mono);font-size:14px;}
.kat-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:11.5px;}
.kat-row:last-child{border-bottom:none;}
.kat-dot{width:10px;height:10px;border-radius:999px;flex-shrink:0;}
.kat-row .kat-val{margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.kat-row.total{font-weight:700;border-top:1.5px solid var(--line-strong);border-bottom:none;padding-top:11px;}
.kat-net{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
  padding:11px;text-align:center;margin-bottom:13px;font-family:var(--font-display);

.kat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;}
.new-menu-wrap{position:relative;}

.new-menu button{display:block;width:100%;text-align:left;padding:11px 14px;background:none;
  border:none;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);

.new-menu button:hover{background:var(--surface-sunk);}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);

.ac-item{padding:8px 10px;font-size:12.5px;cursor:pointer;border-radius:6px;color:var(--ink);}
.ac-item:hover{background:var(--surface-sunk);}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,17,22,.45);display:none;align-items:center;
  justify-content:center;z-index:60;padding:24px;backdrop-filter:blur(2px);}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:86vh;

.modal-close{background:none;border:none;font-size:16px;color:var(--ink-3);cursor:pointer;

.donut-inner span{font-family:var(--font-mono);font-size:14px;font-weight:600;margin-top:4px;color:var(--ink);}

  font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;}

/* ---------- İmza: Kilitli Halka Rayı ---------- */
/* Tamamlanan aşama = "kilitlenmiş şalter" (koyu, kilit ikonlu). Aktif aşama = sarı, parlayan. */
.rail{display:flex;gap:3px;margin:11px 0 3px;}
.rail-seg{flex:1;height:12px;border-radius:3px;background:var(--surface-sunk);border:1.5px solid var(--line-strong);
  position:relative;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.rail-seg.done{background:var(--ink);border-color:var(--ink);}
.rail-seg.done::after{content:'🔒';font-size:7px;line-height:1;filter:grayscale(1) brightness(3);}
.rail-seg.now{background:var(--hold-glow);border-color:var(--hold-glow);
  box-shadow:0 0 0 2px var(--hold-soft), 0 0 9px 1px rgba(250,204,21,.75);}
.rail-seg:not(.done):not(.now)::after{content:'';display:inline-block;width:8px;height:8px;
  background-color:var(--ink);opacity:.5;
  -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2v6l6 4-6 4v6h12v-6l-6-4 6-4V2H6z' fill='black'/></svg>");
  mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 2v6l6 4-6 4v6h12v-6l-6-4 6-4V2H6z' fill='black'/></svg>");
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;}
.rail-labels{display:flex;gap:3px;margin-top:4px;}
.rail-labels span{flex:1;font-family:var(--font-mono);font-size:9px;font-weight:700;text-align:center;
  color:var(--ink-3);letter-spacing:.2px;}
.rail-labels span.now{color:var(--ink);background:var(--hold-glow);border-radius:2px;padding:1px 0;}

/* Koyu zeminli sağ panelde (login-right) "done" segment ile arka plan aynı renkte olduğu için görünmüyordu — burada ayrı renk veriyoruz. */
.login-right .rail-seg.done{background:#3A4A63;border-color:#3A4A63;}
.login-right .rail-seg{background:#25314A;border-color:#3A4A63;}
.login-right .rail-seg:not(.done):not(.now)::after{background-color:#FFFFFF;opacity:.85;}

/* ---------- Duyarlı (Responsive) Tasarım ---------- */
.mobile-topbar{display:none;}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:85;display:none;}
.sidebar-backdrop.show{display:block;}
@media (max-width:880px){

  .mobile-topbar .brand-left{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;}
  .hamburger-btn{width:36px;height:36px;border-radius:6px;border:1.5px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer;flex-shrink:0;}

  .sidebar.mobile-open{transform:translateX(0);}
  .content{padding:14px 14px 50px;}
  .form-page{max-width:100%;}
  .avatar-upload{float:none;margin:0 0 14px 0;width:100%;flex-direction:row;justify-content:flex-start;}
  .field-row{flex-direction:column;gap:0;}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .ledger-wrap{flex-direction:column;}
  .board-col,.gt-col{min-width:78vw;flex:0 0 78vw;}
  .kb-columns,.donut-row,.type-choice{flex-direction:column;}
  .tf-table-head{display:none;}
  .tf-row{grid-template-columns:1fr;gap:6px;background:var(--surface-sunk);padding:10px;}
  .li-row-full{grid-template-columns:1fr;gap:6px;}
  .quote-doc-parties{flex-direction:column;gap:14px;}
}
.login-right .rail-labels span{color:var(--ink-3);}

/* ---------- Yan Panel (Kişi Detayı) ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(14,17,22,.35);display:none;z-index:65;}
.drawer-overlay.show{display:block;}
.side-drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);
  z-index:66;box-shadow:-8px 0 24px rgba(14,17,22,.12);transform:translateX(100%);
  transition:transform .22s ease;overflow-y:auto;padding:24px;}
.side-drawer.show{transform:translateX(0);}
.drawer-close-x{position:absolute;top:20px;right:20px;background:none;border:none;font-size:16px;
  color:var(--ink-3);cursor:pointer;width:28px;height:28px;border-radius:6px;}

  background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;}

.drawer-footer{display:flex;gap:8px;margin-top:24px;}
.drawer-footer button{flex:1;height:38px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
.drawer-footer button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);}

/* ---------- Bildirim / tema ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:var(--canvas);padding:0 18px;height:40px;display:flex;align-items:center;border-radius:8px;
  font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow-md);}
.toast.show{opacity:1;}
.top-right-bar{position:fixed;bottom:24px;left:20px;display:flex;align-items:center;gap:8px;z-index:70;pointer-events:none;}
.preview-flag{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);transition:color .2s,border-color .2s;}
.preview-flag.ok{display:none;}
.preview-flag.saving{color:var(--hold);border-color:var(--hold);}
.preview-flag.err{color:var(--risk);border-color:var(--risk);}
.preview-flag.x{
  font-family:var(--font-mono);font-size:10.5px;padding:5px 10px;border-radius:6px;}
.theme-toggle{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);}
.theme-toggle:hover{border-color:var(--ink);}
.theme-toggle svg{width:15px;height:15px;fill:var(--ink-2);}
.theme-toggle:disabled{opacity:.35;cursor:default;}
.theme-toggle:disabled:hover{background:var(--surface);}

  overflow:hidden;background:#FFFFFF;font-family:var(--font-mono);line-height:1;}

.v-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;

.v-chip.ok{background:var(--ok-soft);color:var(--ok);}

.v-chip.none{background:var(--surface-sunk);color:var(--ink-3);}
.v-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;
  padding:11px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .12s,box-shadow .12s;}

.v-card-dates{display:flex;flex-wrap:wrap;gap:6px;}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px;}
.alert-strip{margin-bottom:20px;}
.alert-strip-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ink-3);margin-bottom:8px;}
.alert-row{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line-strong);border-left-width:3px;border-radius:7px;
  padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:box-shadow .12s;}
.alert-row:hover{box-shadow:var(--shadow-md);}
.alert-row.late{border-left-color:var(--risk);}
.alert-row.crit{border-left-color:var(--signal);}

.alert-row-title{font-size:13px;font-weight:600;color:var(--ink);}
.alert-row-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.v-detail-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px;}

/* ---------- Dış Alımlar ---------- */
.da-liste{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;margin-bottom:14px;}
.da-baslik{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--surface-sunk);
  border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);}

.da-check{width:21px;height:21px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--line-strong);
  border-radius:999px;background:var(--surface);color:#fff;font-size:11px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.da-check:hover{border-color:var(--ok);color:var(--ok);}
.da-row.tamam .da-check{background:var(--ok);border-color:var(--ok);}
.da-ana{flex:1;min-width:0;}
.da-malzeme{font-size:13px;font-weight:600;color:var(--ink);line-height:18px;}
.da-row.tamam .da-malzeme{color:var(--ink-3);text-decoration:line-through;}
.da-alt{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:3px;font-size:11.5px;color:var(--ink-2);}
.da-alt .mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
.da-rozet{flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:5px;background:var(--surface-sunk);color:var(--ink-2);white-space:nowrap;}
.da-rozet.gecikti{background:var(--risk-soft);color:var(--risk);}
.da-rozet.bugun{background:var(--signal-soft);color:var(--signal);}

// Benzersiz kimlik: sayaç DEĞİL — sayfa yenilense de çakışmaz (eski sayaçlar
// yenilemede başa sarıp aynı kimlikten iki kayıt üretiyor, silme ikisini birden götürüyordu).
function benzersizId(on){ return on + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
// İş kodu: mevcut işlerin en büyüğünden devam eder (kayıtlı veriden türetilir, sayaç tutulmaz)
function yeniIsKodu(){
  const maks = JOBS.reduce((m, j) => {
    const n = parseInt(String(j.code || '').replace(/\D/g, ''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 2601);
  return 'AJ-' + (maks + 1);
}
// Açılışta veri onarımı: geçmişte sayaç hatasıyla oluşmuş çift kimlikleri ayırır
function veriOnar(){
  let degisti = false;
  const gorulen = new Set();
  QUOTES.forEach(q => {
    if(gorulen.has(q.id)){
      degisti = true;
      const eski = q.id;
      q.id = benzersizId('q');
      if(q.jobId){ const j = JOBS.find(x => x.id === q.jobId && x.quoteId === eski); if(j) j.quoteId = q.id; }
    }
    gorulen.add(q.id);
  });
  const g2 = new Set();
  (GENERAL_TASKS || []).forEach(t => { if(g2.has(t.id)) t.id = benzersizId('gt'); g2.add(t.id); });
  // Eski kayıtlara kimlik ekle — düzenle/sil için gerekli
  (GELIRLER  || []).forEach(x => { if(!x.id){ x.id = benzersizId('ge'); degisti = true; } });
  (GIDERLER  || []).forEach(x => { if(!x.id){ x.id = benzersizId('gi'); degisti = true; } });
  (CEK_SENET || []).forEach(x => { if(!x.id){ x.id = benzersizId('cs'); degisti = true; } });
  (PRODUCT_CATALOG || []).forEach(x => { if(!x.id){ x.id = benzersizId('pr'); degisti = true; } });
  (KASA_ACCOUNTS || []).forEach(x => { if(!x.id){ x.id = benzersizId('ka'); degisti = true; } });
  (BANK_ACCOUNTS || []).forEach(x => { if(!x.id){ x.id = benzersizId('ba'); degisti = true; } });
  (PERSONELLER || []).forEach(p => (p.hareketler || []).forEach(h => { if(!h.id){ h.id = benzersizId('hr'); degisti = true; } }));
  // Silinmiş teklife bağlı yetim işler ve sahipsiz plan blokları temizlenir
  const teklifIdleri = new Set(QUOTES.map(q => q.id));
  const isOnce = JOBS.length, planOnce = PLAN_TASKS.length;
  JOBS = JOBS.filter(j => !j.quoteId || teklifIdleri.has(j.quoteId));
  const isIdleri = new Set(JOBS.map(j => j.id));
  PLAN_TASKS = PLAN_TASKS.filter(t => !t.jobId || isIdleri.has(t.jobId));
  if(JOBS.length !== isOnce || PLAN_TASKS.length !== planOnce) degisti = true;
  return degisti;
}

function renderNav(){

    const clickHandler = p.hasSub ? `toggleSubmenu('${p.key}')` : `goTo('${p.key}')`;
    const isActiveParent = currentPage === p.key;
    let html = `
      <button class="${isActiveParent && !p.hasSub ?'active':''}" onclick="${clickHandler}">
        <span class="nav-item-icon">${p.icon}</span>
        <span class="nav-item-label">${p.label}</span>
        ${p.isNew ? '<span class="badge-new">YENİ</span>' : ''}
        ${p.hasSub ? `<span class="nav-chevron ${openSubmenu===p.key?'rot':''}">›</span>` : ''}
      </button>
    `;
    if(p.hasSub && SUBMENUS[p.key]){
      let subs = SUBMENUS[p.key];
      if(p.key==='gorev-yonetimi') subs = subs.filter(s => roleCfg().gorevSubs.includes(s.key));
      if(p.key==='yonetim') subs = subs.filter(s => (roleCfg().yonetimSubs||[]).includes(s.key));
      const activeSub = SUB_STATE[p.key].get();
      html += `<div class="subnav ${openSubmenu===p.key?'open':''}">
        ${subs.map(s => `<button class="${currentPage===p.key && activeSub===s.key?'active':''}" onclick="selectSub('${p.key}','${s.key}')">${s.label}</button>`).join('')}

  }).join('');
}

let NAV_HISTORY = [];
function snapshotNavState(){
  return { currentPage, onMuhasebeSub, raporlarSub, stokSub, gorevSub, yonetimSub };
}
function pushHistory(){
  NAV_HISTORY.push(snapshotNavState());
  if(NAV_HISTORY.length>20) NAV_HISTORY.shift();
  updateBackBtn();
}
function updateBackBtn(){
  const b = document.getElementById('backBtn');
  if(b) b.disabled = NAV_HISTORY.length===0;
}
function goBack(){
  if(NAV_HISTORY.length===0) return;
  const snap = NAV_HISTORY.pop();
  currentPage = snap.currentPage; onMuhasebeSub = snap.onMuhasebeSub; raporlarSub = snap.raporlarSub;
  stokSub = snap.stokSub; gorevSub = snap.gorevSub; yonetimSub = snap.yonetimSub;
  openSubmenu = SUBMENUS[currentPage] ? currentPage : null;
  renderNav(); renderContent(); updateBackBtn();
}

function toggleSubmenu(key){
  if(key !== currentPage) pushHistory();
  currentPage = key;
  openSubmenu = openSubmenu===key ? null : key;
  if(key==='on-muhasebe'){ cekSenetStep = 'list'; giderStep = 'list'; gelirStep = 'list'; }
  if(key!=='gorev-yonetimi' || gorevSub!=='genel-board') boardFilterStage = null;
  renderNav(); renderContent();
}
function selectSub(parentKey, subKey){
  if(!(currentPage===parentKey && SUB_STATE[parentKey].get()===subKey)) pushHistory();
  currentPage = parentKey;
  SUB_STATE[parentKey].set(subKey);
  openSubmenu = parentKey;
  if(parentKey==='on-muhasebe'){ cekSenetStep = 'list'; giderStep = 'list'; gelirStep = 'list'; personelStep = 'list'; personelSecili = null; mesaiPersonelId = null; mesaiRatesEdit = false; }
  if(parentKey==='yonetim'){ aracStep = 'list'; editingVehicleId = null; }
  if(!(parentKey==='gorev-yonetimi' && subKey==='genel-board')) boardFilterStage = null;
  if(parentKey==='gorev-yonetimi'){ gtAssigneeFilter = ''; gtSearchQuery = ''; }
  renderNav(); renderContent();
  closeMobileSidebar();
  menuDaralt(true);
}
function goTo(key){
  if(key !== currentPage) pushHistory();
  if(key === 'ana-sayfa' && currentPage !== 'ana-sayfa' && sozSirasi !== null) sozSirasi++;
  currentPage = key; kisilerStep = 'list'; editingCustomerId = null; teklifStep = 'list'; boardFilterStage = null; gtAssigneeFilter = ''; gtSearchQuery = ''; if(!SUBMENUS[key]) openSubmenu = null; renderNav(); renderContent(); closeMobileSidebar();
  menuDaralt(true);
}

function renderContent(){
  const el = document.getElementById('content');
  if(currentPage==='ana-sayfa') el.innerHTML = anaSayfaView();
  else if(currentPage==='kisiler'){
    el.innerHTML = kisilerView();
    if(kisilerStep==='form' && openAccordions.has('acc2')){ renderContactRows(); renderAddressRows(); }
  }
  else if(currentPage==='teklifler'){
    el.innerHTML = teklifView();
    if(teklifStep==='form'){ fillCustomerInfo(); renderLineItems(); }
  }
  else if(currentPage==='on-muhasebe') el.innerHTML = onMuhasebeView();
  else if(currentPage==='raporlar') el.innerHTML = raporlarView();
  else if(currentPage==='stok') el.innerHTML = stokView();
  else if(currentPage==='gorev-yonetimi') el.innerHTML = gorevYonetimiView();
  else if(currentPage==='yonetim') el.innerHTML = yonetimView();
  else if(currentPage==='destek') el.innerHTML = destekView();
  else el.innerHTML = placeholderView();
}

let planSurukleKaymaDk = 0;
let planGorunum = 'ekip';                 // 'ekip' (personel × gün) | 'saat' (zaman ızgarası)
let planDepartman = 'Üretim + Montaj';
let planSurukleKaynakKisi = null;         // ekip görünümünde hangi satırdan alındı
let planSurukleIsId = null;               // tepsiden sürüklenen iş (JOB) — blok değil
const PLAN_HAFTALIK_KAPASITE = 45 * 60;   // dakika — yüklenme çubuğunun tabanı

function planEkip(){
  const sec = planSecim();
  return PERSONELLER.filter(p => !p.arsiv && (!sec.deps || sec.deps.includes(p.departman || '')));
}
function planKisiGorevleri(kisiId, iso){
  return PLAN_TASKS.filter(t => (t.personelIds||[]).includes(kisiId) && (!iso || t.date === iso))
                   .sort((a,b) => saatToDk(a.startTime) - saatToDk(b.startTime));
}
function planKisiHaftaDk(kisiId, gunler){
  const isolar = gunler.map(planIso);
  return PLAN_TASKS.filter(t => (t.personelIds||[]).includes(kisiId) && isolar.includes(t.date))
                   .reduce((s,t) => s + (Number(t.durationMinutes)||0), 0);
}
function planKisaAd(id){
  const p = PERSONELLER.find(x => x.id === id);
  if(!p) return '?';
  const par = p.name.split(' ');
  return par[0] + (par[1] ? ' ' + par[1][0] + '.' : '');
}

function planIso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function planHaftaBasi(ofset){
  const d = new Date(); d.setHours(0,0,0,0);
  const gun = (d.getDay() + 6) % 7;                 // Pazartesi = 0
  d.setDate(d.getDate() - gun + (ofset * 7));
  return d;
}
function planHaftaGunleri(){
  const bas = planHaftaBasi(planHaftaOfset);
  return Array.from({length:7}, (_,i) => { const d = new Date(bas); d.setDate(bas.getDate()+i); return d; });
}
function dkToSaat(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  if(!s) return k + 'dk';
  return s + 's' + (k ? ' ' + k + 'dk' : '');
}
function saatToDk(hhmm){
  const p = String(hhmm||'00:00').split(':');
  return (Number(p[0])||0)*60 + (Number(p[1])||0);
}
function dkToSaatMetni(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  return String(s).padStart(2,'0') + ':' + String(k).padStart(2,'0');
}
// Renk müşteri/proje adından türetilir — aynı müşteri her yerde aynı renk, liste tutulmaz
function planRenk(ad){
  let hsh = 0; const s = String(ad || '');
  for(let i = 0; i < s.length; i++) hsh = (hsh * 31 + s.charCodeAt(i)) >>> 0;
  return PLAN_RENKLER[hsh % PLAN_RENKLER.length];
}
function planProjeRengi(t){ return planRenk(t && t.projectName !== undefined ? t.projectName : t); }
function planAktifProjeler(gunler){
  const isolar = gunler.map(planIso);
  return [...new Set(PLAN_TASKS.filter(t => isolar.includes(t.date)).map(t => t.projectName))];
}

// Aşama ↔ departman eşlemesi: tepsi hangi aşamadaki işleri, satırlar hangi departmanı gösterir
const PLAN_DEPARTMANLAR = {
  'Keşif':           { stages:['KESIF'],            deps:['Keşif'] },
  'Tasarım':         { stages:['TASARIM'],          deps:['Tasarım'] },
  'Üretim':          { stages:['URETIM'],           deps:['Üretim'] },
  'Montaj':          { stages:['MONTAJ'],           deps:['Montaj'] },
  'Üretim + Montaj': { stages:['URETIM','MONTAJ'],  deps:['Üretim','Montaj'] },
  'Tümü':            { stages:null,                 deps:null },
};
const PLAN_VARSAYILAN_SURE = 120;   // tepsiden bırakılan iş için dakika
function planYetkili(){ return CURRENT_ROLE === 'YONETICI'; }
function planSecim(){ return PLAN_DEPARTMANLAR[planDepartman] || PLAN_DEPARTMANLAR['Üretim + Montaj']; }
// İşin mevcut aşaması için planlanmış bloğu
function planBlogu(j){ return PLAN_TASKS.find(t => t.jobId === j.id && t.stage === j.stage) || null; }
function planBlogMetni(b){
  const d = new Date(b.date + 'T00:00:00');
  const kisiler = (b.personelIds||[]).map(planKisaAd).join(', ');
  return `${PLAN_GUNLER[(d.getDay()+6)%7]} ${d.getDate()} ${PLAN_AYLAR[d.getMonth()]} ${b.startTime}` + (kisiler ? ' · ' + kisiler : '');
}
// Seçili departmanın aşamasına gelmiş ama henüz plana konmamış işler
function planlanmamisIsler(){
  const sec = planSecim();
  return JOBS.filter(j => j.stage !== 'TAHSILAT' && (!sec.stages || sec.stages.includes(j.stage)) && !planBlogu(j));
}
function planBlokIsten(j, iso, startTime, kisiler){
  return { id:'t'+Date.now()+Math.floor(Math.random()*999), jobId:j.id, stage:j.stage,
    projectId:j.customerId || null, projectName:j.client, taskName:j.desc,
    date:iso, startTime:startTime || '09:00', durationMinutes:PLAN_VARSAYILAN_SURE,
    cost:j.tutar || 0, ilerleme:0, personelIds:kisiler || [] };
}

      date:g(3), startTime:'09:30', durationMinutes:180, cost:7400, ilerleme:45, personelIds:['p5','p6'] },
    { id:'t7', projectId:'c3', projectName:'Pinar Su', taskName:'Otoyol montaj — vinçli',
      date:g(4), startTime:'11:00', durationMinutes:210, cost:12500, ilerleme:0, personelIds:['p11','p13','p14'] },
    { id:'t8', projectId:'__ic', projectName:'Dekant İç İşler', taskName:'Depo sayımı',
      date:g(5), startTime:'10:00', durationMinutes:120, cost:0, ilerleme:0, personelIds:['p16'] },
    { id:'t9', projectId:'c2', projectName:'Mavi Market', taskName:'LED ve trafo montajı',
      date:g(3), startTime:'14:00', durationMinutes:150, cost:5200, ilerleme:0, personelIds:['p9'] },
    { id:'t10', projectId:'c1', projectName:'Kaya İnşaat', taskName:'Folyo kesim ve uygulama',
      date:g(1), startTime:'13:00', durationMinutes:180, cost:3600, ilerleme:20, personelIds:['p8'] },
    { id:'t11', projectId:'c3', projectName:'Pinar Su', taskName:'Sevkiyat hazırlığı',
