  letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);opacity:.7;}
.imza b{font-weight:700;color:var(--ink-2);}
.logout-link{width:100%;height:32px;background:none;border:none;color:var(--ink-3);
  font-size:12px;cursor:pointer;text-align:left;padding:0 8px;border-radius:6px;}
.logout-link:hover{background:var(--surface-sunk);color:var(--ink);}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px 10px;}
.avatar{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:11px;font-weight:700;flex-shrink:0;}
.sidebar-user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-role{font-size:10.5px;color:var(--ink-3);}
.sidebar-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;}

/* ---------- Yan Panel (Kişi Detayı) ---------- */
.drawer-overlay{position:fixed;inset:0;background:rgba(14,17,22,.35);display:none;z-index:65;}
.drawer-overlay.show{display:block;}
.side-drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);
  z-index:66;box-shadow:-8px 0 24px rgba(14,17,22,.12);transform:translateX(100%);
  transition:transform .22s ease;overflow-y:auto;padding:24px;}
.side-drawer.show{transform:translateX(0);}
.side-drawer.genis{width:calc(100vw - 540px);min-width:600px;max-width:1280px;}
.drawer-close-x{position:absolute;top:20px;right:20px;background:none;border:none;font-size:16px;
  color:var(--ink-3);cursor:pointer;width:28px;height:28px;border-radius:6px;}
.drawer-close-x:hover{background:var(--surface-sunk);color:var(--ink);}
.drawer-title{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.3px;margin:0 0 2px;padding-right:32px;}
.drawer-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:20px;}
.drawer-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
.drawer-row .k{color:var(--ink-3);}
.drawer-row .v{font-weight:600;text-align:right;}
.drawer-section-title{display:flex;align-items:center;gap:7px;font-family:var(--font-display);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);
  margin:22px 0 6px;}
.drawer-contact-row{padding:10px 0;border-bottom:1px solid var(--line);}
.drawer-contact-row .k{font-size:11.5px;color:var(--ink-3);margin-bottom:3px;}
.drawer-contact-row .v{font-size:13.5px;font-weight:600;color:var(--ink);}
.drawer-permission{font-size:11px;color:var(--ok);margin-top:3px;}
.drawer-contact-btns{display:flex;gap:8px;margin-top:8px;}
.drawer-contact-btns button{flex:1;height:32px;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;}
.drawer-contact-btns button:hover{background:var(--surface-sunk);}
.drawer-footer{display:flex;gap:8px;margin-top:24px;}
.drawer-footer button{flex:1;height:38px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);}
.drawer-footer button.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.drawer-footer button:hover{opacity:.85;}

/* ---------- Bildirim / tema ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:var(--canvas);padding:0 18px;height:40px;display:flex;align-items:center;border-radius:8px;
  font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow-md);}
.toast.show{opacity:1;}
.top-right-bar{position:fixed;bottom:24px;left:20px;display:flex;align-items:center;gap:8px;z-index:70;pointer-events:none;}
.preview-flag{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);transition:color .2s,border-color .2s;}
.preview-flag.ok{display:none;}
.preview-flag.saving{color:var(--hold);border-color:var(--hold);}
.preview-flag.err{color:var(--risk);border-color:var(--risk);}
.preview-flag.x{
  font-family:var(--font-mono);font-size:10.5px;padding:5px 10px;border-radius:6px;}
.theme-toggle{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);}
.theme-toggle:hover{border-color:var(--ink);}
.theme-toggle svg{width:15px;height:15px;fill:var(--ink-2);}
.theme-toggle:disabled{opacity:.35;cursor:default;}
.theme-toggle:disabled:hover{background:var(--surface);}

/* ---------------- ARAÇLARIM ---------------- */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid #0F172A;border-radius:5px;
  overflow:hidden;background:#FFFFFF;font-family:var(--font-mono);line-height:1;}
.plate-tr{background:#1E40AF;color:#fff;font-size:7.5px;font-weight:700;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 4px;}
.plate-no{color:#0F172A;font-size:14px;font-weight:700;letter-spacing:1.2px;padding:5px 9px;}
.plate.sm .plate-no{font-size:12px;padding:4px 7px;}
.v-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;
  font-size:11px;font-weight:600;font-family:var(--font-body);white-space:nowrap;}
.v-chip.ok{background:var(--ok-soft);color:var(--ok);}
.v-chip.soon{background:var(--hold-soft);color:var(--hold);}
.v-chip.crit{background:var(--signal-soft);color:var(--signal);}
.v-chip.late{background:var(--risk-soft);color:var(--risk);}
.v-chip.none{background:var(--surface-sunk);color:var(--ink-3);}
.v-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;
  padding:11px;box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.v-card:hover{border-color:var(--ink-3);box-shadow:var(--shadow-md);}
.v-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.v-card-name{font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.2px;}
.v-card-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.v-card-dates{display:flex;flex-wrap:wrap;gap:6px;}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px;}
.alert-strip{margin-bottom:20px;}
.alert-strip-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ink-3);margin-bottom:8px;}
.alert-row{display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line-strong);border-left-width:3px;border-radius:7px;
  padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:box-shadow .12s;}
.alert-row:hover{box-shadow:var(--shadow-md);}
.alert-row.late{border-left-color:var(--risk);}
.alert-row.crit{border-left-color:var(--signal);}
.alert-row.soon{border-left-color:var(--hold);}
.alert-row-main{flex:1;min-width:0;}
.alert-row-title{font-size:13px;font-weight:600;color:var(--ink);}
.alert-row-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
.v-detail-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px;}
.v-stat{background:var(--surface-sunk);border-radius:6px;padding:8px 11px;}
.v-stat-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);}
.v-stat-value{font-family:var(--font-mono);font-size:13.5px;font-weight:600;color:var(--ink);margin-top:2px;}
.v-stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px;margin-bottom:14px;}
@media(max-width:640px){ .v-grid{grid-template-columns:1fr;} }

/* ---------- Dış Alımlar ---------- */
.da-liste{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;margin-bottom:14px;}
.da-baslik{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--surface-sunk);
  border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);}
.da-baslik .adet{font-family:var(--font-mono);color:var(--surface);background:var(--ink-3);padding:1px 7px;border-radius:3px;font-size:10.5px;}
.da-row{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;}
.da-row:last-child{border-bottom:none;}
.da-row:hover{background:var(--surface-sunk);}
.da-check{width:21px;height:21px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--line-strong);
  border-radius:999px;background:var(--surface);color:#fff;font-size:11px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.da-check:hover{border-color:var(--ok);color:var(--ok);}
.da-row.tamam .da-check{background:var(--ok);border-color:var(--ok);}
.da-ana{flex:1;min-width:0;}
.da-malzeme{font-size:13px;font-weight:600;color:var(--ink);line-height:18px;}
.da-row.tamam .da-malzeme{color:var(--ink-3);text-decoration:line-through;}
.da-alt{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:3px;font-size:11.5px;color:var(--ink-2);}
.da-alt .mono{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);}
.da-rozet{flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:5px;background:var(--surface-sunk);color:var(--ink-2);white-space:nowrap;}
.da-rozet.gecikti{background:var(--risk-soft);color:var(--risk);}
.da-rozet.bugun{background:var(--signal-soft);color:var(--signal);}
.da-bos{padding:22px 16px;text-align:center;font-size:12px;color:var(--ink-3);}
/* Haftalık plan üstü şeridi */
.da-serit{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--hold);border-radius:8px;
  padding:8px 10px;margin-bottom:10px;}
.da-serit-baslik{font-family:var(--font-display);font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--ink-3);margin:4px 4px 0 0;white-space:nowrap;}
.da-chip{display:flex;flex-direction:column;max-width:230px;border:1px solid var(--line-strong);
  border-radius:6px;padding:4px 9px;font-size:11px;line-height:14px;cursor:pointer;background:var(--surface);}
.da-chip:hover{border-color:var(--ink);}
.da-chip b{font-family:var(--font-display);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.da-chip i{font-style:normal;font-size:10px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.da-chip u{text-decoration:none;font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);}
.da-chip.gecikti{border-color:var(--risk);background:var(--risk-soft);}

/* ---------- Bildirimler (sağ üst çan) ---------- */
.brand-tools{display:flex;align-items:center;gap:2px;}
.brand-btn{position:relative;width:27px;height:27px;border-radius:6px;border:none;background:none;
  font-size:13px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:0;}
.brand-btn:hover{background:var(--surface-sunk);color:var(--ink);}
.brand-btn svg{width:14px;height:14px;fill:var(--ink-2);}
#bildirimWrap{position:fixed;top:50px;left:10px;z-index:72;font-family:var(--font-body);}
.bildirim-rozet{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--risk);color:#fff;font-family:var(--font-mono);
  font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.bildirim-rozet:empty{display:none;}
.bildirim-panel{display:none;width:356px;max-height:460px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;
  box-shadow:var(--shadow-md);overflow:hidden;flex-direction:column;}
#bildirimWrap.open .bildirim-panel{display:flex;}
.bildirim-head{display:flex;align-items:center;justify-content:space-between;height:38px;flex-shrink:0;
  padding:0 13px;background:var(--ink);color:var(--surface);
  font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.4px;}
.bildirim-head button{border:none;background:none;color:var(--surface);opacity:.75;font-size:11px;
  cursor:pointer;text-decoration:underline;font-family:inherit;}
.bildirim-head button:hover{opacity:1;}
.bildirim-liste{overflow-y:auto;}
.bildirim-satir{display:flex;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);align-items:flex-start;}
.bildirim-satir:last-child{border-bottom:none;}
.bildirim-satir.yeni{background:var(--signal-soft);}
.bildirim-ikon{flex:0 0 20px;font-size:15px;margin-top:1px;}
.bildirim-metin{flex:1;min-width:0;font-size:12.5px;line-height:17px;color:var(--ink);}
.bildirim-zaman{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);margin-top:3px;}
.bildirim-aksiyon{display:flex;gap:7px;margin-top:7px;}
.bildirim-aksiyon button{height:26px;padding:0 11px;border-radius:6px;font-size:11.5px;font-weight:600;
  cursor:pointer;font-family:inherit;}
.bildirim-aksiyon .onay{background:var(--risk);color:#fff;border:none;}
.bildirim-aksiyon .red{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-strong);}
.bildirim-sonuc{margin-top:6px;font-size:11px;font-weight:600;color:var(--ink-3);}
.bildirim-bos{padding:26px 16px;text-align:center;font-size:12px;color:var(--ink-3);}
@media(max-width:760px){ #bildirimWrap{top:56px;left:12px;} .bildirim-panel{width:calc(100vw - 24px);max-width:356px;} }

/* ---------- Not Defteri (sağ alt) ---------- */
#notWrap{position:fixed;bottom:0;right:24px;z-index:55;font-family:var(--font-body);}
.not-tab{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;
  background:var(--ink);color:var(--surface);border:none;border-radius:8px 8px 0 0;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 -2px 10px rgba(15,23,42,.18);}
.not-tab:hover{opacity:.92;}
.not-sayi{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--signal);
  color:#fff;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;}
.not-sayi:empty{display:none;}
.not-panel{display:none;width:328px;height:452px;background:var(--surface);
  border:1px solid var(--line-strong);border-bottom:none;border-radius:10px 10px 0 0;
  box-shadow:var(--shadow-md);flex-direction:column;overflow:hidden;}
#notWrap.open .not-panel{display:flex;}
#notWrap.open .not-tab{display:none;}
.not-head{display:flex;align-items:center;justify-content:space-between;height:38px;
  padding:0 8px 0 13px;background:var(--ink);color:var(--surface);flex-shrink:0;}
.not-head b{font-family:var(--font-display);font-size:12.5px;font-weight:700;letter-spacing:.3px;}
.not-head-kucult{width:26px;height:26px;border:none;border-radius:6px;background:transparent;
  color:var(--surface);font-size:14px;cursor:pointer;line-height:1;}
.not-head-kucult:hover{background:rgba(255,255,255,.15);}
.not-giris{display:flex;gap:7px;padding:10px 11px;border-bottom:1px solid var(--line);flex-shrink:0;}
.not-giris textarea{flex:1;resize:none;height:52px;padding:7px 9px;border:1px solid var(--line-strong);
  border-radius:6px;background:var(--surface);color:var(--ink);font-size:12.5px;line-height:17px;font-family:inherit;}
.not-giris textarea:focus{outline:none;border-color:var(--ink);}
.not-giris textarea::placeholder{color:var(--ink-3);}
.not-ekle{width:36px;border:none;border-radius:6px;background:var(--ink);color:var(--surface);
  font-size:17px;font-weight:600;cursor:pointer;flex-shrink:0;}
.not-ekle:hover{opacity:.85;}
.not-liste{flex:1;overflow-y:auto;padding:6px 0;}
.not-satir{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-bottom:1px solid var(--line);}
.not-satir:hover{background:var(--surface-sunk);}
.not-check{width:20px;height:20px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--line-strong);
  border-radius:999px;background:var(--surface);color:#fff;font-size:11px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.not-check:hover{border-color:var(--ok);color:var(--ok);}
.not-satir.tamam .not-check{background:var(--ok);border-color:var(--ok);}
.not-metin{flex:1;min-width:0;font-size:12.5px;line-height:17px;color:var(--ink);
  white-space:pre-wrap;word-wrap:break-word;cursor:text;}
.not-satir.tamam .not-metin{color:var(--ink-3);text-decoration:line-through;}
.not-zaman{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-3);margin-top:3px;text-decoration:none;}
.not-sil{width:22px;height:22px;flex-shrink:0;border:none;border-radius:5px;background:none;
  color:var(--ink-3);font-size:11px;cursor:pointer;opacity:0;padding:0;}
.not-satir:hover .not-sil{opacity:1;}
.not-sil:hover{background:var(--risk-soft);color:var(--risk);}
.not-bolum{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 5px;
  font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;color:var(--ink-3);}
.not-bolum button{border:none;background:none;color:var(--ink-3);font-size:10.5px;cursor:pointer;
  text-decoration:underline;font-family:inherit;padding:0;}
.not-bolum button:hover{color:var(--risk);}
.not-bos{padding:26px 16px;text-align:center;font-size:12px;color:var(--ink-3);line-height:18px;}
.not-duzenle-alani{flex:1;resize:none;padding:6px 8px;border:1px solid var(--ink);border-radius:6px;
  background:var(--surface);color:var(--ink);font-size:12.5px;line-height:17px;font-family:inherit;}
.not-duzenle-alani:focus{outline:none;}
@media(max-width:760px){
  #notWrap{right:12px;}
  .not-panel{width:calc(100vw - 24px);max-width:360px;height:60vh;}
}

/* ============================================================
   TASARIM KATMANI — Aşama 1: ORTAK UYGULAMA KABUĞU
   (Referans: ROTA-TASARIM-CALISAN-REFERANS.html / gorsel-referanslar)
   Sınıf/id adları ve olaylar korunur; buradaki kurallar kaynak sırası
   gereği yukarıdaki eski kuralları ezer.
   ============================================================ */

/* --- Gövde tipografisi ve sayfa başlığı --- */
html,body{font-family:var(--font-family-base);font-size:var(--font-size-body);line-height:1.45;}
.page-title{font-family:var(--font-display);font-size:27px;line-height:34px;font-weight:800;
  letter-spacing:-.7px;color:var(--ink);}
.page-sub{font-size:13.5px;line-height:20px;color:var(--ink-2);margin-top:6px;}
.page-head,.list-page-head{margin-bottom:22px;}
.gunun-sozu{font-family:var(--font-family-base);color:var(--ink);}

/* --- Kabuk: sidebar + ana sütun (üst çubuk + içerik) --- */
.shell{display:flex;min-height:100vh;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;
  align-items:center;padding:0 30px;position:sticky;top:0;z-index:60;gap:12px;}
.crumb{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;min-width:0;}
.crumb i{color:var(--line-strong);font-style:normal;}
.crumb strong{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb strong i{color:var(--line-strong);font-style:normal;margin:0 6px;font-weight:400;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px;}
.icon-btn{position:relative;width:38px;height:38px;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink-2);}
.icon-btn:hover{border-color:var(--line-strong);background:var(--surface-muted);color:var(--ink);}
.icon-btn svg{width:16px;height:16px;fill:var(--ink-2);}
.icon-btn svg.ico-stroke{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;}
.icon-btn:hover svg{fill:var(--ink);} .icon-btn:hover svg.ico-stroke{fill:none;stroke:var(--ink);}
.icon-btn .bildirim-rozet{top:-5px;right:-5px;border:2px solid var(--surface);}
.content{flex:1;padding:26px 30px 60px;max-width:1600px;width:100%;}
/* Prototipte önizleme rozeti üst çubukla çakışmasın (canlıda zaten sol alttadır) */
.top-right-bar{top:auto;bottom:24px;left:20px;right:auto;}
/* Bildirim paneli çanın (üst sağ) altında açılır */
#bildirimWrap{top:62px;left:auto;right:24px;}

/* --- Sol menü: koyu lacivert --- */
.sidebar{width:var(--sidebar-w);background:var(--navy-950);border-right:1px solid var(--navy-line);
  padding:22px 16px 16px;color:#D8DFEB;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;}
.brand{padding:0 8px 4px;min-height:45px;}
.brand-left{color:#FFFFFF;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.5px;}
.brand-logo{width:33px;height:33px;border-radius:9px;background:var(--signal);color:#FFFFFF;
  font-family:var(--font-display);font-weight:800;font-size:18px;}
.brand-tools{gap:4px;}
.brand-btn{width:28px;height:28px;border-radius:7px;color:var(--navy-muted);}
.brand-btn:hover{background:var(--navy-hover);color:#FFFFFF;}

.firma-karti{margin:14px 0 6px;padding:11px;background:#152642;border:1px solid #263955;border-radius:12px;
  display:flex;align-items:center;gap:9px;min-width:0;}
.firma-avatar{width:32px;height:32px;border-radius:8px;background:#314565;color:#FFFFFF;display:flex;align-items:center;
  justify-content:center;font-family:var(--font-display);font-weight:700;font-size:11px;flex-shrink:0;}
.firma-metin{min-width:0;display:flex;flex-direction:column;}
.firma-metin strong{font-size:12px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.firma-metin small{font-size:10px;color:var(--navy-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.nav{gap:2px;margin-top:4px;}
.nav-label{margin:14px 10px 5px;font-size:10px;letter-spacing:1.3px;color:#71809A;font-weight:700;font-family:var(--font-display);}
.nav-label:first-child{margin-top:10px;}
.nav button{height:38px;padding:0 10px;gap:11px;border-radius:9px;font-family:var(--font-family-base);
  font-size:13px;font-weight:500;color:var(--navy-text);}
.nav button:hover{background:var(--navy-hover);color:#FFFFFF;}
.nav button.active{background:var(--navy-800);color:#FFFFFF;font-weight:600;}
.nav button.active::before{left:-16px;top:50%;bottom:auto;height:21px;width:3px;
  transform:translateY(-50%);background:var(--signal);border-radius:0 3px 3px 0;}
.nav-item-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;opacity:1;filter:none;font-size:15px;}
.nav-item-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nav-chevron{color:#667792;font-size:11px;}
.badge-new{background:#2C405F;color:#FFFFFF;border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;}

.subnav{padding-left:31px;margin:2px 0 4px;gap:1px;}
.subnav button{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--navy-muted);}
.subnav button:hover{background:var(--navy-hover);color:#FFFFFF;}
.subnav button.active{background:var(--navy-hover);color:#FFFFFF;font-weight:600;}

.sidebar-foot{margin-top:auto;border-top:1px solid var(--navy-line);padding-top:15px;}
.sidebar-user{padding:5px;gap:9px;}
.avatar{width:34px;height:34px;border-radius:50%;background:#354967;color:#FFFFFF;font-size:11px;}
.sidebar-user-name{color:#FFFFFF;font-size:12px;font-weight:700;}
.sidebar-user-role{color:#8292AA;font-size:10.5px;margin-top:2px;}
.logout-link{color:#8897AD;font-size:12px;border-radius:8px;height:34px;}
.logout-link:hover{background:var(--navy-hover);color:#FFFFFF;}

/* Daraltılmış menü (masaüstü) — lacivert ikon şeridi, fareyle açılır */
@media (min-width:881px){
  .shell.menu-dar .sidebar:not(:hover){width:64px;padding:18px 10px 14px;}
  .shell.menu-dar .sidebar:not(:hover) .firma-karti{padding:8px 0;justify-content:center;border-color:transparent;background:transparent;}
  .shell.menu-dar .sidebar:not(:hover) .firma-metin{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .nav-label{display:none;}
  .shell.menu-dar .sidebar:not(:hover) .nav button{height:40px;border-radius:9px;}
  .shell.menu-dar .sidebar:not(:hover) .nav button.active::before{left:-10px;}
  .shell.menu-dar .sidebar:not(:hover) .nav-item-icon svg{width:20px;height:20px;}
}

/* Mobil: hamburger çubuğu + kayan lacivert menü; üst çubuk sadeleşir */
@media (max-width:880px){
  /* Eski hata düzeltmesi: hamburger çubuğu içerikle yan yana sıkışıyordu; kabuk mobilde dikey akar */
  .shell{flex-direction:column;}
  .mobile-topbar{width:100%;}
  .main-col{width:100%;}
  .sidebar{width:248px;padding:22px 16px 16px;height:auto;position:fixed;}
  .mobile-topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;}
  .mobile-topbar .brand-left{color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:18px;}
  .hamburger-btn{border:1px solid var(--line);border-radius:9px;width:38px;height:38px;}
  .sidebar-backdrop{background:rgba(8,17,31,.5);}
  .topbar{height:48px;padding:0 16px;top:0;}
  .content{padding:18px 16px 60px;}
  #bildirimWrap{top:110px;right:12px;left:auto;}
}
@media print{ .topbar{display:none !important;} }

   TASARIM KATMANI — Aşama 2: ORTAK BİLEŞEN SİSTEMİ

.login-tam-logo{height:46px;width:auto;display:block;}
.login-brand{margin-bottom:6px;}
/* --- Üst çubuk 68px + Hızlı Oluştur --- */
.topbar{height:68px;}
.primary{height:38px;border:0;border-radius:9px;background:var(--signal);color:#fff;padding:0 15px;font-weight:700;
  cursor:pointer;font-family:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.primary:hover{background:#EA6A0E;}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 12px;color:var(--ink-2);
  font-weight:600;cursor:pointer;font-family:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.ghost:hover{border-color:var(--line-strong);background:var(--surface-muted);color:var(--ink);}

/* --- Eski buton sınıfları yeni dile --- */
.primary-btn,.save-btn,.btn-complete,.modal-submit,.btn-approve,.tk-btn.go{background:var(--signal);color:#fff;border:0;border-radius:9px;font-weight:700;font-family:inherit;}
.primary-btn,.save-btn{height:36px;padding:0 15px;font-size:13px;}
.primary-btn:hover,.save-btn:hover,.btn-complete:hover,.modal-submit:hover,.btn-approve:hover{opacity:1;background:#EA6A0E;}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:12.5px;font-family:inherit;}
.btn:hover{background:var(--surface-muted);border-color:var(--line-strong);color:var(--ink);}
.back-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);}
.tk-btn.clear{border-radius:8px;}
.add-task-btn,.add-line-btn{height:38px;border:0;background:var(--surface-sunk);color:var(--ink-2);border-radius:9px;font-weight:600;font-size:12.5px;}
.add-task-btn:hover,.add-line-btn:hover{background:var(--line-strong);color:var(--ink);}
.collapse-link,.sub-add-link{text-decoration:none;color:var(--signal);font-weight:700;}
.collapse-link:hover,.sub-add-link:hover{color:#C2410C;}

/* --- Sayfa başlığı --- */
.eyebrow{margin:0 0 6px;color:var(--signal);font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;}
.page-head,.list-page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
.page-head .action-row,.list-page-head .action-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.date-chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--ink-2);font-size:13px;white-space:nowrap;}
.date-chip strong{color:var(--ink);margin-left:5px;}

/* --- Metrik kartları --- */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:17px 18px;min-height:112px;box-shadow:0 2px 6px rgba(11,24,48,.02);min-width:0;}
.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:12px;font-weight:600;gap:8px;}
.metric-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-sunk);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0;font-size:13px;}
.metric-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.metric-icon.orange{background:var(--signal-soft);color:var(--signal);} .metric-icon.green{background:var(--ok-soft);color:var(--ok);}
.metric-icon.red{background:var(--risk-soft);color:var(--risk);} .metric-icon.blue{background:var(--info-soft);color:var(--info);}
.metric strong{display:block;font-family:var(--font-display);font-size:25px;font-weight:800;color:var(--ink);margin:7px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.metric small{color:var(--ink-3);font-size:12px;display:block;}
.metric small.trend{color:var(--ok);font-weight:700;} .metric small.risk{color:var(--risk);font-weight:700;}
.metric.clickable{cursor:pointer;} .metric.clickable:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.metric-grid.compact .metric{min-height:98px;}
/* Eski KPI sınıfları aynı dile */
.rap-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px;}
.rap-kpi-kutu{border-radius:var(--radius-card);padding:17px 18px;min-height:96px;box-shadow:0 2px 6px rgba(11,24,48,.02);}
.rap-kpi-kutu span{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-2);}
.rap-kpi-kutu b{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.4px;margin-top:6px;}
.ch-kpi{gap:14px;margin-bottom:16px;}
.ch-kart{border-radius:var(--radius-card);padding:17px 18px;min-height:98px;box-shadow:0 2px 6px rgba(11,24,48,.02);}
.ch-kart h4{font-size:12px;color:var(--ink-2);margin-bottom:6px;}
.ch-kart .deger{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.4px;}
.ch-kart.vurgu{border-color:var(--line);box-shadow:0 2px 6px rgba(11,24,48,.02);}

/* --- Paneller ve kartlar --- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:0 2px 8px rgba(11,24,48,.025);overflow:hidden;min-width:0;}
.panel-head{min-height:57px;padding:0 17px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
.panel-head h3{font-family:var(--font-display);font-weight:700;font-size:14px;margin:0;color:var(--ink);}
.panel-head p{margin:3px 0 0;color:var(--ink-2);font-size:11.5px;}
.panel-head .ghost,.panel-head .panel-right{margin-left:auto;}
.panel-body{padding:16px 17px;}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);gap:16px;align-items:start;}
.two-col{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;align-items:start;}
.card{border-radius:var(--radius-card);border-color:var(--line);padding:16px;box-shadow:0 2px 6px rgba(11,24,48,.02);}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm);}
.ledger-main,.ledger-side,.cari-tablo-kap,.rap-tablo,.kb-main,.kb-side,.form-block,.chart-box,.tk-list,.tk-side{border-radius:var(--radius-card);border-color:var(--line);box-shadow:0 2px 8px rgba(11,24,48,.025);}
.form-block{padding:18px;}
.group-header{padding:0 17px;min-height:48px;display:flex;align-items:center;background:var(--surface);font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);}
.group-header span:last-child{color:var(--ink-2);font-weight:500;font-size:11.5px;font-family:var(--font-family-base);}
.ledger-row{padding:13px 17px;}
.ledger-footer{padding:14px 17px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);}
.ledger-search{border-radius:9px;}
.note{border-radius:10px;border-left-width:3px;border-left-color:var(--signal);}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-2);}

/* --- Tablolar --- */
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;box-shadow:0 2px 8px rgba(11,24,48,.025);}
.table-card.scroll{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;background:transparent;border:0;border-radius:0;}
.data-table th{height:42px;background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;text-transform:uppercase;text-align:left;padding:0 16px;border-bottom:1px solid var(--line);font-family:var(--font-family-base);font-weight:700;}
.data-table td{padding:13px 16px;border-top:1px solid var(--line);border-bottom:0;font-size:12.5px;height:auto;color:var(--ink);vertical-align:middle;}
.data-table tbody tr:first-child td{border-top:0;}
.data-table td strong{font-size:13px;font-weight:700;}
.data-table td small{display:block;color:var(--ink-2);margin-top:4px;font-size:11.5px;}
.data-table .sag,.data-table .money{text-align:right;}
.data-table tbody tr:hover{background:var(--surface-muted);}
.data-table tr.clickable{cursor:pointer;}
.money{font-family:var(--font-display);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.money.trend,.money.pos{color:var(--ok);} .money.risk,.money.neg{color:var(--risk);}
.table-summary{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12.5px;}
.table-summary strong{color:var(--ink);font-family:var(--font-display);}
/* Eski tablo dili */
table{border-radius:var(--radius-card);border-color:var(--line);}
th{height:42px;background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;padding:0 16px;border-bottom:1px solid var(--line);font-family:var(--font-family-base);}
td{padding:0 16px;height:44px;font-size:12.5px;}
tbody tr:hover{background:var(--surface-muted);}
.ch-tablo th{height:42px;background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;text-transform:uppercase;padding:0 16px;font-weight:700;}
.ch-tablo td{padding:12px 16px;}
.ch-tablo .ch-sag{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;}
.rap-baslik{background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;padding:12px 16px;}
.rap-cari.rap-duz,.rap-cari>summary{padding:12px 16px;}
.kb-row.header{background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;height:42px;}
.kb-row{height:46px;font-size:13px;}
.kb-row.total{font-family:var(--font-display);font-weight:700;background:var(--surface-muted);}

/* --- Rozetler --- */
.tag,.chip,.status-pill,.pay-tag,.ch-rozet,.ch-durum,.stage-badge,.gt-pill{display:inline-flex;align-items:center;border-radius:99px;padding:0 9px;height:22px;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;}
.tag.orange,.tag.turuncu{background:var(--signal-soft);color:var(--signal-ink);} .tag.red,.tag.kirmizi{background:var(--risk-soft);color:var(--risk);}
.tag.green,.tag.yesil{background:var(--ok-soft);color:var(--ok);} .tag.blue,.tag.mavi{background:var(--info-soft);color:var(--info);}
.tag.gray,.tag.gri{background:var(--surface-sunk);color:var(--ink-2);} .tag.amber,.tag.sari{background:var(--hold-soft);color:var(--hold);}
.st-taslak,.status-Taslak{background:var(--surface-sunk);color:var(--ink-2);} .st-gonderildi,.status-Gönderildi{background:var(--signal-soft);color:var(--signal-ink);}
.st-kabul-edildi,.st-faturalandi,.status-Onaylandı{background:var(--ok-soft);color:var(--ok);} .st-reddedildi{background:var(--risk-soft);color:var(--risk);}
.movement{font-weight:700;font-size:11px;} .movement.debit{color:var(--red);} .movement.credit{color:var(--green);}

/* --- Araç çubuğu / filtreler / formlar --- */
.toolbar{display:flex;gap:9px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.tb-field,.tb-filter{height:39px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 12px;color:var(--ink-2);font-family:inherit;font-size:13px;}
.tb-field{min-width:260px;flex:1;color:var(--ink);} .tb-field::placeholder{color:var(--ink-3);}
.tb-filter{cursor:pointer;font-weight:600;} select.tb-filter{appearance:auto;}
.tb-filter:hover{border-color:var(--line-strong);}
.segmented{display:flex;background:var(--surface-sunk);border-radius:9px;padding:3px;margin-left:auto;}
.segmented button{border:0;background:transparent;border-radius:7px;padding:0 12px;height:31px;color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.segmented button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.toggle-row{display:inline-flex;background:var(--surface-sunk);border-radius:9px;padding:3px;gap:0;}
.toggle-row button{border:0;background:transparent;border-radius:7px;padding:0 12px;height:31px;color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.toggle-row button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.tk-search,.cari-ara-kutu,.ledger-search,.rap-arac .cari-ara-kutu{height:39px;border-radius:9px;border:1px solid var(--line);background:var(--surface);}
.ch-filtre select,.ch-filtre input[type=date],.ch-sira-sec,.rap-tarih,.filter-bar select,.filter-bar input{height:39px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-family:inherit;font-size:13px;color:var(--ink-2);font-weight:600;}
.field label,.form-main-field label,.form-grid label{font-size:11px;font-weight:700;color:var(--ink-2);}
.field input,.field select,.field textarea,.form-main-field input,.repeat-row input,.repeat-row select{border:1px solid var(--line);border-radius:8px;padding:10px 11px;height:auto;min-height:38px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus,.form-main-field input:focus,.tb-field:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft);outline:none;}
.form-section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;box-shadow:0 2px 8px rgba(11,24,48,.025);}
.section-title{display:flex;align-items:flex-start;gap:11px;margin-bottom:16px;}
.section-title>span{width:30px;height:30px;border-radius:8px;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:12px;flex-shrink:0;}
.section-title h3,.section-title p{margin:0;} .section-title h3{font-family:var(--font-display);font-weight:700;font-size:14px;}
.section-title p{font-size:11.5px;color:var(--ink-2);margin-top:4px;} .section-title .sag-eylem{margin-left:auto;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .form-grid .span-2{grid-column:span 2;} .form-grid .field{margin:0;}
.builder-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.builder-head h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.5px;}
.builder-head .eyebrow{margin:0;} .save-state{margin-left:auto;color:var(--ink-2);font-size:11.5px;}
.builder-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start;}
.builder-main{display:grid;gap:14px;min-width:0;}
.quote-summary{position:sticky;top:88px;background:var(--navy-950);color:#fff;border-radius:15px;padding:20px;}
.quote-summary>p{font-size:10px;letter-spacing:1.3px;color:var(--navy-muted);font-weight:700;margin:0 0 16px;font-family:var(--font-display);}
.quote-summary .tf-totals{display:block;align-items:stretch;gap:0;font-size:13px;color:#B6C1D1;padding:0;border:0;margin:0;}
.quote-summary .tf-totals>div{display:flex;justify-content:space-between;gap:10px;margin:12px 0;}
.quote-summary .tf-totals>div strong{color:#fff;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;}
.quote-summary .tf-totals>div.grand{display:block;border-top:1px solid #31425E;padding-top:16px;margin-top:16px;}
.quote-summary .tf-totals>div.grand span{display:block;font-size:10px;letter-spacing:1.3px;color:var(--navy-muted);font-weight:700;}
.quote-summary .tf-totals>div.grand strong{display:block;font-size:25px;font-weight:800;margin-top:6px;}
.quote-summary .full{width:100%;margin-top:18px;justify-content:center;}
.quote-summary .qs-bilgi{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#B6C1D1;margin:10px 0;}
.quote-summary .qs-bilgi b{color:#fff;font-weight:600;text-align:right;}
.quote-summary hr{border:0;border-top:1px solid #31425E;margin:16px 0;}
.tf-table-head{background:var(--surface-muted);color:var(--ink-3);font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;border-radius:8px;padding:10px 8px;}

/* --- Koyu bantlar --- */
.attention{margin-top:16px;background:#121F35;color:#fff;border-radius:var(--radius-card);padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.attention>span{width:38px;height:38px;background:#21314B;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#FFB37D;font-weight:800;flex-shrink:0;}
.attention h4{margin:0 0 4px;font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;}
.attention p{margin:0;color:#AAB6C7;font-size:11.5px;}
.attention .primary,.attention button.beyaz{margin-left:auto;background:#fff;color:#142036;border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;font-family:inherit;height:auto;}
.account-hero{background:var(--navy-950);color:#fff;border-radius:16px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
.account-id{display:flex;align-items:center;gap:14px;min-width:0;}
.account-id>span{width:48px;height:48px;border-radius:13px;background:#263A5A;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;flex-shrink:0;}
.account-id p,.account-id h2,.account-id small{margin:0;}
.account-id p{font-size:10px;letter-spacing:1.3px;color:var(--navy-muted);font-weight:700;font-family:var(--font-display);}
.account-id h2{font-family:var(--font-display);font-weight:800;font-size:20px;margin:3px 0;color:#fff;}
.account-id small{color:#AAB6C7;font-size:12px;}
.balance-block{text-align:right;} .balance-block small,.balance-block strong,.balance-block span{display:block;}
.balance-block small{font-size:10px;letter-spacing:1.3px;color:var(--navy-muted);font-weight:700;font-family:var(--font-display);}
.balance-block strong{font-family:var(--font-display);font-weight:800;font-size:24px;margin:4px 0;color:#fff;font-variant-numeric:tabular-nums;}
.balance-block span{font-size:11px;color:#83D6B8;} .balance-block span.risk{color:#FCA5A5;}

/* --- Liste blokları (öncelik, hareket, finans) --- */
.task-list{padding:4px 16px 8px;}
.task-row{display:grid;grid-template-columns:36px 1fr auto;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.task-row:last-child{border:0;} .task-row:hover strong{color:var(--signal);}
.task-check{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ok);}
.task-check.done{background:var(--ok-soft);border-color:var(--ok);}
.task-row strong{display:block;font-size:13px;} .task-row small{display:block;color:var(--ink-2);margin-top:4px;font-size:11.5px;}
.activity{padding:9px 17px 14px;}
.activity-item{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.activity-item:last-child{border:0;}
.activity-item>span{width:30px;height:30px;background:var(--surface-sunk);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-2);}
.activity-item p{margin:1px 0 3px;font-size:12px;line-height:1.35;} .activity-item small{color:var(--ink-3);font-size:10.5px;}
.finance-list{padding:8px 16px;}
.finance-row{display:flex;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px;}
.finance-row:last-child{border:0;}
.finance-row>span:first-child{width:36px;height:36px;border-radius:9px;background:var(--surface-sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:12px;color:var(--ink-2);}
.finance-row strong,.finance-row small{display:block;} .finance-row strong{font-size:13px;} .finance-row small{color:var(--ink-2);margin-top:3px;font-size:11.5px;}
.finance-row .money{margin-left:auto;}
.finance-row .fr-metin{min-width:0;flex:1;}

/* --- Grafik (saf CSS çubuklar) --- */
.chart-wrap{padding:22px;}
.chart{height:240px;display:flex;align-items:flex-end;gap:18px;border-bottom:1px solid var(--line);padding:0 12px;}
.bar-group{height:100%;flex:1;display:flex;align-items:flex-end;gap:5px;position:relative;}
.bar{flex:1;border-radius:5px 5px 0 0;background:var(--line-strong);min-height:2px;}
.kbr-chart .chart{height:180px;justify-content:flex-start;gap:22px;} .kbr-chart .bar-group{flex:0 1 96px;max-width:96px;}
.bar.orange{background:var(--signal);} .bar.green{background:var(--ok);} .bar.red{background:var(--risk);} .bar.navy{background:var(--navy-950);}
.bar-label{position:absolute;bottom:-25px;width:100%;text-align:center;font-size:10px;color:var(--ink-2);}
.chart-legend{display:flex;gap:16px;margin-left:auto;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;}
.chart-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.chart-legend-wrap{padding:0 22px 30px;}

/* --- Kanban --- */
.board{gap:13px;}
.board-col,.gt-col{background:var(--surface-sunk);border:0;border-radius:12px;padding:10px;min-height:420px;}
.board-col-head{padding:3px 3px 11px;}
.board-col-title,.gt-col-title{font-family:var(--font-family-base);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);}
.board-col-count{background:var(--surface);color:var(--ink);border-radius:10px;padding:2px 7px;font-family:var(--font-family-base);font-size:11px;}
.kcard,.gt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:9px;box-shadow:0 2px 5px rgba(13,27,48,.04);}
.kcard:hover,.gt-card:hover{border-color:var(--line-strong);box-shadow:0 4px 10px rgba(13,27,48,.06);}
.kcard .code{font-family:var(--font-family-base);font-size:10px;color:var(--ink-3);font-weight:600;margin-bottom:7px;letter-spacing:.3px;}
.kcard .client{font-size:12.5px;font-weight:700;line-height:1.4;}
.kcard .desc{font-size:11.5px;color:var(--ink-2);}
.mini-avatar{width:24px;height:24px;background:var(--surface-sunk);color:var(--ink-2);font-size:9px;font-weight:700;border:2px solid #fff;font-family:var(--font-family-base);}
.due{font-family:var(--font-family-base);font-size:10.5px;color:var(--ink-3);}
.pano-liste .data-table td{font-size:12.5px;}

/* --- Gelir & Giderler raporu --- */
.gg-net{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:12px;padding:14px 17px;margin-bottom:14px;flex-wrap:wrap;}
.gg-net.pozitif{border-left-color:var(--ok);} .gg-net.negatif{border-left-color:var(--risk);}
.gg-net-ikon{width:38px;height:38px;border-radius:10px;background:var(--surface-sunk);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display);flex-shrink:0;}
.gg-net.pozitif .gg-net-ikon{background:var(--ok-soft);color:var(--ok);} .gg-net.negatif .gg-net-ikon{background:var(--risk-soft);color:var(--risk);}
.gg-net-metin{min-width:0;} .gg-net-metin strong,.gg-net-metin small{display:block;} .gg-net-metin strong{font-size:13.5px;} .gg-net-metin small{color:var(--ink-2);font-size:11.5px;margin-top:3px;}
.gg-net-deger{margin-left:auto;text-align:right;} .gg-net-deger span{display:block;font-size:10px;letter-spacing:1.3px;color:var(--ink-3);font-weight:700;font-family:var(--font-display);}
.gg-net-deger strong{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--ink);}
.gg-net.pozitif .gg-net-deger strong{color:var(--ok);} .gg-net.negatif .gg-net-deger strong{color:var(--risk);}
.gg-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;}
.gg-toplam{margin-left:auto;text-align:right;} .gg-toplam span{display:block;font-size:10px;letter-spacing:1.2px;color:var(--ink-3);font-weight:700;font-family:var(--font-display);}
.gg-toplam strong{display:block;font-family:var(--font-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;} .gg-toplam.gelir strong{color:var(--ok);} .gg-toplam.gider strong{color:var(--risk);}

// yenilemede başa sarıp aynı kimlikten iki kayıt üretiyor, silme ikisini birden götürüyordu).
function benzersizId(on){ return on + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
// İş kodu: mevcut işlerin en büyüğünden devam eder (kayıtlı veriden türetilir, sayaç tutulmaz)
function yeniIsKodu(){
  const maks = JOBS.reduce((m, j) => {
    const n = parseInt(String(j.code || '').replace(/\D/g, ''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 2601);
  return 'AJ-' + (maks + 1);
}
// Açılışta veri onarımı: geçmişte sayaç hatasıyla oluşmuş çift kimlikleri ayırır
function veriOnar(){
  let degisti = false;
  if(Array.isArray(KATEGORILER) && !KATEGORILER.some(k => k.tip === 'gider' && String(k.ad).toLowerCase() === 'kartlı alışveriş')){
    KATEGORILER.push({ id: benzersizId('kd'), ad:'Kartlı Alışveriş', tip:'gider', sistem:true }); degisti = true;
  }
  const gorulen = new Set();
  QUOTES.forEach(q => {
    if(gorulen.has(q.id)){
      degisti = true;
      const eski = q.id;
      q.id = benzersizId('q');
      if(q.jobId){ const j = JOBS.find(x => x.id === q.jobId && x.quoteId === eski); if(j) j.quoteId = q.id; }
    }
    gorulen.add(q.id);
  });
  const g2 = new Set();
  (GENERAL_TASKS || []).forEach(t => { if(g2.has(t.id)) t.id = benzersizId('gt'); g2.add(t.id); });
  // Eski gelir kayıtlarına isimden müşteri kimliği eşlenir (cari hareketleri için)
  (GELIRLER || []).forEach(g => {
    if(g.customerId || !g.client) return;
    const c = CUSTOMERS.find(x => x.name.toLowerCase() === String(g.client).toLowerCase());
    if(c){ g.customerId = c.id; degisti = true; }
  });
  // Teklif geçerliliği yanlışlıkla teslim tarihi olarak kopyalanmış işler temizlenir
  (JOBS || []).forEach(j => {
    if(!j.quoteId || !j.due) return;
    const q = QUOTES.find(x => x.id === j.quoteId);
    if(q && q.gecerlilik && j.due === formatDate(q.gecerlilik)){
      const e = j.isEmri;
      j.due = (e && e.teslimTarihi) ? formatDate(e.teslimTarihi) : '';
      degisti = true;
    }
  });
  // Teklife müşteri adı notu: cari silinse bile teklifte ad görünsün
  (QUOTES || []).forEach(q => {
    if(!q.musteriAdi){
      const c = CUSTOMERS.find(x => x.id === q.customerId);
      const j = q.jobId ? JOBS.find(x => x.id === q.jobId) : null;
      const ad = (c && c.name) || (j && j.client && j.client !== 'Müşteri seçilmedi' ? j.client : '');
      if(ad){ q.musteriAdi = ad; degisti = true; }
    }
  });
  // Eski kayıtlara kimlik ekle — düzenle/sil için gerekli
  (GELIRLER  || []).forEach(x => { if(!x.id){ x.id = benzersizId('ge'); degisti = true; } });
  (GIDERLER  || []).forEach(x => { if(!x.id){ x.id = benzersizId('gi'); degisti = true; } });
  (CEK_SENET || []).forEach(x => { if(!x.id){ x.id = benzersizId('cs'); degisti = true; } });
  (CARI_HAREKETLER || []).forEach(x => { if(!x.id){ x.id = benzersizId('ch'); degisti = true; } });
  (PRODUCT_CATALOG || []).forEach(x => { if(!x.id){ x.id = benzersizId('pr'); degisti = true; } });
  (KASA_ACCOUNTS || []).forEach(x => { if(!x.id){ x.id = benzersizId('ka'); degisti = true; } });
  (BANK_ACCOUNTS || []).forEach(x => { if(!x.id){ x.id = benzersizId('ba'); degisti = true; } });
  (MALZEME_FIYATLARI || []).forEach(x => { if(!x.id){ x.id = benzersizId('mz'); degisti = true; } });
  (PERSONELLER || []).forEach(p => (p.hareketler || []).forEach(h => { if(!h.id){ h.id = benzersizId('hr'); degisti = true; } }));
  // Silinmiş teklife bağlı yetim işler ve sahipsiz plan blokları temizlenir
  const teklifIdleri = new Set(QUOTES.map(q => q.id));
  const isOnce = JOBS.length, planOnce = PLAN_TASKS.length;
  JOBS = JOBS.filter(j => !j.quoteId || teklifIdleri.has(j.quoteId));
  const isIdleri = new Set(JOBS.map(j => j.id));
  PLAN_TASKS = PLAN_TASKS.filter(t => !t.jobId || isIdleri.has(t.jobId));
  if(JOBS.length !== isOnce || PLAN_TASKS.length !== planOnce) degisti = true;
  return degisti;
}

function renderNav(){
  const allowedTabs = roleCfg().tabs;
  let sonGrup = null;
  document.getElementById('navList').innerHTML = PAGES.filter(p => allowedTabs.includes(p.key)).map(p => {
    // altMenuGizli: alt menü sol sütunda gösterilmez (seçim ekrandaki sekmelerden yapılır); state ve yönlendirme aynı
    const clickHandler = p.hasSub
      ? (p.altMenuGizli ? `toggleSubmenu('${p.key}'); openSubmenu=null; closeMobileSidebar(); menuDaralt(true);` : `toggleSubmenu('${p.key}')`)
      : `goTo('${p.key}')`;
    const isActiveParent = currentPage === p.key;
    // Grup etiketi (yalnız görsel; menü sırası ve olaylar değişmez)
    const grupEtiketi = (p.grup && p.grup !== sonGrup) ? `<div class="nav-label">${p.grup}</div>` : '';
    sonGrup = p.grup || sonGrup;
    let html = grupEtiketi + `
      <button class="${isActiveParent && (!p.hasSub || p.altMenuGizli) ?'active':''}" onclick="${clickHandler}" title="${p.label}">
        <span class="nav-item-icon">${p.svg || p.icon}</span>
        <span class="nav-item-label">${p.label}</span>
        ${p.isNew ? '<span class="badge-new">YENİ</span>' : ''}
        ${p.hasSub && !p.altMenuGizli ? `<span class="nav-chevron ${openSubmenu===p.key?'rot':''}">›</span>` : ''}
      </button>
    `;
    if(p.hasSub && !p.altMenuGizli && SUBMENUS[p.key]){
      let subs = SUBMENUS[p.key];
      if(p.key==='gorev-yonetimi') subs = subs.filter(s => roleCfg().gorevSubs.includes(s.key));
      if(p.key==='yonetim') subs = subs.filter(s => (roleCfg().yonetimSubs||[]).includes(s.key));
      if(p.key==='teklifler' && !finansGorebilir()) subs = subs.filter(s => s.key === 'liste');
      const activeSub = SUB_STATE[p.key].get();
      html += `<div class="subnav ${openSubmenu===p.key?'open':''}">
        ${subs.map(s => `<button class="${currentPage===p.key && activeSub===s.key?'active':''}" onclick="selectSub('${p.key}','${s.key}')">${s.label}</button>`).join('')}
      </div>`;
    }
    return html;
  }).join('');

// Üst çubuk genel arama — kişi/teklif/iş kayıtlarında arar, mevcut açma fonksiyonlarına yönlendirir
function globalAraSonuclar(q){
  const s = (q || '').trim().toLocaleLowerCase('tr'); if(s.length < 2) return [];
  const tabs = roleCfg().tabs; const out = [];
  const icerir = v => String(v || '').toLocaleLowerCase('tr').includes(s);
  if(tabs.includes('kisiler')) CUSTOMERS.filter(c => icerir(c.name) || icerir(c.contact) || icerir(c.phone) || icerir(c.company)).slice(0, 5)
    .forEach(c => out.push({ grup:'Kişiler', baslik:c.name, alt:[c.contact, c.phone].filter(Boolean).join(' · ') || (c.durum || ''), etiket:c.durum || 'Kişi', renk:c.durum === 'Tedarikçi' ? 'orange' : 'blue', onclick:`goTo('kisiler'); openKisiDrawer('${c.id}')` }));
  if(tabs.includes('teklifler')) QUOTES.filter(q => icerir(q.no) || icerir(teklifMusteriAdi(q)) || icerir(q.repName)).slice(0, 5)
    .forEach(q => out.push({ grup:'Teklifler', baslik:`${q.no || 'Teklif'} · ${teklifMusteriAdi(q)}`, alt:`${formatDate(q.date)}${finansGorebilir() ? ' · ' + CURRENCY_SYMBOLS[q.currency||'TL'] + Math.round(quoteTotal(q)).toLocaleString('tr-TR') : ''}`, etiket:q.status, renk:statusSlug(q.status) === 'st-reddedildi' ? 'red' : (statusSlug(q.status) === 'st-gonderildi' ? 'orange' : 'green'), onclick:`goTo('teklifler'); openQuoteView('${q.id}')` }));
  if(tabs.includes('gorev-yonetimi')) JOBS.filter(j => icerir(j.code) || icerir(j.client) || icerir(j.desc) || (j.assignees||[]).some(icerir)).slice(0, 5)
    .forEach(j => out.push({ grup:'İşler', baslik:`${j.code} · ${j.client}`, alt:j.desc, etiket:STAGE_LABELS_TR[j.stage] || j.stage, renk:'gray', onclick:`openJobDrawer('${j.id}')` }));
  return out;
}
function globalAraYaz(v){
  const kutu = document.getElementById('globalAraSonuc'); if(!kutu) return;
  const sonuc = globalAraSonuclar(v);
  if(!(v || '').trim()){ kutu.classList.remove('show'); kutu.innerHTML = ''; return; }
  let grup = null;
  kutu.innerHTML = sonuc.length ? sonuc.map(r => { const b = r.grup !== grup ? `<div class="ga-grup">${r.grup}</div>` : ''; grup = r.grup;
    return b + `<button class="ga-satir" type="button" onclick="globalAraKapat(); ${r.onclick}"><div style="min-width:0;"><strong>${notEsc(r.baslik)}</strong><small>${notEsc(r.alt)}</small></div><span class="tag ${r.renk}">${notEsc(r.etiket)}</span></button>`; }).join('')
    : `<div class="ga-bos">${(v||'').trim().length < 2 ? 'En az 2 karakter yazın.' : 'Eşleşen kayıt yok.'}</div>`;
  kutu.classList.add('show');
}
function globalAraKapat(){ const kutu = document.getElementById('globalAraSonuc'); if(kutu) kutu.classList.remove('show'); const i = document.getElementById('globalAraKutu'); if(i) i.value = ''; }
function globalAraKlavye(ev){
  const kutu = document.getElementById('globalAraSonuc');
  if(ev.key === 'Escape'){ globalAraKapat(); ev.target.blur(); return; }
  if(ev.key === 'ArrowDown' && kutu){ const ilk = kutu.querySelector('.ga-satir'); if(ilk){ ev.preventDefault(); ilk.focus(); } }
  if(ev.key === 'Enter' && kutu){ const ilk = kutu.querySelector('.ga-satir'); if(ilk){ ev.preventDefault(); ilk.click(); } }
}
document.addEventListener('click', e => { if(!e.target.closest('#globalAra')) { const k = document.getElementById('globalAraSonuc'); if(k) k.classList.remove('show'); } });
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ const i = document.getElementById('globalAraKutu'); if(i && getComputedStyle(i.parentElement).display !== 'none'){ e.preventDefault(); i.focus(); i.select(); } }
});

let NAV_HISTORY = [];
function snapshotNavState(){
  return { currentPage, onMuhasebeSub, raporlarSub, stokSub, gorevSub, yonetimSub,
    teklifStep, teklifViewId, kisilerStep, gelirStep, giderStep, cekSenetStep,
    personelStep, personelSecili, mesaiPersonelId, cariSecili };
}
function pushHistory(){
  NAV_HISTORY.push(snapshotNavState());
  if(NAV_HISTORY.length>20) NAV_HISTORY.shift();
  updateBackBtn();
}
// Tarayıcının GERİ/İLERİ tuşları uygulama içi ekranlar arasında gezinir
function tarayiciGecmisYaz(){
  if(window.__gecmisGeziniyor) return;
  try{
    const su = snapshotNavState();
    if(history.state && JSON.stringify(history.state) === JSON.stringify(su)) return;
    history.pushState(su, '');
  }catch(e){}
}
window.addEventListener('popstate', e => {
  const st = e.state;
  if(!st || !st.currentPage) return;
  window.__gecmisGeziniyor = true;
  currentPage = st.currentPage;
  onMuhasebeSub = st.onMuhasebeSub; raporlarSub = st.raporlarSub;
  stokSub = st.stokSub; gorevSub = st.gorevSub; yonetimSub = st.yonetimSub;
  openSubmenu = SUBMENUS[currentPage] ? currentPage : null;
  cariSecili = st.cariSecili !== undefined ? st.cariSecili : null;
  kisilerStep = st.kisilerStep || 'list'; teklifStep = st.teklifStep || 'list';
  gelirStep = st.gelirStep || 'list'; giderStep = st.giderStep || 'list';
  cekSenetStep = st.cekSenetStep || 'list'; personelStep = st.personelStep || 'list';
  if(st.teklifViewId !== undefined && st.teklifViewId !== null) teklifViewId = st.teklifViewId;
  personelSecili = st.personelSecili !== undefined ? st.personelSecili : null;
  mesaiPersonelId = st.mesaiPersonelId !== undefined ? st.mesaiPersonelId : null;
  renderNav(); renderContent();
  window.__gecmisGeziniyor = false;
});
function updateBackBtn(){
  const b = document.getElementById('backBtn');
  if(b) b.disabled = NAV_HISTORY.length===0;
}
function goBack(){
  if(NAV_HISTORY.length===0) return;
  const snap = NAV_HISTORY.pop();
  currentPage = snap.currentPage; onMuhasebeSub = snap.onMuhasebeSub; raporlarSub = snap.raporlarSub;
  stokSub = snap.stokSub; gorevSub = snap.gorevSub; yonetimSub = snap.yonetimSub;
  openSubmenu = SUBMENUS[currentPage] ? currentPage : null;
  cariSecili = snap.cariSecili !== undefined ? snap.cariSecili : null;
  kisilerStep = snap.kisilerStep || 'list'; teklifStep = snap.teklifStep || 'list';
  gelirStep = snap.gelirStep || 'list'; giderStep = snap.giderStep || 'list';
  cekSenetStep = snap.cekSenetStep || 'list'; personelStep = snap.personelStep || 'list';
  if(snap.teklifViewId !== undefined && snap.teklifViewId !== null) teklifViewId = snap.teklifViewId;
  personelSecili = snap.personelSecili !== undefined ? snap.personelSecili : null;
  mesaiPersonelId = snap.mesaiPersonelId !== undefined ? snap.mesaiPersonelId : null;
  renderNav(); renderContent(); updateBackBtn();
}

function toggleSubmenu(key){
  if(key !== currentPage) pushHistory();
  currentPage = key;
  openSubmenu = openSubmenu===key ? null : key;
  if(key==='on-muhasebe'){ cekSenetStep = 'list'; giderStep = 'list'; gelirStep = 'list'; }
  if(key!=='gorev-yonetimi' || gorevSub!=='genel-board') boardFilterStage = null;
  renderNav(); renderContent();
  tarayiciGecmisYaz();
}
function selectSub(parentKey, subKey){
  if(!(currentPage===parentKey && SUB_STATE[parentKey].get()===subKey)) pushHistory();
  currentPage = parentKey;
  SUB_STATE[parentKey].set(subKey);
  openSubmenu = parentKey;
  if(parentKey==='on-muhasebe'){ cekSenetStep = 'list'; giderStep = 'list'; gelirStep = 'list'; personelStep = 'list'; personelSecili = null; mesaiPersonelId = null; mesaiRatesEdit = false; }
  if(parentKey==='yonetim'){ aracStep = 'list'; editingVehicleId = null; }
  if(parentKey==='teklifler'){ teklifStep = 'list'; }
  if(!(parentKey==='gorev-yonetimi' && subKey==='genel-board')) boardFilterStage = null;
  if(parentKey==='gorev-yonetimi'){ gtAssigneeFilter = ''; gtSearchQuery = ''; }
  renderNav(); renderContent();
  closeMobileSidebar();
  menuDaralt(true);
  tarayiciGecmisYaz();
}
function goTo(key){
  if(key !== currentPage) pushHistory();
  if(key === 'ana-sayfa' && currentPage !== 'ana-sayfa' && sozSirasi !== null) sozSirasi++;
  currentPage = key; kisilerStep = 'list'; editingCustomerId = null; teklifStep = 'list'; boardFilterStage = null; gtAssigneeFilter = ''; gtSearchQuery = ''; if(key==='teklifler') teklifSub = 'liste'; if(!SUBMENUS[key]) openSubmenu = null; renderNav(); renderContent(); closeMobileSidebar();
  menuDaralt(true);
  tarayiciGecmisYaz();
}

function renderContent(){
  const el = document.getElementById('content');
  if(currentPage==='ana-sayfa') el.innerHTML = anaSayfaView();
  else if(currentPage==='kisiler'){
    el.innerHTML = kisilerView();
    if(kisilerStep==='form' && openAccordions.has('acc2')){ renderContactRows(); renderAddressRows(); }
  }
  else if(currentPage==='teklifler'){

      if(teklifStep==='form'){ fillCustomerInfo(); renderLineItems(); }
    }
  }
  else if(currentPage==='on-muhasebe') el.innerHTML = onMuhasebeView();
  else if(currentPage==='raporlar') el.innerHTML = raporlarView();
  else if(currentPage==='stok') el.innerHTML = stokView();

  else el.innerHTML = placeholderView();
}

function planIso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function planHaftaBasi(ofset){
  const d = new Date(); d.setHours(0,0,0,0);
  const gun = (d.getDay() + 6) % 7;                 // Pazartesi = 0
  d.setDate(d.getDate() - gun + (ofset * 7));
  return d;
}

}
function dkToSaat(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  if(!s) return k + 'dk';
  return s + 's' + (k ? ' ' + k + 'dk' : '');
}
function saatToDk(hhmm){
  const p = String(hhmm||'00:00').split(':');
  return (Number(p[0])||0)*60 + (Number(p[1])||0);
}
function dkToSaatMetni(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  return String(s).padStart(2,'0') + ':' + String(k).padStart(2,'0');
}
// Renk müşteri/proje adından türetilir — aynı müşteri her yerde aynı renk, liste tutulmaz
let PLAN_RENK_MAP = {};
// Görünen haftadaki cariler farklı renk alır: hash başlangıç, doluysa sıradaki boş renge kayar
function planRenkleriGuncelle(gunler){
  PLAN_RENK_MAP = {};
  const kullanilan = new Set();
  planAktifProjeler(gunler).forEach(ad => {
    let hsh = 0; const t = String(ad || '');
    for(let i = 0; i < t.length; i++) hsh = (hsh * 31 + t.charCodeAt(i)) >>> 0;
    let idx = hsh % PLAN_RENKLER.length;
    if(kullanilan.size < PLAN_RENKLER.length){
      while(kullanilan.has(idx)) idx = (idx + 1) % PLAN_RENKLER.length;
    }
    kullanilan.add(idx);
    PLAN_RENK_MAP[ad] = PLAN_RENKLER[idx];
  });
}
function planRenk(ad){
  if(PLAN_RENK_MAP[ad]) return PLAN_RENK_MAP[ad];
  let hsh = 0; const s = String(ad || '');
  for(let i = 0; i < s.length; i++) hsh = (hsh * 31 + s.charCodeAt(i)) >>> 0;
  return PLAN_RENKLER[hsh % PLAN_RENKLER.length];
}
function planProjeRengi(t){ return planRenk(t && t.projectName !== undefined ? t.projectName : t); }
function planAktifProjeler(gunler){
  const isolar = gunler.map(planIso);
  return [...new Set(PLAN_TASKS.filter(t => isolar.includes(t.date)).map(t => t.projectName))];
}

// ---- Sürükle-bırak ----
function planDragStart(e, id){
  planSurukleId = id;
  const kart = e.currentTarget;
  const r = kart.getBoundingClientRect();
  planSurukleKaymaDk = Math.round(((e.clientY - r.top) / PLAN_SAAT_PX) * 60);
  kart.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
}
function planDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleId = null; }
function planDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop'); }
function planDragLeave(e){ e.currentTarget.classList.remove('drop'); }
function planDrop(e, iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  const r = e.currentTarget.getBoundingClientRect();
  if(planSurukleIsId){                                   // tepsiden saat ızgarasına
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    let dk = Math.round((((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
    dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - PLAN_VARSAYILAN_SURE));
    PLAN_TASKS.push(planBlokIsten(j, iso, dkToSaatMetni(dk), planKisilerIsimden(j.assignees)));
    bildirimAtama(planKisilerIsimden(j.assignees), `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    renderContent();
    showToast(`${j.code} planlandı → ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  if(!t) return;
  const dkHam = ((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60 - planSurukleKaymaDk;
  let dk = Math.round(dkHam / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - t.durationMinutes));
  t.date = iso;
  t.startTime = dkToSaatMetni(dk);
  planSurukleId = null;
  renderContent();
  showToast(`${t.projectName} → ${formatDate(iso)} ${t.startTime}`);
}

function planIsDragStart(e, jobId){

}
function planIsDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleIsId = null; }
function planTepsiOver(e){ if(planSurukleId){ e.preventDefault(); e.currentTarget.classList.add('drop'); } }
function planTepsiDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  if(!planYetkili()) return;
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  planSurukleId = null; planSurukleKaynakKisi = null;
  if(!t) return;
  if(!t.jobId){ showToast('Bu blok bir işe bağlı değil; silmek için karta tıklayın.'); return; }
  PLAN_TASKS = PLAN_TASKS.filter(x => x.id !== t.id);
  renderContent();
  showToast(`${t.projectName} planı kaldırıldı — iş tekrar tepside.`);
}
function planKisilerIsimden(adlar){

function planHucreDrop(e, iso, kisiId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  if(!planYetkili()) return;
  if(planSurukleIsId){                                   // tepsiden yeni planlama
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    PLAN_TASKS.push(planBlokIsten(j, iso, '09:00', [kisiId]));
    bildirimAtama([kisiId], `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)}`);

    const p = PERSONELLER.find(x => x.id === kisiId);
    showToast(`${j.code} planlandı → ${p ? p.name : ''} · ${formatDate(iso)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);

  showToast(`${t.taskName} → ${p ? p.name : ''} · ${formatDate(iso)}`);
}

// ---- Kart alt kenarından süre uzatma ----
let planResize = null;
let planSonResize = 0;
function planKartTikla(id){
  if(Date.now() - planSonResize < 300) return;   // resize'ın hemen ardından modal açılmasın
  openPlanTaskModal(id);
}
function planResizeEtiket(e, dk){
  let et = document.getElementById('hpResizeTag');
  if(!et){ et = document.createElement('div'); et.id = 'hpResizeTag'; et.className = 'hp-resize-tag'; document.body.appendChild(et); }
  et.textContent = dkToSaat(dk);
  et.style.left = (e.clientX + 14) + 'px';
  et.style.top  = (e.clientY + 10) + 'px';
  et.style.display = 'block';
}
function planResizeEtiketGizle(){ const et = document.getElementById('hpResizeTag'); if(et) et.style.display = 'none'; }
function planResizeStart(e, id){
  if(!planYetkili()) return;
  e.preventDefault(); e.stopPropagation();
  const t = PLAN_TASKS.find(x => x.id === id); if(!t) return;
  const kart = e.currentTarget.parentElement;
  planTipGizle();
  kart.setAttribute('draggable','false');
  kart.classList.add('resizing');
  planResize = { id:id, kart:kart, basY:e.clientY, basSure:t.durationMinutes, yeni:t.durationMinutes };
  planResizeEtiket(e, t.durationMinutes);
  try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
  document.addEventListener('pointermove', planResizeMove);
  document.addEventListener('pointerup', planResizeEnd);
  document.addEventListener('pointercancel', planResizeEnd);
}
function planResizeMove(e){
  if(!planResize) return;
  if(e.cancelable) e.preventDefault();
  const t = PLAN_TASKS.find(x => x.id === planResize.id); if(!t) return;
  const fark = ((e.clientY - planResize.basY) / PLAN_SAAT_PX) * 60;
  const enFazla = PLAN_BIT_SAAT*60 - saatToDk(t.startTime);       // günün sonunu aşmasın
  let yeni = Math.round((planResize.basSure + fark) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  yeni = Math.max(PLAN_SNAP_DK, Math.min(yeni, enFazla));
  planResize.yeni = yeni;
  planResize.kart.style.height = Math.max((yeni/60)*PLAN_SAAT_PX - 3, 22) + 'px';
  const sureEl = planResize.kart.querySelector('.hp-sure');
  if(sureEl) sureEl.textContent = dkToSaat(yeni);
  planResizeEtiket(e, yeni);
}
function planResizeEnd(){
  document.removeEventListener('pointermove', planResizeMove);
  document.removeEventListener('pointerup', planResizeEnd);
  document.removeEventListener('pointercancel', planResizeEnd);
  planResizeEtiketGizle();
  if(!planResize) return;
  const t = PLAN_TASKS.find(x => x.id === planResize.id);
  const yeni = planResize.yeni;
  const degisti = t && t.durationMinutes !== yeni;
  if(t) t.durationMinutes = yeni;
  planResize.kart.classList.remove('resizing');
  planResize.kart.setAttribute('draggable','true');
  planResize = null;
  planSonResize = Date.now();
  renderContent();
  if(degisti) showToast('Süre ' + dkToSaat(yeni) + ' oldu.');
}

    <div class="hp-tip-row"><span>Tarih</span><b style="color:var(--ink);">${formatDate(t.date)}</b></div>
    <div class="hp-tip-row"><span>Saat</span><b style="color:var(--ink);">${dkToSaatMetni(bas)} – ${dkToSaatMetni(bit)}</b></div>
    <div class="hp-tip-row"><span>Süre</span><b style="color:var(--ink);">${dkToSaat(t.durationMinutes)}</b></div>
    ${t.cost && finansGorebilir() ? `<div class="hp-tip-row"><span>Değer</span><b style="color:var(--ink);">₺${t.cost.toLocaleString('tr-TR')}</b></div>` : ''}
    <div class="hp-tip-row"><span>İlerleme</span><b style="color:var(--ink);">%${t.ilerleme||0}</b></div>
    ${(t.personelIds||[]).length ? `<div class="hp-tip-row" style="align-items:flex-start;">
      <span>Ekip</span><b style="color:var(--ink);text-align:right;">${
        (t.personelIds||[]).map(x => { const p = PERSONELLER.find(y => y.id === x); return p ? p.name : ''; }).join('<br>')
      }</b></div>` : ''}
    <div class="hp-tip-bar"><span style="width:${t.ilerleme||0}%;"></span></div>`;
  const r = e.currentTarget.getBoundingClientRect();
  let x = r.right + 10, y = r.top;
  if(x + 250 > window.innerWidth) x = r.left - 246;
  if(y + 190 > window.innerHeight) y = Math.max(8, window.innerHeight - 196);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.display = 'block';
}
function planTipGizle(){ const t = document.getElementById('hpTip'); if(t) t.style.display = 'none'; }
