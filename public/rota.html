  const par = p.name.split(' ');
  return par[0] + (par[1] ? ' ' + par[1][0] + '.' : '');
}

function planIso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function planHaftaBasi(ofset){
  const d = new Date(); d.setHours(0,0,0,0);
  const gun = (d.getDay() + 6) % 7;                 // Pazartesi = 0
  d.setDate(d.getDate() - gun + (ofset * 7));
  return d;
}
function planHaftaGunleri(){
  const bas = planHaftaBasi(planHaftaOfset);
  return Array.from({length:7}, (_,i) => { const d = new Date(bas); d.setDate(bas.getDate()+i); return d; });
}
function dkToSaat(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  if(!s) return k + 'dk';
  return s + 's' + (k ? ' ' + k + 'dk' : '');
}
function saatToDk(hhmm){
  const p = String(hhmm||'00:00').split(':');
  return (Number(p[0])||0)*60 + (Number(p[1])||0);
}
function dkToSaatMetni(dk){
  const s = Math.floor(dk/60), k = dk % 60;
  return String(s).padStart(2,'0') + ':' + String(k).padStart(2,'0');
}
// Renk müşteri/proje adından türetilir — aynı müşteri her yerde aynı renk, liste tutulmaz
let PLAN_RENK_MAP = {};
// Görünen haftadaki cariler farklı renk alır: hash başlangıç, doluysa sıradaki boş renge kayar
function planRenkleriGuncelle(gunler){
  PLAN_RENK_MAP = {};
  const kullanilan = new Set();
  planAktifProjeler(gunler).forEach(ad => {
    let hsh = 0; const t = String(ad || '');
    for(let i = 0; i < t.length; i++) hsh = (hsh * 31 + t.charCodeAt(i)) >>> 0;
    let idx = hsh % PLAN_RENKLER.length;
    if(kullanilan.size < PLAN_RENKLER.length){
      while(kullanilan.has(idx)) idx = (idx + 1) % PLAN_RENKLER.length;
    }
    kullanilan.add(idx);
    PLAN_RENK_MAP[ad] = PLAN_RENKLER[idx];
  });
}
function planRenk(ad){
  if(PLAN_RENK_MAP[ad]) return PLAN_RENK_MAP[ad];
  let hsh = 0; const s = String(ad || '');
  for(let i = 0; i < s.length; i++) hsh = (hsh * 31 + s.charCodeAt(i)) >>> 0;
  return PLAN_RENKLER[hsh % PLAN_RENKLER.length];
}
function planProjeRengi(t){ return planRenk(t && t.projectName !== undefined ? t.projectName : t); }
function planAktifProjeler(gunler){
  const isolar = gunler.map(planIso);
  return [...new Set(PLAN_TASKS.filter(t => isolar.includes(t.date)).map(t => t.projectName))];
}

// ---- Sürükle-bırak ----
function planDragStart(e, id){
  planSurukleId = id;
  const kart = e.currentTarget;
  const r = kart.getBoundingClientRect();
  planSurukleKaymaDk = Math.round(((e.clientY - r.top) / PLAN_SAAT_PX) * 60);
  kart.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
}
function planDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleId = null; }
function planDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop'); }
function planDragLeave(e){ e.currentTarget.classList.remove('drop'); }
function planDrop(e, iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  const r = e.currentTarget.getBoundingClientRect();
  if(planSurukleIsId){                                   // tepsiden saat ızgarasına
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    let dk = Math.round((((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
    dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - PLAN_VARSAYILAN_SURE));
    PLAN_TASKS.push(planBlokIsten(j, iso, dkToSaatMetni(dk), planKisilerIsimden(j.assignees)));
    bildirimAtama(planKisilerIsimden(j.assignees), `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    renderContent();
    showToast(`${j.code} planlandı → ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  if(!t) return;
  const dkHam = ((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60 - planSurukleKaymaDk;
  let dk = Math.round(dkHam / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - t.durationMinutes));
  t.date = iso;
  t.startTime = dkToSaatMetni(dk);
  planSurukleId = null;
  renderContent();
  showToast(`${t.projectName} → ${formatDate(iso)} ${t.startTime}`);
}

        </div>`; }).join('')
      : `<span class="hp-tepsi-bos">${asamaAdi} aşamasında planlanmayı bekleyen iş yok. Bir planı buraya sürükleyerek geri alabilirsiniz.</span>`}
      ${yetki ? '' : '<span class="hp-tepsi-bos" style="margin-left:auto;">🔒 Planlamayı yönetici yapar</span>'}

function planIsDragStart(e, jobId){
  if(!planYetkili()){ e.preventDefault(); return; }
  planSurukleIsId = jobId; planSurukleId = null;
  e.currentTarget.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', 'job:'+jobId); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
  e.stopPropagation();
}
function planIsDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleIsId = null; }
function planTepsiOver(e){ if(planSurukleId){ e.preventDefault(); e.currentTarget.classList.add('drop'); } }
function planTepsiDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  planSurukleId = null; planSurukleKaynakKisi = null;
  if(!t) return;
  if(!t.jobId){ showToast('Bu blok bir işe bağlı değil; silmek için karta tıklayın.'); return; }
  PLAN_TASKS = PLAN_TASKS.filter(x => x.id !== t.id);
  renderContent();
  showToast(`${t.projectName} planı kaldırıldı — iş tekrar tepside.`);
}
function planKisilerIsimden(adlar){
  return (adlar||[]).map(ad => { const p = PERSONELLER.find(x => x.name === ad); return p ? p.id : null; }).filter(Boolean);
}

function planChipDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleId = null; }
function planHucreDrop(e, iso, kisiId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  if(planSurukleIsId){                                   // tepsiden yeni planlama
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    PLAN_TASKS.push(planBlokIsten(j, iso, '09:00', [kisiId]));
    bildirimAtama([kisiId], `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)}`);
    renderContent();
    const p = PERSONELLER.find(x => x.id === kisiId);
    showToast(`${j.code} planlandı → ${p ? p.name : ''} · ${formatDate(iso)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  if(!t){ planSurukleKaynakKisi = null; return; }
  const eski = planSurukleKaynakKisi;
  const yeniAtama = !(t.personelIds || []).includes(kisiId);
  t.date = iso;
  let kisiler = (t.personelIds || []).slice();
  if(eski && eski !== kisiId) kisiler = kisiler.filter(x => x !== eski);
  if(!kisiler.includes(kisiId)) kisiler.push(kisiId);
  t.personelIds = kisiler;
  if(yeniAtama) bildirimAtama([kisiId], `Size plan atandı: ${t.taskName} (${t.projectName}) — ${formatDate(iso)}`);
  planSurukleId = null; planSurukleKaynakKisi = null;
  renderContent();
  const p = PERSONELLER.find(x => x.id === kisiId);
  showToast(`${t.taskName} → ${p ? p.name : ''} · ${formatDate(iso)}`);
}

let planResize = null;
let planSonResize = 0;
function planKartTikla(id){
  if(Date.now() - planSonResize < 300) return;   // resize'ın hemen ardından modal açılmasın
  openPlanTaskModal(id);
}
function planResizeEtiket(e, dk){
  let et = document.getElementById('hpResizeTag');
  if(!et){ et = document.createElement('div'); et.id = 'hpResizeTag'; et.className = 'hp-resize-tag'; document.body.appendChild(et); }
  et.textContent = dkToSaat(dk);
  et.style.left = (e.clientX + 14) + 'px';
  et.style.top  = (e.clientY + 10) + 'px';
  et.style.display = 'block';
}
function planResizeEtiketGizle(){ const et = document.getElementById('hpResizeTag'); if(et) et.style.display = 'none'; }
function planResizeStart(e, id){
  e.preventDefault(); e.stopPropagation();
  const t = PLAN_TASKS.find(x => x.id === id); if(!t) return;
  const kart = e.currentTarget.parentElement;
  planTipGizle();
  kart.setAttribute('draggable','false');
  kart.classList.add('resizing');
  planResize = { id:id, kart:kart, basY:e.clientY, basSure:t.durationMinutes, yeni:t.durationMinutes };
  planResizeEtiket(e, t.durationMinutes);
  try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
  document.addEventListener('pointermove', planResizeMove);
  document.addEventListener('pointerup', planResizeEnd);
  document.addEventListener('pointercancel', planResizeEnd);
}
function planResizeMove(e){
  if(!planResize) return;
  if(e.cancelable) e.preventDefault();
  const t = PLAN_TASKS.find(x => x.id === planResize.id); if(!t) return;
  const fark = ((e.clientY - planResize.basY) / PLAN_SAAT_PX) * 60;
  const enFazla = PLAN_BIT_SAAT*60 - saatToDk(t.startTime);       // günün sonunu aşmasın
  let yeni = Math.round((planResize.basSure + fark) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  yeni = Math.max(PLAN_SNAP_DK, Math.min(yeni, enFazla));
  planResize.yeni = yeni;
  planResize.kart.style.height = Math.max((yeni/60)*PLAN_SAAT_PX - 3, 22) + 'px';
  const sureEl = planResize.kart.querySelector('.hp-sure');
  if(sureEl) sureEl.textContent = dkToSaat(yeni);
  planResizeEtiket(e, yeni);
}
function planResizeEnd(){
  document.removeEventListener('pointermove', planResizeMove);
  document.removeEventListener('pointerup', planResizeEnd);
  document.removeEventListener('pointercancel', planResizeEnd);
  planResizeEtiketGizle();
  if(!planResize) return;
  const t = PLAN_TASKS.find(x => x.id === planResize.id);
  const yeni = planResize.yeni;
  const degisti = t && t.durationMinutes !== yeni;
  if(t) t.durationMinutes = yeni;
  planResize.kart.classList.remove('resizing');
  planResize.kart.setAttribute('draggable','true');
  planResize = null;
  planSonResize = Date.now();
  renderContent();
  if(degisti) showToast('Süre ' + dkToSaat(yeni) + ' oldu.');
}

const PLAN_YAZDIR_HEX = ['#FDE68A','#BFDBFE','#BBF7D0','#FECACA','#DDD6FE','#FED7AA','#A5F3FC','#F5D0FE','#D9F99D','#E2E8F0'];
function planYazdirRenk(ad){
  let hsh = 0; const t = String(ad || '');
  for(let i = 0; i < t.length; i++) hsh = (hsh * 31 + t.charCodeAt(i)) >>> 0;
  return PLAN_YAZDIR_HEX[hsh % PLAN_YAZDIR_HEX.length];
}
function planYazdirHtml(alan, kagit, haftaSonu, sadeceIsli){
  const sec = PLAN_DEPARTMANLAR[alan] || PLAN_DEPARTMANLAR['Tümü'];
  const gunler = haftaSonu ? planHaftaGunleri() : planHaftaGunleri().slice(0, 5);
  const bugunIso = planIso(new Date());
  let ekip = PERSONELLER.filter(p => !p.arsiv && (!sec.deps || sec.deps.includes(p.departman || '')));
  if(sadeceIsli) ekip = ekip.filter(p => planKisiHaftaDk(p.id, gunler) > 0);
  // Sayfa ölçüleri (mm, 7mm kenar boşluğu düşülmüş) ve OKUNABİLİRLİK TABANI:
  // satır 11mm'nin altına inmez — sığmayan personel sonraki sayfaya taşar.
  const W = kagit === 'A3' ? 406 : 283;
  const H = kagit === 'A3' ? 283 : 196;
  const kullanilabilir = H - 12 - 2 - 9;
  const MIN_SATIR = 11, MAX_SATIR = 26;
  const kapasite = Math.max(1, Math.floor(kullanilabilir / MIN_SATIR));
  const sayfaSayisi = Math.max(1, Math.ceil(ekip.length / kapasite));
  const sayfadaKisi = Math.max(1, Math.ceil(ekip.length / sayfaSayisi));
  const rowH = Math.min(MAX_SATIR, Math.max(MIN_SATIR, kullanilabilir / sayfadaKisi));
  const mod = rowH >= 22 ? 'genis' : (rowH >= 15 ? 'orta' : 'dar');
  const maxChip = mod === 'genis' ? 5 : (mod === 'orta' ? 3 : 2);
  const baslik = alan === 'Tümü' ? 'Haftalık Program' : alan + ' Haftalık Programı';
  const son = gunler[gunler.length - 1];
  const aralik = `${gunler[0].getDate()} ${PLAN_AYLAR[gunler[0].getMonth()]} – ${son.getDate()} ${PLAN_AYLAR[son.getMonth()]} ${son.getFullYear()}` + (haftaSonu ? '' : ' · hafta içi');

  const chipHtml = t => mod === 'dar'
    ? `<div class="chip tek" style="background:${planYazdirRenk(t.projectName)};"><b>${notEsc(t.taskName)}</b> · ${notEsc(t.projectName)} · ${t.startTime}</div>`
    : `<div class="chip" style="background:${planYazdirRenk(t.projectName)};"><b>${notEsc(t.taskName)}</b><i>${notEsc(t.projectName)}</i><u>${t.startTime} · ${dkToSaat(t.durationMinutes)}</u></div>`;

  const kisiSatiri = p => {
    const hafta = planKisiHaftaDk(p.id, gunler);
    const adHucre = mod === 'dar'
      ? `<div class="hucre ad"><b>${notEsc(p.name)}</b><i>${notEsc(p.unvan || p.departman || '')}${hafta ? ' · ' + dkToSaat(hafta) : ''}</i></div>`
      : `<div class="hucre ad"><b>${notEsc(p.name)}</b><i>${notEsc(p.unvan || p.departman || '')}</i><u>${hafta ? dkToSaat(hafta) : '—'}</u></div>`;
    return adHucre + gunler.map(d => { const iso = planIso(d);
      const isler = planKisiGorevleri(p.id, iso);
      const gorunen = isler.slice(0, maxChip);
      const kalan = isler.length - gorunen.length;
      return `<div class="hucre ${iso === bugunIso ? 'bugun' : ''}">
        ${gorunen.map(chipHtml).join('')}
        ${kalan > 0 ? `<div class="fazla">+${kalan} iş daha</div>` : ''}
      </div>`; }).join('');
  };

  const gunBasliklari = `
    <div class="gunbas">Personel<span>${ekip.length} kişi</span></div>
    ${gunler.map(d => { const iso = planIso(d);
      return `<div class="gunbas ${iso === bugunIso ? 'bugun' : ''}">${PLAN_GUNLER[(d.getDay()+6)%7]}<span>${d.getDate()} ${PLAN_AYLAR[d.getMonth()]}</span></div>`; }).join('')}`;

  const sayfalar = [];
  for(let sf = 0; sf < sayfaSayisi; sf++){
    const grup = ekip.slice(sf * sayfadaKisi, (sf + 1) * sayfadaKisi);
    sayfalar.push(`
    <div class="alan">
      <div class="bas">
        <img src="${AGENCY.logo}" alt="">
        <div class="orta"><h1>${baslik}</h1><div class="aralik">${aralik}</div></div>
        <div class="sag">${ekip.length} personel · ${kagit} yatay${sayfaSayisi > 1 ? ` · Sayfa ${sf + 1}/${sayfaSayisi}` : ''}<br>Yazdırma: ${new Date().toLocaleDateString('tr-TR')}</div>
      </div>
      <div class="tablo" style="grid-template-rows:9mm repeat(${Math.max(grup.length, 1)}, ${rowH.toFixed(2)}mm);">
        ${gunBasliklari}
        ${grup.map(kisiSatiri).join('') || '<div style="grid-column:1/-1;padding:6mm;text-align:center;color:#64748B;">Bu alanda personel yok.</div>'}
      </div>
    </div>`);
  }

  return `<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>${baslik}</title><style>
    @page{size:${kagit} landscape;margin:7mm;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1E293B;}
    .alan{width:${W}mm;height:${H}mm;overflow:hidden;display:flex;flex-direction:column;page-break-after:always;}
    .alan:last-child{page-break-after:auto;}
    .bas{height:12mm;flex:0 0 12mm;display:flex;justify-content:space-between;align-items:center;
      border-bottom:2px solid #DC2626;margin-bottom:2mm;}
    .bas img{height:9mm;}
    .bas .orta{text-align:center;}
    .bas h1{font-size:13pt;letter-spacing:.3px;}
    .bas .aralik{font-size:8.5pt;color:#64748B;}
    .bas .sag{font-size:7.5pt;color:#94A3B8;text-align:right;}
    .tablo{display:grid;grid-template-columns:38mm repeat(${gunler.length},1fr);
      border:1px solid #94A3B8;overflow:hidden;}
    .gunbas,.hucre{border-right:1px solid #CBD5E1;border-bottom:1px solid #CBD5E1;overflow:hidden;}
    .gunbas{background:#1E293B;color:#fff;display:flex;flex-direction:column;justify-content:center;

    .gunbas span{font-weight:400;font-size:7.5pt;color:#CBD5E1;text-transform:none;}
    .gunbas.bugun{background:#DC2626;}
    .hucre{padding:1mm;}
    .hucre.bugun{background:#FFF7ED;}
    .hucre.ad{background:#F1F5F9;display:flex;flex-direction:column;justify-content:center;padding:0.6mm 2mm;line-height:1.3;}
    .hucre.ad b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hucre.ad i{font-style:normal;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .hucre.ad u{text-decoration:none;color:#334155;font-weight:700;}
    .chip{border:0.3mm solid #94A3B8;border-radius:1mm;padding:0.6mm 1mm;margin-bottom:0.7mm;line-height:1.3;}
    .chip b{display:block;}
    .chip i{display:block;font-style:normal;color:#334155;}
    .chip u{text-decoration:none;color:#475569;}
    .chip.tek{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chip.tek b{display:inline;}
    .fazla{font-weight:700;color:#DC2626;}
    body.genis .hucre.ad b{font-size:10pt;} body.genis .hucre.ad i,body.genis .hucre.ad u{font-size:7.5pt;}
    body.genis .chip{font-size:8pt;} body.genis .chip u,body.genis .fazla{font-size:7pt;}
    body.orta .hucre.ad b{font-size:9pt;} body.orta .hucre.ad i,body.orta .hucre.ad u{font-size:7pt;}
    body.orta .chip{font-size:7pt;} body.orta .chip u,body.orta .fazla{font-size:6.5pt;}
    body.dar .hucre.ad b{font-size:8.5pt;} body.dar .hucre.ad i{font-size:6.5pt;}
    body.dar .chip{font-size:6.8pt;} body.dar .fazla{font-size:6pt;}
  </style></head><body class="${mod}">
    ${sayfalar.join('')}
  </body></html>`;
}

function planSaatView(){
  const gunler = planHaftaGunleri();
  planRenkleriGuncelle(gunler);
  const bugunIso = planIso(new Date());
  const yukseklik = (PLAN_BIT_SAAT - PLAN_BAS_SAAT) * PLAN_SAAT_PX;
  const haftaDk = gunler.reduce((s,d)=> s + planGunOzeti(planIso(d)).dk, 0);
  const haftaTutar = gunler.reduce((s,d)=> s + planGunOzeti(planIso(d)).tutar, 0);

  const saatCizgileri = Array.from({length: PLAN_BIT_SAAT - PLAN_BAS_SAAT + 1}, (_,i) =>
    `<div class="hp-cizgi" style="top:${i*PLAN_SAAT_PX}px;"></div>`).join('');

  const simdi = new Date();
  const simdiDk = simdi.getHours()*60 + simdi.getMinutes();
  const simdiGoster = simdiDk >= PLAN_BAS_SAAT*60 && simdiDk <= PLAN_BIT_SAAT*60;

  const departmanSecici = `
    <select onchange="planDepartman=this.value; renderContent();"
      style="height:28px;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;
             background:var(--surface);color:var(--ink);font-size:11.5px;">
      ${Object.keys(PLAN_DEPARTMANLAR).map(x =>
        `<option ${planDepartman === x ? 'selected' : ''}>${x}</option>`).join('')}
    </select>`;
  return `
    ${planUstBar(gunler, departmanSecici)}
    ${planTepsiHtml()}

    <div class="hp-board">
      <div class="hp-head corner"></div>
      ${gunler.map(d => { const iso = planIso(d); const o = planGunOzeti(iso);
        return `<div class="hp-head">
          <div class="hp-gun ${iso === bugunIso ? 'bugun' : ''}">${PLAN_GUNLER[(d.getDay()+6)%7]}${iso === bugunIso ? ' · bugün' : ''}</div>
          <div class="hp-tarih">${d.getDate()} ${PLAN_AYLAR[d.getMonth()]}</div>
          <div class="hp-ozet">${o.dk ? dkToSaat(o.dk) : '—'}${o.tutar ? ' · ₺'+o.tutar.toLocaleString('tr-TR') : ''}</div>
        </div>`; }).join('')}

      <div class="hp-gutter" style="height:${yukseklik}px;">
        ${Array.from({length: PLAN_BIT_SAAT - PLAN_BAS_SAAT + 1}, (_,i) =>
          `<div class="hp-saat" style="top:${i*PLAN_SAAT_PX}px;">${String(PLAN_BAS_SAAT+i).padStart(2,'0')}:00</div>`).join('')}
      </div>

      ${gunler.map(d => { const iso = planIso(d);
        const gorevler = PLAN_TASKS.filter(t => t.date === iso)
          .sort((a,b) => saatToDk(a.startTime) - saatToDk(b.startTime));
        // Aynı saat aralığında çakışan bloklar üst üste değil YAN YANA yerleşir
        const yerlesim = {};
        let kume = [], kumeSonu = -1, aktif = [];
        const kumeBitir = () => {
          if(!kume.length) return;
          const n = Math.max.apply(null, kume.map(x => yerlesim[x.id].sut)) + 1;
          kume.forEach(x => { yerlesim[x.id].toplam = n; });
          kume = [];
        };
        gorevler.forEach(t => {
          const bas = saatToDk(t.startTime), bit = bas + (Number(t.durationMinutes) || 0);
          if(kume.length && bas >= kumeSonu){ kumeBitir(); aktif = []; }
          aktif = aktif.filter(a => saatToDk(a.startTime) + (Number(a.durationMinutes) || 0) > bas);
          const dolu = new Set(aktif.map(a => yerlesim[a.id].sut));
          let sut = 0; while(dolu.has(sut)) sut++;
          yerlesim[t.id] = { sut: sut, toplam: 1 };
          aktif.push(t); kume.push(t);
          kumeSonu = Math.max(kumeSonu, bit);
        });
        kumeBitir();
        return `<div class="hp-col" style="height:${yukseklik}px;"
          ondragover="planDragOver(event)" ondragleave="planDragLeave(event)" ondrop="planDrop(event,'${iso}')">
          ${saatCizgileri}
          ${(iso === bugunIso && simdiGoster) ? `<div class="hp-simdi" style="top:${((simdiDk - PLAN_BAS_SAAT*60)/60)*PLAN_SAAT_PX}px;"></div>` : ''}
          ${gorevler.map(t => {
            const c = planProjeRengi(t);
            const top = ((saatToDk(t.startTime) - PLAN_BAS_SAAT*60) / 60) * PLAN_SAAT_PX;
            const h = Math.max((t.durationMinutes / 60) * PLAN_SAAT_PX - 3, 22);
            const yer = yerlesim[t.id] || { sut: 0, toplam: 1 };
            const yanYana = yer.toplam > 1
              ? `left:calc(${(yer.sut * 100 / yer.toplam).toFixed(3)}% + 2px);width:calc(${(100 / yer.toplam).toFixed(3)}% - 5px);right:auto;`
              : '';
            return `<div class="hp-task" draggable="${planYetkili()}"
              style="top:${top}px;height:${h}px;${yanYana}background:var(--${c});border-color:var(--${c}b);color:var(--${c}f);"
              ondragstart="planDragStart(event,'${t.id}')" ondragend="planDragEnd(event)"
              onmouseenter="planTipGoster(event,'${t.id}')" onmouseleave="planTipGizle()"
              onclick="planKartTikla('${t.id}')">
              <div class="hp-task-proje">${t.projectName}</div>
              ${h > 42 ? `<div class="hp-task-ad">${t.taskName}</div>` : ''}
              ${h > 58 && (t.personelIds||[]).length ? `<div class="hp-kim">${
                (t.personelIds||[]).slice(0,3).map(x => `<span>${planKisaAd(x)}</span>`).join('')
              }${(t.personelIds||[]).length > 3 ? `<span>+${(t.personelIds||[]).length-3}</span>` : ''}</div>` : ''}
              ${h > 58 ? `<div class="hp-task-alt">
                <span>${t.cost ? '₺'+t.cost.toLocaleString('tr-TR') : ''}</span>
                <span class="hp-sure">${dkToSaat(t.durationMinutes)}</span></div>` : ''}
              ${planYetkili() ? `<div class="hp-resize" title="Süreyi uzatmak/kısaltmak için aşağı-yukarı sürükleyin"
                onpointerdown="planResizeStart(event,'${t.id}')"></div>` : ''}
            </div>`; }).join('')}
        </div>`; }).join('')}
    </div>

    <div class="hp-legend">
      ${planAktifProjeler(gunler).map(ad => { const c = planRenk(ad);
        return `<span><i style="background:var(--${c});border-color:var(--${c}b);"></i>${ad}</span>`; }).join('')}
    </div>`;
}

function submitPlanTask(id){
  const val = x => { const el = document.getElementById(x); return el ? el.value : ''; };
  const ad = val('ptAd').trim();
  if(!ad){ showToast('Görev adı girin.'); return; }
  const mevcutBlok = id ? PLAN_TASKS.find(x => x.id === id) : null;
  let projectId = val('ptProje'), projectName;
  if(mevcutBlok && mevcutBlok.jobId){ projectId = mevcutBlok.projectId; projectName = mevcutBlok.projectName; }
  else if(projectId === '__ic'){ projectName = 'Dekant İç İşler'; }
  else { const c = CUSTOMERS.find(x => x.id === projectId); projectName = c ? c.name : 'Proje'; }
  const veri = {
    projectId: projectId, projectName: projectName, taskName: ad,
    date: val('ptGun'), startTime: val('ptSaat') || '09:00',
    durationMinutes: Math.max(Number(val('ptSure')) || 60, 15),
    cost: Number(val('ptTutar')) || 0,
    ilerleme: Math.min(Math.max(Number(val('ptIlerleme')) || 0, 0), 100),
    personelIds: Array.from(document.querySelectorAll('.pt-kisi:checked')).map(x => x.value),
  };
  const mevcut = id ? PLAN_TASKS.find(x => x.id === id) : null;
  const oncekiler = mevcut ? (mevcut.personelIds || []) : [];
  if(mevcut) Object.assign(mevcut, veri);
  else PLAN_TASKS.push(Object.assign({ id:'t'+Date.now() }, veri));
  bildirimAtama(veri.personelIds.filter(x => !oncekiler.includes(x)),
    `Size plan atandı: ${ad} (${projectName}) — ${formatDate(veri.date)}`);
  closeModal(); renderContent();
  showToast(mevcut ? 'Blok güncellendi.' : 'Blok eklendi.');
}
function deletePlanTask(id){
  PLAN_TASKS = PLAN_TASKS.filter(x => x.id !== id);
  closeModal(); renderContent(); showToast('Blok silindi.');
}

// ---- Gelir Gider Raporu (kategori kırılımlı) ----
let katRaporBas = '2026-01-01';
let katRaporBit = new Date().toISOString().slice(0,10);
function isoToMs(s){ const d = new Date(s + 'T00:00:00'); return isNaN(d) ? 0 : d.getTime(); }
function kayitTarihMs(x){ return trTarihMs(x.tarih) || isoToMs(x.tarih); }
function katFiltre(list){
  const b = isoToMs(katRaporBas), s = isoToMs(katRaporBit) + 86399999;
  return list.filter(x => { const t = kayitTarihMs(x); return !t || (t >= b && t <= s); });
}
function katGrupla(list, rampa){
  const map = new Map();
  list.forEach(x => {
    const key = x.kategoriId || '__yok';
    if(!map.has(key)) map.set(key, { id:key, ad: x.kategoriId ? kategoriAdi(x.kategoriId) : 'Kategorisiz', toplam:0, adet:0 });
    const g = map.get(key);
    g.toplam += Number(x.tutar)||0; g.adet++;
  });
  const arr = [...map.values()].sort((a,b) => Math.abs(b.toplam) - Math.abs(a.toplam));
  let i = 0;
  arr.forEach(g => { g.renk = (g.id === '__yok') ? 'var(--cat-none)' : rampa[i++ % rampa.length]; });
  return arr;
}
function katDonutGradient(gruplar){
  const toplam = gruplar.reduce((s,g)=> s + Math.abs(g.toplam), 0);
  if(!toplam) return 'conic-gradient(var(--surface-sunk) 0deg 360deg)';
  const bosluk = gruplar.length > 1 ? 2 : 0;      // dilimler arası 2° yüzey boşluğu
  let acc = 0; const parts = [];
  gruplar.forEach(g => {
    const deg = (Math.abs(g.toplam) / toplam) * 360;
    const son = acc + Math.max(deg - bosluk, 0.6);
    parts.push(`${g.renk} ${acc.toFixed(2)}deg ${son.toFixed(2)}deg`);
    if(bosluk) parts.push(`var(--surface) ${son.toFixed(2)}deg ${(acc+deg).toFixed(2)}deg`);
    acc += deg;
  });
  return `conic-gradient(${parts.join(',')})`;
}

function rapYazdirBas(){
  const kir = document.getElementById('ryKirilim');

function rapYazdirHtml(v, kagit, toplamVar, zebra){
  const [boy, yon] = kagit.split('-');
  const [enMm, boyMm] = RAP_SAYFA_MM[kagit] || RAP_SAYFA_MM['a4-yatay'];

  const sayfalar = [];
  for(let i = 0; i < v.satirlar.length; i += satirBasina) sayfalar.push(v.satirlar.slice(i, i + satirBasina));
  const bugun = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const sagMi = i => v.kolonlar[i] && v.kolonlar[i].sag;
  const hucre = (h, i) => `<td class="${sagMi(i) ? 'sag' : ''}">${h == null ? '' : h}</td>`;

  const govde = sayfalar.map((sf, si) => `

        <colgroup><col style="width:34px;">${v.kolonlar.map(k => `<col${k.g ? ` style="width:${k.g};"` : ''}>`).join('')}</colgroup>
        <thead><tr><th class="no">No</th>${v.kolonlar.map(k => `<th class="${k.sag ? 'sag' : ''}">${notEsc(k.ad)}</th>`).join('')}</tr></thead>
        <tbody>${sf.map((r, i) => `<tr><td class="no">${si * satirBasina + i + 1}</td>${r.hucreler.map(hucre).join('')}</tr>`).join('')}</tbody>
        ${toplamVar ? `<tfoot>
          ${sayfalar.length > 1 ? `<tr class="ara"><td></td>${araToplam(sf)}</tr>` : ''}

        </tfoot>` : ''}
      </table>
      <div class="alt">
        <span>${notEsc(v.not || 'ROTA — Dekant Endüstriyel Reklam')}</span>
        <span>${si + 1} / ${sayfalar.length}</span>
      </div>
    </section>`).join('');
  return `<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>${notEsc(v.baslik)}</title><style>
    @page{ size:${boy.toUpperCase()} ${yon === 'yatay' ? 'landscape' : 'portrait'}; margin:9mm; }
    *{box-sizing:border-box;}
    body{margin:0;font:11px/1.4 'Segoe UI',system-ui,-apple-system,sans-serif;color:#111827;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .sayfa{page-break-after:always;break-after:page;display:flex;flex-direction:column;
      width:${enMm}mm;height:${boyMm}mm;overflow:hidden;}
    .sayfa:last-child{page-break-after:auto;break-after:auto;}
    .bas{background:#0F172A;color:#fff;text-align:center;padding:9px 12px;border-radius:5px;
      font-size:14px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;}
    .ust{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:9px 2px 7px;font-size:10.5px;color:#475569;}
    .ust .firma{font-weight:700;color:#0F172A;font-size:11.5px;}
    .ust .tarih{font-variant-numeric:tabular-nums;}
    table{width:100%;border-collapse:collapse;table-layout:fixed;}
    th{background:#E2E8F0;border:1px solid #94A3B8;padding:5px 6px;font-size:9.5px;font-weight:700;
      text-transform:uppercase;letter-spacing:.4px;color:#0F172A;text-align:left;}
    td{border:1px solid #CBD5E1;padding:3.5px 6px;font-size:10.5px;vertical-align:top;word-wrap:break-word;}

    ${v.kolonlar.length > 8 ? 'td,th{padding:2.5px 3px;font-size:9px;} th{font-size:8.5px;letter-spacing:0;}' : ''}
  </style></head><body>${govde}</body></html>`;
}

// Ekrandaki rapora göre yazdırma verisi
function rapYazdirVeri(){
  if(raporlarSub === 'odemeler-raporu')    return rapVeriAcik('odeme');
  if(raporlarSub === 'tahsilatlar-raporu') return rapVeriAcik('tahsilat');
  if(raporlarSub === 'alis-raporu')  return rapVeriAlisSatis('alis');
  if(raporlarSub === 'satis-raporu') return rapVeriAlisSatis('satis');
  if(raporlarSub === 'cari-durum')         return rapVeriCariDurum();
  if(raporlarSub === 'kdv-raporu')         return rapVeriKdv();
  if(raporlarSub === 'gelir-gider-raporu') return rapVeriGelirGider();
  return { baslik:'Rapor', altBaslik:'', kolonlar:[], satirlar:[] };
}
function rapVadeNotu(){
  const g = RAP_VADE_GRUP.find(x => x.key === rapVade);
  return g ? '  ·  ' + g.ad : '';
}
function rapAralikMetni(){
  const g = i => i.split('-').reverse().join('.');
  return g(rapBas) + ' – ' + g(rapBit);
}
function rapAraSuz(liste){
  const q = rapAra.trim().toLowerCase();
  return q ? liste.filter(c => (c.ad || '').toLowerCase().includes(q)) : liste;
}

function rapVeriAcik(yon){
  const odeme = yon === 'odeme';
  const bugun = chTarihSira(new Date().toLocaleDateString('tr-TR'));
  if(rapKirilim === 'gunluk'){
    const satir = [];
    rapAraSuz(rapDefterler()).forEach(c => c.d.rows
      .filter(r => !r.iptal && (odeme ? (r.alacakK && r.alacakKalanK > 0) : (r.borcK && r.kalanK > 0))
        && rapTarihAralikta(r.tarih) && (!rapVade || rapVadeDurumu(r, bugun) === rapVade))
      .forEach(r => satir.push({ c, r, tutarK: odeme ? r.alacakK : r.borcK, kalan: odeme ? r.alacakKalanK : r.kalanK })));
    satir.sort((a, b) => chTarihSira(a.r.vade || a.r.tarih).localeCompare(chTarihSira(b.r.vade || b.r.tarih)));
    return {
      baslik: (odeme ? 'Ödemeler' : 'Tahsilatlar') + ' Raporu — Belge Dökümü', altBaslik: rapAralikMetni() + rapVadeNotu(),
      not: 'Vade tarihine göre sıralanmıştır.',
      kolonlar: [ { ad:'Tarih', g:'74px' }, { ad:'Vade', g:'74px' }, { ad:'Cari Kodu', g:'80px' },
                  { ad:'Cari Adı', g:'24%' }, { ad:'Belge No', g:'92px' }, { ad:'Açıklama' },
                  { ad:'Tutar', sag:true, topla:true }, { ad:'Kalan', sag:true, topla:true } ],
      satirlar: satir.map(x => ({
        hucreler: [ chTarihTR(x.r.tarih), x.r.vade ? chTarihTR(x.r.vade) : '—', rapCariKodu(x.c.key),
                    notEsc(x.c.ad), notEsc(x.r.belgeNo || ''), notEsc(x.r.aciklama || ''),
                    chTL(x.tutarK), chTL(x.kalan) ],
        ham: [ 0, 0, 0, 0, 0, 0, x.tutarK, x.kalan ],
      })),
    };
  }
  const veri = rapAraSuz(rapDefterler().map(c => {
    const acik = c.d.rows.filter(r => !r.iptal && (odeme ? (r.alacakK && r.alacakKalanK > 0) : (r.borcK && r.kalanK > 0))
      && rapTarihAralikta(r.tarih) && (!rapVade || rapVadeDurumu(r, bugun) === rapVade))
      .map(r => ({ ...r, tutarK: odeme ? r.alacakK : r.borcK, kalan: odeme ? r.alacakKalanK : r.kalanK }));
    const gecen = acik.filter(r => r.vade && chTarihSira(r.vade) < bugun).reduce((s, r) => s + r.kalan, 0);
    return { ...c, adet: acik.length, toplamK: acik.reduce((s, r) => s + r.tutarK, 0),
      kalan: acik.reduce((s, r) => s + r.kalan, 0), gecen };
  }).filter(c => c.kalan > 0).sort((a, b) => b.kalan - a.kalan));
  return {
    baslik: odeme ? 'Ödemeler Raporu' : 'Tahsilatlar Raporu',
    altBaslik: rapAralikMetni() + rapVadeNotu(),
    not: odeme ? 'Açık alış faturaları ve borç kayıtları — cari bakiyelerinden hesaplanmıştır.'
               : 'Açık satış faturaları ve alacak kayıtları — cari bakiyelerinden hesaplanmıştır.',
    kolonlar: [ { ad:'Cari Kodu' }, { ad:'Cari Adı' }, { ad:'Belge', sag:true },
                { ad:'Toplam', sag:true, topla:true }, { ad:'Vadesi Geçen', sag:true, topla:true },
                { ad: odeme ? 'Kalan Borç' : 'Kalan Alacak', sag:true, topla:true } ],
    satirlar: veri.map(c => ({
      hucreler: [ rapCariKodu(c.key), notEsc(c.ad), String(c.adet), chTL(c.toplamK), c.gecen ? chTL(c.gecen) : '—', chTL(c.kalan) ],
      ham: [ 0, 0, 0, c.toplamK, c.gecen, c.kalan ],
    })),
  };
}
function rapCariKodu(key){
  const c = CUSTOMERS.find(x => x.id === key);
  return notEsc((c && c.cariKodu) || '');
}

function rapVeriAlisSatis(kind){
  const alis = kind === 'alis';
  const belgeTip = alis ? 'alis-faturasi' : 'satis-faturasi';
  const tutar = r => alis ? r.alacakK : r.borcK;
  const kalanOf = r => alis ? (r.alacakKalanK || 0) : (r.kalanK || 0);
  const baz = rapAraSuz(rapDefterler().map(c => ({
    ...c, rows: c.d.rows.filter(r => !r.iptal && r.tip === belgeTip && rapTarihAralikta(r.tarih)),
  })).filter(c => c.rows.length));
  const ortakAd = alis ? 'Alış' : 'Satış';

  // --- Günlük: belge belge döküm ---
  if(rapKirilim === 'gunluk'){
    const satir = [];
    baz.forEach(c => c.rows.forEach(r => satir.push({ c, r })));
    satir.sort((a, b) => chTarihSira(a.r.tarih).localeCompare(chTarihSira(b.r.tarih)));
    return {
      baslik: ortakAd + ' Raporu — Belge Dökümü', altBaslik: rapAralikMetni(),
      kolonlar: [ { ad:'Tarih', g:'74px' }, { ad:'Cari Kodu', g:'80px' }, { ad:'Cari Adı', g:'26%' },
                  { ad:'Belge No', g:'96px' }, { ad:'Açıklama' },
                  { ad:'Tutar', sag:true, topla:true }, { ad:'Kalan', sag:true, topla:true } ],
      satirlar: satir.map(({ c, r }) => ({
        hucreler: [ chTarihTR(r.tarih), rapCariKodu(c.key), notEsc(c.ad), notEsc(r.belgeNo || ''),
                    notEsc(r.aciklama || ''), chTL(tutar(r)), kalanOf(r) ? chTL(kalanOf(r)) : '' ],
        ham: [ 0, 0, 0, 0, 0, tutar(r), kalanOf(r) ],
      })),
    };
  }

  // --- Dönem matrisi: aylık / çeyrek / yıllık ---
  if(rapKirilim === 'aylik' || rapKirilim === 'ceyrek' || rapKirilim === 'yillik'){
    const yillar = [...new Set(baz.flatMap(c => c.rows.map(r => chTarihSira(r.tarih).slice(0, 4))).filter(Boolean))].sort();
    const sutunlar = rapKirilim === 'aylik' ? RAP_AYLAR
      : rapKirilim === 'ceyrek' ? ['1. Çeyrek', '2. Çeyrek', '3. Çeyrek', '4. Çeyrek']
      : yillar;
    const dizin = r => {
      const t = chTarihSira(r.tarih); if(!t) return -1;
      if(rapKirilim === 'yillik') return yillar.indexOf(t.slice(0, 4));
      const ay = parseInt(t.slice(5, 7), 10) - 1;
      return rapKirilim === 'aylik' ? ay : Math.floor(ay / 3);
    };
    const veri = baz.map(c => {
      const kutu = new Array(sutunlar.length).fill(0);
      c.rows.forEach(r => { const d = dizin(r); if(d >= 0) kutu[d] += tutar(r); });
      return { ...c, kutu, toplamK: kutu.reduce((s, x) => s + x, 0) };
    }).filter(c => c.toplamK).sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
    const donemAd = rapKirilim === 'aylik' ? 'Aylık' : (rapKirilim === 'ceyrek' ? 'Üç Aylık' : 'Yıllık');
    return {
      baslik: `Cari ${ortakAd} Listesi — ${donemAd}`, altBaslik: rapAralikMetni(),

function rapTarihAralikta(trTarih){

}

// Teklif temsilcisi olarak seçilebilecek personel — üretim personeli hariç
function teklifTemsilciSecenekleri(){
  return PERSONELLER.filter(p => !p.arsiv && p.departman !== 'Üretim').map(p => p.name);
}

// Temsilci bazlı özet: seçili tarih aralığındaki tüm teklifler üzerinden
function teklifRaporuVerisi(){
  const map = new Map();
  QUOTES.filter(q => rapTarihAralikta(q.date)).forEach(q => {
    const ad = q.repName || 'Belirtilmemiş';
    if(!map.has(ad)) map.set(ad, { ad, adet:0, tutar:0, iseDonusen:0, faturalandi:0, reddedildi:0 });
    const r = map.get(ad);
    r.adet++; r.tutar += quoteTotal(q);
    if(q.jobId) r.iseDonusen++;
    if(q.status === 'Faturalandı') r.faturalandi++;
    if(q.status === 'Reddedildi') r.reddedildi++;
  });
  return [...map.values()].sort((a, b) => b.tutar - a.tutar);
}
// Seçili bir temsilcinin dönem kırılımlı (aylık/üç aylık/yıllık) teklif tutarı grafiği + özeti
function teklifTemsilciDonemVerisi(ad){
  const liste = QUOTES.filter(q => (q.repName || 'Belirtilmemiş') === ad && rapTarihAralikta(q.date));
  const yillar = [...new Set(liste.map(q => chTarihSira(q.date).slice(0, 4)).filter(Boolean))].sort();
  const sutunlar = teklifKirilim === 'aylik' ? RAP_AYLAR
    : teklifKirilim === 'ceyrek' ? ['1. Çeyrek', '2. Çeyrek', '3. Çeyrek', '4. Çeyrek']
    : (yillar.length ? yillar : [String(new Date().getFullYear())]);
  const dizin = q => {
    const t = chTarihSira(q.date); if(!t) return -1;
    if(teklifKirilim === 'yillik') return yillar.indexOf(t.slice(0, 4));
    const ay = parseInt(t.slice(5, 7), 10) - 1;
    return teklifKirilim === 'aylik' ? ay : Math.floor(ay / 3);
  };
  const kutu = new Array(sutunlar.length).fill(0);
  liste.forEach(q => { const d = dizin(q); if(d >= 0) kutu[d] += quoteTotal(q); });
  return {
    sutunlar, kutu, adet: liste.length, toplam: liste.reduce((s, q) => s + quoteTotal(q), 0),
    iseDonusen: liste.filter(q => q.jobId).length,
    faturalandi: liste.filter(q => q.status === 'Faturalandı').length,
    reddedildi: liste.filter(q => q.status === 'Reddedildi').length,
  };
}
// Müşteri sıralaması: gerçek cari defterindeki satış faturası (Kabul Edildi + Faturalandı) toplamına göre, azalan
function teklifMusteriSiralamasi(){
  const map = new Map();
  cariTumSatirlar().forEach(r => {
    if(r.iptal || r.tip !== 'satis-faturasi' || !rapTarihAralikta(r.tarih)) return;
    if(!map.has(r.key)) map.set(r.key, { key: r.key, ad: r.ad, tutarK: 0, adet: 0 });
    const c = map.get(r.key);
    if(r.ad && (!c.ad || c.ad === 'Müşteri seçilmedi')) c.ad = r.ad;
    c.tutarK += r.borcK; c.adet++;
  });
  return [...map.values()].sort((a, b) => b.tutarK - a.tutarK);
}

// Tüm cariler için defterleri tek seferde çıkarır (tek tek cariDefter çağırmak yavaş kalır)
function rapDefterler(){
  return cariOzetListesi(true).map(c => ({ key: c.key, ad: c.ad,
    tedarikci: (CUSTOMERS.find(x => x.id === c.key) || {}).durum === 'Tedarikçi',
    d: cariDefter(c.key) }));
}

// ---- Ortak tablo: cari bazlı, açılır belge listesi ----
function rapCariTablo(satirlar, basliklar, bosMetin){
  if(!satirlar.length) return `<div class="empty-state">${bosMetin}</div>`;
  return `
    <div class="rap-tablo">
      <div class="rap-baslik">${basliklar.map((b, i) => `<span class="${i ? 'sag' : ''}">${b}</span>`).join('')}</div>
      ${satirlar.join('')}
    </div>`;
}
function rapBelgeSatiri(r){
  return `<div class="rap-belge">
    <span>${chRozet(r.tip)} <span class="rap-belge-no">${notEsc(r.belgeNo) || '—'}</span> ${chTarihTR(r.tarih)}</span>
    <span class="rap-belge-ac">${notEsc(r.aciklama || '')}</span>
    <span class="sag">${r.vade ? 'Vade ' + chTarihTR(r.vade) : ''}</span>
    <span class="sag">${chTL(r.tutarK)}</span>
    <span class="sag"><b>${chTL(r.kalan)}</b></span>
  </div>`;
}

// ---------- 1) ÖDEMELER RAPORU — bizim tedarikçilere borcumuz ----------
// Vade durumu — açık belgeler için ortak sınıflandırma
const RAP_VADE_GRUP = [
  { key:'gecmis', ad:'Vadesi Geçmiş',   renk:'var(--risk)'   },
  { key:'ileri',  ad:'İleri Tarihli',   renk:'var(--signal)' },
  { key:'yok',    ad:'Vade Tarihi Yok', renk:'var(--ink-3)'  },
];
function rapVadeDurumu(r, bugun){
  if(!r.vade) return 'yok';
  return chTarihSira(r.vade) < bugun ? 'gecmis' : 'ileri';
}
// Halka grafik — dolu kısım oranı kadar renkli
function rapDonut(etiket, tutarK, oran, renk){
  const derece = Math.max(0, Math.min(1, oran)) * 360;
  const metin = chTL(tutarK);
  // Tutar halkanın içine tek satırda sığsın. İç çember 128px, iki yandan 8px pay;
  // Inter tabular rakamlarda karakter genişliği ≈ 0.60em olduğundan punto buradan çıkar.
  const u = Math.max(metin.length, 1);
  const punto = Math.max(11, Math.min(22, Math.floor((140 - 14) / (u * 0.57) * 10) / 10));
  return `
    <div class="rap-donut-kutu">
      <div class="rap-donut" style="background:conic-gradient(${renk} 0deg ${derece.toFixed(1)}deg, var(--surface-sunk,#eceff3) ${derece.toFixed(1)}deg 360deg);">
        <div class="rap-donut-ic"><b style="font-size:${punto}px;">${metin}</b></div>
      </div>
      <div class="rap-donut-ad" style="color:${renk};">${etiket}</div>
    </div>`;
}

// ---------- 1-2) ÖDEMELER / TAHSİLATLAR ----------
function odemelerRaporuView(){ return rapAcikRaporView('odeme'); }
function tahsilatlarRaporuView(){ return rapAcikRaporView('tahsilat'); }

function rapAcikRaporView(yon){
  const odeme = yon === 'odeme';
  const bugun = chTarihSira(new Date().toLocaleDateString('tr-TR'));
  // Cari + açık belgeleri, vade durumuna göre ayrılmış
  const cariler = rapDefterler().map(c => {
    const acik = c.d.rows
      .filter(r => !r.iptal && (odeme ? (r.alacakK && r.alacakKalanK > 0) : (r.borcK && r.kalanK > 0)) && rapTarihAralikta(r.tarih))
      .map(r => ({ ...r, tutarK: odeme ? r.alacakK : r.borcK, kalan: odeme ? r.alacakKalanK : r.kalanK,
        vadeDurum: rapVadeDurumu(r, bugun) }));
    return { ...c, acik };
  }).filter(c => c.acik.length);

  const toplamlar = { gecmis:0, ileri:0, yok:0 };
  cariler.forEach(c => c.acik.forEach(r => { toplamlar[r.vadeDurum] += r.kalan; }));
  const genel = toplamlar.gecmis + toplamlar.ileri + toplamlar.yok;

  const secili = RAP_VADE_GRUP;
  const govde = secili.map(g => {
    const liste = cariler.map(c => ({ ...c, satirlar: c.acik.filter(r => r.vadeDurum === g.key) }))
      .filter(c => c.satirlar.length)
      .map(c => ({ ...c, kalan: c.satirlar.reduce((s, r) => s + r.kalan, 0) }))
      .sort((a, b) => b.kalan - a.kalan);
    if(!liste.length) return '';
    return `
      <div class="rap-grup-basi ${rapGrupKapali[g.key] ? 'kapali' : ''}" style="--grup:${g.renk};"
        onclick="rapGrupAcKapa('${g.key}')" title="${rapGrupKapali[g.key] ? 'Aç' : 'Simge durumuna küçült'}">
        <span><i class="rap-grup-ikon">${rapGrupKapali[g.key] ? '＋' : '—'}</i>${g.ad}</span>
        <span>${liste.length} cari · <b>${chTL(toplamlar[g.key])}</b></span>
      </div>
      ${rapGrupKapali[g.key] ? '' : liste.map(c => `
        <details class="rap-cari" data-ad="${notEsc(c.ad).toLowerCase()}">
          <summary onclick="event.stopPropagation();">
            <span class="rap-ad">${notEsc(c.ad)}${c.tedarikci ? ' <span class="ch-durum turuncu">Tedarikçi</span>' : ''}</span>
            <span class="sag">${c.satirlar.length}</span>
            <span class="sag">${chTL(c.satirlar.reduce((s, r) => s + r.tutarK, 0))}</span>
            <span class="sag">${c.satirlar[0].vade ? chTarihTR(c.satirlar[0].vade) : '—'}</span>
            <span class="sag"><b style="color:${g.renk};">${chTL(c.kalan)}</b></span>
          </summary>
          ${c.satirlar.map(rapBelgeSatiri).join('')}
          <div class="rap-git"><button class="btn" onclick="rapCariAc('${c.key.replace(/'/g, "\\'")}')">Cari kartını aç →</button></div>
        </details>`).join('')}`;
  }).join('');

  return `
    <div class="list-page-head"><div><div class="page-title">${odeme ? 'Ödemeler Raporu' : 'Tahsilatlar Raporu'}</div>
      <div class="page-sub">${odeme ? 'Tedarikçilere ödenmemiş borçlar' : 'Müşterilerden tahsil edilmemiş alacaklar'} — cari kartlardaki bakiyelerden hesaplanır.</div></div>
      ${rapYazdirDugmesi()}</div>
    <div class="rap-donut-serit">
      ${rapDonut('Toplam', genel, 1, odeme ? 'var(--risk)' : 'var(--ok)')}
      ${rapDonut('Vadesi Gelmemiş', toplamlar.ileri, genel ? toplamlar.ileri / genel : 0, 'var(--signal)')}
    </div>
    ${rapFiltreBar(false)}
    ${govde ? `<div class="rap-tablo">
      <div class="rap-baslik"><span>Cari</span><span class="sag">Belge</span><span class="sag">Toplam</span>
        <span class="sag">İlk Vade</span><span class="sag">${odeme ? 'Kalan Borç' : 'Kalan Alacak'}</span></div>
      ${govde}</div>`
      : `<div class="empty-state">Bu aralıkta ${odeme ? 'ödenecek borç' : 'tahsil edilecek alacak'} görünmüyor.</div>`}`;
}
function rapGrupAcKapa(k){ rapGrupKapali[k] = !rapGrupKapali[k]; renderContent(); }

// ---------- 3-4) ALIŞ / SATIŞ RAPORU ----------
function alisSatisRaporuView(kind){
  const alis = kind === 'alis';
  const belgeTip = alis ? 'alis-faturasi' : 'satis-faturasi';
  const veri = rapDefterler().map(c => {
    const rows = c.d.rows.filter(r => !r.iptal && r.tip === belgeTip && rapTarihAralikta(r.tarih))
      .map(r => ({ ...r, tutarK: alis ? r.alacakK : r.borcK, kalan: alis ? (r.alacakKalanK || 0) : (r.kalanK || 0) }));
    const toplamK = rows.reduce((s, r) => s + r.tutarK, 0);
    const kalanK = rows.reduce((s, r) => s + r.kalan, 0);
    return { ...c, rows, toplamK, kalanK, odenenK: toplamK - kalanK };
  }).filter(c => c.rows.length).sort((a, b) => b.toplamK - a.toplamK);
  const toplam = veri.reduce((s, c) => s + c.toplamK, 0);
  const kalan = veri.reduce((s, c) => s + c.kalanK, 0);
  const belgeAdet = veri.reduce((s, c) => s + c.rows.length, 0);
  const satirlar = veri.map(c => `
    <details class="rap-cari" data-ad="${notEsc(c.ad).toLowerCase()}">
      <summary onclick="event.stopPropagation();">
        <span class="rap-ad">${notEsc(c.ad)}${c.tedarikci ? ' <span class="ch-durum turuncu">Tedarikçi</span>' : ''}</span>
        <span class="sag">${c.rows.length}</span>
        <span class="sag"><b>${chTL(c.toplamK)}</b></span>
        <span class="sag" style="color:var(--ok);">${chTL(c.odenenK)}</span>
        <span class="sag" style="color:${c.kalanK ? 'var(--risk)' : 'var(--ink-3)'};">${chTL(c.kalanK)}</span>
      </summary>
      ${c.rows.map(rapBelgeSatiri).join('')}
      <div class="rap-git"><button class="btn" onclick="rapCariAc('${c.key.replace(/'/g, "\\'")}')">Cari kartını aç →</button></div>
    </details>`);
  return `
    <div class="list-page-head"><div><div class="page-title">${alis ? 'Alış Raporu' : 'Satış Raporu'}</div>
      <div class="page-sub">${alis ? 'Tedarikçilerden yapılan alışlar (giderlerde cari seçilmiş kayıtlar).'
        : 'Kabul edilen ve faturalanan teklifler — cari kartlarındaki satış faturaları.'}</div></div>
      ${rapYazdirDugmesi()}</div>
    ${rapKpi([[alis ? 'Toplam alış' : 'Toplam satış', chTL(toplam)],
              [alis ? 'Ödenen' : 'Tahsil edilen', chTL(toplam - kalan), 'var(--ok)'],
              ['Kalan', chTL(kalan), kalan ? 'var(--risk)' : 'var(--ink-3)'],
              ['Belge / Cari', belgeAdet + ' / ' + veri.length]])}
    ${rapFiltreBar(false)}
    ${rapCariTablo(satirlar, ['Cari', 'Belge', 'Toplam', alis ? 'Ödenen' : 'Tahsil Edilen', 'Kalan'],
        `Bu aralıkta ${alis ? 'alış' : 'satış'} kaydı yok.`)}`;
}

// ---------- 5) GELİR-GİDER: cari kırılımı ----------
function gelirGiderCariTablosu(){
  const veri = rapDefterler().map(c => {
    const rows = c.d.rows.filter(r => !r.iptal && rapTarihAralikta(r.tarih));
    const tahsilat = rows.filter(r => r.tip === 'tahsilat').reduce((s, r) => s + r.alacakK, 0);
    const odeme = rows.filter(r => r.tip === 'odeme').reduce((s, r) => s + r.borcK, 0);
    return { ...c, tahsilat, odeme, net: tahsilat - odeme, bakiyeK: c.d.bakiyeK };
  }).filter(c => c.tahsilat || c.odeme).sort((a, b) => (b.tahsilat + b.odeme) - (a.tahsilat + a.odeme));
  const tT = veri.reduce((s, c) => s + c.tahsilat, 0);
  const tO = veri.reduce((s, c) => s + c.odeme, 0);
  const satirlar = veri.map(c => `
    <div class="rap-cari rap-duz" data-ad="${notEsc(c.ad).toLowerCase()}" onclick="rapCariAc('${c.key.replace(/'/g, "\\'")}')">
      <span class="rap-ad">${notEsc(c.ad)}</span>
      <span class="sag" style="color:var(--ok);">${c.tahsilat ? chTL(c.tahsilat) : '—'}</span>
      <span class="sag" style="color:var(--risk);">${c.odeme ? chTL(c.odeme) : '—'}</span>
      <span class="sag"><b>${chTL(c.net)}</b></span>
      <span class="sag" style="color:${c.bakiyeK > 0 ? 'var(--ok)' : (c.bakiyeK < 0 ? 'var(--risk)' : 'var(--ink-3)')};">${chTL(c.bakiyeK)}</span>
    </div>`);
  return `
    <div class="rap-bolum-baslik">Cari Bazlı Nakit Akışı
      <span>Tahsilat ${chTL(tT)} · Ödeme ${chTL(tO)} · Net ${chTL(tT - tO)} &nbsp; ${rapYazdirDugmesi()}</span></div>
    ${rapFiltreBar(false)}
    ${rapCariTablo(satirlar, ['Cari', 'Tahsilat', 'Ödeme', 'Net', 'Güncel Bakiye'],
      'Bu aralıkta cariye bağlı tahsilat / ödeme yok.')}`;
}


// ---------------- KDV RAPORU ----------------
// Hesaplanan KDV: durumu "Faturalandı" olan teklifler (satır bazında KDV oranı).
// İndirilecek KDV: gider kayıtlarındaki KDV (tutar KDV dahil girilir, matrah/KDV ayrışır).
// Devir: bir ayda indirilecek fazlaysa fark sonraki aya "devreden KDV" olarak taşınır.
function kdvAyAdi(anahtar){
  const d = new Date(anahtar + '-01T00:00:00');
  return isNaN(d) ? anahtar : d.toLocaleDateString('tr-TR', { month:'long', year:'numeric' });
}
function kdvAyAnahtar(tarih){
  const t = chTarihSira(tarih);                 // yyyy-aa-gg
  return t ? t.slice(0, 7) : '';
}
function kdvSatislar(){
  return QUOTES.filter(q => q.status === 'Faturalandı' && q.date).map(q => {
    const cst = CUSTOMERS.find(x => x.id === q.customerId);
    return { ay: kdvAyAnahtar(q.date), tarih: q.date, belgeNo: q.no || '',
      ad: (cst && cst.name) || q.musteriAdi || 'Müşteri',
      matrahK: Math.round(quoteSub(q) * 100), kdvK: Math.round(quoteKdvAmount(q) * 100),
      kaynak: { tip:'teklif', id: q.id } };
  }).filter(x => x.ay);
}
function kdvAlislar(){
  return (GIDERLER || []).filter(g => g.kdvK && g.tarih).map(g => ({
    ay: kdvAyAnahtar(g.tarih), tarih: g.tarih, belgeNo: g.belgeNo || '',
    ad: g.client || g.tur || 'Gider', oran: g.kdvOran || 0,
    matrahK: g.matrahK || 0, kdvK: g.kdvK || 0,
  })).filter(x => x.ay);
}
// Aylar eskiden yeniye hesaplanır ki devir doğru aksın; gösterimde ters çevrilir.
function kdvDonemleri(){
  const sat = kdvSatislar(), alis = kdvAlislar();
  const aylar = [...new Set([...sat, ...alis].map(x => x.ay))].sort();
  let devirK = 0;
  const satirlar = aylar.map(ay => {
    const s = sat.filter(x => x.ay === ay), a = alis.filter(x => x.ay === ay);
    const hesaplananK = s.reduce((t, x) => t + x.kdvK, 0);
    const indirilecekK = a.reduce((t, x) => t + x.kdvK, 0);
    const oncekiDevirK = devirK;
    const netK = hesaplananK - indirilecekK - oncekiDevirK;
    const odenecekK = netK > 0 ? netK : 0;
    const sonrakiDevirK = netK < 0 ? -netK : 0;
    devirK = sonrakiDevirK;
    return { ay, ad: kdvAyAdi(ay), hesaplananK, indirilecekK, oncekiDevirK, odenecekK, devredenK: sonrakiDevirK,
      satisMatrahK: s.reduce((t, x) => t + x.matrahK, 0), alisMatrahK: a.reduce((t, x) => t + x.matrahK, 0),
      satisBelge: s.length, alisBelge: a.length, satislar: s, alislar: a };
  });
  return satirlar.reverse();
}
let kdvAcikAy = '';
function kdvAyAcKapa(ay){ kdvAcikAy = kdvAcikAy === ay ? '' : ay; renderContent(); }

function kdvRaporuView(){
  const donemler = kdvDonemleri();

  return `

      ${rapYazdirDugmesi()}</div>
    <div class="warn-banner">⚠️ Bu rapor beyanname yerine geçmez; tevkifat, istisna ve iade işlemlerini içermez. Mali müşavirinizin hesabıyla karşılaştırın.</div>
    ${rapKpi([
      ['Bu ay hesaplanan', suanki ? chTL(suanki.hesaplananK) : '—'],
      ['Bu ay indirilecek', suanki ? chTL(suanki.indirilecekK) : '—', 'var(--ok)'],
      ['Bu ay ödenecek', suanki ? chTL(suanki.odenecekK) : '—', suanki && suanki.odenecekK ? 'var(--risk)' : 'var(--ink-3)'],
      ['Sonraki aya devreden', chTL(sonDevir), sonDevir ? 'var(--signal)' : 'var(--ink-3)'],
    ])}
    ${donemler.length ? `
    <div class="kdv-tablo-kap">
      <table class="kdv-tablo">
        <thead><tr>
          <th>Dönem</th><th class="sag">Satış Matrahı</th><th class="sag">Hesaplanan KDV</th>
          <th class="sag">Alış Matrahı</th><th class="sag">İndirilecek KDV</th>
          <th class="sag">Devreden (önceki)</th><th class="sag">Ödenecek</th><th class="sag">Sonraki aya devir</th>
        </tr></thead>
        <tbody>${donemler.map(d => `
          <tr class="kdv-satir ${kdvAcikAy === d.ay ? 'acik' : ''}" onclick="kdvAyAcKapa('${d.ay}')">
            <td><i class="rap-grup-ikon" style="--grup:var(--ink-3);">${kdvAcikAy === d.ay ? '—' : '＋'}</i>${d.ad}</td>
            <td class="sag">${chTL(d.satisMatrahK)}</td>
            <td class="sag">${chTL(d.hesaplananK)}</td>
            <td class="sag">${chTL(d.alisMatrahK)}</td>
            <td class="sag" style="color:var(--ok);">${chTL(d.indirilecekK)}</td>
            <td class="sag" style="color:var(--ink-3);">${d.oncekiDevirK ? chTL(d.oncekiDevirK) : '—'}</td>
            <td class="sag"><b style="color:${d.odenecekK ? 'var(--risk)' : 'var(--ink-3)'};">${d.odenecekK ? chTL(d.odenecekK) : '—'}</b></td>
            <td class="sag" style="color:var(--signal);">${d.devredenK ? chTL(d.devredenK) : '—'}</td>
          </tr>
          ${kdvAcikAy === d.ay ? `<tr class="kdv-detay-satir"><td colspan="8">
            <div class="kdv-detay">
              <div>
                <h4>Satış belgeleri <span>${d.satisBelge}</span></h4>
                ${d.satislar.length ? d.satislar.map(x => `<div class="kdv-belge" onclick="event.stopPropagation(); chKaynagaGit('teklif','${x.kaynak.id}')">
                  <span>${chTarihTR(x.tarih)}</span><span class="kdv-belge-ad">${notEsc(x.ad)}</span>
                  <span class="kdv-belge-no">${notEsc(x.belgeNo)}</span>
                  <span class="sag">${chTL(x.matrahK)}</span><span class="sag"><b>${chTL(x.kdvK)}</b></span>
                </div>`).join('') : '<div class="kdv-bos">Bu ay faturalanmış teklif yok.</div>'}
              </div>
              <div>
                <h4>Alış belgeleri <span>${d.alisBelge}</span></h4>
                ${d.alislar.length ? d.alislar.map(x => `<div class="kdv-belge">
                  <span>${chTarihTR(x.tarih)}</span><span class="kdv-belge-ad">${notEsc(x.ad)}</span>
                  <span class="kdv-belge-no">%${x.oran}</span>
                  <span class="sag">${chTL(x.matrahK)}</span><span class="sag"><b>${chTL(x.kdvK)}</b></span>
                </div>`).join('') : '<div class="kdv-bos">Bu ay KDV\'li gider kaydı yok.</div>'}
              </div>
            </div></td></tr>` : ''}
        `).join('')}</tbody>
        <tfoot><tr><td>TOPLAM</td><td colspan="5"></td>
          <td class="sag">${chTL(toplamOdenecek)}</td><td class="sag">${chTL(sonDevir)}</td></tr></tfoot>
      </table>
    </div>`
    : `<div class="empty-state">Henüz KDV doğuran kayıt yok. Hesaplanan KDV için teklif durumunu <b>Faturalandı</b> yapın; indirilecek KDV için giderleri KDV oranıyla girin.</div>`}`;
}
// Sadece gerçekten kasa/bankadan para giren/çıkan kayıtlar listelenir — henüz ödenmemiş

// ---- Kasa/Banka bakiyesi ↔ Gelir/Gider bağlantısı ----
// Hesap bakiyeleri elle girilir (Kasa ve Banka > Düzenle) ve bu andan itibaren
// yeni tahsilat/ödeme kayıtları bakiyeye otomatik işlenir (var olan bakiyeyi geriye dönük değiştirmez).
function hesapAdindanBul(ad){
  if(!ad) return null;
  return KASA_ACCOUNTS.find(a => a.name === ad) || BANK_ACCOUNTS.find(a => a.name === ad) || null;
}
function hesapBakiyeDeltaUygula(hesapAdi, tutarTL){
  const a = hesapAdindanBul(hesapAdi);
  if(!a || !tutarTL) return;
  a.balance = Math.round(((Number(a.balance) || 0) + Number(tutarTL)) * 100) / 100;
}
// Bir gelir kaydı her zaman gerçek nakit girişidir (Gelirler = tahsilat, tahakkuk değil).
function gelirNakitEtkisi(g){ return g ? (Number(g.tutar) || 0) : 0; }
// Bir gider kaydının nakit çıkışı doğurup doğurmadığı: cariye bağlıysa "alış" (henüz ödenmedi)
// hariç her durumda, cariye bağlı değilse yalnızca "odendi" işaretliyse nakit hareketi sayılır.
function giderNakitEtkisi(g){
  if(!g) return 0;
  const tutar = Number(g.tutar) || 0;
  if(!tutar) return 0;
  if(g.customerId){
    const etki = g.cariTip || (g.odendi ? 'alis-odeme' : 'alis');
    return etki === 'alis' ? 0 : tutar;
  }
  return g.odendi ? tutar : 0;
}

// Faturalar ekranı: gerçek cari defterinden türetilir.
// Satış faturası = durumu "Faturalandı" olan teklifler (KDV raporuyla tutarlı — "Kabul Edildi" henüz resmi fatura değildir).
// Alış faturası = cariye bağlı ve fatura niteliğindeki giderler (Giderler ekranında girildiği an fatura sayılır).
// Kalan tutarlar cariDefter() içindeki FIFO hesabından okunur, böylece yapılan tahsilat/ödemeler faturaya yansır.
function faturaListesi(){
  const out = [];
  const keys = new Set(cariTumSatirlar().map(r => r.key));
  keys.forEach(key => {
    const def = cariDefter(key);
    def.rows.forEach(r => {
      if(r.iptal) return;
      if(r.tip === 'satis-faturasi'){
        const q = (r.kaynak && r.kaynak.tip === 'teklif') ? QUOTES.find(x => x.id === r.kaynak.id) : null;
        if(!q || q.status !== 'Faturalandı') return; // henüz resmi fatura kesilmemiş (Kabul Edildi) teklifler burada listelenmez
        out.push({ tur:'Satış Faturası', client:r.ad, no:r.belgeNo, tarih:r.tarih, vade:r.vade,
          tutarK:r.borcK, kalanK:r.kalanK || 0, quoteId:q.id });
      } else if(r.tip === 'alis-faturasi'){
        out.push({ tur:'Alış Faturası', client:r.ad, no:r.belgeNo, tarih:r.tarih, vade:r.vade,
          tutarK:r.alacakK, kalanK:r.alacakKalanK || 0, giderId:(r.kaynak && r.kaynak.id) });
      }
    });
  });
  out.sort((a, b) => chTarihSira(b.tarih).localeCompare(chTarihSira(a.tarih)));
  return out;
}
function faturaVadeMetni(vade){
  if(!vade) return 'Vade tarihi yok';
  const bugunIso = chTarihSira(new Date().toLocaleDateString('tr-TR'));
  const vadeIso = chTarihSira(vade);
  if(!vadeIso) return 'Vade tarihi yok';
  const gun = Math.round((new Date(vadeIso) - new Date(bugunIso)) / 86400000);
  const etiket = gun === 0 ? 'Bugün' : gun > 0 ? `${gun} Gün Kaldı` : `${Math.abs(gun)} Gün Geçti`;
  return `${chTarihTR(vade)} · ${etiket}`;
}

const KDV_ORANLARI = [20, 10, 1, 0];
// KDV dahil tutardan matrah ve KDV ayrıştırır (kuruş, tam sayı)
function kdvAyir(dahilTutar, oran){
  const dahilK = Math.round((Number(dahilTutar) || 0) * 100);
  const o = Number(oran) || 0;
  const matrahK = Math.round(dahilK / (1 + o / 100));
  return { dahilK, matrahK, kdvK: dahilK - matrahK, oran: o };
}
function gKdvBilgiYaz(){
  const kutu = document.getElementById('gKdvBilgi'); if(!kutu) return;
  const t = (document.getElementById('gTutar') || {}).value;
  const o = (document.getElementById('gKdv') || {}).value;
  const a = kdvAyir(t, o);
  kutu.innerHTML = a.dahilK
    ? `Matrah <b>${chTL(a.matrahK)}</b> · KDV <b>${chTL(a.kdvK)}</b> · Toplam <b>${chTL(a.dahilK)}</b>`
    : 'Tutarı KDV dahil yazın; matrah ve KDV otomatik ayrışır.';
}
function submitGider(){
  const f = GIDER_FORMLARI[giderFormTur] || GIDER_FORMLARI.odeme;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const tutar = Number(val('gTutar')) || 0;
  if(!tutar){ showToast('Tutar girin.'); return; }
  const cust = CUSTOMERS.find(c => c.id === val('gTedarikci'));
  let baslik = null, tur = f.tur;
  if(cust) baslik = cust.name;
  else if(giderFormTur === 'tekrarlayan'){ baslik = val('gAd') || 'Tekrarlayan Gider';
                                           tur = f.tur + ' · ' + val('gSiklik'); }
  else if(giderFormTur === 'sigorta')      tur = f.tur + (val('gDonem') ? ' · ' + val('gDonem') : '');
  else if(giderFormTur === 'banka')        tur = val('gAltTur') || f.tur;
  else if(giderFormTur === 'vergi')        tur = (val('gAltTur') || f.tur) + (val('gDonem') ? ' · ' + val('gDonem') : '');
  const aciklama = val('gAciklama');
  const yeniGider = {
    id: benzersizId('gi'),
    client: baslik,
    customerId: cust ? cust.id : null,
    kdvOran: Number(val('gKdv')) || 0,
    kdvK: kdvAyir(tutar, val('gKdv')).kdvK,
    matrahK: kdvAyir(tutar, val('gKdv')).matrahK,
    cariTip: cust ? (val('gCariEtki') || 'alis-odeme') : null,
    hesap: val('gHesap'),
    tur: aciklama ? tur + ' — ' + aciklama : tur,
    tarih: val('gTarih'),
    tutar: tutar,
    odendi: giderFormTur !== 'tekrarlayan',
    kategoriId: val('gKategori') || null,
  };
  GIDERLER.unshift(yeniGider);
  hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
  giderStep = 'list';
  renderContent();
  showToast(`${f.label} kaydedildi — ₺${tutar.toLocaleString('tr-TR')}`);
}

  const g = GIDERLER.find(x => x.id === id); if(!g) return;

let KATEGORILER = [
  { id:'kg1', ad:'Mobilya Satış', tip:'gelir' },
  { id:'kg2', ad:'Tabela İşleri', tip:'gelir' },
  { id:'kd1', ad:'Mutfak',        tip:'gider' },
  { id:'kd2', ad:'Maaş',          tip:'gider', sistem:true },
  { id:'kd3', ad:'Mesai',         tip:'gider', sistem:true },
  { id:'kd4', ad:'Malzeme Alımı', tip:'gider' },
];
const GELIR_RAMPA = ['var(--cat-g1)','var(--cat-g2)','var(--cat-g3)','var(--cat-g4)','var(--cat-g5)'];
const GIDER_RAMPA = ['var(--cat-r1)','var(--cat-r2)','var(--cat-r3)','var(--cat-r4)','var(--cat-r5)'];

function kategorilerByTip(tip){ return KATEGORILER.filter(k => k.tip === tip); }
function kategoriAdi(id){ const k = KATEGORILER.find(x => x.id === id); return k ? k.ad : 'Kategorisiz'; }
function kategoriIdByAd(ad, tip){
  const k = KATEGORILER.find(x => x.tip === tip && x.ad.toLowerCase() === String(ad).toLowerCase());
  return k ? k.id : null;
}
function kategoriSelectHtml(id, tip, secili){
  return `<div style="display:flex;gap:8px;align-items:center;">
    <select id="${id}" style="flex:1;">
      <option value="">Kategorisiz</option>
      ${kategorilerByTip(tip).map(k => `<option value="${k.id}" ${secili === k.id ? 'selected' : ''}>${k.ad}</option>`).join('')}
    </select>
    <button class="btn" style="flex:0 0 auto;height:36px;" onclick="openKategoriModal('${tip}','${id}')">+ Yeni</button>
  </div>`;
}
function openKategoriModal(tip, hedefSelectId){
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Yeni ${tip === 'gelir' ? 'Gelir' : 'Gider'} Kategorisi</h2>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Kategori Adı</label>
      <input id="ktAd" placeholder="${tip === 'gelir' ? 'Örn. Kira Geliri' : 'Örn. Mutfak'}"></div>
    <button class="modal-submit" onclick="submitKategori('${tip}','${hedefSelectId || ''}')">Ekle</button>`;
  showModal();
}
function submitKategori(tip, hedefSelectId){
  const ad = document.getElementById('ktAd').value.trim();
  if(!ad){ showToast('Kategori adı girin.'); return; }
  if(kategoriIdByAd(ad, tip)){ showToast('Bu kategori zaten var.'); return; }
  const yeni = { id:'k'+Date.now(), ad:ad, tip:tip };
  KATEGORILER.push(yeni);
  closeModal();
  const sel = hedefSelectId ? document.getElementById(hedefSelectId) : null;
  if(sel){
    const opt = document.createElement('option');
    opt.value = yeni.id; opt.textContent = yeni.ad; opt.selected = true;
    sel.appendChild(opt);
  } else {
    renderContent();
  }
  showToast(`"${ad}" kategorisi eklendi.`);
}
function openKategoriDuzenle(id){
  const k = KATEGORILER.find(x => x.id === id);
  if(!k || k.sistem){ showToast('Bu kategori düzenlenemez.'); return; }
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Kategoriyi Yeniden Adlandır</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Kategori Adı</label><input id="ktAd" value="${notEsc(k.ad)}"></div>
    <button class="modal-submit" onclick="submitKategoriDuzenle('${id}')">Kaydet</button>`;
  showModal();
}
function submitKategoriDuzenle(id){
  const k = KATEGORILER.find(x => x.id === id); if(!k) return;
  const ad = document.getElementById('ktAd').value.trim();
  if(!ad){ showToast('Kategori adı girin.'); return; }
  const ayni = kategoriIdByAd(ad, k.tip);
  if(ayni && ayni !== id){ showToast('Bu isimde bir kategori zaten var.'); return; }
  k.ad = ad;
  closeModal(); renderContent();
  showToast('Kategori güncellendi.');
}
function deleteKategori(id){
  const k = KATEGORILER.find(x => x.id === id);
  if(!k || k.sistem){ showToast('Bu kategori silinemez.'); return; }
  const kullanim = [...GELIRLER, ...GIDERLER].filter(x => x.kategoriId === id).length;
  KATEGORILER = KATEGORILER.filter(x => x.id !== id);
  [...GELIRLER, ...GIDERLER].forEach(x => { if(x.kategoriId === id) x.kategoriId = null; });
  renderContent();
  showToast(kullanim ? `"${k.ad}" silindi, ${kullanim} kayıt kategorisiz kaldı.` : `"${k.ad}" silindi.`);
}

function blankPersonel(){
  return { id:null, name:'', unvan:'', brut:0, arsiv:false,
    cinsiyet:'Seç', dogumTarihi:'', dogumYeri:'',
    iletisim:[{ tur:'İş Telefon No', deger:'' }],
    adres:{ tur:'İş Adresi', ulke:'Türkiye', postaKodu:'', ilce:'', sehir:'', eyalet:'', adres:'' },
    hareketler:[], departman:'Üretim' };
}
function trTarihMs(s){
  const m = String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : 0;
}
function tlSigned(n){
  const v = Number(n)||0;
  return v.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL';
}
function personelBakiye(p){ return (p.hareketler||[]).reduce((s,x)=> s + (Number(x.tutar)||0), 0); }
function personelEkstre(p){
  const list = (p.hareketler||[]).slice()
    .sort((a,b) => trTarihMs(a.tarih) - trTarihMs(b.tarih));
  let bak = 0;
  return list.map(x => { bak += Number(x.tutar)||0; return Object.assign({}, x, { bakiye:bak }); }).reverse();
}
function personelById(id){ return PERSONELLER.find(p => p.id === id); }

function personellerView(){

  if(personelStep === 'detay') return personelDetayView();

function submitHareket(kind){
  const k = HAREKET_TURLERI[kind];
  const p = personelById(personelSecili);

  const tutar = Number(document.getElementById('hrTutar').value) || 0;
  if(!tutar){ showToast('Tutar girin.'); return; }
  p.hareketler.push({
    id: benzersizId('hr'),
    tur: k.tur,
    tarih: document.getElementById('hrTarih').value || bugunTR(),
    aciklama: document.getElementById('hrAciklama').value.trim(),
    tutar: tutar * k.isaret,
  });
  const gidereIsle = document.getElementById('hrGider');
  if(!gidereIsle || gidereIsle.checked){
    const yeniGider = {
      id: benzersizId('gi'),
      client: p.name,
      hesap: BANK_ACCOUNTS[0] ? BANK_ACCOUNTS[0].name : 'Kasa',
      tur: k.tur,
      tarih: document.getElementById('hrTarih').value || bugunTR(),
      tutar: tutar,
      odendi: kind === 'avans',
      kategoriId: kategoriIdByAd('Maaş','gider'),
    };
    GIDERLER.unshift(yeniGider);
    hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
  }
  closeModal(); renderContent();
  showToast(`${k.tur} eklendi — ${tlSigned(tutar * k.isaret)}`);
}
function openHareketDuzenle(hid){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  const isaret = Number(h.tutar) < 0 ? -1 : 1;
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>${h.tur} — Düzenle</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Ödeme Tarihi</label><input id="hrTarih" value="${notEsc(h.tarih || '')}"></div>

    <button class="modal-submit" onclick="submitHareketDuzenle('${hid}', ${isaret})">Kaydet</button>`;

}
function submitHareketDuzenle(hid, isaret){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  const tutar = Number(document.getElementById('hrTutar').value) || 0;
  if(!tutar){ showToast('Tutar girin.'); return; }
  h.tarih = document.getElementById('hrTarih').value || h.tarih;
  h.aciklama = document.getElementById('hrAciklama').value.trim();
  h.tutar = tutar * isaret;
  closeModal(); renderContent();
  showToast('Hareket güncellendi.');
}
function deleteHareket(hid){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  if(!confirm(`${h.tur} — ${tlSigned(h.tutar)} hareketi silinsin mi? Giderler'e işlenmiş kayıt varsa onu Giderler ekranından ayrıca silmelisiniz.`)) return;
  p.hareketler = p.hareketler.filter(x => x.id !== hid);
  renderContent();
  showToast('Hareket silindi.');
}
function togglePersonelArsiv(id){

function deletePersonel(id){
  const p = personelById(id);

}

// ---------------- MESAİLER ----------------
let MESAI_RATES = { normal:50, hafta:100, resmi:100 };   // yüzde ek
const MESAI_TYPES = [
  { key:'normal', label:'Normal Mesai', icon:'🕐', base:'saat' },
  { key:'hafta',  label:'Hafta Tatili', icon:'📅', base:'saat' },
  { key:'resmi',  label:'Resmî Tatil',  icon:'🎉', base:'gun'  },   // maaş / 30 gün
];
const MESAI_VARSAYILAN_SAAT = 225;
const MESAI_AY_GUN = 30;                       // resmî tatil günlük ücret böleni
function mesaiTip(key){ return MESAI_TYPES.find(t => t.key === key); }
function mesaiBirimAdi(key){ return mesaiTip(key).base === 'gun' ? 'gün' : 'saat'; }
function mesaiBirimBaslik(key){ return mesaiTip(key).base === 'gun' ? 'Günlük ücret' : 'Saatlik ücret'; }
let MESAI_KAYIT = {};            // personelId → { brut, saat, hours }
let mesaiPersonelId = null;
let mesaiRatesEdit = false;

function mesaiKatsayi(key){ return 1 + ((Number(MESAI_RATES[key])||0)/100); }
function mesaiData(id){
  if(!MESAI_KAYIT[id]){
    const p = PERSONELLER.find(x => x.id === id);
    MESAI_KAYIT[id] = { brut:(p && p.brut) || 0, saat:MESAI_VARSAYILAN_SAAT,
                        hours:{ normal:0, hafta:0, resmi:0 }, kayitTarihi:null };
  }
  return MESAI_KAYIT[id];
}
function mesaiSaatlik(d){ const s = Number(d.saat)||0; return s > 0 ? (Number(d.brut)||0)/s : 0; }
function mesaiGunluk(d){ return (Number(d.brut)||0) / MESAI_AY_GUN; }
function mesaiBirimUcret(d, key){ return mesaiTip(key).base === 'gun' ? mesaiGunluk(d) : mesaiSaatlik(d); }
function mesaiTutar(d, key){ return mesaiBirimUcret(d, key) * mesaiKatsayi(key) * (Number(d.hours[key])||0); }
function mesaiMiktarMetni(d, key){
  return (Number(d.hours[key])||0).toLocaleString('tr-TR') + ' ' + mesaiBirimAdi(key);
}
function mesaiToplam(d){ return MESAI_TYPES.reduce((s,t)=> s + mesaiTutar(d, t.key), 0); }
function tl(n){ return '₺' + (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function tl0(n){ return '₺' + Math.round(Number(n)||0).toLocaleString('tr-TR'); }

function toggleMesaiRates(){ mesaiRatesEdit = !mesaiRatesEdit; renderContent(); }
function updateMesaiRate(key, val){
  MESAI_RATES[key] = Number(String(val).replace(',', '.')) || 0;
  if(mesaiPersonelId) syncMesai();
}
function openMesai(id){ pushHistory(); mesaiPersonelId = id; mesaiRatesEdit = false; renderContent(); tarayiciGecmisYaz(); }
function closeMesai(){ mesaiPersonelId = null; renderContent(); }

function updateMesai(field, val){
  const d = mesaiData(mesaiPersonelId);
  const n = Number(String(val).replace(',', '.')) || 0;
  if(field === 'brut' || field === 'saat') d[field] = n;
  else d.hours[field] = n;
  syncMesai();
}
function syncMesai(){
  const d = mesaiData(mesaiPersonelId);
  const saatlik = mesaiSaatlik(d);
  const set = (id, v) => { const el = document.getElementById(id); if(el){ if('value' in el && el.tagName === 'INPUT') el.value = v; else el.textContent = v; } };
  set('msSaatlik', tl(saatlik));
  set('msGunluk', tl(mesaiGunluk(d)));
  MESAI_TYPES.forEach(t => {
    set('msK_'+t.key, mesaiBirimBaslik(t.key) + ' × ' + mesaiKatsayi(t.key).toLocaleString('tr-TR'));
    set('msT_'+t.key, tl(mesaiTutar(d, t.key)));
    set('msS_'+t.key, mesaiMiktarMetni(d, t.key));
    set('msB_'+t.key, tl(mesaiBirimUcret(d, t.key)));
  });
  const html = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  html('msToplam', '<b>' + tl(mesaiToplam(d)) + '</b>');
  set('msToplam2', tl(mesaiToplam(d)));
  set('msGenel',   tl((Number(d.brut)||0) + mesaiToplam(d)));
}
