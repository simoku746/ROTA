function cancelQuickCustomer(){
  closeModal();
  const select = document.getElementById(quickCustomerTargetId);
  if(select && select.value === '__new__') select.value = '';
}

function renderLineItems(){
  const box = document.getElementById('lineItemsBox');
  if(!box) return;
  const head = document.getElementById('lineItemsHead');
  if(head) head.innerHTML = `<span>Ürün\\Hizmet</span><span>Miktar</span><span>Birim</span>`
    + `<span>Birim Fiyat</span><span>KDV</span><span>Tutar</span><span></span><span></span>`;
  box.innerHTML = quoteLineItems.map((it,idx)=>{
    const u = lineUnit(it);
    return `
    <div class="tf-row" ondragover="liDragOver(event,${idx})" ondragleave="liDragLeave(event)" ondrop="liDrop(event,${idx})">
      <div class="ac-wrap">
        <input value="${it.title}" placeholder="Hizmet veya Ürün Seçin" oninput="onLineTitleInput(${idx},this.value)" onfocus="onLineTitleInput(${idx},this.value)" onblur="setTimeout(()=>hideAc(${idx}),150)">
        <div class="ac-list" id="acList${idx}"></div>
        <input class="li-detail" value="${notEsc(it.detail || '')}" placeholder="Açıklama — müşteri belgesindeki Açıklama sütununda görünür" oninput="updateLine(${idx},'detail',this.value)">
      </div>
      <input inputmode="decimal" value="${virgulYaz(it.qty)}" oninput="updateLine(${idx},'qty',this.value)">
      <select id="liUnit${idx}" onchange="updateLine(${idx},'unit',this.value)">
        ${LINE_UNITS.map(x=>`<option value="${x.key}" ${u===x.key?'selected':''}>${x.label}</option>`).join('')}
      </select>
      <input inputmode="decimal" value="${virgulYaz(it.price)}" oninput="updateLine(${idx},'price',this.value)">
      <select onchange="updateLine(${idx},'kdv',this.value)">
        ${[0,1,8,10,20].map(r=>`<option value="${r}" ${it.kdv===r?'selected':''}>%${r}</option>`).join('')}
      </select>
      <input id="rowTotal${idx}" readonly value="${CURRENCY_SYMBOLS[quoteCurrency]}${Math.round(lineNet(it)).toLocaleString('tr-TR')}">
      <button class="li-remove" onclick="removeLine(${idx})">✕</button>
      <span class="li-drag" draggable="true" title="Sırayı değiştirmek için basılı tutup aşağı/yukarı sürükleyin"
        ondragstart="liDragStart(event,${idx})" ondragend="liDragEnd()">⠿</span>
      ${dimLineHtml(idx)}
    </div>`;
  }).join('');
  updateGrandTotals();
}
// Ölçü şeridi — yalnız birimi m² / mtül olan satırda görünür
function dimLineHtml(idx){
  const it = quoteLineItems[idx];
  const u = lineUnit(it);
  if(u === 'adet') return '';
  const isM2 = (u === 'm2');
  return `<div class="li-dims">
    <span class="li-dims-label">${isM2 ? 'Ölçü' : 'Uzunluk'}</span>
    <input inputmode="decimal" id="liW${idx}" value="${it.w ? virgulYaz(it.w) : ''}"
      placeholder="${isM2 ? 'en' : 'uzunluk'}" oninput="updateLine(${idx},'w',this.value)">
    ${isM2 ? `<span>×</span>
    <input inputmode="decimal" id="liH${idx}" value="${it.h ? virgulYaz(it.h) : ''}"
      placeholder="boy" oninput="updateLine(${idx},'h',this.value)">` : ''}
    <span>cm</span>
    <span class="li-res" id="liM${idx}">${fmt2(lineQty(it))} ${unitShort(it)}</span>
  </div>`;
}
function refreshDimLine(idx){
  const row = document.querySelectorAll('#lineItemsBox .tf-row')[idx];
  if(!row) return;
  const old = row.querySelector('.li-dims');
  if(old) old.remove();
  const html = dimLineHtml(idx);
  if(html) row.insertAdjacentHTML('beforeend', html);
}
function syncRow(idx){
  const it = quoteLineItems[idx];
  const m = document.getElementById('liM'+idx);
  const t = document.getElementById('rowTotal'+idx);
  if(m) m.textContent = fmt2(lineQty(it)) + ' ' + unitShort(it);
  if(t) t.value = CURRENCY_SYMBOLS[quoteCurrency] + Math.round(lineNet(it)).toLocaleString('tr-TR');
  updateGrandTotals();
}
function updateGrandTotals(){
  const sym = CURRENCY_SYMBOLS[quoteCurrency];
  const sub = quoteLineItems.reduce((s,i)=>s+lineNet(i),0);
  const total = quoteLineItems.reduce((s,i)=>s+lineGross(i),0);
  const totalsBox = document.getElementById('totalsBox');
  if(totalsBox) totalsBox.innerHTML = `<span>Ara Toplam: ${sym}${sub.toLocaleString('tr-TR')}</span><span>Toplam KDV: ${sym}${Math.round(total-sub).toLocaleString('tr-TR')}</span><span class="grand">Genel Toplam: ${sym}${Math.round(total).toLocaleString('tr-TR')}</span>`;
}
function onLineTitleInput(idx, value){
  quoteLineItems[idx].title = value;
  const d = parseDims(value);
  const cur = quoteLineItems[idx];
  if(d && lineUnit(cur) === 'adet' && !cur.w && !cur.h){
    cur.unit = 'm2'; cur.w = d.w; cur.h = d.h;
    const us = document.getElementById('liUnit'+idx); if(us) us.value = 'm2';
    refreshDimLine(idx);
    syncRow(idx);
    showToast(`Ölçü algılandı: ${d.w} × ${d.h} cm`);
  }
  const list = document.getElementById('acList'+idx);
  if(!value){ list.classList.remove('show'); return; }
  const matches = PRODUCT_CATALOG.filter(p => p.name.toLowerCase().includes(value.toLowerCase()));
  if(matches.length===0){ list.classList.remove('show'); return; }
  list.innerHTML = matches.map(m => `<div class="ac-item" onmousedown="pickProduct(${idx},'${m.name.replace(/'/g,"\\'")}',${m.price})">${m.name}</div>`).join('');
  list.classList.add('show');
}
function pickProduct(idx, name, price){
  quoteLineItems[idx].title = name;
  if(price) quoteLineItems[idx].price = price;
  renderLineItems();
}
function hideAc(idx){ const l = document.getElementById('acList'+idx); if(l) l.classList.remove('show'); }
function updateLine(idx, field, value){
  // Sadece o satırın toplamını ve genel toplamı güncelle — input'ları yeniden oluşturma,
  // yoksa yazarken fokus kayboluyor (kullanıcı tekrar tıklamak zorunda kalıyordu).
  quoteLineItems[idx][field] = (field==='title' || field==='unit' || field==='detail')
    ? value
    : Number(String(value).replace(',', '.')) || 0;
  if(field === 'unit') refreshDimLine(idx);
  syncRow(idx);
}
let liSurukleIdx = null;
function liDragStart(e, idx){
  liSurukleIdx = idx;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(idx)); } catch(err) {}
  const row = e.target.closest('.tf-row');
  if(row) row.classList.add('li-tasinan');
}
function liDragEnd(){
  document.querySelectorAll('.tf-row').forEach(r => r.classList.remove('li-tasinan','li-hedef'));
  liSurukleIdx = null;
}
function liDragOver(e, idx){
  if(liSurukleIdx === null || idx === liSurukleIdx) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('#lineItemsBox .tf-row').forEach((r, i) => r.classList.toggle('li-hedef', i === idx));
}
function liDragLeave(e){ const r = e.currentTarget; if(r) r.classList.remove('li-hedef'); }
function liDrop(e, idx){
  if(liSurukleIdx === null) return;
  e.preventDefault();
  const tasinan = quoteLineItems.splice(liSurukleIdx, 1)[0];
  quoteLineItems.splice(idx, 0, tasinan);
  liSurukleIdx = null;
  renderLineItems();
  showToast('Satır sırası güncellendi.');
}
function blankLine(){ return { title:'', detail:'', qty:1, price:0, kdv:20, unit:'adet', w:0, h:0 }; }
function addLineItem(){ quoteLineItems.push(blankLine()); renderLineItems(); }
function removeLine(idx){ quoteLineItems.splice(idx,1); if(quoteLineItems.length===0) quoteLineItems.push(blankLine()); renderLineItems(); }

function submitQuote(){
  const customerId = document.getElementById('qCustomer').value;
  if(!customerId){ alert('Lütfen bir müşteri seçin'); return; }
  const repName = document.getElementById('qRep').value;
  const girisMetni = document.getElementById('qGiris').value;
  const notlar = document.getElementById('qNotlar') ? document.getElementById('qNotlar').value : DEFAULT_NOTES;
  const items = quoteLineItems.filter(i=>i.title);
  // Teklifte yazılan yeni ürünler kataloğa eklenir — sonraki tekliflerde ilk harften otomatik tamamlanır
  items.forEach(it => {
    const ad = String(it.title).trim();
    if(!ad) return;
    if(!PRODUCT_CATALOG.some(pr => pr.name.toLowerCase() === ad.toLowerCase())){
      PRODUCT_CATALOG.push({ id: benzersizId('pr'), name: ad, price: Number(it.price) || 0 });
    }
  });

  let targetId;
  if(editingQuoteId){
    const q = QUOTES.find(x=>x.id===editingQuoteId);
    q.customerId = customerId; q.repName = repName; q.girisMetni = girisMetni; q.notlar = notlar; q.items = items; q.currency = quoteCurrency;
    q.musteriAdi = (CUSTOMERS.find(c => c.id === customerId) || {}).name || q.musteriAdi;
    targetId = q.id;
    showToast(`Teklif No: ${q.no} güncellendi.`);
  } else {
    const no = yeniTeklifNo();
    const q = {
      id: benzersizId('q'), no, customerId, repName, currency: quoteCurrency,
      date: new Date().toISOString().slice(0,10), // teklif tarihi her zaman bugün, otomatik
      status:'Taslak', girisMetni, notlar, items,
      tur:'Satış Teklifi', sonuc:'Sonuçlandırılmamış', etiketler:[],
      gecerlilik: isoPlus(60),
      musteriAdi: (CUSTOMERS.find(c => c.id === customerId) || {}).name || '',
    };
    QUOTES.push(q);
    targetId = q.id;
  }

  editingQuoteId = null;
  teklifStep = 'list';
  teklifCollapse = { yetkili:false, ustAlt:false, onKapak:false, dipNot:false };
  quoteLineItems = [blankLine()];
  renderContent();
  openQuoteView(targetId);
}

const QUOTE_STATUSES = ['Taslak','Gönderildi','Kabul Edildi','Reddedildi','Faturalandı'];
const TEKLIF_TURLERI = ['Satış Teklifi','Satın Alma Teklifi'];
const TEKLIF_SONUCLARI = ['Kazanıldı','Kaybedildi','Sonuçlandırılmamış'];
const GECERLILIK_FILTRELERI = ['Hala Geçerli','Süresi Dolmak Üzere','Bugün','Süresi Geçmiş'];
function statusSlug(s){
  return 'st-' + String(s||'').toLowerCase()
    .replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9]+/g,'-');
}

// ---------------- TEKLİF MALİYET HESABI ----------------
// Her teklifin içine gömülü maliyet dökümü: q.maliyet = { items:[{ad, miktar, fiyat}] }
// Müşteriye giden belgede GÖRÜNMEZ; iç maliyet ve kâr takibi içindir.
// ---- Tedarikçi malzeme fiyatları + günlük kur ----
function VARSAYILAN_MALZEMELER(){
  return [
    { id:'mz1', ad:'Kompozit Panel',   birim:'m²',   fiyat:0, para:'USD' },
    { id:'mz2', ad:'Pleksi',           birim:'m²',   fiyat:0, para:'USD' },
    { id:'mz3', ad:'Folyo',            birim:'m²',   fiyat:0, para:'TL'  },
    { id:'mz4', ad:'Dijital Baskı',    birim:'m²',   fiyat:0, para:'TL'  },
    { id:'mz5', ad:'Alüminyum Profil', birim:'mt',   fiyat:0, para:'EUR' },
    { id:'mz6', ad:'LED Modül',        birim:'adet', fiyat:0, para:'USD' },
  ];
}
let MALZEME_FIYATLARI = VARSAYILAN_MALZEMELER();
let KURLAR = { usd: 0, eur: 0, tarih: '', kaynak: '' };
let maliyetTab = 'kalemler';
function paraSimge(pb){ return pb === 'USD' ? '$' : (pb === 'EUR' ? '€' : '₺'); }
// Türkçe ondalık: "15,5" da "15.5" da kabul edilir
function virgulSayi(v){
  if(v === '' || v === null || v === undefined) return 0;
  let t = String(v).trim().replace(/\s/g, '');
  if(!t) return 0;
  if(t.includes(',')){
    // Virgül ondalık ayırıcı: noktalar binlik ayırıcıdır
    t = t.replace(/\./g, '').replace(',', '.');
  } else {
    const parcalar = t.split('.');
    // Tek nokta + sonrasında tam 3 hane (25.000) ya da birden fazla nokta (1.250.000) → binlik
    if(parcalar.length > 2 || (parcalar.length === 2 && /^\d{3}$/.test(parcalar[1]))) t = parcalar.join('');
  }
  return Number(t) || 0;
}
function virgulYaz(n){ return (n || n === 0) && n !== '' ? String(n).replace('.', ',') : ''; }
function malzemeTL(mz){
  const f = Number(mz.fiyat) || 0;
  if(mz.para === 'USD') return f * (Number(KURLAR.usd) || 0);
  if(mz.para === 'EUR') return f * (Number(KURLAR.eur) || 0);
  return f;
}
// Günlük kur: canlıda /api/kur (TCMB döviz satış), olmazsa piyasa kuru; elle de girilebilir
async function kurGetir(zorla){
  const bugun = new Date().toLocaleDateString('tr-TR');
  if(!zorla && KURLAR.usd && KURLAR.cekilme === bugun) return;
  try{
    let d = null;
    try{ const r = await fetch('/api/kur', { cache:'no-store' }); if(r.ok) d = await r.json(); }catch(e){}
    if(!d || !d.usd){
      const [ru, re] = await Promise.all([
        fetch('https://open.er-api.com/v6/latest/USD').then(x => x.json()),
        fetch('https://open.er-api.com/v6/latest/EUR').then(x => x.json()),
      ]);
      d = { usd: ru && ru.rates && ru.rates.TRY, eur: re && re.rates && re.rates.TRY, tarih:'', kaynak:'Piyasa (yaklaşık)' };
    }
    if(d && d.usd){
      KURLAR.usd = Math.round(d.usd * 10000) / 10000;
      KURLAR.eur = Math.round((d.eur || 0) * 10000) / 10000;
      KURLAR.tarih = d.tarih || bugun; KURLAR.kaynak = d.kaynak || 'TCMB Döviz Satış';
      KURLAR.cekilme = bugun;
      mxKurlaYenile();
      if(currentPage === 'teklifler' && teklifStep === 'maliyet') renderContent();
      showToast(`Kur güncellendi: $${KURLAR.usd.toLocaleString('tr-TR')} · €${KURLAR.eur.toLocaleString('tr-TR')}`);
    } else if(zorla) showToast('Kur alınamadı — elle girebilirsiniz.');
  }catch(e){ if(zorla) showToast('Kur alınamadı — elle girebilirsiniz.'); }
}
function kurElleDegistir(alan, deger){
  KURLAR[alan] = virgulSayi(deger);
  KURLAR.kaynak = 'Elle girildi'; KURLAR.tarih = new Date().toLocaleDateString('tr-TR');
  mxKurlaYenile();
  renderContent();
}
// Kur değişince malzemeye bağlı tüm maliyet satırlarının TL fiyatı tazelenir
function mxKurlaYenile(){
  QUOTES.forEach(q => ((q.maliyet && q.maliyet.items) || []).forEach(r => {
    if(!r.malzemeId) return;
    const mz = MALZEME_FIYATLARI.find(x => x.id === r.malzemeId);
    if(mz) r.fiyat = Math.round(malzemeTL(mz) * 100) / 100;
  }));
}
const HAZIR_MALIYET_KALEMLERI = ['Folyo Baskı','Dijital Baskı','Kutu Harf','Pleksi','Alüminyum Profil','LED Modül','Trafo','Vida','Dübel','Silikon','Boya','Elektrik Malzemesi','Montaj İşçiliği','Nakliye','Vinç Kirası'];
function ensureMaliyet(q){ if(!q.maliyet || !Array.isArray(q.maliyet.items)) q.maliyet = { items: [] }; return q.maliyet; }
function maliyetToplam(q){
  return ((q.maliyet && q.maliyet.items) || []).reduce((s,r) => s + (Number(r.miktar)||1) * (Number(r.fiyat)||0), 0);
}
function openMaliyet(id){
  pushHistory();
  teklifViewId = id; teklifStep = 'maliyet'; maliyetTab = 'kalemler';
  kurGetir(false);
  
  const q = QUOTES.find(x => x.id === id);
  if(q){ const m = ensureMaliyet(q); if(!m.items.length) m.items.push({ ad:'', miktar:1, fiyat:0 }); }
  renderContent();
  
  tarayiciGecmisYaz();
}

        ${MALZEME_FIYATLARI.map((mz, i) => `

        <div class="t-row"><span>Kâr Marjı:</span><span id="mxMarj">${quoteSub(q) > 0 ? '%' + Math.round((quoteSub(q)-maliyetToplam(q)) / quoteSub(q) * 100) : '—'}</span></div>

function mxAktifTeklif(){ return QUOTES.find(x => x.id === teklifViewId); }
function mxOzetGuncelle(){
  const q = mxAktifTeklif(); if(!q) return;
  const maliyet = maliyetToplam(q), satis = quoteSub(q), kar = satis - maliyet;
  const t = document.getElementById('mxToplam'); if(t) t.textContent = tl(maliyet);
  const k = document.getElementById('mxKar');
  if(k){ k.textContent = tl(kar); k.style.color = kar >= 0 ? 'var(--ok)' : 'var(--risk)'; }
  const mrj = document.getElementById('mxMarj'); if(mrj) mrj.textContent = satis > 0 ? '%' + Math.round(kar / satis * 100) : '—';
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function mxGuncelle(i, alan, deger){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r) return;
  r[alan] = (alan === 'ad' || alan === 'aciklama') ? deger : (deger === '' ? '' : virgulSayi(deger));
  if(alan === 'ad') mxAdEslestir(i);
  const tut = document.getElementById('mxTutar' + i);
  if(tut) tut.value = tl((Number(r.miktar)||1) * (Number(r.fiyat)||0));
  mxOzetGuncelle();
}
// Kalem adı bir tedarikçi malzemesiyle birebir eşleşirse otomatik bağlanır
function mxAdEslestir(i){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r) return;
  const ad = String(r.ad || '').trim().toLowerCase();
  if(!ad){ r.malzemeId = null; mxSatirTazele(i); return; }
  const mz = MALZEME_FIYATLARI.find(x => String(x.ad || '').trim().toLowerCase() === ad);
  if(mz && r.malzemeId !== mz.id){
    r.malzemeId = mz.id;
    mxHesapla(i);
    mxSatirTazele(i);
  }
}
function mxBaglantiKaldir(i){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r) return;
  r.malzemeId = null;
  mxSatirTazele(i);
}
function mxBagliHtml(r, i){
  const mz = r.malzemeId ? MALZEME_FIYATLARI.find(x => x.id === r.malzemeId) : null;
  if(!mz) return '<span style="color:var(--ink-3);">serbest kalem</span>';
  return `🔗 ${notEsc(mz.ad)} · ${(Number(mz.fiyat)||0).toLocaleString('tr-TR')} ${paraSimge(mz.para)}/${mz.birim} → ${tl(malzemeTL(mz))}
    <span class="mini-islem sil" title="Malzeme bağlantısını kaldır" onclick="mxBaglantiKaldir(${i})">✕</span>`;
}
function mxSatirEkle(ad){
  const q = mxAktifTeklif(); if(!q) return;
  const items = ensureMaliyet(q).items;
  items.push({ ad: ad || '', miktar: 1, fiyat: 0 });
  if(ad){
    const i = items.length - 1;
    const mz = MALZEME_FIYATLARI.find(x => String(x.ad || '').trim().toLowerCase() === String(ad).trim().toLowerCase());
    if(mz){ items[i].malzemeId = mz.id; mxHesapla(i); }
  }
  renderContent();
  const inputs = document.querySelectorAll('.mx-row input:first-child');
  const son = inputs[inputs.length - 1]; if(son && !ad) son.focus();
}
function mxSatirSil(i){
  const q = mxAktifTeklif(); if(!q) return;
  ensureMaliyet(q).items.splice(i, 1);
  renderContent();
}
function mxOlcuMetni(r){
  const mz = r.malzemeId ? MALZEME_FIYATLARI.find(x => x.id === r.malzemeId) : null;
  if(!mz) return '';
  if(mz.birim === 'm²'){
    const m2 = (Number(r.en) || 0) * (Number(r.boy) || 0) / 10000;
    return m2 ? '= ' + m2.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' m²' : 'En × Boy girin';
  }
  if(mz.birim === 'mt'){
    const mt = (Number(r.boy) || 0) / 100;
    return mt ? '= ' + mt.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' mt (Boy)' : 'Boy girin';
  }
  return 'adet: miktarı elle girin';
}
// Seçili malzemeye göre miktar (m²/mt) ve birim maliyet (₺) otomatik yazılır
function mxHesapla(i){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r || !r.malzemeId) return;
  const mz = MALZEME_FIYATLARI.find(x => x.id === r.malzemeId); if(!mz) return;
  if(mz.birim === 'm²'){
    const m2 = (Number(r.en) || 0) * (Number(r.boy) || 0) / 10000;
    if(m2) r.miktar = Math.round(m2 * 100) / 100;
  } else if(mz.birim === 'mt'){
    const mt = (Number(r.boy) || 0) / 100;
    if(mt) r.miktar = Math.round(mt * 100) / 100;
  }
  r.fiyat = Math.round(malzemeTL(mz) * 100) / 100;
  if(!r.ad) r.ad = mz.ad;
  if((mz.para === 'USD' || mz.para === 'EUR') && !KURLAR.usd) showToast('Kur girilmemiş — üstteki kur alanını doldurun.');
}
function mxSatirTazele(i){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r) return;
  const satir = document.querySelectorAll('.mx-row')[i];
  if(satir){
    const girisler = satir.querySelectorAll('input');
    if(document.activeElement !== girisler[0]) girisler[0].value = r.ad || '';
    if(document.activeElement !== girisler[1]) girisler[1].value = virgulYaz(r.miktar ?? 1);
    if(document.activeElement !== girisler[2]) girisler[2].value = virgulYaz(r.fiyat ?? 0);
  }
  const tut = document.getElementById('mxTutar' + i);
  if(tut) tut.value = tl((Number(r.miktar) || 1) * (Number(r.fiyat) || 0));
  const m2 = document.getElementById('mxM2_' + i);
  if(m2) m2.textContent = mxOlcuMetni(r);
  const bagli = document.getElementById('mxMz_' + i);
  if(bagli) bagli.innerHTML = mxBagliHtml(r, i);
  mxOzetGuncelle();
}
function mxOlcu(i, alan, deger){
  const q = mxAktifTeklif(); if(!q) return;
  const r = ensureMaliyet(q).items[i]; if(!r) return;
  r[alan] = deger === '' ? '' : virgulSayi(deger);
  mxHesapla(i);
  mxSatirTazele(i);
}
// ---- Tedarikçi fiyatları sekmesi ----
function mzGuncelle(i, alan, deger){
  const mz = MALZEME_FIYATLARI[i]; if(!mz) return;
  mz[alan] = alan === 'fiyat' ? virgulSayi(deger) : deger;
  mxKurlaYenile();
  if(alan === 'ad' || alan === 'fiyat'){
    // yazarken ekran yenilenmez — sadece ₺ karşılığı tazelenir (odak kaybolmasın)
    const h = document.getElementById('mzTl' + i);
    if(h) h.textContent = malzemeTL(mz) ? tl(malzemeTL(mz)) + '/' + mz.birim : '—';
  } else renderContent();
}
function mzEkle(){
  MALZEME_FIYATLARI.push({ id: benzersizId('mz'), ad: '', birim: 'm²', fiyat: 0, para: 'TL' });
  renderContent();
}
function mzSil(i){
  const mz = MALZEME_FIYATLARI[i]; if(!mz) return;
  const kullanan = QUOTES.reduce((t, q) => t + (((q.maliyet && q.maliyet.items) || []).filter(r => r.malzemeId === mz.id).length), 0);
  if(!confirm(`${mz.ad || 'Malzeme'} silinsin mi?` + (kullanan ? `\n${kullanan} maliyet satırı bu fiyata bağlı — satırlar kalır ama artık kurla güncellenmez.` : ''))) return;
  MALZEME_FIYATLARI.splice(i, 1);
  renderContent();
}

function quoteViewPage(id){
  const q = QUOTES.find(x=>x.id===id);
  if(!q) return `<div class="note">Teklif bulunamadı.</div>`;
  const c = CUSTOMERS.find(x=>x.id===q.customerId);

  return `
    <div class="page-head">

function changeQuoteStatus(id, status){
  const q = QUOTES.find(x=>x.id===id);
  if(!q) return;
  q.status = status;
  if(status === 'Kabul Edildi' || status === 'Faturalandı'){
    q.sonuc = 'Kazanıldı';
    if(!q.jobId){ renderContent(); openIsAcModal(q.id); return; }
    renderContent();
    showToast(`Durum "${status}" olarak güncellendi.`);
    return;
  }
  if(status === 'Reddedildi') q.sonuc = 'Kaybedildi';
  else q.sonuc = 'Sonuçlandırılmamış';
  renderContent();
  showToast(`Durum "${status}" olarak güncellendi.`);
}
// ---- İş Aç penceresi: grafiker ata veya havuza bırak ----
function benimPersonelim(){
  if(typeof LIVE !== 'undefined' && LIVE.user){
    return PERSONELLER.find(p => p.kullanici && p.kullanici.email === LIVE.user.email) || null;
  }
  return (typeof personelByRol === 'function' ? personelByRol(CURRENT_ROLE) : null) || null;
}
function bildirimRole(rol, metin, ekstra){
  const benimEmail = notKullanici();
  USERS.filter(u => u.role === rol && u.email !== benimEmail).forEach(u => bildirimEkle(u.email, metin, 'bilgi', ekstra));
}

function submitIsAc(qid){
  const q = QUOTES.find(x => x.id === qid); if(!q) return;
  const j = ensureJobForQuote(q);
  const asama = document.getElementById('iaAsama').value;
  j.stage = asama;
  const kesifNotu = (document.getElementById('iaNot') || { value:'' }).value.trim();
  if(kesifNotu){ if(!j.notes) j.notes = {}; j.notes.KESIF = kesifNotu; }
  const pid = document.getElementById('iaGrafiker').value;
  if(pid){
    const p = PERSONELLER.find(x => x.id === pid);
    j.assignees = p ? [p.name] : [];
    if(p) bildirimAtama([p.id], `Size yeni iş atandı: ${j.code} · ${j.client} (${STAGE_LABELS_TR[asama]})`, { jobId: j.id });
    closeModal(); renderContent();
    showToast(`${j.code} açıldı — ${p ? p.name : 'sorumlu'} atandı, ${STAGE_LABELS_TR[asama]} aşamasında.`);
  } else {
    j.assignees = [];
    bildirimRole('TASARIM', `Havuza yeni iş düştü: ${j.code} · ${j.client} — Görev Yönetimi'nden üstlenebilirsiniz.`, { jobId: j.id });
    closeModal(); renderContent();
    showToast(`${j.code} açıldı — havuzda, grafikerlerden biri üstlenecek.`);
  }
}
function isiUstlen(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  if(j.assignees && j.assignees.length){
    showToast('Bu iş az önce üstlenildi: ' + j.assignees.join(', '));
    renderContent(); return;
  }
  const p = benimPersonelim();
  if(!p){ showToast('Hesabınıza bağlı personel kartı bulunamadı — atamayı yönetici yapabilir.'); return; }
  j.assignees = [p.name];
  bildirimYoneticilere(`${p.name} işi üstlendi: ${j.code} · ${j.client}`, 'bilgi', { jobId: j.id });
  renderContent();
  showToast(`${j.code} artık sizde — kolay gelsin!`);
}
function isiHavuzaBirak(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  const p = benimPersonelim();
  const yetkili = CURRENT_ROLE === 'YONETICI' || (p && (j.assignees || []).includes(p.name));
  if(!yetkili){ showToast('İşi yalnız sorumlusu veya yönetici havuza bırakabilir.'); return; }
  const eski = (j.assignees || []).join(', ');
  j.assignees = [];
  bildirimRole('TASARIM', `İş havuza geri bırakıldı: ${j.code} · ${j.client} — üstlenebilirsiniz.`, { jobId: j.id });
  bildirimYoneticilere(`${eski || 'Sorumlu'} işi havuza bıraktı: ${j.code} · ${j.client}`, 'bilgi', { jobId: j.id });
  closeDrawer(); renderContent();
  showToast('İş havuza bırakıldı.');
}
// Teklif için iş yoksa açar, varsa mevcut olanı döndürür (idempotent)
function ensureJobForQuote(q){
  let j = q.jobId ? JOBS.find(x => x.id === q.jobId) : null;
  if(j) return j;
  const c = CUSTOMERS.find(x => x.id === q.customerId);
  j = {
    id:'j'+Date.now(), code:yeniIsKodu(),
    client: c ? c.name : (q.musteriAdi || 'Müşteri seçilmedi'), customerId: q.customerId || null,
    desc: q.items.map(i => i.title).filter(Boolean).join(', ') || 'Teklif kapsamındaki iş',
    material: q.items.map(i => i.detail).filter(Boolean).join(' · '),
    stage:'KESIF', approval:null,
    assignees: [],
    due: '',   // teslim tarihi İş Emri'nden gelir; teklif geçerliliğiyle karıştırılmaz
    tutar: Math.round(quoteTotal(q)),
    quoteId: q.id, quoteNo: q.no,
    yeni: true,
  };
  JOBS.push(j);
  q.jobId = j.id;
  return j;
}
function openJobFromQuote(qid){
  const q = QUOTES.find(x => x.id === qid);
  if(!q) return;
  if(!q.jobId){ openIsAcModal(qid); return; }
  pushHistory();
  currentPage = 'gorev-yonetimi'; gorevSub = 'tum-isler'; openSubmenu = 'gorev-yonetimi';
  renderNav(); renderContent();
  setTimeout(() => openJobDrawer(q.jobId), 50);
}
function duplicateQuote(id){
  const q = QUOTES.find(x=>x.id===id);
  const copy = JSON.parse(JSON.stringify(q));
  copy.id = benzersizId('q');
  copy.no = yeniTeklifNo();
  copy.status = 'Taslak';
  copy.date = new Date().toISOString().slice(0,10);
  copy.gecerlilik = isoPlus(60);
  copy.sonuc = 'Sonuçlandırılmamış';
  delete copy.jobId;                       // kopya yeni bir teklif — işe bağlı doğmaz
  QUOTES.push(copy);
  hideIslemlerMenu();
  teklifViewId = copy.id;
  renderContent();
  showToast(`Teklif kopyalandı — yeni No: ${copy.no}`);
}
function reviseQuote(id){
  duplicateQuote(id);
  showToast('Revize taslağı oluşturuldu — düzenleyip gönderebilirsiniz.');
}
// Teklifi bağlı kayıtlarıyla birlikte kaldırır: işe dönüşmüşse iş + plan blokları da silinir
function teklifSilUygula(id){
  const q = QUOTES.find(x => x.id === id);
  if(q && q.jobId){
    PLAN_TASKS = PLAN_TASKS.filter(t => t.jobId !== q.jobId);
    JOBS = JOBS.filter(j => j.id !== q.jobId);
  }
  QUOTES = QUOTES.filter(x => x.id !== id);
}
function deleteQuote(id){
  const q = QUOTES.find(x => x.id === id); if(!q) return;
  hideIslemlerMenu();
  if(CURRENT_ROLE !== 'YONETICI'){
    if(BILDIRIMLER.some(b => b.tip === 'silme-istegi' && b.quoteId === id && !b.sonuc)){
      showToast('Bu teklif için silme isteği zaten yönetici onayında bekliyor.'); return;
    }
    const c = CUSTOMERS.find(x => x.id === q.customerId);
    const kim = (typeof LIVE !== 'undefined' && LIVE.user) ? LIVE.user.name : roleCfg().label;
    bildirimYoneticilere(
      `${kim}, ${q.no} numaralı teklifin (${c ? c.name : 'müşteri yok'}) silinmesini istiyor.`,
      'silme-istegi', { quoteId: id, quoteNo: q.no, isteyen: notKullanici() });
    showToast('Teklif silinemiyor — yönetici onayı sonrası silinebilir. İsteğiniz yöneticiye iletildi.');
    return;
  }
  const uyari = q.jobId
    ? 'Bu teklifi ve teklife bağlı işi (plan kayıtlarıyla birlikte) silmek istediğinize emin misiniz?'
    : 'Bu teklifi silmek istediğinize emin misiniz?';
  if(!confirm(uyari)) return;
  teklifSilUygula(id);
  teklifStep = 'list';
  renderContent();
  showToast('Teklif ve bağlı kayıtları silindi.');
}

let DIS_ALIMLAR = [];

const DA_TURLER = {
  toplama:  { ad:'Araçla Toplanacak',          ikon:'🚚', sublabel:'Tedarikçiden biz alacağız' },
  teslimat: { ad:'Sipariş — Geliş Bekleniyor', ikon:'📦', sublabel:'Kargo / tedarikçi getirecek' },
};
function daTarihRozet(a){
  if(a.durum === 'tamam') return '<span class="da-rozet">✓ tamam</span>';
  if(!a.tarih) return '<span class="da-rozet">tarih yok</span>';
  const bugun = planIso(new Date());
  const gunFark = Math.round((new Date(a.tarih+'T00:00:00') - new Date(bugun+'T00:00:00')) / 86400000);
  const d = new Date(a.tarih+'T00:00:00');
  const kisa = d.getDate() + ' ' + PLAN_AYLAR[d.getMonth()];
  if(gunFark < 0)  return `<span class="da-rozet gecikti">${kisa} · ${-gunFark} gün gecikti</span>`;
  if(gunFark === 0) return '<span class="da-rozet bugun">bugün</span>';
  if(gunFark === 1) return '<span class="da-rozet bugun">yarın</span>';
  return `<span class="da-rozet">${kisa}</span>`;
}
function daSatirHtml(a){
  const p = PERSONELLER.find(x => x.id === a.sorumluId);
  const v = VEHICLES.find(x => x.id === a.aracId);

function submitDisAlim(id){
  const malzeme = document.getElementById('daMalzeme').value.trim();
  if(!malzeme){ showToast('Malzeme / sipariş açıklaması girin.'); return; }
  const veri = {
    tur: document.getElementById('daTur').value,
    malzeme: malzeme,
    tedarikci: document.getElementById('daTedarikci').value.trim(),
    tarih: document.getElementById('daTarih').value,
    tutar: Number(document.getElementById('daTutar').value) || 0,
    sorumluId: document.getElementById('daSorumlu').value || null,
    aracId: document.getElementById('daArac').value || null,
    jobId: document.getElementById('daJob').value || null,
    not: document.getElementById('daNot').value.trim(),
  };
  let oncekiSorumlu = null;
  if(id){
    const a = DIS_ALIMLAR.find(x => x.id === id);
    if(a){ oncekiSorumlu = a.sorumluId; Object.assign(a, veri); }
  } else {
    DIS_ALIMLAR.push(Object.assign({ id: benzersizId('da'), durum:'bekliyor' }, veri));
  }
  if(veri.sorumluId && veri.sorumluId !== oncekiSorumlu)
    bildirimAtama([veri.sorumluId], `Size dış alım atandı: ${veri.malzeme}${veri.tedarikci ? ' (' + veri.tedarikci + ')' : ''}${veri.tarih ? ' — ' + formatDate(veri.tarih) : ''}`);
  closeModal(); renderContent();
  showToast(id ? 'Dış alım güncellendi.' : 'Dış alım eklendi.');
}
function daToggle(id){
  const a = DIS_ALIMLAR.find(x => x.id === id);
  if(!a) return;
  a.durum = a.durum === 'tamam' ? 'bekliyor' : 'tamam';
  if(a.durum === 'tamam') daTamamAcik = true;
  renderContent();
}
function daSil(id){
  const i = DIS_ALIMLAR.findIndex(x => x.id === id);
  if(i >= 0){ DIS_ALIMLAR.splice(i, 1); closeModal(); renderContent(); showToast('Dış alım silindi.'); }
}
function daTamamTemizle(){
  DIS_ALIMLAR = DIS_ALIMLAR.filter(a => a.durum !== 'tamam');
  renderContent();
}
// Haftalık planın üstünde: bu haftanın bekleyen dış alımları

// ---------------- BİLDİRİMLER ----------------
// Kişiye özel bildirimler (buluta kaydedilir; diğer cihazlara 15 sn içinde düşer).
// Türler: 'atama' (iş/plan/dış alım ataması), 'silme-istegi' (yönetici onayı bekler), 'bilgi'.
let BILDIRIMLER = [];
let bildirimAcik = false;

function bildirimEkle(aliciEmail, metin, tip, ekstra){
  if(!aliciEmail) return;
  BILDIRIMLER.unshift(Object.assign(
    { id: benzersizId('b'), alici: aliciEmail, metin: metin, tip: tip || 'bilgi', tarih: Date.now(), okundu: false },
    ekstra || {}));
  if(BILDIRIMLER.length > 300) BILDIRIMLER.length = 300;
  renderBildirimler();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function bildirimYoneticilere(metin, tip, ekstra){
  const benimEmail = notKullanici();
  USERS.filter(u => u.role === 'YONETICI' && u.email !== benimEmail)
       .forEach(u => bildirimEkle(u.email, metin, tip, ekstra));
}
// Personel kimliklerinden kullanıcı hesabı olanlara atama bildirimi (kendine bildirim gitmez)
function bildirimAtama(personelIds, metin, ekstra){
  (personelIds || []).forEach(pid => {
    const p = PERSONELLER.find(x => x.id === pid);
    if(p && p.kullanici && p.kullanici.email && p.kullanici.email !== notKullanici())
      bildirimEkle(p.kullanici.email, metin, 'atama', ekstra);
  });
}
function benimBildirimlerim(){ return BILDIRIMLER.filter(b => b.alici === notKullanici()); }
function bildirimAcKapa(e){
  if(e) e.stopPropagation();
  bildirimAcik = !bildirimAcik;
  if(bildirimAcik){
    let degisti = false;
    benimBildirimlerim().forEach(b => { if(!b.okundu){ b.okundu = true; degisti = true; } });
    if(degisti && typeof liveMarkDirty === 'function') liveMarkDirty();
  }
  renderBildirimler();
}
function bildirimTemizle(){
  const ben = notKullanici();
  BILDIRIMLER = BILDIRIMLER.filter(b => b.alici !== ben || (b.tip === 'silme-istegi' && !b.sonuc));
  renderBildirimler();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function bildirimSatirHtml(b){
  const IKON = { atama:'📋', 'silme-istegi':'🗑️', bilgi:'ℹ️' };
  let aksiyon = '';
  if(b.tip === 'silme-istegi' && CURRENT_ROLE === 'YONETICI'){
    if(b.sonuc === 'silindi') aksiyon = '<div class="bildirim-sonuc">✓ Teklif silindi</div>';
    else if(b.sonuc === 'red') aksiyon = '<div class="bildirim-sonuc">✕ Reddedildi</div>';
    else if(b.sonuc === 'yok') aksiyon = '<div class="bildirim-sonuc">Teklif zaten silinmiş</div>';
    else aksiyon = `<div class="bildirim-aksiyon">
      <button class="onay" onclick="event.stopPropagation(); bildirimSilmeOnayla('${b.id}')">Teklifi Sil</button>
      <button class="red" onclick="event.stopPropagation(); bildirimSilmeReddet('${b.id}')">Reddet</button></div>`;
  }
  return `<div class="bildirim-satir ${b.okundu ? '' : 'yeni'}"${b.jobId ? ` style="cursor:pointer;" title="İşi aç" onclick="bildirimIseGit('${b.jobId}')"` : ''}>
    <span class="bildirim-ikon">${IKON[b.tip] || '🔔'}</span>
    <div class="bildirim-metin">${notEsc(b.metin)}${aksiyon}
      <div class="bildirim-zaman">${notZamanStr(b.tarih)}</div></div>
  </div>`;
}
function bildirimIseGit(jobId){
  const j = JOBS.find(x => x.id === jobId);
  if(!j){ showToast('Bu iş artık bulunamıyor (silinmiş olabilir).'); return; }
  bildirimAcik = false; renderBildirimler();
  if(roleCfg().tabs.includes('gorev-yonetimi')){
    pushHistory();
    currentPage = 'gorev-yonetimi';
    gorevSub = roleCfg().gorevSubs.includes('tum-isler') ? 'tum-isler' : (roleCfg().gorevSubs[0] || 'gorevlerim');
    boardFilterStage = null; openSubmenu = 'gorev-yonetimi';
    renderNav(); renderContent();
    if(typeof menuDaralt === 'function') menuDaralt(true);
    tarayiciGecmisYaz();
  }
  openJobDrawer(jobId);
}
function renderBildirimler(){
  const wrap = document.getElementById('bildirimWrap');
  if(!wrap) return;
  wrap.classList.toggle('open', bildirimAcik);
  const benim = benimBildirimlerim();
  const rozet = document.getElementById('bildirimRozet');
  if(rozet){ const n = benim.filter(b => !b.okundu).length; rozet.textContent = n ? String(n) : ''; }
  const el = document.getElementById('bildirimListe');
  if(el) el.innerHTML = benim.length
    ? benim.slice(0, 50).map(bildirimSatirHtml).join('')
    : '<div class="bildirim-bos">Bildirim yok.<br>Size iş atandığında veya onayınız gerektiğinde burada görünür.</div>';
}
document.addEventListener('click', e => {
  if(bildirimAcik && !e.target.closest('#bildirimWrap')){ bildirimAcik = false; renderBildirimler(); }
});
// Silme isteği kararları (yalnız yönetici panelinde görünür)
function bildirimSilmeOnayla(bid){
  const b = BILDIRIMLER.find(x => x.id === bid); if(!b) return;
  const q = QUOTES.find(x => x.id === b.quoteId);
  if(!q){ b.sonuc = 'yok'; renderBildirimler(); showToast('Teklif zaten silinmiş.'); return; }
  teklifSilUygula(q.id);
  b.sonuc = 'silindi';
  if(b.isteyen) bildirimEkle(b.isteyen, `${b.quoteNo} için silme isteğiniz onaylandı — teklif silindi.`, 'bilgi');
  renderBildirimler(); renderContent();
  showToast(`${b.quoteNo} ve bağlı kayıtları silindi.`);
}
function bildirimSilmeReddet(bid){
  const b = BILDIRIMLER.find(x => x.id === bid); if(!b || b.sonuc) return;
  b.sonuc = 'red';
  if(b.isteyen) bildirimEkle(b.isteyen, `${b.quoteNo} için silme isteğiniz reddedildi.`, 'bilgi');
  renderBildirimler();
  showToast('Silme isteği reddedildi.');
}

// ---------------- NOT DEFTERİ ----------------
// Kişiye özel hızlı notlar: telefonda konuşurken yazılır, iş gibi işaretlenip kapatılır.
// NOT_DEFTERI: { kullanıcıAnahtarı: [ {id, metin, tamam, tarih} ] } — buluta kaydedilir.
let NOT_DEFTERI = {};
let notAcik = false;
let notTamamAcik = false;
let notDuzenlenen = null;

function notKullanici(){
  if(typeof LIVE !== 'undefined' && LIVE.user && LIVE.user.email) return LIVE.user.email;
  const p = personelByRol(CURRENT_ROLE);   // önizleme modunda: role bağlı hesabın e-postası
  return (p && p.kullanici && p.kullanici.email) ? p.kullanici.email : ('demo-' + CURRENT_ROLE);
}
function notlarim(){
  const k = notKullanici();
  if(!Array.isArray(NOT_DEFTERI[k])) NOT_DEFTERI[k] = [];
  return NOT_DEFTERI[k];
}
function notEsc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function notZamanStr(ms){
  const d = new Date(ms);
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function notKaydet(){
  renderNotlar();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function notAcKapa(){
  notAcik = !notAcik;
  document.getElementById('notWrap').classList.toggle('open', notAcik);
  if(notAcik){ const inp = document.getElementById('notInput'); if(inp) setTimeout(() => inp.focus(), 50); }
}
function notKeydown(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); notEkle(); }
}
function notEkle(){
  const inp = document.getElementById('notInput');
  const metin = inp.value.trim();
  if(!metin) return;
  notlarim().unshift({ id:'n' + Date.now(), metin: metin, tamam:false, tarih: Date.now() });
  inp.value = '';
  notKaydet();
  inp.focus();
}
function notToggle(id){
  const n = notlarim().find(x => x.id === id);
  if(!n) return;
  n.tamam = !n.tamam;
  if(n.tamam) notTamamAcik = true;
  notKaydet();
}
function notSil(id){
  const liste = notlarim();
  const i = liste.findIndex(x => x.id === id);
  if(i >= 0){ liste.splice(i, 1); notKaydet(); }
}
function notTamamlananlariTemizle(){
  const k = notKullanici();
  NOT_DEFTERI[k] = notlarim().filter(n => !n.tamam);
  notKaydet();
}
function notDuzenle(id){
  const n = notlarim().find(x => x.id === id);
  if(!n || n.tamam) return;
  notDuzenlenen = id;
  renderNotlar();
  const ta = document.getElementById('notDuzenleAlani');
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function notDuzenleBitir(id, deger){
  const n = notlarim().find(x => x.id === id);
  notDuzenlenen = null;
  if(n){ const m = String(deger).trim(); if(m) n.metin = m; }
  notKaydet();
}
function notDuzenleKeydown(e, id){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.target.blur(); }
  if(e.key === 'Escape'){ notDuzenlenen = null; renderNotlar(); }
}
function notSatirHtml(n){
  const duzenleniyor = notDuzenlenen === n.id;
  const metinHtml = duzenleniyor
    ? `<textarea id="notDuzenleAlani" class="not-duzenle-alani" rows="2"
         onblur="notDuzenleBitir('${n.id}', this.value)"
         onkeydown="notDuzenleKeydown(event,'${n.id}')">${notEsc(n.metin)}</textarea>`
    : `<div class="not-metin" ${n.tamam ? '' : `onclick="notDuzenle('${n.id}')" title="Düzenlemek için tıklayın"`}>${notEsc(n.metin)}<div class="not-zaman">${notZamanStr(n.tarih)}</div></div>`;
  return `
    <div class="not-satir ${n.tamam ? 'tamam' : ''}">
      <button class="not-check" title="${n.tamam ? 'Geri al' : 'Tamamlandı işaretle'}" onclick="notToggle('${n.id}')">${n.tamam ? '✓' : ''}</button>
      ${metinHtml}
      <button class="not-sil" title="Notu sil" onclick="notSil('${n.id}')">✕</button>
    </div>`;
}
function renderNotlar(){
  const wrap = document.getElementById('notWrap');
  if(!wrap) return;
  const liste = notlarim();
  const acik = liste.filter(n => !n.tamam);
  const tamam = liste.filter(n => n.tamam);
  const sayi = document.getElementById('notSayiTab');
  if(sayi) sayi.textContent = acik.length ? String(acik.length) : '';
  const el = document.getElementById('notListe');
  if(!el) return;
  let html = '';
  if(!liste.length){
    html = '<div class="not-bos">Henüz not yok.<br>Telefonda konuşurken aklınıza geleni buraya yazın;<br>bitince ✓ ile kapatın.</div>';
  } else {
    html = acik.map(notSatirHtml).join('');
    if(!acik.length) html += '<div class="not-bos">Açık not kalmadı 🎉</div>';
    if(tamam.length){
      html += `<div class="not-bolum">
        <span style="cursor:pointer;" onclick="notTamamAcik=!notTamamAcik; renderNotlar();">${notTamamAcik ? '▾' : '▸'} Tamamlananlar (${tamam.length})</span>
        <button onclick="notTamamlananlariTemizle()">Temizle</button></div>`;
      if(notTamamAcik) html += tamam.map(notSatirHtml).join('');
    }
  }
  el.innerHTML = html;
}

// ---------------- MODAL / TOAST HELPERS ----------------
function showModal(){ document.getElementById('overlay').classList.add('show'); document.getElementById('modalBox').className = 'modal wide'; }
function closeModal(){
  const mb = document.getElementById('modalBox');
  if(mb){ mb.classList.remove('wide'); mb.style.maxWidth = ''; } document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ================= CANLI KATMAN — oturum, yükleme, otomatik kayıt =================
// Tüm veri tek JSON belgesi olarak /api/state'te tutulur. Her renderContent() sonrası
// değişiklik varsa 700 ms içinde kaydedilir; 15 sn'de bir diğer cihazların kayıtları çekilir.
const LIVE = { user:null, version:0, lastSaved:'', saving:false, timer:null, pending:false, conflict:false, booted:false };

const VARSAYILAN_KATEGORILER = () => [
  { id:'kd2', ad:'Maaş',  tip:'gider', sistem:true },
  { id:'kd3', ad:'Mesai', tip:'gider', sistem:true },
];

function collectState(){
  return {
    AGENCY, CUSTOMERS, JOBS, QUOTES, PRODUCT_CATALOG, DEPOLAR, PROJELER_LIST, STOK_HAREKETLERI, GOREV_RAPORU,
    PLAN_TASKS, GENERAL_TASKS, KASA_ACCOUNTS, BANK_ACCOUNTS, CEK_SENET, GELIRLER, GIDERLER, PERSONELLER,
    KATEGORILER, MESAI_RATES, MESAI_KAYIT, VEHICLES, FATURALAR, NOT_DEFTERI, DIS_ALIMLAR, BILDIRIMLER,
    CARI_HAREKETLER,
    MALZEME_FIYATLARI, KURLAR,
  };
}
function applyState(d){
  d = d || {};
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  CUSTOMERS = arr('CUSTOMERS'); JOBS = arr('JOBS'); QUOTES = arr('QUOTES');
  PRODUCT_CATALOG = arr('PRODUCT_CATALOG');
  DEPOLAR = Array.isArray(d.DEPOLAR) && d.DEPOLAR.length ? d.DEPOLAR : [ { name:'Ana Depo', adres:'', urunSayisi:0 } ];
  PROJELER_LIST = Array.isArray(d.PROJELER_LIST) && d.PROJELER_LIST.length ? d.PROJELER_LIST : ['Genel'];
  STOK_HAREKETLERI = arr('STOK_HAREKETLERI'); GOREV_RAPORU = arr('GOREV_RAPORU');
  PLAN_TASKS = arr('PLAN_TASKS'); GENERAL_TASKS = arr('GENERAL_TASKS');
  KASA_ACCOUNTS = arr('KASA_ACCOUNTS'); BANK_ACCOUNTS = arr('BANK_ACCOUNTS'); CEK_SENET = arr('CEK_SENET');
  GELIRLER = arr('GELIRLER'); GIDERLER = arr('GIDERLER'); PERSONELLER = arr('PERSONELLER');
  KATEGORILER = Array.isArray(d.KATEGORILER) && d.KATEGORILER.length ? d.KATEGORILER : VARSAYILAN_KATEGORILER();
  MESAI_RATES = (d.MESAI_RATES && typeof d.MESAI_RATES === 'object') ? d.MESAI_RATES : { normal:50, hafta:100, resmi:100 };
  MESAI_KAYIT = (d.MESAI_KAYIT && typeof d.MESAI_KAYIT === 'object') ? d.MESAI_KAYIT : {};
  VEHICLES = arr('VEHICLES'); FATURALAR = arr('FATURALAR');
  DIS_ALIMLAR = arr('DIS_ALIMLAR'); BILDIRIMLER = arr('BILDIRIMLER');
  CARI_HAREKETLER = arr('CARI_HAREKETLER');
  MALZEME_FIYATLARI = Array.isArray(d.MALZEME_FIYATLARI) && d.MALZEME_FIYATLARI.length ? d.MALZEME_FIYATLARI : VARSAYILAN_MALZEMELER();
  KURLAR = (d.KURLAR && typeof d.KURLAR === 'object' && !Array.isArray(d.KURLAR)) ? d.KURLAR : { usd:0, eur:0, tarih:'', kaynak:'' };
  NOT_DEFTERI = (d.NOT_DEFTERI && typeof d.NOT_DEFTERI === 'object' && !Array.isArray(d.NOT_DEFTERI)) ? d.NOT_DEFTERI : {};
  window.__onarimYapildi = (typeof veriOnar === 'function') ? !!veriOnar() : false;   // çift kimlik + yetim kayıt onarımı
  if(d.AGENCY && typeof d.AGENCY === 'object'){
    // Sunucudan gelen firma bilgileri varsayılanların üzerine yazılır (logo dahil, boş değilse)
    Object.keys(d.AGENCY).forEach(k => { if(d.AGENCY[k] !== undefined && d.AGENCY[k] !== null) AGENCY[k] = d.AGENCY[k]; });
  }
  // Eski SVG yer tutucu logo sunucuda kayıtlıysa gerçek Dekant logosuyla değiştirilir
  if(!AGENCY.logo || String(AGENCY.logo).startsWith('data:image/svg+xml')){
    AGENCY.logo = (typeof DEKANT_LOGO !== 'undefined') ? DEKANT_LOGO : AGENCY.logo;
    window.__onarimYapildi = true;
  }
}

function liveSetStatus(cls, text){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.className = 'preview-flag ' + cls;
  el.innerHTML = '●&nbsp;' + text;
}
function liveZaman(){ return new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }); }

async function liveApi(method, url, body){
  try{
    const r = await fetch(url, { method, headers:{ 'Content-Type':'application/json' }, body: body ? JSON.stringify(body) : undefined, cache:'no-store' });
    let data = null; try { data = await r.json(); } catch(e) {}
    if(r.status === 401){ location.href = '/login'; return { ok:false, status:401, error:'Oturum süresi doldu' }; }
    return { ok:r.ok, status:r.status, data, error:(data && data.error) || (r.ok ? '' : 'İşlem başarısız (' + r.status + ')') };
  }catch(e){
    return { ok:false, status:0, data:null, error:'Sunucuya ulaşılamadı' };
  }
}

function liveMarkDirty(){
  if(!LIVE.booted) return;
  clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(() => liveSave(), 700);
}

async function liveSave(opts){
  opts = opts || {};
  if(!LIVE.booted || LIVE.conflict) return;
  if(LIVE.saving){ LIVE.pending = true; return; }
  const json = JSON.stringify(collectState());
  if(json === LIVE.lastSaved) return;
  LIVE.saving = true;
  liveSetStatus('saving', 'Kaydediliyor…');
  try{
    const r = await fetch('/api/state', {
      method:'PUT', headers:{ 'Content-Type':'application/json' }, cache:'no-store',
      body: '{"version":' + LIVE.version + ',"data":' + json + '}',
    });
    if(r.status === 409){
      LIVE.conflict = true;
      liveSetStatus('err', 'Çakışma — sayfa yenileniyor');
      showToast('Başka bir kullanıcı aynı anda kaydetti. Son değişikliğiniz alınamadı, sayfa yenileniyor.');
      setTimeout(() => location.reload(), 2500);
      return;
    }
    if(r.status === 401){ location.href = '/login'; return; }
    if(!r.ok){
      let msg = 'Kaydedilemedi'; try { msg = (await r.json()).error || msg; } catch(e) {}
      liveSetStatus('err', msg + ' — yeniden denenecek');
      return;
    }
    const d = await r.json();
    LIVE.version = d.version;
    LIVE.lastSaved = json;
    liveSetStatus('ok', 'Kaydedildi ' + liveZaman());
  }catch(e){
    liveSetStatus('err', 'Bağlantı yok — yeniden denenecek');
  }finally{
    LIVE.saving = false;
    if(LIVE.pending){ LIVE.pending = false; liveMarkDirty(); }
  }
}

// Kullanıcı bir formun içindeyse uzaktan gelen veriyi uygulamayı erteler (yazdığı silinmesin).
function liveFormdaMi(){
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(document.getElementById('overlay').classList.contains('show')) return true;
  const steps = [typeof kisilerStep !== 'undefined' && kisilerStep, typeof teklifStep !== 'undefined' && teklifStep,
                 typeof personelStep !== 'undefined' && personelStep, typeof aracStep !== 'undefined' && aracStep,
                 typeof gelirStep !== 'undefined' && gelirStep, typeof giderStep !== 'undefined' && giderStep,
                 typeof cekSenetStep !== 'undefined' && cekSenetStep];
  return steps.some(st => st === 'form' || st === 'type');
}

async function liveTick(){
  if(!LIVE.booted || LIVE.conflict) return;
  const json = JSON.stringify(collectState());
  if(json !== LIVE.lastSaved){ liveSave(); return; }
  if(LIVE.saving) return;
  try{
    const r = await fetch('/api/state?v=' + LIVE.version, { cache:'no-store' });
    if(r.status === 401){ location.href = '/login'; return; }
    if(!r.ok) return;
    const d = await r.json();
    if(d.unchanged || d.version === LIVE.version) return;
    if(liveFormdaMi()){ return; } // bir sonraki turda tekrar denenir
    applyState(d.data || {});
    LIVE.version = d.version;
    LIVE.lastSaved = JSON.stringify(collectState());
    if(window.__onarimYapildi){ LIVE.lastSaved = ''; }
    renderNav(); renderContent();
    if(typeof renderNotlar === 'function') renderNotlar();
    if(typeof renderBildirimler === 'function') renderBildirimler();
    liveSetStatus('ok', 'Güncellendi ' + liveZaman());
  }catch(e){ /* sessiz */ }
}

async function liveBoot(){
  const msg = document.getElementById('bootMsg');
  try{
    const me = await fetch('/api/auth/me', { cache:'no-store' });
    if(me.status === 401){ location.href = '/login'; return; }
    if(!me.ok) throw new Error('me ' + me.status);
    LIVE.user = await me.json();

    const st = await fetch('/api/state', { cache:'no-store' });
    if(st.status === 401){ location.href = '/login'; return; }
    if(!st.ok) throw new Error('state ' + st.status);
    const d = await st.json();
    LIVE.version = d.version || 0;
    applyState(d.data || {});
    LIVE.lastSaved = JSON.stringify(collectState());
    LIVE.booted = true;
    if(window.__onarimYapildi){ LIVE.lastSaved = ''; liveSave(); }   // temizlenen veri sunucuya da yazılsın

    document.getElementById('bootScreen').style.display = 'none';
    doLogin(LIVE.user.role);
    liveSetStatus('ok', 'Kaydedildi');
    setInterval(liveTick, 15000);
  }catch(e){
    msg.innerHTML = 'Veriler yüklenemedi. <a href="#" onclick="location.reload();return false;" style="color:var(--ink);">Yeniden dene</a>'
      + '<div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;">' + String(e.message || e) + '</div>';
  }
}

// Her ekran çiziminden sonra değişiklik kontrolü
const _renderContentOrig = renderContent;
renderContent = function(){ _renderContentOrig(); liveMarkDirty(); };

// Sekme gizlenirken / kapanırken bekleyen değişikliği gönder
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') liveSave({ force:true }); });
window.addEventListener('pagehide', () => {
  if(!LIVE.booted || LIVE.conflict) return;
  const json = JSON.stringify(collectState());
  if(json === LIVE.lastSaved) return;
  try { navigator.sendBeacon('/api/state', new Blob(['{"version":' + LIVE.version + ',"data":' + json + '}'], { type:'application/json' })); } catch(e) {}
});

liveBoot();

function toggleTheme(){
  document.documentElement.classList.toggle('dark');
}
