function planGunOzeti(iso){
  const list = PLAN_TASKS.filter(t => t.date === iso);
  return { adet:list.length,
           dk:list.reduce((s,t)=> s + (Number(t.durationMinutes)||0), 0),
           tutar:list.reduce((s,t)=> s + (Number(t.cost)||0), 0) };
}

// ---- Sürükle-bırak ----
function planDragStart(e, id){
  planSurukleId = id;
  const kart = e.currentTarget;
  const r = kart.getBoundingClientRect();
  planSurukleKaymaDk = Math.round(((e.clientY - r.top) / PLAN_SAAT_PX) * 60);
  kart.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
}
function planDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleId = null; }
function planDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop'); }
function planDragLeave(e){ e.currentTarget.classList.remove('drop'); }
function planDrop(e, iso){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  const r = e.currentTarget.getBoundingClientRect();
  if(planSurukleIsId){                                   // tepsiden saat ızgarasına
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    let dk = Math.round((((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
    dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - PLAN_VARSAYILAN_SURE));
    PLAN_TASKS.push(planBlokIsten(j, iso, dkToSaatMetni(dk), planKisilerIsimden(j.assignees)));
    bildirimAtama(planKisilerIsimden(j.assignees), `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    renderContent();
    showToast(`${j.code} planlandı → ${formatDate(iso)} ${dkToSaatMetni(dk)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  if(!t) return;
  const dkHam = ((e.clientY - r.top) / PLAN_SAAT_PX) * 60 + PLAN_BAS_SAAT*60 - planSurukleKaymaDk;
  let dk = Math.round(dkHam / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  dk = Math.max(PLAN_BAS_SAAT*60, Math.min(dk, PLAN_BIT_SAAT*60 - t.durationMinutes));
  t.date = iso;
  t.startTime = dkToSaatMetni(dk);
  planSurukleId = null;
  renderContent();
  showToast(`${t.projectName} → ${formatDate(iso)} ${t.startTime}`);
}

// ---- Planlanmamış tepsisi ----
function planTepsiHtml(){
  const isler = planlanmamisIsler();
  const yetki = planYetkili();
  const sec = planSecim();
  const asamaAdi = sec.stages ? sec.stages.map(k => (STAGES.find(s => s.key === k)||{}).label).join(' / ') : 'tüm aşamalar';
  return `
    ${disAlimSeritHtml()}
    <div class="hp-tepsi" ondragover="planTepsiOver(event)" ondragleave="planDragLeave(event)" ondrop="planTepsiDrop(event)">
      <span class="hp-tepsi-baslik">Planlanmamış <b>${isler.length}</b></span>
      ${isler.length ? isler.map(j => { const c = planRenk(j.client);
        return `<div class="hp-is" draggable="${yetki}" title="${yetki ? 'Gün / kişi hücresine sürükleyin' : 'Planlamayı yönetici yapar'}"
          style="background:var(--${c});border-color:var(--${c}b);color:var(--${c}f);"
          ondragstart="planIsDragStart(event,'${j.id}')" ondragend="planIsDragEnd(event)"
          onclick="openJobDrawer('${j.id}')">
          <b>${j.client}</b><i>${j.desc}</i>
          <u>${j.code}${j.tutar ? ' · ₺'+Number(j.tutar).toLocaleString('tr-TR') : ''}${sec.stages && sec.stages.length > 1 ? ' · '+(STAGES.find(s=>s.key===j.stage)||{}).label : ''}</u>
        </div>`; }).join('')
      : `<span class="hp-tepsi-bos">${asamaAdi} aşamasında planlanmayı bekleyen iş yok. Bir planı buraya sürükleyerek geri alabilirsiniz.</span>`}
      ${yetki ? '' : '<span class="hp-tepsi-bos" style="margin-left:auto;">🔒 Planlamayı yönetici yapar</span>'}
    </div>`;
}
function planIsDragStart(e, jobId){
  if(!planYetkili()){ e.preventDefault(); return; }
  planSurukleIsId = jobId; planSurukleId = null;
  e.currentTarget.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', 'job:'+jobId); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
  e.stopPropagation();
}
function planIsDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleIsId = null; }
function planTepsiOver(e){ if(planSurukleId){ e.preventDefault(); e.currentTarget.classList.add('drop'); } }
function planTepsiDrop(e){
  e.preventDefault(); e.currentTarget.classList.remove('drop');
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  planSurukleId = null; planSurukleKaynakKisi = null;
  if(!t) return;
  if(!t.jobId){ showToast('Bu blok bir işe bağlı değil; silmek için karta tıklayın.'); return; }
  PLAN_TASKS = PLAN_TASKS.filter(x => x.id !== t.id);
  renderContent();
  showToast(`${t.projectName} planı kaldırıldı — iş tekrar tepside.`);
}
function planKisilerIsimden(adlar){
  return (adlar||[]).map(ad => { const p = PERSONELLER.find(x => x.name === ad); return p ? p.id : null; }).filter(Boolean);
}

// ---- Ekip görünümü: sürükle-bırak ----
function planChipDragStart(e, id, kisiId){
  planSurukleId = id; planSurukleKaynakKisi = kisiId;
  e.currentTarget.classList.add('suruklenen');
  try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch(_){}
  e.stopPropagation();
}
function planChipDragEnd(e){ e.currentTarget.classList.remove('suruklenen'); planSurukleId = null; }
function planHucreDrop(e, iso, kisiId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop');
  if(planSurukleIsId){                                   // tepsiden yeni planlama
    const j = JOBS.find(x => x.id === planSurukleIsId);
    planSurukleIsId = null;
    if(!j) return;
    PLAN_TASKS.push(planBlokIsten(j, iso, '09:00', [kisiId]));
    bildirimAtama([kisiId], `Size iş atandı: ${j.code} · ${j.client} — ${formatDate(iso)}`);
    renderContent();
    const p = PERSONELLER.find(x => x.id === kisiId);
    showToast(`${j.code} planlandı → ${p ? p.name : ''} · ${formatDate(iso)}`);
    return;
  }
  const t = PLAN_TASKS.find(x => x.id === planSurukleId);
  if(!t){ planSurukleKaynakKisi = null; return; }
  const eski = planSurukleKaynakKisi;
  const yeniAtama = !(t.personelIds || []).includes(kisiId);
  t.date = iso;
  let kisiler = (t.personelIds || []).slice();
  if(eski && eski !== kisiId) kisiler = kisiler.filter(x => x !== eski);
  if(!kisiler.includes(kisiId)) kisiler.push(kisiId);
  t.personelIds = kisiler;
  if(yeniAtama) bildirimAtama([kisiId], `Size plan atandı: ${t.taskName} (${t.projectName}) — ${formatDate(iso)}`);
  planSurukleId = null; planSurukleKaynakKisi = null;
  renderContent();
  const p = PERSONELLER.find(x => x.id === kisiId);
  showToast(`${t.taskName} → ${p ? p.name : ''} · ${formatDate(iso)}`);
}

// ---- Kart alt kenarından süre uzatma ----
let planResize = null;
let planSonResize = 0;
function planKartTikla(id){
  if(Date.now() - planSonResize < 300) return;   // resize'ın hemen ardından modal açılmasın
  openPlanTaskModal(id);
}
function planResizeEtiket(e, dk){
  let et = document.getElementById('hpResizeTag');
  if(!et){ et = document.createElement('div'); et.id = 'hpResizeTag'; et.className = 'hp-resize-tag'; document.body.appendChild(et); }
  et.textContent = dkToSaat(dk);
  et.style.left = (e.clientX + 14) + 'px';
  et.style.top  = (e.clientY + 10) + 'px';
  et.style.display = 'block';
}
function planResizeEtiketGizle(){ const et = document.getElementById('hpResizeTag'); if(et) et.style.display = 'none'; }
function planResizeStart(e, id){
  e.preventDefault(); e.stopPropagation();
  const t = PLAN_TASKS.find(x => x.id === id); if(!t) return;
  const kart = e.currentTarget.parentElement;
  planTipGizle();
  kart.setAttribute('draggable','false');
  kart.classList.add('resizing');
  planResize = { id:id, kart:kart, basY:e.clientY, basSure:t.durationMinutes, yeni:t.durationMinutes };
  planResizeEtiket(e, t.durationMinutes);
  try { e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); } catch(err) {}
  document.addEventListener('pointermove', planResizeMove);
  document.addEventListener('pointerup', planResizeEnd);
  document.addEventListener('pointercancel', planResizeEnd);
}
function planResizeMove(e){
  if(!planResize) return;
  if(e.cancelable) e.preventDefault();
  const t = PLAN_TASKS.find(x => x.id === planResize.id); if(!t) return;
  const fark = ((e.clientY - planResize.basY) / PLAN_SAAT_PX) * 60;
  const enFazla = PLAN_BIT_SAAT*60 - saatToDk(t.startTime);       // günün sonunu aşmasın
  let yeni = Math.round((planResize.basSure + fark) / PLAN_SNAP_DK) * PLAN_SNAP_DK;
  yeni = Math.max(PLAN_SNAP_DK, Math.min(yeni, enFazla));
  planResize.yeni = yeni;
  planResize.kart.style.height = Math.max((yeni/60)*PLAN_SAAT_PX - 3, 22) + 'px';
  const sureEl = planResize.kart.querySelector('.hp-sure');
  if(sureEl) sureEl.textContent = dkToSaat(yeni);
  planResizeEtiket(e, yeni);
}
function planResizeEnd(){
  document.removeEventListener('pointermove', planResizeMove);
  document.removeEventListener('pointerup', planResizeEnd);
  document.removeEventListener('pointercancel', planResizeEnd);
  planResizeEtiketGizle();
  if(!planResize) return;
  const t = PLAN_TASKS.find(x => x.id === planResize.id);
  const yeni = planResize.yeni;
  const degisti = t && t.durationMinutes !== yeni;
  if(t) t.durationMinutes = yeni;
  planResize.kart.classList.remove('resizing');
  planResize.kart.setAttribute('draggable','true');
  planResize = null;
  planSonResize = Date.now();
  renderContent();
  if(degisti) showToast('Süre ' + dkToSaat(yeni) + ' oldu.');
}

// ---- Tooltip ----
function planTipGoster(e, id){
  const t = PLAN_TASKS.find(x => x.id === id); if(!t) return;
  const bas = saatToDk(t.startTime), bit = bas + t.durationMinutes;
  let tip = document.getElementById('hpTip');
  if(!tip){ tip = document.createElement('div'); tip.id = 'hpTip'; tip.className = 'hp-tip'; document.body.appendChild(tip); }
  tip.innerHTML = `
    <h6>${t.projectName}</h6>
    <div>${t.taskName}</div>
    <div class="hp-tip-row"><span>Tarih</span><b style="color:var(--ink);">${formatDate(t.date)}</b></div>
    <div class="hp-tip-row"><span>Saat</span><b style="color:var(--ink);">${dkToSaatMetni(bas)} – ${dkToSaatMetni(bit)}</b></div>
    <div class="hp-tip-row"><span>Süre</span><b style="color:var(--ink);">${dkToSaat(t.durationMinutes)}</b></div>
    ${t.cost ? `<div class="hp-tip-row"><span>Değer</span><b style="color:var(--ink);">₺${t.cost.toLocaleString('tr-TR')}</b></div>` : ''}
    <div class="hp-tip-row"><span>İlerleme</span><b style="color:var(--ink);">%${t.ilerleme||0}</b></div>
    ${(t.personelIds||[]).length ? `<div class="hp-tip-row" style="align-items:flex-start;">
      <span>Ekip</span><b style="color:var(--ink);text-align:right;">${
        (t.personelIds||[]).map(x => { const p = PERSONELLER.find(y => y.id === x); return p ? p.name : ''; }).join('<br>')
      }</b></div>` : ''}
    <div class="hp-tip-bar"><span style="width:${t.ilerleme||0}%;"></span></div>`;
  const r = e.currentTarget.getBoundingClientRect();
  let x = r.right + 10, y = r.top;
  if(x + 250 > window.innerWidth) x = r.left - 246;
  if(y + 190 > window.innerHeight) y = Math.max(8, window.innerHeight - 196);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.display = 'block';
}
function planTipGizle(){ const t = document.getElementById('hpTip'); if(t) t.style.display = 'none'; }

// ---- Görünüm ----
function haftalikPlanView(){
  return planGorunum === 'ekip' ? planEkipView() : planSaatView();
}
function planUstBar(gunler, ekstra){
  const isolar = gunler.map(planIso);
  const ekipIds = planEkip().map(p => p.id);
  const sec = planSecim();
  const haftaDk = PLAN_TASKS.filter(t => isolar.includes(t.date) &&
      ((t.personelIds||[]).some(id => ekipIds.includes(id)) || (!(t.personelIds||[]).length && (!sec.stages || sec.stages.includes(t.stage)))))
    .reduce((s,t)=> s + (Number(t.durationMinutes)||0), 0);
  const baslik = planDepartman === 'Tümü' ? 'Haftalık Program' : planDepartman.replace('+','&amp;') + ' Haftalık Programı';
  return `
    <div class="list-page-head">
      <div><div class="page-title">${baslik}</div>
        <div class="page-sub">Kimin elinde hangi iş var, hangi gün ne kadar yüklü — sürükleyerek değiştirin.</div></div>
      ${planYetkili() ? `<button class="primary-btn" onclick="openPlanTaskModal()">+ Serbest Blok</button>` : ''}
    </div>
    <div class="hp-bar">
      <div class="hp-mod">
        <button class="${planGorunum === 'ekip' ? 'on' : ''}" onclick="planGorunum='ekip'; renderContent();">Ekip</button>

function planSaatView(){
  const gunler = planHaftaGunleri();
  const bugunIso = planIso(new Date());
  const yukseklik = (PLAN_BIT_SAAT - PLAN_BAS_SAAT) * PLAN_SAAT_PX;
  const haftaDk = gunler.reduce((s,d)=> s + planGunOzeti(planIso(d)).dk, 0);
  const haftaTutar = gunler.reduce((s,d)=> s + planGunOzeti(planIso(d)).tutar, 0);

  const saatCizgileri = Array.from({length: PLAN_BIT_SAAT - PLAN_BAS_SAAT + 1}, (_,i) =>
    `<div class="hp-cizgi" style="top:${i*PLAN_SAAT_PX}px;"></div>`).join('');

  const simdi = new Date();
  const simdiDk = simdi.getHours()*60 + simdi.getMinutes();
  const simdiGoster = simdiDk >= PLAN_BAS_SAAT*60 && simdiDk <= PLAN_BIT_SAAT*60;

  const departmanSecici = `
    <select onchange="planDepartman=this.value; renderContent();"
      style="height:28px;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;
             background:var(--surface);color:var(--ink);font-size:11.5px;">
      ${Object.keys(PLAN_DEPARTMANLAR).map(x =>
        `<option ${planDepartman === x ? 'selected' : ''}>${x}</option>`).join('')}
    </select>`;
  return `
    ${planUstBar(gunler, departmanSecici)}
    ${planTepsiHtml()}

    <div class="hp-board">
      <div class="hp-head corner"></div>
      ${gunler.map(d => { const iso = planIso(d); const o = planGunOzeti(iso);
        return `<div class="hp-head">
          <div class="hp-gun ${iso === bugunIso ? 'bugun' : ''}">${PLAN_GUNLER[(d.getDay()+6)%7]}${iso === bugunIso ? ' · bugün' : ''}</div>
          <div class="hp-tarih">${d.getDate()} ${PLAN_AYLAR[d.getMonth()]}</div>
          <div class="hp-ozet">${o.dk ? dkToSaat(o.dk) : '—'}${o.tutar ? ' · ₺'+o.tutar.toLocaleString('tr-TR') : ''}</div>
        </div>`; }).join('')}

      <div class="hp-gutter" style="height:${yukseklik}px;">
        ${Array.from({length: PLAN_BIT_SAAT - PLAN_BAS_SAAT + 1}, (_,i) =>
          `<div class="hp-saat" style="top:${i*PLAN_SAAT_PX}px;">${String(PLAN_BAS_SAAT+i).padStart(2,'0')}:00</div>`).join('')}
      </div>

      ${gunler.map(d => { const iso = planIso(d);
        const gorevler = PLAN_TASKS.filter(t => t.date === iso)
          .sort((a,b) => saatToDk(a.startTime) - saatToDk(b.startTime));
        // Aynı saat aralığında çakışan bloklar üst üste değil YAN YANA yerleşir
        const yerlesim = {};
        let kume = [], kumeSonu = -1, aktif = [];
        const kumeBitir = () => {
          if(!kume.length) return;
          const n = Math.max.apply(null, kume.map(x => yerlesim[x.id].sut)) + 1;
          kume.forEach(x => { yerlesim[x.id].toplam = n; });
          kume = [];
        };
        gorevler.forEach(t => {
          const bas = saatToDk(t.startTime), bit = bas + (Number(t.durationMinutes) || 0);
          if(kume.length && bas >= kumeSonu){ kumeBitir(); aktif = []; }
          aktif = aktif.filter(a => saatToDk(a.startTime) + (Number(a.durationMinutes) || 0) > bas);
          const dolu = new Set(aktif.map(a => yerlesim[a.id].sut));
          let sut = 0; while(dolu.has(sut)) sut++;
          yerlesim[t.id] = { sut: sut, toplam: 1 };
          aktif.push(t); kume.push(t);
          kumeSonu = Math.max(kumeSonu, bit);
        });
        kumeBitir();
        return `<div class="hp-col" style="height:${yukseklik}px;"
          ondragover="planDragOver(event)" ondragleave="planDragLeave(event)" ondrop="planDrop(event,'${iso}')">
          ${saatCizgileri}
          ${(iso === bugunIso && simdiGoster) ? `<div class="hp-simdi" style="top:${((simdiDk - PLAN_BAS_SAAT*60)/60)*PLAN_SAAT_PX}px;"></div>` : ''}
          ${gorevler.map(t => {
            const c = planProjeRengi(t);
            const top = ((saatToDk(t.startTime) - PLAN_BAS_SAAT*60) / 60) * PLAN_SAAT_PX;
            const h = Math.max((t.durationMinutes / 60) * PLAN_SAAT_PX - 3, 22);
            const yer = yerlesim[t.id] || { sut: 0, toplam: 1 };
            const yanYana = yer.toplam > 1
              ? `left:calc(${(yer.sut * 100 / yer.toplam).toFixed(3)}% + 2px);width:calc(${(100 / yer.toplam).toFixed(3)}% - 5px);right:auto;`
              : '';
            return `<div class="hp-task" draggable="${planYetkili()}"
              style="top:${top}px;height:${h}px;${yanYana}background:var(--${c});border-color:var(--${c}b);color:var(--${c}f);"
              ondragstart="planDragStart(event,'${t.id}')" ondragend="planDragEnd(event)"
              onmouseenter="planTipGoster(event,'${t.id}')" onmouseleave="planTipGizle()"
              onclick="planKartTikla('${t.id}')">
              <div class="hp-task-proje">${t.projectName}</div>
              ${h > 42 ? `<div class="hp-task-ad">${t.taskName}</div>` : ''}
              ${h > 58 && (t.personelIds||[]).length ? `<div class="hp-kim">${
                (t.personelIds||[]).slice(0,3).map(x => `<span>${planKisaAd(x)}</span>`).join('')
              }${(t.personelIds||[]).length > 3 ? `<span>+${(t.personelIds||[]).length-3}</span>` : ''}</div>` : ''}
              ${h > 58 ? `<div class="hp-task-alt">
                <span>${t.cost ? '₺'+t.cost.toLocaleString('tr-TR') : ''}</span>
                <span class="hp-sure">${dkToSaat(t.durationMinutes)}</span></div>` : ''}
              ${planYetkili() ? `<div class="hp-resize" title="Süreyi uzatmak/kısaltmak için aşağı-yukarı sürükleyin"
                onpointerdown="planResizeStart(event,'${t.id}')"></div>` : ''}
            </div>`; }).join('')}
        </div>`; }).join('')}
    </div>

    <div class="hp-legend">
      ${planAktifProjeler(gunler).map(ad => { const c = planRenk(ad);
        return `<span><i style="background:var(--${c});border-color:var(--${c}b);"></i>${ad}</span>`; }).join('')}
    </div>`;
}

function submitPlanTask(id){
  const val = x => { const el = document.getElementById(x); return el ? el.value : ''; };
  const ad = val('ptAd').trim();
  if(!ad){ showToast('Görev adı girin.'); return; }
  const mevcutBlok = id ? PLAN_TASKS.find(x => x.id === id) : null;
  let projectId = val('ptProje'), projectName;
  if(mevcutBlok && mevcutBlok.jobId){ projectId = mevcutBlok.projectId; projectName = mevcutBlok.projectName; }
  else if(projectId === '__ic'){ projectName = 'Dekant İç İşler'; }
  else { const c = CUSTOMERS.find(x => x.id === projectId); projectName = c ? c.name : 'Proje'; }
  const veri = {
    projectId: projectId, projectName: projectName, taskName: ad,
    date: val('ptGun'), startTime: val('ptSaat') || '09:00',
    durationMinutes: Math.max(Number(val('ptSure')) || 60, 15),
    cost: Number(val('ptTutar')) || 0,
    ilerleme: Math.min(Math.max(Number(val('ptIlerleme')) || 0, 0), 100),
    personelIds: Array.from(document.querySelectorAll('.pt-kisi:checked')).map(x => x.value),
  };
  const mevcut = id ? PLAN_TASKS.find(x => x.id === id) : null;
  const oncekiler = mevcut ? (mevcut.personelIds || []) : [];
  if(mevcut) Object.assign(mevcut, veri);
  else PLAN_TASKS.push(Object.assign({ id:'t'+Date.now() }, veri));
  bildirimAtama(veri.personelIds.filter(x => !oncekiler.includes(x)),
    `Size plan atandı: ${ad} (${projectName}) — ${formatDate(veri.date)}`);
  closeModal(); renderContent();
  showToast(mevcut ? 'Blok güncellendi.' : 'Blok eklendi.');
}
function deletePlanTask(id){
  PLAN_TASKS = PLAN_TASKS.filter(x => x.id !== id);
  closeModal(); renderContent(); showToast('Blok silindi.');
}

// ---- Gelir Gider Raporu (kategori kırılımlı) ----
let katRaporBas = '2026-01-01';
let katRaporBit = new Date().toISOString().slice(0,10);
function isoToMs(s){ const d = new Date(s + 'T00:00:00'); return isNaN(d) ? 0 : d.getTime(); }
function kayitTarihMs(x){ return trTarihMs(x.tarih) || isoToMs(x.tarih); }
function katFiltre(list){
  const b = isoToMs(katRaporBas), s = isoToMs(katRaporBit) + 86399999;
  return list.filter(x => { const t = kayitTarihMs(x); return !t || (t >= b && t <= s); });
}
function katGrupla(list, rampa){
  const map = new Map();
  list.forEach(x => {
    const key = x.kategoriId || '__yok';
    if(!map.has(key)) map.set(key, { id:key, ad: x.kategoriId ? kategoriAdi(x.kategoriId) : 'Kategorisiz', toplam:0, adet:0 });
    const g = map.get(key);
    g.toplam += Number(x.tutar)||0; g.adet++;
  });
  const arr = [...map.values()].sort((a,b) => Math.abs(b.toplam) - Math.abs(a.toplam));
  let i = 0;
  arr.forEach(g => { g.renk = (g.id === '__yok') ? 'var(--cat-none)' : rampa[i++ % rampa.length]; });
  return arr;
}
function katDonutGradient(gruplar){
  const toplam = gruplar.reduce((s,g)=> s + Math.abs(g.toplam), 0);
  if(!toplam) return 'conic-gradient(var(--surface-sunk) 0deg 360deg)';
  const bosluk = gruplar.length > 1 ? 2 : 0;      // dilimler arası 2° yüzey boşluğu
  let acc = 0; const parts = [];
  gruplar.forEach(g => {
    const deg = (Math.abs(g.toplam) / toplam) * 360;
    const son = acc + Math.max(deg - bosluk, 0.6);
    parts.push(`${g.renk} ${acc.toFixed(2)}deg ${son.toFixed(2)}deg`);
    if(bosluk) parts.push(`var(--surface) ${son.toFixed(2)}deg ${(acc+deg).toFixed(2)}deg`);
    acc += deg;
  });
  return `conic-gradient(${parts.join(',')})`;
}
function katPanel(baslik, gruplar, toplam, renkSinif){
  const bas = gruplar[0];
  return `
    <div class="kat-panel">
      <div class="kat-donut" style="background:${katDonutGradient(gruplar)};">
        <div class="kat-donut-hole">
          <b>${bas ? bas.ad : '—'}</b>
          <span>${bas ? tlSigned(bas.toplam) : '0,00 TL'}</span>
        </div>
      </div>
      <div class="kat-panel-head">
        <h4>${baslik}</h4>
        <b style="color:${renkSinif};">${tlSigned(toplam)}</b>
      </div>
      <div class="kat-row" style="font-family:var(--font-display);font-size:10.5px;font-weight:700;
        text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);border-bottom:1px solid var(--line);">
        <span style="width:10px;"></span><span>Kategori Adı</span><span class="kat-val">Toplam Tutar</span></div>
      ${gruplar.length ? gruplar.map(g => `<div class="kat-row">
        <span class="kat-dot" style="background:${g.renk};"></span>
        <span>${g.ad}</span>
        <span class="kat-val">${tlSigned(g.toplam)}</span>
      </div>`).join('') : `<div class="kat-row" style="color:var(--ink-3);"><span></span><span>Bu aralıkta kayıt yok.</span></div>`}
      <div class="kat-row total"><span></span><span>Toplam Tutar</span>
        <span class="kat-val">${tlSigned(toplam)}</span></div>
    </div>`;
}
function kategoriRaporuView(){
  const gelirler = katFiltre(GELIRLER);
  const giderler = katFiltre(GIDERLER);
  const gGruplar = katGrupla(gelirler, GELIR_RAMPA);
  const dGruplar = katGrupla(giderler.map(x => Object.assign({}, x, { tutar: -Math.abs(Number(x.tutar)||0) })), GIDER_RAMPA);
  const gToplam = gGruplar.reduce((s,g)=> s + g.toplam, 0);
  const dToplam = dGruplar.reduce((s,g)=> s + g.toplam, 0);

// Cari bakiyeleri faturalardan türetilir: satış faturası kalanı = tahsil edilecek (−), alış faturası kalanı = ödeme yapılacak (+)
function cariBakiyeleri(){
  const m = new Map();
  FATURALAR.forEach(f => {
    const kalan = Number(f.kalan)||0; if(!kalan) return;
    const yon = /Alış/.test(f.tur||'') ? 1 : -1;
    m.set(f.client, (m.get(f.client)||0) + yon*kalan);
  });
  return [...m.entries()].filter(([,b]) => b !== 0)
    .map(([client,bakiye]) => ({ client, bakiye, durum: bakiye<0 ? 'Tahsil Edilecek' : 'Ödeme Yapılacak' }))
    .sort((a,b) => a.client.localeCompare(b.client,'tr'));
}

let KATEGORILER = [
  { id:'kg1', ad:'Mobilya Satış', tip:'gelir' },
  { id:'kg2', ad:'Tabela İşleri', tip:'gelir' },
  { id:'kd1', ad:'Mutfak',        tip:'gider' },
  { id:'kd2', ad:'Maaş',          tip:'gider', sistem:true },
  { id:'kd3', ad:'Mesai',         tip:'gider', sistem:true },
  { id:'kd4', ad:'Malzeme Alımı', tip:'gider' },
];
const GELIR_RAMPA = ['var(--cat-g1)','var(--cat-g2)','var(--cat-g3)','var(--cat-g4)','var(--cat-g5)'];
const GIDER_RAMPA = ['var(--cat-r1)','var(--cat-r2)','var(--cat-r3)','var(--cat-r4)','var(--cat-r5)'];

function kategorilerByTip(tip){ return KATEGORILER.filter(k => k.tip === tip); }
function kategoriAdi(id){ const k = KATEGORILER.find(x => x.id === id); return k ? k.ad : 'Kategorisiz'; }
function kategoriIdByAd(ad, tip){
  const k = KATEGORILER.find(x => x.tip === tip && x.ad.toLowerCase() === String(ad).toLowerCase());
  return k ? k.id : null;
}
function kategoriSelectHtml(id, tip, secili){
  return `<div style="display:flex;gap:8px;align-items:center;">
    <select id="${id}" style="flex:1;">
      <option value="">Kategorisiz</option>
      ${kategorilerByTip(tip).map(k => `<option value="${k.id}" ${secili === k.id ? 'selected' : ''}>${k.ad}</option>`).join('')}
    </select>
    <button class="btn" style="flex:0 0 auto;height:36px;" onclick="openKategoriModal('${tip}','${id}')">+ Yeni</button>
  </div>`;
}
function openKategoriModal(tip, hedefSelectId){
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Yeni ${tip === 'gelir' ? 'Gelir' : 'Gider'} Kategorisi</h2>
      <button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Kategori Adı</label>
      <input id="ktAd" placeholder="${tip === 'gelir' ? 'Örn. Kira Geliri' : 'Örn. Mutfak'}"></div>
    <button class="modal-submit" onclick="submitKategori('${tip}','${hedefSelectId || ''}')">Ekle</button>`;
  showModal();
}
function submitKategori(tip, hedefSelectId){
  const ad = document.getElementById('ktAd').value.trim();
  if(!ad){ showToast('Kategori adı girin.'); return; }
  if(kategoriIdByAd(ad, tip)){ showToast('Bu kategori zaten var.'); return; }
  const yeni = { id:'k'+Date.now(), ad:ad, tip:tip };
  KATEGORILER.push(yeni);
  closeModal();
  const sel = hedefSelectId ? document.getElementById(hedefSelectId) : null;
  if(sel){
    const opt = document.createElement('option');
    opt.value = yeni.id; opt.textContent = yeni.ad; opt.selected = true;
    sel.appendChild(opt);
  } else {
    renderContent();
  }
  showToast(`"${ad}" kategorisi eklendi.`);
}
function openKategoriDuzenle(id){
  const k = KATEGORILER.find(x => x.id === id);
  if(!k || k.sistem){ showToast('Bu kategori düzenlenemez.'); return; }
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Kategoriyi Yeniden Adlandır</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Kategori Adı</label><input id="ktAd" value="${notEsc(k.ad)}"></div>
    <button class="modal-submit" onclick="submitKategoriDuzenle('${id}')">Kaydet</button>`;
  showModal();
}
function submitKategoriDuzenle(id){
  const k = KATEGORILER.find(x => x.id === id); if(!k) return;
  const ad = document.getElementById('ktAd').value.trim();
  if(!ad){ showToast('Kategori adı girin.'); return; }
  const ayni = kategoriIdByAd(ad, k.tip);
  if(ayni && ayni !== id){ showToast('Bu isimde bir kategori zaten var.'); return; }
  k.ad = ad;
  closeModal(); renderContent();
  showToast('Kategori güncellendi.');
}
function deleteKategori(id){
  const k = KATEGORILER.find(x => x.id === id);
  if(!k || k.sistem){ showToast('Bu kategori silinemez.'); return; }
  const kullanim = [...GELIRLER, ...GIDERLER].filter(x => x.kategoriId === id).length;
  KATEGORILER = KATEGORILER.filter(x => x.id !== id);
  [...GELIRLER, ...GIDERLER].forEach(x => { if(x.kategoriId === id) x.kategoriId = null; });
  renderContent();
  showToast(kullanim ? `"${k.ad}" silindi, ${kullanim} kayıt kategorisiz kaldı.` : `"${k.ad}" silindi.`);
}

function kategorilerView(){
  const blok = (tip, baslik) => `
    <div class="group-header" style="margin-top:16px;"><span>— ${baslik}</span>
      <span style="cursor:pointer;text-decoration:underline;" onclick="openKategoriModal('${tip}','')">+ Yeni Kategori</span></div>
    ${kategorilerByTip(tip).length ? `<table style="margin-bottom:8px;">
      <thead><tr><th>Kategori</th><th style="text-align:right;">Kayıt</th><th style="text-align:right;">Toplam</th><th></th></tr></thead>
      <tbody>${kategorilerByTip(tip).map(k => {
        const kayitlar = (tip === 'gelir' ? GELIRLER : GIDERLER).filter(x => x.kategoriId === k.id);
        const toplam = kayitlar.reduce((s,x)=> s + (Number(x.tutar)||0), 0);
        return `<tr>
          <td><b>${k.ad}</b>${k.sistem ? ' <span class="due">· sistem</span>' : ''}</td>
          <td style="text-align:right;">${kayitlar.length}</td>
          <td style="text-align:right;font-family:var(--font-mono);">${tlSigned(toplam)}</td>
          <td style="text-align:right;width:64px;white-space:nowrap;">${k.sistem ? ''
            : `<span class="mini-islem" title="Yeniden adlandır" onclick="openKategoriDuzenle('${k.id}')">✎</span>
               <span class="mini-islem sil" title="Sil" onclick="deleteKategori('${k.id}')">✕</span>`}</td>
        </tr>`; }).join('')}</tbody></table>`
      : `<div class="note">Henüz kategori yok.</div>`}`;
  return `
    <div class="page-head"><div><div class="page-title">Kategoriler</div>
      <div class="page-sub">Gelir ve gider kayıtları bu kategorilere göre raporlanır.</div></div></div>
    <div class="note">Sistem kategorileri (<b>Maaş</b>, <b>Mesai</b>) silinemez — personel ve mesai kayıtları otomatik olarak bunlara işlenir.</div>
    ${blok('gelir','Gelir Kategorileri')}
    ${blok('gider','Gider Kategorileri')}`;
}

    adres:{ tur:'İş Adresi', ulke:'Türkiye', postaKodu:'', ilce:'', sehir:'', eyalet:'', adres:'' },
    hareketler:[], departman:'Üretim' };
}
function trTarihMs(s){
  const m = String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : 0;
}
function tlSigned(n){
  const v = Number(n)||0;
  return v.toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' TL';
}
function personelBakiye(p){ return (p.hareketler||[]).reduce((s,x)=> s + (Number(x.tutar)||0), 0); }
function personelEkstre(p){
  const list = (p.hareketler||[]).slice()
    .sort((a,b) => trTarihMs(a.tarih) - trTarihMs(b.tarih));
  let bak = 0;
  return list.map(x => { bak += Number(x.tutar)||0; return Object.assign({}, x, { bakiye:bak }); }).reverse();
}
function personelById(id){ return PERSONELLER.find(p => p.id === id); }

function personellerView(){

  if(personelStep === 'detay') return personelDetayView();

function submitHareket(kind){

  const tutar = Number(document.getElementById('hrTutar').value) || 0;

  p.hareketler.push({
    id: benzersizId('hr'),
    tur: k.tur,
    tarih: document.getElementById('hrTarih').value || bugunTR(),
    aciklama: document.getElementById('hrAciklama').value.trim(),
    tutar: tutar * k.isaret,
  });
  const gidereIsle = document.getElementById('hrGider');
  if(!gidereIsle || gidereIsle.checked){
    GIDERLER.unshift({
      id: benzersizId('gi'),
      client: p.name,
      hesap: BANK_ACCOUNTS[0] ? BANK_ACCOUNTS[0].name : 'Kasa',
      tur: k.tur,
      tarih: document.getElementById('hrTarih').value || bugunTR(),
      tutar: tutar,
      odendi: kind === 'avans',
      kategoriId: kategoriIdByAd('Maaş','gider'),
    });
  }
  closeModal(); renderContent();
  showToast(`${k.tur} eklendi — ${tlSigned(tutar * k.isaret)}`);
}
function openHareketDuzenle(hid){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  const isaret = Number(h.tutar) < 0 ? -1 : 1;
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>${h.tur} — Düzenle</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Ödeme Tarihi</label><input id="hrTarih" value="${notEsc(h.tarih || '')}"></div>

    <div class="field"><label>Tutar (₺)</label><input id="hrTutar" type="number" min="0" value="${Math.abs(Number(h.tutar) || 0)}"></div>
    <div class="hint" style="margin:-6px 0 10px;">Bu düzenleme yalnızca personel ekstresini günceller; Giderler'e işlenmiş kayıt varsa onu Giderler ekranından ayrıca düzenleyin.</div>
    <button class="modal-submit" onclick="submitHareketDuzenle('${hid}', ${isaret})">Kaydet</button>`;
  showModal();
}
function submitHareketDuzenle(hid, isaret){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  const tutar = Number(document.getElementById('hrTutar').value) || 0;
  if(!tutar){ showToast('Tutar girin.'); return; }
  h.tarih = document.getElementById('hrTarih').value || h.tarih;
  h.aciklama = document.getElementById('hrAciklama').value.trim();
  h.tutar = tutar * isaret;
  closeModal(); renderContent();
  showToast('Hareket güncellendi.');
}
function deleteHareket(hid){
  const p = personelById(personelSecili); if(!p) return;
  const h = (p.hareketler || []).find(x => x.id === hid); if(!h) return;
  if(!confirm(`${h.tur} — ${tlSigned(h.tutar)} hareketi silinsin mi? Giderler'e işlenmiş kayıt varsa onu Giderler ekranından ayrıca silmelisiniz.`)) return;
  p.hareketler = p.hareketler.filter(x => x.id !== hid);
  renderContent();
  showToast('Hareket silindi.');
}

function deletePersonel(id){

}

function submitPersonel(){
  const d = personelDraft;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const ad = val('prAd').trim();
  if(!ad){ showToast('Ad Soyad zorunlu.'); return; }
  const veri = {
    name: ad,
    unvan: val('prUnvan').trim(),
    departman: val('prDepartman'),
    brut: Number(val('prBrut')) || 0,
    cinsiyet: val('prCinsiyet'),
    dogumTarihi: val('prDogumTarihi'),
    dogumYeri: val('prDogumYeri').trim(),
    iletisim: d.iletisim.filter(x => x.deger.trim()),
    adres: { tur:val('prAdresTur'), ulke:val('prUlke'), postaKodu:val('prPostaKodu'),
             ilce:val('prIlce'), sehir:val('prSehir'), eyalet:val('prEyalet'), adres:val('prAdres') },
  };
  if(!veri.iletisim.length) veri.iletisim = [{ tur:'İş Telefon No', deger:'' }];
  const mevcut = d.id ? personelById(d.id) : null;
  if(mevcut){ Object.assign(mevcut, veri); personelSecili = mevcut.id; }
  else {

  personelDraft = null; personelStep = 'detay'; renderContent();
  showToast(`${ad} kaydedildi.`);
}

// ---------------- MESAİLER ----------------
let MESAI_RATES = { normal:50, hafta:100, resmi:100 };   // yüzde ek
const MESAI_TYPES = [
  { key:'normal', label:'Normal Mesai', icon:'🕐', base:'saat' },
  { key:'hafta',  label:'Hafta Tatili', icon:'📅', base:'saat' },
  { key:'resmi',  label:'Resmî Tatil',  icon:'🎉', base:'gun'  },   // maaş / 30 gün
];
const MESAI_VARSAYILAN_SAAT = 225;
const MESAI_AY_GUN = 30;                       // resmî tatil günlük ücret böleni
function mesaiTip(key){ return MESAI_TYPES.find(t => t.key === key); }
function mesaiBirimAdi(key){ return mesaiTip(key).base === 'gun' ? 'gün' : 'saat'; }
function mesaiBirimBaslik(key){ return mesaiTip(key).base === 'gun' ? 'Günlük ücret' : 'Saatlik ücret'; }
let MESAI_KAYIT = {};            // personelId → { brut, saat, hours }
let mesaiPersonelId = null;
let mesaiRatesEdit = false;

function mesaiKatsayi(key){ return 1 + ((Number(MESAI_RATES[key])||0)/100); }
function mesaiData(id){
  if(!MESAI_KAYIT[id]){
    const p = PERSONELLER.find(x => x.id === id);
    MESAI_KAYIT[id] = { brut:(p && p.brut) || 0, saat:MESAI_VARSAYILAN_SAAT,
                        hours:{ normal:0, hafta:0, resmi:0 }, kayitTarihi:null };
  }
  return MESAI_KAYIT[id];
}
function mesaiSaatlik(d){ const s = Number(d.saat)||0; return s > 0 ? (Number(d.brut)||0)/s : 0; }
function mesaiGunluk(d){ return (Number(d.brut)||0) / MESAI_AY_GUN; }
function mesaiBirimUcret(d, key){ return mesaiTip(key).base === 'gun' ? mesaiGunluk(d) : mesaiSaatlik(d); }
function mesaiTutar(d, key){ return mesaiBirimUcret(d, key) * mesaiKatsayi(key) * (Number(d.hours[key])||0); }
function mesaiMiktarMetni(d, key){
  return (Number(d.hours[key])||0).toLocaleString('tr-TR') + ' ' + mesaiBirimAdi(key);
}
function mesaiToplam(d){ return MESAI_TYPES.reduce((s,t)=> s + mesaiTutar(d, t.key), 0); }
function tl(n){ return '₺' + (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function tl0(n){ return '₺' + Math.round(Number(n)||0).toLocaleString('tr-TR'); }

function mesailerView(){ return mesaiPersonelId ? mesaiDetayView() : mesaiListView(); }

function mesaiListView(){
  return `
    <div class="list-page-head"><div class="page-title">Mesailer</div></div>
    <div class="note">Hesaplamak istediğiniz personele tıklayın. Liste <b>Ön Muhasebe → Personeller</b> sayfasından gelir; oradaki her personel burada da görünür.</div>
    ${mesaiRatesBlock()}
    ${(() => { const aktif = PERSONELLER.filter(p => !p.arsiv); return `
    <div class="group-header" style="margin-top:18px;"><span>— Personeller</span><span>${aktif.length} kayıt</span></div>
    <table>
      <thead><tr><th>Personel</th><th>Unvan</th><th>Son Kayıt</th><th style="text-align:right;">Hesaplanan Mesai</th></tr></thead>
      <tbody>
        ${aktif.map(p => {
          const d = MESAI_KAYIT[p.id];
          const t = d ? mesaiToplam(d) : 0;
          return `<tr style="cursor:pointer;" onclick="openMesai('${p.id}')">
            <td><b>${p.name}</b></td>

function updateMesai(field, val){
  const d = mesaiData(mesaiPersonelId);
  const n = Number(String(val).replace(',', '.')) || 0;
  if(field === 'brut' || field === 'saat') d[field] = n;
  else d.hours[field] = n;
  syncMesai();
}
function syncMesai(){
  const d = mesaiData(mesaiPersonelId);
  const saatlik = mesaiSaatlik(d);
  const set = (id, v) => { const el = document.getElementById(id); if(el){ if('value' in el && el.tagName === 'INPUT') el.value = v; else el.textContent = v; } };
  set('msSaatlik', tl(saatlik));
  set('msGunluk', tl(mesaiGunluk(d)));
  MESAI_TYPES.forEach(t => {
    set('msK_'+t.key, mesaiBirimBaslik(t.key) + ' × ' + mesaiKatsayi(t.key).toLocaleString('tr-TR'));
    set('msT_'+t.key, tl(mesaiTutar(d, t.key)));
    set('msS_'+t.key, mesaiMiktarMetni(d, t.key));
    set('msB_'+t.key, tl(mesaiBirimUcret(d, t.key)));
  });
  const html = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  html('msToplam', '<b>' + tl(mesaiToplam(d)) + '</b>');
  set('msToplam2', tl(mesaiToplam(d)));
  set('msGenel',   tl((Number(d.brut)||0) + mesaiToplam(d)));
}

function saveMesai(){
  const d = mesaiData(mesaiPersonelId);
  const p = PERSONELLER.find(x => x.id === mesaiPersonelId);
  const toplam = mesaiToplam(d);
  if(!toplam){ showToast('Önce mesai saati girin.'); return; }
  d.kayitTarihi = new Date().toLocaleDateString('tr-TR');
  const gidereIsle = document.getElementById('msGider');
  if(!gidereIsle || gidereIsle.checked){
    GIDERLER.unshift({
      client: p ? p.name : null,
      hesap: BANK_ACCOUNTS[0] ? BANK_ACCOUNTS[0].name : 'Kasa',
      tur: 'Mesai Ücreti',
      tarih: d.kayitTarihi,
      tutar: Math.round(toplam),
      odendi: false,
      kategoriId: kategoriIdByAd('Mesai','gider'),
    });
  }
  mesaiPersonelId = null;
  renderContent();
  showToast(`${p ? p.name : 'Personel'} — ${tl(toplam)} mesai kaydedildi.`);
}

function hesapBul(tur, id){ return (tur === 'kasa' ? KASA_ACCOUNTS : BANK_ACCOUNTS).find(x => x.id === id); }
function openAccountModal(tur, id){
  const a = id ? hesapBul(tur, id) : null;
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>${a ? 'Hesabı Düzenle' : 'Yeni Hesap'}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Hesap Adı</label><input id="accName" value="${a ? notEsc(a.name) : ''}" placeholder="Örn. Merkez Kasa"></div>
    <div class="field-row">
      <div class="field"><label>Tür</label><select id="accType" ${a ? 'disabled' : ''}>
        <option value="kasa" ${tur === 'kasa' ? 'selected' : ''}>Kasa</option>
        <option value="banka" ${tur === 'banka' ? 'selected' : ''}>Banka</option></select></div>
      <div class="field"><label>Para Birimi</label><select id="accCurrency">
        <option value="TL" ${a && a.currency === 'TL' ? 'selected' : ''}>TL</option>
        <option value="$" ${a && a.currency === '$' ? 'selected' : ''}>$</option></select></div>
    </div>
    <div class="field"><label>${a ? 'Bakiye' : 'Başlangıç Bakiyesi'}</label><input id="accBalance" type="number" value="${a ? a.balance : 0}"></div>
    <button class="modal-submit" onclick="submitAccount('${tur || ''}','${a ? a.id : ''}')">${a ? 'Kaydet' : 'Hesabı Ekle'}</button>
  `;
  showModal();
}
function submitAccount(tur, id){
  const name = document.getElementById('accName').value.trim();
  if(!name) return;
  const currency = document.getElementById('accCurrency').value;
  const balance = Number(document.getElementById('accBalance').value) || 0;
  const a = id ? hesapBul(tur, id) : null;
  if(a){ a.name = name; a.currency = currency; a.balance = balance; }
  else {
    const type = document.getElementById('accType').value;
    (type === 'kasa' ? KASA_ACCOUNTS : BANK_ACCOUNTS).push({ id: benzersizId(type === 'kasa' ? 'ka' : 'ba'), name, balance, currency });
  }
  closeModal(); renderContent();
  showToast(a ? `${name} güncellendi.` : `${name} eklendi.`);
}
function deleteAccount(tur, id){
  const a = hesapBul(tur, id); if(!a) return;
  const uyari = a.balance ? ` Hesapta ${a.balance.toLocaleString('tr-TR')}${a.currency} bakiye görünüyor.` : '';
  if(!confirm(`"${a.name}" hesabı silinsin mi?${uyari} Geçmiş gelir/gider kayıtları silinmez.`)) return;
  if(tur === 'kasa') KASA_ACCOUNTS = KASA_ACCOUNTS.filter(x => x.id !== id);
  else BANK_ACCOUNTS = BANK_ACCOUNTS.filter(x => x.id !== id);
  renderContent();
  showToast('Hesap silindi.');
}

const STAGE_COLORS = { KESIF:'#94A3B8', TASARIM:'#F59E0B', URETIM:'#FF5A1F', MONTAJ:'#3B82F6', TAHSILAT:'#10B981' };
const STAGE_LABELS_TR = { KESIF:'Keşif', TASARIM:'Tasarım', URETIM:'Üretim', MONTAJ:'Montaj', TAHSILAT:'Tahsilat' };

function departmentDonut(){
  const stages = Object.keys(STAGE_COLORS);
  const counts = stages.map(s => JOBS.filter(j=>j.stage===s).length);
  const total = counts.reduce((a,b)=>a+b,0);
  const bolen = total || 1;
  let cursor = 0;
  const stops = total ? stages.map((s,i) => {
    const start = cursor/bolen*360;
    cursor += counts[i];
    const end = cursor/bolen*360;
    return `${STAGE_COLORS[s]} ${start}deg ${end}deg`;
  }).join(', ') : 'var(--surface-sunk) 0deg 360deg';
  return `
    <div style="padding:22px; display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
      <div class="donut" style="width:168px;height:168px;background:conic-gradient(${stops}); flex-shrink:0;">
        <div class="donut-inner" style="width:114px;height:114px;">
          <b style="font-size:10px;">TOPLAM İŞ</b>
          <span style="font-size:20px;">${total}</span>
        </div>
      </div>
      <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:2px;">
        ${stages.map((s,i) => `
          <div onclick="filterBoardByStage('${s}')" style="display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;" onmouseover="this.style.background='var(--surface-sunk)'" onmouseout="this.style.background='transparent'">
            <span style="width:10px;height:10px;border-radius:3px;background:${STAGE_COLORS[s]}; flex-shrink:0;"></span>
            <span style="flex:1; font-size:13px; font-weight:500;">${STAGE_LABELS_TR[s]}</span>
            <span style="font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--ink-2);">${counts[i]}</span>
            <span style="color:var(--ink-3); font-size:12px;">›</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function submitUser(){
  const pid = document.getElementById('uPersonel').value;
  const email = document.getElementById('uEmail').value.trim().toLowerCase();
  const pass = document.getElementById('uPass').value;
  const rol = document.getElementById('uRole').value;
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p){ showToast('Personel seçin.'); return; }
  if(!email){ showToast('E-posta girin.'); return; }
  if(pass.length < 6){ showToast('Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('uSubmitBtn'); btn.disabled = true; btn.textContent = 'Açılıyor…';
  const r = await liveApi('POST', '/api/users', { email, name:p.name, password:pass, role:rol });
  if(!r.ok){ btn.disabled = false; btn.textContent = 'Hesabı Aç'; showToast(r.error); return; }
  p.kullanici = { email:email, rol:rol };
  closeModal(); renderContent();
  showToast(`${p.name} için giriş hesabı açıldı (${ROLE_CONFIG[rol].label}).`);
}
async function removeUser(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p || !p.kullanici) return;
  if(p.kullanici.rol === 'YONETICI' && USERS.filter(u => u.role === 'YONETICI').length <= 1){
    showToast('Son yönetici hesabı kaldırılamaz.'); return;
  }
  if(LIVE.user && p.kullanici.email === LIVE.user.email){ showToast('Kendi hesabınızı kaldıramazsınız.'); return; }
  const r = await liveApi('DELETE', '/api/users', { email:p.kullanici.email });
  if(!r.ok && r.status !== 404){ showToast(r.error); return; }
  delete p.kullanici; renderContent(); showToast(`${p.name} — giriş hesabı kaldırıldı.`);
}
function openPasswordModal(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p || !p.kullanici) return;
  document.getElementById('modalBox').innerHTML = `

    <button class="modal-submit" id="pwSubmitBtn" onclick="submitPassword('${p.id}')">Şifreyi Kaydet</button>
  `;
  showModal();
}
async function submitPassword(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  const pass = document.getElementById('pwNew').value;
  if(!p || !p.kullanici) return;
  if(pass.length < 6){ showToast('Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('pwSubmitBtn'); btn.disabled = true;
  const r = await liveApi('PATCH', '/api/users', { email:p.kullanici.email, password:pass });
  if(!r.ok){ btn.disabled = false; showToast(r.error); return; }
  closeModal(); showToast(`${p.name} — şifre güncellendi.`);
}

function webUrl(v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://' + s.replace(/^\/+/, '');
}
function socialUrl(base, v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return base + s.replace(/^[\/@]+/, '');
}
function telHref(v){
  const d = String(v || '').replace(/[^\d+]/g, '');
  return d ? 'tel:' + d : '';
}
function waHref(v){
  let d = String(v || '').replace(/\D/g, '').replace(/^0+/, '');
  if(!d) return '';
  if(d.length === 10) d = '90' + d;          // 5xx xxx xx xx → 90 5xx...
  return 'https://wa.me/' + d;
}
function linkOr(href, inner, cls){
  return href
    ? `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

const FUEL_TYPES = ['Dizel','Benzin','LPG','Hibrit','Elektrik'];
const VEHICLE_ALERT_WINDOW = 30;      // gün — uyarının başladığı yer

function isoPlus(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  { id:'v1', plate:'01 ABC 123', brand:'Ford', model:'Transit', year:2021, fuel:'Dizel',
    km:184500, owner:'Murat Aslan', note:'Montaj ekibinin ana servis aracı.',
    dates:{ muayene:isoPlus(4), trafik:isoPlus(41), kasko:isoPlus(126), mtv1:isoPlus(-3),
            mtv2:isoPlus(178), egzoz:isoPlus(22), bakim:isoPlus(11) },
    kms:{ muayene:171200, egzoz:171200, bakim:170500 },
    expenses:[

      { id:'e5', date:isoPlus(-33), type:'Lastik', amount:11400, desc:'4 adet yaz lastiği' },
    ] },
  { id:'v3', plate:'01 KLM 34', brand:'Renault', model:'Master', year:2023, fuel:'Dizel',
    km:41200, owner:'İlke Küçükbey', note:'Tabela taşıma aracı — yüksek tavan.',
    dates:{ muayene:isoPlus(480), trafik:isoPlus(92), kasko:isoPlus(92), mtv1:isoPlus(-3),
            mtv2:isoPlus(178), egzoz:isoPlus(300), bakim:isoPlus(26) },

let aracStep = 'list';          // 'list' | 'detail' | 'form'
let editingVehicleId = null;
let viewingVehicleId = null;

function daysLeft(iso){
  if(!iso) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d - t)/86400000);
}
function dueStatus(n){
  if(n === null)                   return { cls:'none', text:'Tarih girilmedi' };
  if(n < 0)                        return { cls:'late', text:Math.abs(n)+' gün gecikti' };
  if(n === 0)                      return { cls:'late', text:'Bugün son gün' };
  if(n <= 7)                       return { cls:'crit', text:n+' gün kaldı' };
  if(n <= VEHICLE_ALERT_WINDOW)    return { cls:'soon', text:n+' gün kaldı' };
  return { cls:'ok', text:n+' gün kaldı' };
}
function plateHtml(p, sm){
  return '<span class="plate'+(sm?' sm':'')+'"><span class="plate-tr">TR</span><span class="plate-no">'+(p||'—')+'</span></span>';
}
function vehicleLabel(v){ return [v.brand, v.model, v.year].filter(Boolean).join(' ') || 'İsimsiz araç'; }
function money(n){ return '₺'+(Number(n)||0).toLocaleString('tr-TR'); }
function canSeeVehicles(){ return (roleCfg().yonetimSubs||[]).includes('araclarim'); }

function vehicleAlerts(){
  const out = [];
  VEHICLES.forEach(v => DATE_FIELDS.forEach(f => {
    const n = daysLeft(v.dates[f.key]);
    if(n === null || n > VEHICLE_ALERT_WINDOW) return;
    out.push({ v:v, f:f, n:n, st:dueStatus(n) });
  }));
  return out.sort((a,b) => a.n - b.n);
}
function alertRowHtml(a){
  return `
    <div class="alert-row ${a.st.cls}" onclick="openVehicle('${a.v.id}')">
      ${plateHtml(a.v.plate, true)}
      <div class="alert-row-main">
        <div class="alert-row-title">${a.f.label}</div>
        <div class="alert-row-sub">${vehicleLabel(a.v)} · ${formatDate(a.v.dates[a.f.key])}</div>
      </div>
      <span class="v-chip ${a.st.cls}">${a.st.text}</span>
    </div>`;
}
function homeVehicleAlertsHtml(){
  if(!canSeeVehicles()) return '';
  const list = vehicleAlerts();
  if(!list.length) return '';
  const late = list.filter(a => a.st.cls === 'late').length;
  return `
    <div class="alert-strip">
      <div class="alert-strip-head">
        <span>🚗</span> Araç Hatırlatmaları
        <span style="color:${late?'var(--risk)':'var(--signal)'};">${list.length}</span>
        ${late ? `<span style="color:var(--risk);font-weight:600;">· ${late} gecikmiş</span>` : ''}
      </div>
      ${list.slice(0,5).map(alertRowHtml).join('')}
      ${list.length > 5 ? `<div class="due" style="padding:2px 2px 0;cursor:pointer;text-decoration:underline;" onclick="goToAraclarim()">+ ${list.length-5} hatırlatma daha — Araçlarım'a git ›</div>` : ''}
    </div>`;
}
function goToAraclarim(){
  pushHistory(); currentPage='yonetim'; yonetimSub='araclarim'; openSubmenu='yonetim';
  aracStep='list'; renderNav(); renderContent();
}
function openVehicle(id){
  pushHistory(); currentPage='yonetim'; yonetimSub='araclarim'; openSubmenu='yonetim';
  viewingVehicleId=id; aracStep='detail'; renderNav(); renderContent();
}

// ---- Liste ----
function araclarimView(){
  if(aracStep==='form')   return aracFormView();
  if(aracStep==='detail') return aracDetailView();
  return aracListView();
}
function aracListView(){
  const alerts = vehicleAlerts();
  return `
    <div class="list-page-head"><div class="page-title">Araçlarım</div>
      <button class="primary-btn" onclick="openVehicleForm(null)">+ Yeni Araç</button></div>
    <div class="note">Plakayı, resmî tarihleri ve kilometreleri girin. Tarihe <b>30 gün</b> kala Ana Sayfa'da ve burada uyarı çıkar. Kilometre alanları kayıt amaçlıdır, uyarı üretmez.</div>
    ${alerts.length ? `<div class="alert-strip">
        <div class="alert-strip-head"><span>⏰</span> Yaklaşan / Geçmiş Ödemeler <span style="color:var(--signal);">${alerts.length}</span></div>
        ${alerts.map(alertRowHtml).join('')}
      </div>` : `<div class="note" style="border-left-color:var(--ok);">Yaklaşan bir ödeme veya işlem yok. 👍</div>`}
    ${VEHICLES.length ? `<div class="v-grid">${VEHICLES.map(vehicleCardHtml).join('')}</div>`
      : `<div class="empty-state">Henüz araç eklenmedi.</div>`}
  `;
}
function vehicleCardHtml(v){
  const chips = DATE_FIELDS
    .map(f => ({ f:f, n:daysLeft(v.dates[f.key]) }))
    .filter(x => x.n !== null)
    .sort((a,b) => a.n - b.n)
    .slice(0,3)
    .map(x => { const st = dueStatus(x.n);
      return `<span class="v-chip ${st.cls}">${x.f.short}: ${st.text}</span>`; }).join('');
  const totalExp = v.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  return `
    <div class="v-card" onclick="openVehicle('${v.id}')">
      <div class="v-card-top">
        <div>
          <div class="v-card-name">${vehicleLabel(v)}</div>
          <div class="v-card-sub">${v.fuel} · ${(Number(v.km)||0).toLocaleString('tr-TR')} km · ${v.owner || 'Zimmetsiz'}</div>
          <div class="v-card-sub">Toplam gider: <b style="color:var(--ink-2);">${money(totalExp)}</b></div>
        </div>
        ${plateHtml(v.plate)}
      </div>
      <div class="v-card-dates">${chips || '<span class="v-chip none">Tarih girilmedi</span>'}</div>
    </div>`;
}

// ---- Detay ----
function aracDetailView(){
  const v = VEHICLES.find(x => x.id === viewingVehicleId);
  if(!v){ aracStep='list'; return aracListView(); }
  const exps = v.expenses.slice().sort((a,b) => (a.date < b.date ? 1 : -1));
  const totalExp = exps.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const fuelExp  = exps.filter(e=>e.type==='Yakıt').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const nearest  = DATE_FIELDS.map(f=>({f:f,n:daysLeft(v.dates[f.key])})).filter(x=>x.n!==null).sort((a,b)=>a.n-b.n)[0];
  const bakimKm  = (v.kms||{}).bakim;
  const sinceBakim = (bakimKm && v.km && Number(v.km) >= Number(bakimKm)) ? Number(v.km)-Number(bakimKm) : null;
  return `
    <div class="page-head">
      <div>
        <div class="v-detail-head">${plateHtml(v.plate)}<div class="page-title" style="margin:0;">${vehicleLabel(v)}</div></div>
        <div class="page-sub">${v.fuel} · ${(Number(v.km)||0).toLocaleString('tr-TR')} km · Zimmet: ${v.owner || '—'}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin:-6px 0 18px;">
      <button class="btn" style="flex:0 0 auto;" onclick="backToVehicleList()">‹ Listeye Dön</button>
      <button class="primary-btn" onclick="openVehicleForm('${v.id}')">Düzenle</button>
    </div>

    <div class="v-stat-row">
      <div class="v-stat"><div class="v-stat-label">Toplam Gider</div><div class="v-stat-value">${money(totalExp)}</div></div>
      <div class="v-stat"><div class="v-stat-label">Yakıt Gideri</div><div class="v-stat-value">${money(fuelExp)}</div></div>
      <div class="v-stat"><div class="v-stat-label">Son Bakımdan Beri</div>
        <div class="v-stat-value">${sinceBakim !== null ? sinceBakim.toLocaleString('tr-TR')+' km' : '—'}</div></div>
      <div class="v-stat"><div class="v-stat-label">Gider Kaydı</div><div class="v-stat-value">${exps.length}</div></div>
      <div class="v-stat"><div class="v-stat-label">En Yakın İşlem</div>
        <div class="v-stat-value" style="font-size:13px;">${nearest ? nearest.f.short+' · '+dueStatus(nearest.n).text : '—'}</div></div>
    </div>

    <div class="group-header"><span>— Resmî Tarihler ve Kilometreler</span><span>30 gün kala uyarı verilir</span></div>
    <table style="margin-bottom:22px;">
      <thead><tr><th>İşlem</th><th>Tarih</th><th>Girdiği Kilometre</th><th style="text-align:right;">Durum</th></tr></thead>
      <tbody>
        ${DATE_FIELDS.map(f => {
          const n = daysLeft(v.dates[f.key]); const st = dueStatus(n);
          const km = (v.kms||{})[f.key];
          let kmCell = '<span style="color:var(--ink-3);">—</span>';
          if(f.hasKm && km){
            const delta = (v.km && Number(v.km) >= Number(km)) ? Number(v.km)-Number(km) : null;
            kmCell = `<span style="font-family:var(--font-mono);">${Number(km).toLocaleString('tr-TR')} km</span>`
              + (delta !== null ? `<div class="due">o günden beri +${delta.toLocaleString('tr-TR')} km</div>` : '');
          } else if(f.hasKm){
            kmCell = '<span style="color:var(--ink-3);">girilmedi</span>';
          }
          return `<tr><td><b>${f.label}</b></td><td>${formatDate(v.dates[f.key])}</td><td>${kmCell}</td>
            <td style="text-align:right;"><span class="v-chip ${st.cls}">${st.text}</span></td></tr>`; }).join('')}
      </tbody>
    </table>

    <div class="group-header"><span>— Giderler</span>
      <span style="cursor:pointer;text-decoration:underline;" onclick="openExpenseModal('${v.id}')">+ Gider Ekle</span></div>
    ${exps.length ? `<table style="margin-bottom:22px;">
      <thead><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th style="text-align:right;">Tutar</th><th></th></tr></thead>
      <tbody>
        ${exps.map(e => `<tr>
          <td>${formatDate(e.date)}</td><td>${e.type}</td><td>${e.desc || '—'}</td>
          <td style="text-align:right;font-family:var(--font-mono);">${money(e.amount)}</td>
          <td style="text-align:right;width:34px;"><span style="cursor:pointer;color:var(--ink-3);" title="Sil" onclick="deleteExpense('${v.id}','${e.id}')">✕</span></td>
        </tr>`).join('')}
        <tr><td colspan="3"><b>Toplam</b></td>
          <td style="text-align:right;font-family:var(--font-mono);"><b>${money(totalExp)}</b></td><td></td></tr>
      </tbody></table>`
      : `<div class="note" style="margin-bottom:22px;">Bu araç için henüz gider kaydı yok.</div>`}

    ${v.note ? `<div class="group-header"><span>— Not</span><span></span></div><div class="note">${v.note}</div>` : ''}

      </div>

      <div class="group-header" style="margin:18px 0 10px;"><span>— Resmî Tarihler ve Kilometreler</span><span>boş bırakılabilir</span></div>
      <div class="hint" style="margin:0 0 12px;">Kilometre alanları kayıt amaçlıdır: aracın hangi kilometrede muayeneye, egzoz emisyona ve bakıma girdiğini tutar. Hatırlatmalar tarihlerden üretilir.</div>
      ${DATE_FIELDS.map(f => f.hasKm
        ? `<div class="field-row">
             <div class="field"><label>${f.label} — Tarih</label>
               <input id="vd_${f.key}" type="date" value="${v.dates[f.key] || ''}"></div>
             <div class="field"><label>${f.label} — Girdiği Kilometre</label>
               <input id="vk_${f.key}" type="number" value="${(v.kms||{})[f.key] || ''}" placeholder="Örn. 171200"></div>
           </div>`
        : `<div class="field"><label>${f.label}</label>
             <input id="vd_${f.key}" type="date" value="${v.dates[f.key] || ''}"></div>`).join('')}

      <div class="field"><label>Not</label><input id="vNote" value="${v.note || ''}" placeholder="Örn. Montaj ekibinin ana servis aracı"></div>

      <div style="display:flex;gap:8px;align-items:center;margin-top:14px;">
        <button class="save-btn" onclick="saveVehicle()">${isNew ? 'Aracı Ekle' : 'Kaydet'}</button>
        <button class="btn" style="flex:0 0 auto;" onclick="backToVehicleList()">Vazgeç</button>
        ${isNew ? '' : `<span style="margin-left:auto;cursor:pointer;color:var(--risk);font-size:12.5px;" onclick="deleteVehicle('${editingVehicleId}')">Aracı Sil</span>`}
      </div>
    </div>
  `;
}
function saveVehicle(){
  const plate = document.getElementById('vPlate').value.trim().toUpperCase();
  if(!plate){ showToast('Plaka zorunlu.'); return; }
  const dates = {};
  DATE_FIELDS.forEach(f => { const el = document.getElementById('vd_'+f.key); dates[f.key] = el && el.value ? el.value : ''; });
  const kms = {};
  DATE_FIELDS.forEach(f => { if(!f.hasKm) return; const el = document.getElementById('vk_'+f.key);
    kms[f.key] = el && el.value ? Number(el.value) : ''; });
  const data = {
    plate: plate,
    brand: document.getElementById('vBrand').value.trim(),
    model: document.getElementById('vModel').value.trim(),
    year:  document.getElementById('vYear').value,
    fuel:  document.getElementById('vFuel').value,
    km:    Number(document.getElementById('vKm').value) || 0,
    owner: document.getElementById('vOwner').value,
    note:  document.getElementById('vNote').value.trim(),
    dates: dates,
    kms: kms,
  };
  const existing = VEHICLES.find(x => x.id === editingVehicleId);
  if(existing){ Object.assign(existing, data); viewingVehicleId = existing.id; }
  else { const nv = Object.assign({ id:'v'+Date.now(), expenses:[] }, data); VEHICLES.push(nv); viewingVehicleId = nv.id; }
  editingVehicleId = null; aracStep = 'detail'; renderContent();
  showToast(plate + ' kaydedildi.');
}
function deleteVehicle(id){
  const v = VEHICLES.find(x => x.id === id);
  VEHICLES = VEHICLES.filter(x => x.id !== id);
  editingVehicleId = null; viewingVehicleId = null; aracStep = 'list'; renderContent();
  showToast((v ? v.plate : 'Araç') + ' silindi.');
}

// ---- Gider ----
function openExpenseModal(vid){
  const typeOptions = EXPENSE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Gider Ekle</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Tarih</label><input id="exDate" type="date" value="${isoPlus(0)}"></div>
    <div class="field"><label>Tür</label><select id="exType">${typeOptions}</select></div>
    <div class="field"><label>Tutar (₺)</label><input id="exAmount" type="number" placeholder="4250"></div>
    <div class="field"><label>Açıklama</label><input id="exDesc" placeholder="Örn. Dizel — Shell OSB"></div>
    <button class="modal-submit" onclick="submitExpense('${vid}')">Gideri Ekle</button>
  `;
  showModal();
}
function submitExpense(vid){
  const v = VEHICLES.find(x => x.id === vid);
  if(!v) return;
  const amount = Number(document.getElementById('exAmount').value) || 0;
  if(!amount){ showToast('Tutar girin.'); return; }
  v.expenses.push({
    id: 'e'+Date.now(),
    date: document.getElementById('exDate').value || isoPlus(0),
    type: document.getElementById('exType').value,
    amount: amount,
    desc: document.getElementById('exDesc').value.trim(),
  });
  closeModal(); renderContent();
  showToast(money(amount) + ' gider eklendi.');
}
function deleteExpense(vid, eid){
  const v = VEHICLES.find(x => x.id === vid);
  if(!v) return;
  v.expenses = v.expenses.filter(e => e.id !== eid);
  renderContent(); showToast('Gider kaydı silindi.');
}

function railHtml(currentStage){
  const idx = STAGES.findIndex(s=>s.key===currentStage);
  const codes = ['KŞF','TSR','ÜRT','MNT','THS'];
  return `
    <div class="rail">
      ${STAGES.map((s,i)=>`<div class="rail-seg ${i<idx?'done':i===idx?'now':''}"></div>`).join('')}
    </div>
    <div class="rail-labels">
      ${codes.map((c,i)=>`<span class="${i===idx?'now':''}">${c}</span>`).join('')}
    </div>
  `;
}
function initials(name){ if(!name) return '?'; return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

    actionHtml = `

    <textarea id="jobNoteInput" rows="2" placeholder="Bir sonraki departmana iletmek istediğiniz not..." style="width:100%; padding:9px 11px; border:1.5px solid var(--line-strong); border-radius:6px; font-size:12.5px; background:var(--surface); color:var(--ink); font-family:inherit;">${j.notes[j.stage]||''}</textarea>
    <button class="save-btn" style="width:100%; margin-top:8px; height:34px; font-size:12.5px;" onclick="saveJobNote('${j.id}')">Notu Kaydet</button>

function drNumara(){
  const yil = new Date().getFullYear();
  let enBuyuk = 0;
  JOBS.forEach(j => {
    const m = j.isEmri && j.isEmri.emriNo && j.isEmri.emriNo.match(/^DR-(\d{4})-(\d{5})$/);
    if(m && Number(m[1]) === yil) enBuyuk = Math.max(enBuyuk, Number(m[2]));
  });
  return 'DR-' + yil + '-' + String(enBuyuk + 1).padStart(5, '0');
}
function ieVarsayilan(j){
  if(!j.isEmri) j.isEmri = {};
  const e = j.isEmri;
  const alanlar = {
    projeAdi: j.desc || '', yetkili: '', satinalmaNo: '', siparisAdet: '',
    teslimTarihi: '', montajTarihi: '', montajYeri: '', grafiker: '', koordinator: '',
    aciklama: '', malzemeler: j.material || '', tedarikci: '', tedarikNot: '',
    durum: 'tasarim', oncelik: 'normal', genelAciklama: '',
    dosyaAdi: '', revizyon: '', onaylayan: '', onayTarihi: '',
    montajSaati: '', montajAlan: '', ekipLideri: '', sahaTelefon: '',
    isg: '', calisma: '', elektrik: '', vinc: '', iskeleSec: '', montajOncesiOlcu: '',
    eksikNot: '', montajYapan: '', kontrolEden: '',
  };
  Object.keys(alanlar).forEach(k => { if(e[k] === undefined) e[k] = alanlar[k]; });
  if(!e.emriNo) e.emriNo = drNumara();
  if(!Array.isArray(e.kalemler)) e.kalemler = [];
  if(!Array.isArray(e.gorseller)) e.gorseller = [];
  ['dosyaKontrol','ekipman','kapanis'].forEach(k => { if(!e[k] || typeof e[k] !== 'object') e[k] = {}; });
  return e;
}
function ieKirli(){ if(typeof liveMarkDirty === 'function') liveMarkDirty(); }
function ieM2(k){
  const m2 = (Number(k.en) || 0) * (Number(k.boy) || 0) / 1000000 * (Number(k.adet) || 1);
  return m2 ? m2.toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 }) : '—';

function openIsEmri(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j);
  if(!window.__iePasteKurulu){
    window.__iePasteKurulu = true;
    document.addEventListener('paste', (ev) => {
      if(!window.__ieAcikJob) return;
      const items = (ev.clipboardData && ev.clipboardData.items) || [];
      for(const it of items){
        if(it.type && it.type.startsWith('image/')){
          ev.preventDefault();
          ieGorselIsle(window.__ieAcikJob, it.getAsFile());
          return;
        }
      }
    });
  }
  window.__ieAcikJob = id;
  ieRender(id);
}

function ieAlan(id, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j)[ad] = deger;
  ieKirli();
}
function ieCheck(id, grup, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j)[grup][ad] = !!deger;
  ieKirli();
}
function ieKalem(id, i, ad, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.kalemler[i]) return;
  j.isEmri.kalemler[i][ad] = deger;
  ieKirli();
}
function ieKalemEkle(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j).kalemler.push({ tanim:'', kod:'', adet:'', en:'', boy:'', malzeme:'' });
  ieRender(id); ieKirli();
}
function ieKalemSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.kalemler.splice(i, 1);
  ieRender(id); ieKirli();
}
function ieGorselIsle(id, file){
  if(!file || !file.type || !file.type.startsWith('image/')) return;
  const j = JOBS.find(x => x.id === id); if(!j) return;
  ieVarsayilan(j);
  if(j.isEmri.gorseller.length >= 8){ showToast('Bir iş emrine en fazla 8 görsel eklenebilir.'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const olcek = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * olcek));
      c.height = Math.max(1, Math.round(img.height * olcek));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      j.isEmri.gorseller.push({ src: c.toDataURL('image/jpeg', 0.72), not: '' });
      ieRender(id); ieKirli();
      showToast('Görsel eklendi.');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function ieGorselNot(id, i, deger){
  const j = JOBS.find(x => x.id === id); if(!j || !j.isEmri.gorseller[i]) return;
  j.isEmri.gorseller[i].not = deger;
  ieKirli();
}
function ieGorselSil(id, i){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  j.isEmri.gorseller.splice(i, 1);
  ieRender(id); ieKirli();
}

let surukluIsId = null;
function isSurukleBasla(e, id){
  if(CURRENT_ROLE !== 'YONETICI'){ e.preventDefault(); return; }
  surukluIsId = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch(err) {}
  e.currentTarget.classList.add('suruklenen');
}
function isSurukleBitir(e){
  if(e.currentTarget && e.currentTarget.classList) e.currentTarget.classList.remove('suruklenen');
  document.querySelectorAll('.board-col.drop').forEach(c => c.classList.remove('drop'));
  surukluIsId = null;
}
function isSurukleUzeri(e){
  if(!surukluIsId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drop');
}
function isSurukleCik(e){ e.currentTarget.classList.remove('drop'); }
function isBirak(e, hedef){
  e.preventDefault();
  const id = surukluIsId; surukluIsId = null;
  if(!id) return;
  jobTasi(id, hedef);
}
function jobTasi(id, hedef){
  const j = JOBS.find(x => x.id === id);
  if(!j || j.stage === hedef){ renderContent(); return; }
  const from = STAGES.findIndex(s => s.key === j.stage);
  const to = STAGES.findIndex(s => s.key === hedef);
  if(j.stage === 'TASARIM' && to > from && j.approval !== 'ONAYLANDI'){
    renderContent();
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.');
    return;
  }
  const eski = j.stage;
  jobAsamaAyarla(j, hedef);
  renderContent();
  showToast(`${j.client} — ${STAGE_LABELS_TR[eski]} → ${STAGE_LABELS_TR[hedef]}.`);
}
// Aşama değişince onay bayrağını tutarlı tut:
//  • Tasarım'a giren iş onay bekler (BEKLIYOR)
//  • Tasarım'dan Üretim'e yalnız ONAYLANDI ile çıkılır
//  • Üretim'den Tasarım'a geri alınan iş yeniden onay bekler
//  • Keşif'e dönen işin onayı sıfırlanır
function jobAsamaAyarla(j, yeniStage){
  j.stage = yeniStage;
  if(yeniStage === 'TASARIM'){ if(j.approval !== 'REVIZYON') j.approval = 'BEKLIYOR'; }
  else if(yeniStage === 'KESIF'){ j.approval = null; }
}
function deleteJob(id){
  if(CURRENT_ROLE !== 'YONETICI'){ showToast('İş silme yalnızca yönetici yetkisindedir.'); return; }
  const j = JOBS.find(x => x.id === id); if(!j) return;
  if(!confirm(`${j.code} · ${j.client} işini plan kayıtlarıyla birlikte silmek istediğinize emin misiniz?`)) return;
  PLAN_TASKS = PLAN_TASKS.filter(t => t.jobId !== id);
  JOBS = JOBS.filter(x => x.id !== id);
  const q = j.quoteId ? QUOTES.find(x => x.id === j.quoteId) : (j.id ? QUOTES.find(x => x.jobId === j.id) : null);
  if(q){ q.jobId = null; }                       // teklif durur, sadece iş bağlantısı kalkar
  closeDrawer(); renderContent();
  showToast(`${j.code} silindi${q ? ' — ' + q.no + ' teklifi duruyor, bağlantısı kaldırıldı' : ''}.`);
}
function advanceJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx >= STAGES.length-1) return;
  if(j.stage === 'TASARIM' && j.approval !== 'ONAYLANDI'){
    showToast('Müşteri onayı gelmeden iş Üretim aşamasına geçemez.'); return;
  }
  jobAsamaAyarla(j, STAGES[idx+1].key);
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx+1].label} aşamasına taşındı.`);
}
function revertJobStage(id){
  const j = JOBS.find(x=>x.id===id);
  const idx = STAGES.findIndex(s=>s.key===j.stage);
  if(idx <= 0) return;
  const hedef = STAGES[idx-1].key;
  j.stage = hedef;
  if(hedef === 'TASARIM') j.approval = 'BEKLIYOR';      // üretimden dönen iş yeniden onaya girer
  if(hedef === 'KESIF') j.approval = null;
  closeDrawer(); renderContent();
  showToast(`${j.client} — ${STAGES[idx-1].label} aşamasına geri alındı${hedef==='TASARIM' ? ', onay sıfırlandı' : ''}.`);
}
function setJobApproval(id, status){
  const j = JOBS.find(x=>x.id===id);
  if(j.stage !== 'TASARIM'){ showToast('Onay yalnızca Tasarım aşamasındaki iş için verilir.'); return; }
  j.approval = status;
  if(status==='ONAYLANDI') j.stage = 'URETIM';
  closeDrawer();
  renderContent();
  showToast(status==='ONAYLANDI' ? `${j.client} — onaylandı, Üretim aşamasına taşındı.` : `${j.client} için revizyon istendi.`);
}

}

let contactRows = [{ type:'İş Telefon No', value:'' }];
let addressRows = [{ type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:'' }];
const CONTACT_TYPES = ['İş Telefon No', 'Cep Telefonu', 'E-posta', 'Faks'];
const ADDRESS_TYPES = ['İş Adresi', 'Ev Adresi', 'Diğer'];

function renderContactRows(){
  const box = document.getElementById('contactRowsBox');
  if(!box) return;
  box.innerHTML = contactRows.map((r,i) => `
    <div class="repeat-row">
      <select onchange="contactRows[${i}].type=this.value">
        ${CONTACT_TYPES.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <input value="${r.value}" placeholder="Değer girin" oninput="contactRows[${i}].value=this.value">
      <button class="row-remove" onclick="removeContactRow(${i})">✕</button>
    </div>
  `).join('');
}
function addContactRow(){ contactRows.push({type:'İş Telefon No', value:''}); renderContactRows(); }
function removeContactRow(i){ contactRows.splice(i,1); renderContactRows(); }

function renderAddressRows(){
  const box = document.getElementById('addressRowsBox');
  if(!box) return;
  box.innerHTML = addressRows.map((a,i) => `
    <div style="border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;">

      <div class="field-row" style="margin-bottom:8px;">
        <input value="${a.sehir}" placeholder="Şehir" oninput="addressRows[${i}].sehir=this.value">

function addAddressRow(){ addressRows.push({type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:''}); renderAddressRows(); }
function removeAddressRow(i){ addressRows.splice(i,1); renderAddressRows(); }
function updateCharCount(i,val){ const el = document.getElementById('charCount'+i); if(el) el.textContent = val.length + ' / 250'; }

let openAccordions = new Set();
function accordionSection(id, title, bodyHtml){
  const isOpen = openAccordions.has(id);
  return `
    <div class="accordion">
      <div class="accordion-head ${isOpen?'open':''}" id="head-${id}" onclick="toggleAccordion('${id}')">
        <span class="accordion-plus">+</span>${title}
      </div>
      <div class="accordion-body ${isOpen?'open':''}" id="body-${id}">${bodyHtml}</div>
    </div>
  `;
}
function toggleAccordion(id){
  if(openAccordions.has(id)) openAccordions.delete(id); else openAccordions.add(id);
  document.getElementById('body-'+id).classList.toggle('open');
  document.getElementById('head-'+id).classList.toggle('open');
  if(id==='acc2' && openAccordions.has('acc2')){ renderContactRows(); renderAddressRows(); }
}

function submitPersonForm(){
  const name = document.getElementById('pName').value.trim();
  if(!name){ alert(newCustomerType==='firma' ? 'Firma adı gerekli' : 'Ad Soyad gerekli'); return; }
  const isFirma = newCustomerType === 'firma';
  const phoneRow = contactRows.find(r => r.type.includes('Telefon'));
  const emailRow = contactRows.find(r => r.type === 'E-posta');
  const addr = addressRows[0];
  const data = {
    type: newCustomerType, name,
    contact: isFirma ? (document.getElementById('pYetkili')?.value || '') : name,
    phone: phoneRow ? phoneRow.value : '',
    email: emailRow ? emailRow.value : '',
    address: addr ? [addr.detail, addr.ilce, addr.sehir].filter(Boolean).join(', ') : '',
    kaynak: document.getElementById('pKaynak').value,
    kampanya: document.getElementById('pKampanya').value,
    temsilci: document.getElementById('pTemsilci').value,
    sektor: document.getElementById('pSektor').value,
    durum: document.getElementById('pDurum').value,
    etiket: document.getElementById('pEtiket').value,
    kisaAciklama: document.getElementById('pKisaAciklama').value,
    hatirlatma: document.getElementById('pHatirlatma').value,
    contactRows: JSON.parse(JSON.stringify(contactRows)),
    addressRows: JSON.parse(JSON.stringify(addressRows)),
    faturaUnvani: document.getElementById('pFaturaUnvani').value,
    vergiNo: document.getElementById('pVergiNo').value,
    vergiDairesi: document.getElementById('pVergiDairesi').value,
    faturaAdresi: document.getElementById('pFaturaAdresi').value,
    fPostaKodu: document.getElementById('pFPostaKodu').value,
    fIlce: document.getElementById('pFIlce').value,
    fSehir: document.getElementById('pFSehir').value,
    fUlke: document.getElementById('pFUlke').value,
    vadeGun: document.getElementById('pVadeGun').value,
    calisanSayisi: document.getElementById('pCalisanSayisi').value,
  };

  if(editingCustomerId){
    const idx = CUSTOMERS.findIndex(c=>c.id===editingCustomerId);
    CUSTOMERS[idx] = { ...CUSTOMERS[idx], ...data };
  } else {
    CUSTOMERS.push({ id:'c'+Date.now(), dateAdded:new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}), ...data });
  }

  kisilerStep = 'list';
  editingCustomerId = null;
  contactRows = [{ type:'İş Telefon No', value:'' }];
  addressRows = [{ type:'İş Adresi', country:'Türkiye', postal:'', ilce:'', sehir:'', eyalet:'', detail:'' }];
  openAccordions = new Set();
  renderContent();
  showToast(`${name} kaydedildi.`);
}
