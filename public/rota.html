function personelIletisimRows(){
  const d = personelDraft;
  return d.iletisim.map((it,i) => `
    <div class="field-row" style="align-items:flex-end;">
      <div class="field" style="flex:0 0 190px;"><label>Tür</label>
        <select onchange="personelDraft.iletisim[${i}].tur=this.value">
          ${ILETISIM_TURLERI.map(t => `<option ${it.tur === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Bilgi</label>
        <input value="${it.deger}" oninput="personelDraft.iletisim[${i}].deger=this.value"></div>
      <div class="field" style="flex:0 0 34px;">
        <button class="btn" style="height:36px;padding:0;color:var(--risk);" title="Sil"
          onclick="removePersonelIletisim(${i})">✕</button></div>
    </div>`).join('');
}
function addPersonelIletisim(){
  personelDraft.iletisim.push({ tur:'Cep Telefonu', deger:'' });
  document.getElementById('prIletisim').innerHTML = personelIletisimRows();
}
function removePersonelIletisim(i){
  personelDraft.iletisim.splice(i,1);
  if(!personelDraft.iletisim.length) personelDraft.iletisim.push({ tur:'İş Telefon No', deger:'' });
  document.getElementById('prIletisim').innerHTML = personelIletisimRows();
}
function submitPersonel(){
  const d = personelDraft;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const ad = val('prAd').trim();
  if(!ad){ showToast('Ad Soyad zorunlu.'); return; }
  const veri = {
    name: ad,
    unvan: val('prUnvan').trim(),
    departman: val('prDepartman'),
    brut: Number(val('prBrut')) || 0,
    cinsiyet: val('prCinsiyet'),
    dogumTarihi: val('prDogumTarihi'),
    dogumYeri: val('prDogumYeri').trim(),
    iletisim: d.iletisim.filter(x => x.deger.trim()),
    adres: { tur:val('prAdresTur'), ulke:val('prUlke'), postaKodu:val('prPostaKodu'),
             ilce:val('prIlce'), sehir:val('prSehir'), eyalet:val('prEyalet'), adres:val('prAdres') },
  };
  if(!veri.iletisim.length) veri.iletisim = [{ tur:'İş Telefon No', deger:'' }];
  const mevcut = d.id ? personelById(d.id) : null;
  if(mevcut){ Object.assign(mevcut, veri); personelSecili = mevcut.id; }
  else {
    const yeni = Object.assign({ id:'p'+Date.now(), arsiv:false, hareketler:[] }, veri);
    PERSONELLER.push(yeni);
    personelSecili = yeni.id;
  }
  personelDraft = null; personelStep = 'detay'; renderContent();
  showToast(`${ad} kaydedildi.`);
}

// ---------------- MESAİLER ----------------
let MESAI_RATES = { normal:50, hafta:100, resmi:100 };   // yüzde ek
const MESAI_TYPES = [
  { key:'normal', label:'Normal Mesai', icon:'🕐', base:'saat' },
  { key:'hafta',  label:'Hafta Tatili', icon:'📅', base:'saat' },
  { key:'resmi',  label:'Resmî Tatil',  icon:'🎉', base:'gun'  },   // maaş / 30 gün
];
const MESAI_VARSAYILAN_SAAT = 225;
const MESAI_AY_GUN = 30;                       // resmî tatil günlük ücret böleni
function mesaiTip(key){ return MESAI_TYPES.find(t => t.key === key); }
function mesaiBirimAdi(key){ return mesaiTip(key).base === 'gun' ? 'gün' : 'saat'; }
function mesaiBirimBaslik(key){ return mesaiTip(key).base === 'gun' ? 'Günlük ücret' : 'Saatlik ücret'; }
let MESAI_KAYIT = {};            // personelId → { brut, saat, hours }
let mesaiPersonelId = null;
let mesaiRatesEdit = false;

function mesaiKatsayi(key){ return 1 + ((Number(MESAI_RATES[key])||0)/100); }
function mesaiData(id){
  if(!MESAI_KAYIT[id]){
    const p = PERSONELLER.find(x => x.id === id);
    MESAI_KAYIT[id] = { brut:(p && p.brut) || 0, saat:MESAI_VARSAYILAN_SAAT,
                        hours:{ normal:0, hafta:0, resmi:0 }, kayitTarihi:null };
  }
  return MESAI_KAYIT[id];
}
function mesaiSaatlik(d){ const s = Number(d.saat)||0; return s > 0 ? (Number(d.brut)||0)/s : 0; }
function mesaiGunluk(d){ return (Number(d.brut)||0) / MESAI_AY_GUN; }
function mesaiBirimUcret(d, key){ return mesaiTip(key).base === 'gun' ? mesaiGunluk(d) : mesaiSaatlik(d); }
function mesaiTutar(d, key){ return mesaiBirimUcret(d, key) * mesaiKatsayi(key) * (Number(d.hours[key])||0); }
function mesaiMiktarMetni(d, key){
  return (Number(d.hours[key])||0).toLocaleString('tr-TR') + ' ' + mesaiBirimAdi(key);
}
function mesaiToplam(d){ return MESAI_TYPES.reduce((s,t)=> s + mesaiTutar(d, t.key), 0); }
function tl(n){ return '₺' + (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function tl0(n){ return '₺' + Math.round(Number(n)||0).toLocaleString('tr-TR'); }

function mesailerView(){ return mesaiPersonelId ? mesaiDetayView() : mesaiListView(); }

function mesaiListView(){
  return `
    <div class="list-page-head"><div class="page-title">Mesailer</div></div>
    <div class="note">Hesaplamak istediğiniz personele tıklayın. Liste <b>Ön Muhasebe → Personeller</b> sayfasından gelir; oradaki her personel burada da görünür.</div>

    <table>
      <thead><tr><th>Personel</th><th>Unvan</th><th>Son Kayıt</th><th style="text-align:right;">Hesaplanan Mesai</th></tr></thead>
      <tbody>
        ${aktif.map(p => {
          const d = MESAI_KAYIT[p.id];
          const t = d ? mesaiToplam(d) : 0;
          return `<tr style="cursor:pointer;" onclick="openMesai('${p.id}')">
            <td><b>${p.name}</b></td>

            <td style="text-align:right;font-family:var(--font-mono);">${t ? tl0(t) : '<span style="color:var(--ink-3);">—</span>'}
              ${(d && d.kayitTarihi) ? `<span class="mini-islem sil" title="Mesai kaydını sil" onclick="event.stopPropagation();mesaiSil('${p.id}')">✕</span>` : ''}</td>
          </tr>`; }).join('')}

function mesaiRatesBlock(){
  if(mesaiRatesEdit){
    return `
      <div class="group-header"><span>— Yasal Mesai Oranları</span>
        <span style="cursor:pointer;text-decoration:underline;" onclick="toggleMesaiRates()">Vazgeç</span></div>
      <div class="form-block" style="max-width:560px;">
        <div class="hint" style="margin:0 0 12px;">Oranlar yüzde olarak girilir. <b>+%50</b> yazarsanız o saatler saatlik ücretin <b>1,5</b> katından hesaplanır.</div>
        ${MESAI_TYPES.map(t => `<div class="field"><label>${t.label}</label>
          <input type="number" min="0" id="msRate_${t.key}" value="${MESAI_RATES[t.key]}"
            oninput="updateMesaiRate('${t.key}', this.value)"></div>`).join('')}
        <button class="save-btn" onclick="toggleMesaiRates(); showToast('Mesai oranları güncellendi.')">Kaydet</button>
      </div>`;

  return `

      <span style="cursor:pointer;text-decoration:underline;" onclick="toggleMesaiRates()">Oranları Düzenle</span></div>
    <div class="grid">
      ${MESAI_TYPES.map(t => `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <span style="font-size:12.5px;color:var(--ink-2);">${t.label}</span>
        <b style="color:var(--ok);font-family:var(--font-mono);font-size:14px;">+%${MESAI_RATES[t.key]}</b>
      </div>`).join('')}
    </div>`;
}
function toggleMesaiRates(){ mesaiRatesEdit = !mesaiRatesEdit; renderContent(); }
function updateMesaiRate(key, val){
  MESAI_RATES[key] = Number(String(val).replace(',', '.')) || 0;
  if(mesaiPersonelId) syncMesai();
}
function openMesai(id){ pushHistory(); mesaiPersonelId = id; mesaiRatesEdit = false; renderContent(); tarayiciGecmisYaz(); }
function closeMesai(){ mesaiPersonelId = null; renderContent(); }

function updateMesai(field, val){
  const d = mesaiData(mesaiPersonelId);
  const n = Number(String(val).replace(',', '.')) || 0;
  if(field === 'brut' || field === 'saat') d[field] = n;
  else d.hours[field] = n;
  syncMesai();
}
function syncMesai(){
  const d = mesaiData(mesaiPersonelId);
  const saatlik = mesaiSaatlik(d);
  const set = (id, v) => { const el = document.getElementById(id); if(el){ if('value' in el && el.tagName === 'INPUT') el.value = v; else el.textContent = v; } };
  set('msSaatlik', tl(saatlik));
  set('msGunluk', tl(mesaiGunluk(d)));
  MESAI_TYPES.forEach(t => {
    set('msK_'+t.key, mesaiBirimBaslik(t.key) + ' × ' + mesaiKatsayi(t.key).toLocaleString('tr-TR'));
    set('msT_'+t.key, tl(mesaiTutar(d, t.key)));
    set('msS_'+t.key, mesaiMiktarMetni(d, t.key));
    set('msB_'+t.key, tl(mesaiBirimUcret(d, t.key)));
  });
  const html = (id, v) => { const el = document.getElementById(id); if(el) el.innerHTML = v; };
  html('msToplam', '<b>' + tl(mesaiToplam(d)) + '</b>');
  set('msToplam2', tl(mesaiToplam(d)));
  set('msGenel',   tl((Number(d.brut)||0) + mesaiToplam(d)));
}

  return `
    <div class="page-head"><div>
      <div class="page-title">${p.name}</div>
      <div class="page-sub">${p.unvan || '—'} · mesai hesabı</div>

    ${mesaiRatesBlock()}

    <div class="group-header" style="margin-top:18px;"><span>— Maaş Bilgileri</span><span>saatlik ücret otomatik hesaplanır</span></div>
    <div class="form-block" style="max-width:620px;">
      <div class="field-row">
        <div class="field"><label>Brüt Maaş (₺)</label>
          <input type="number" min="0" value="${d.brut || ''}" placeholder="30000" oninput="updateMesai('brut', this.value)"></div>

      </div>

        <div class="field"><label>Saatlik Brüt Ücret (otomatik)</label>

      </div>
      <div class="hint" style="margin:0;">Normal mesai ve hafta tatili <b>saatlik</b> ücretten, resmî tatil <b>günlük</b> ücretten hesaplanır.</div>
    </div>

    <div class="group-header"><span>— Mesai Girişi</span><span>ay içinde çalışılan miktar</span></div>
    <div class="grid" style="margin-bottom:20px;">
      ${MESAI_TYPES.map(t => `
        <div class="card">
          <div style="font-family:var(--font-display);font-weight:700;font-size:13px;margin-bottom:2px;">${t.icon} ${t.label}</div>
          <div id="msK_${t.key}" style="font-size:11.5px;color:var(--ok);margin-bottom:9px;">${mesaiBirimBaslik(t.key)} × ${mesaiKatsayi(t.key).toLocaleString('tr-TR')}</div>
          <div style="display:flex;align-items:center;gap:7px;">
            <input type="number" min="0" value="${d.hours[t.key] || ''}" placeholder="0"
              style="height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;
                     background:var(--surface);color:var(--ink);font-size:13px;width:100%;"
              oninput="updateMesai('${t.key}', this.value)">
            <span style="font-size:12px;color:var(--ink-3);">${mesaiBirimAdi(t.key)}</span>

        </div>`).join('')}
    </div>

    <div class="group-header"><span>— Hesap</span><span></span></div>
    <table style="margin-bottom:16px;">
      <thead><tr><th>Mesai Türü</th><th>Birim Ücret</th><th>Katsayı</th><th>Miktar</th><th style="text-align:right;">Tutar</th></tr></thead>
      <tbody>
        ${MESAI_TYPES.map(t => `<tr>
          <td><b>${t.label}</b></td>

      Giderlere de işle — <b>Mesai</b> kategorisi

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:24px;">

      ${d.kayitTarihi ? `<span class="due" style="margin-left:auto;">Son kayıt: ${d.kayitTarihi}</span>` : ''}

function mesaiGiderKategoriId(){
  // 'Mesai' gider kategorisi yoksa oluşturulur — mesai tutarları her zaman bu kategoriye işlenir
  let id = kategoriIdByAd('Mesai','gider');
  if(!id){
    id = benzersizId('kd');
    KATEGORILER.push({ id, ad:'Mesai', tip:'gider', sistem:true });
  }
  return id;
}
function saveMesai(){
  const d = mesaiData(mesaiPersonelId);
  const p = PERSONELLER.find(x => x.id === mesaiPersonelId);
  const toplam = mesaiToplam(d);
  if(!toplam){ showToast('Önce mesai saati girin.'); return; }
  d.kayitTarihi = new Date().toLocaleDateString('tr-TR');
  const gidereIsle = document.getElementById('msGider');
  if(!gidereIsle || gidereIsle.checked){
    const mevcut = d.giderId ? GIDERLER.find(g => g.id === d.giderId) : null;
    if(mevcut){
      // aynı personelin mesaisi yeniden kaydedildi → mükerrer satır açma, bağlı gideri güncelle
      const eskiEtki = giderNakitEtkisi(mevcut);
      mevcut.tarih = d.kayitTarihi;
      mevcut.tutar = Math.round(toplam);
      mevcut.client = p ? p.name : mevcut.client;
      mevcut.kategoriId = mesaiGiderKategoriId();
      hesapBakiyeDeltaUygula(mevcut.hesap, eskiEtki - giderNakitEtkisi(mevcut));
    } else {
      const gid = benzersizId('gi');
      const yeniGider = {
        id: gid,
        client: p ? p.name : null,
        hesap: BANK_ACCOUNTS[0] ? BANK_ACCOUNTS[0].name : 'Kasa',
        tur: 'Mesai Ücreti',
        tarih: d.kayitTarihi,
        tutar: Math.round(toplam),
        odendi: false,
        kategoriId: mesaiGiderKategoriId(),
      };
      GIDERLER.unshift(yeniGider);
      hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
      d.giderId = gid;
    }
  }
  // Personel ekstresine mesai tahakkuku (bakiyeye artı) — aynı dönem yeniden kaydedilirse güncellenir
  if(p){
    p.hareketler = p.hareketler || [];
    let h = d.hareketId ? p.hareketler.find(x => x.id === d.hareketId) : null;
    if(!h){ h = { id: benzersizId('hr'), tur:'Mesai', giderId: d.giderId || null }; p.hareketler.push(h); d.hareketId = h.id; }
    h.tarih = d.kayitTarihi; h.tutar = Math.round(toplam); h.aciklama = 'Mesai ücreti';
  }
  mesaiPersonelId = null;
  renderContent();
  showToast(`${p ? p.name : 'Personel'} — ${tl(toplam)} mesai kaydedildi (Giderler → Mesai).`);
}
function mesaiSil(id){
  const p = PERSONELLER.find(x => x.id === id);
  const d = MESAI_KAYIT[id];
  if(!d){ showToast('Silinecek mesai kaydı yok.'); return; }
  const bagliGider = d.giderId ? GIDERLER.find(g => g.id === d.giderId) : null;
  const mesaj = `${p ? p.name : 'Personel'} mesai kaydı silinsin mi?` +
    (bagliGider ? `\n\nGiderler'deki bağlı "Mesai Ücreti" kaydı (${tl0(bagliGider.tutar)}) da silinecek.` : '');
  if(!confirm(mesaj)) return;
  if(bagliGider){ hesapBakiyeDeltaUygula(bagliGider.hesap, giderNakitEtkisi(bagliGider)); GIDERLER = GIDERLER.filter(g => g.id !== d.giderId); }
  if(p && d.hareketId && Array.isArray(p.hareketler)) p.hareketler = p.hareketler.filter(x => x.id !== d.hareketId);
  delete MESAI_KAYIT[id];
  if(mesaiPersonelId === id) mesaiPersonelId = null;
  renderContent();
  showToast(`${p ? p.name : 'Personel'} mesai kaydı silindi.`);
}

// ============ CARİ AKTARIMI (Zirve / Excel → ROTA) ============
// Üç giriş yolu: Excel'den kopyala-yapıştır (TSV), CSV dosyası, XLSX dosyası (SheetJS varsa).
// Sütunlar başlık adlarından otomatik eşleşir; müşteri kartı + açılış bakiyesi oluşturur.
let AKT = { satirlar: [], eslesme: {}, basliklar: [], hata: '' };

const AKT_ALANLAR = {
  kod:          ['cari kodu','cari kod','kod','hesap kodu','cari hesap kodu'],
  name:         ['cari adi','cari ünvan','cari unvani','unvan','ünvan','müşteri','musteri','cari','firma adi','ad soyad','hesap adi'],
  tip:          ['cari tipi','tip','tür','tur'],
  borc:         ['borc toplami','borç toplamı','borc','borç','toplam borc','toplam borç'],
  alacak:       ['alacak toplami','alacak toplamı','alacak','toplam alacak'],
  bakiye:       ['bakiye','kalan','bakiye (tl)','net bakiye'],
  vkn:          ['vkn/tckn','vkn','tckn','vergi no','vergi kimlik no','tc kimlik no','vkn tckn'],
  vergiDairesi: ['vergi dairesi','vergi d.','vd'],
  semt:         ['semt','ilce','ilçe'],
  sehir:        ['sehir','şehir','il'],
  address:      ['adres','adres(1)','adres 1','adres1','adres (1)'],
  phone:        ['telefon','tel','tel.','gsm','cep'],
  phone2:       ['tel. (2)','tel (2)','telefon 2','tel2','telefon2','diger telefon'],
  email:        ['e-posta','eposta','email','e mail','mail'],
};
function aktNorm(s){
  return String(s || '').toLowerCase()
    .replace(/i̇/g,'i').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/\s+/g,' ').trim();
}
function aktSayi(v){
  if(typeof v === 'number') return v;
  let t = String(v || '').replace(/[₺$€\s ]/g, '').trim();
  if(!t || t === '-' || t === '—') return 0;
  let eksi = false;
  if(/^\(.*\)$/.test(t)){ eksi = true; t = t.slice(1, -1); }
  if(t.startsWith('-')){ eksi = true; t = t.slice(1); }
  if(t.endsWith('-')){ eksi = true; t = t.slice(0, -1); }
  t = t.replace(/[^\d.,]/g, '');
  if(!t) return 0;
  // Hem Turkce (1.141.100,62) hem Ingilizce (1,141,100.62) bicimi okunur:
  // iki ayirici da varsa SONUNCUSU ondaliktir; tek tur varsa adet/hane sayisina bakilir
  const sonV = t.lastIndexOf(','), sonN = t.lastIndexOf('.');
  let sayi;
  if(sonV >= 0 && sonN >= 0){
    sayi = sonV > sonN ? Number(t.replace(/\./g, '').replace(',', '.'))
                       : Number(t.replace(/,/g, ''));
  } else if(sonV >= 0){
    const adet = (t.match(/,/g) || []).length, sonra = t.length - sonV - 1;
    sayi = (adet > 1 || sonra === 3) ? Number(t.replace(/,/g, '')) : Number(t.replace(',', '.'));
  } else if(sonN >= 0){
    const adet = (t.match(/\./g) || []).length, sonra = t.length - sonN - 1;
    sayi = (adet > 1 || sonra === 3) ? Number(t.replace(/\./g, '')) : Number(t);
  } else sayi = Number(t);
  if(!isFinite(sayi)) sayi = 0;
  return eksi ? -sayi : sayi;
}

// Ayırıcıyı otomatik bul (sekme > noktalı virgül > virgül), tırnaklı hücreleri koru
function aktSatirlaraBol(metin){
  const ilk = metin.split(/\r?\n/).find(x => x.trim());
  if(!ilk) return { ayirici: '\t', satirlar: [] };
  const sayim = { '\t': (ilk.match(/\t/g) || []).length, ';': (ilk.match(/;/g) || []).length, ',': (ilk.match(/,/g) || []).length };
  const ayirici = sayim['\t'] >= sayim[';'] && sayim['\t'] >= sayim[','] ? '\t' : (sayim[';'] >= sayim[','] ? ';' : ',');
  const satirlar = [];
  let hucre = '', satir = [], tirnak = false;
  for(let i = 0; i < metin.length; i++){
    const k = metin[i];
    if(tirnak){
      if(k === '"'){ if(metin[i+1] === '"'){ hucre += '"'; i++; } else tirnak = false; }
      else hucre += k;
      continue;
    }
    if(k === '"'){ tirnak = true; continue; }
    if(k === ayirici){ satir.push(hucre); hucre = ''; continue; }
    if(k === '\n'){ satir.push(hucre); satirlar.push(satir); satir = []; hucre = ''; continue; }
    if(k === '\r') continue;
    hucre += k;
  }
  if(hucre || satir.length){ satir.push(hucre); satirlar.push(satir); }
  return { ayirici, satirlar };
}
function aktMetniIsle(metin){
  const { satirlar } = aktSatirlaraBol(metin);
  if(!satirlar.length){ AKT.hata = 'Veri okunamadı.'; return false; }
  // Başlık satırı: "cari" ya da "ad/ünvan" geçen ilk satır
  let bi = satirlar.findIndex(s => s.some(h => {
    const n = aktNorm(h);
    return AKT_ALANLAR.name.includes(n) || AKT_ALANLAR.kod.includes(n);
  }));
  if(bi < 0) bi = 0;
  const basliklar = satirlar[bi].map(x => String(x).trim());
  const eslesme = {};
  basliklar.forEach((b, i) => {
    const n = aktNorm(b);
    for(const alan in AKT_ALANLAR){
      if(eslesme[alan] !== undefined) continue;
      if(AKT_ALANLAR[alan].some(x => aktNorm(x) === n)){ eslesme[alan] = i; break; }
    }
  });
  // Ad sütunu bulunamadıysa: ilk metin ağırlıklı sütunu ad kabul et
  if(eslesme.name === undefined){
    const veri = satirlar.slice(bi + 1, bi + 12);
    let enIyi = -1, enCok = 0;
    basliklar.forEach((_, i) => {
      const harfli = veri.filter(s => /[a-zçğıöşüA-ZÇĞİÖŞÜ]{3,}/.test(String(s[i] || ''))).length;
      if(harfli > enCok){ enCok = harfli; enIyi = i; }
    });
    if(enIyi >= 0) eslesme.name = enIyi;
  }
  if(eslesme.name === undefined){ AKT.hata = 'Cari adı sütunu bulunamadı. Başlık satırının dosyada olduğundan emin olun.'; return false; }
  const kayitlar = [];
  satirlar.slice(bi + 1).forEach(s => {
    const al = a => (eslesme[a] !== undefined ? String(s[eslesme[a]] ?? '').trim() : '');
    const ad = al('name');
    if(!ad || aktNorm(ad) === 'toplam' || aktNorm(ad) === 'genel toplam') return;
    const borc = aktSayi(al('borc')), alacak = aktSayi(al('alacak'));
    let bakiye = eslesme.bakiye !== undefined ? aktSayi(al('bakiye')) : (borc - alacak);
    kayitlar.push({
      kod: al('kod'), name: ad, tip: al('tip'), borc, alacak, bakiye,
      vkn: al('vkn').replace(/\s/g, ''), vergiDairesi: al('vergiDairesi'),
      semt: al('semt'), sehir: al('sehir'), address: al('address'),
      phone: al('phone'), phone2: al('phone2'), email: al('email'),
      uyum: eslesme.bakiye === undefined || Math.abs((borc - alacak) - bakiye) < 0.02
            || Math.abs((borc - alacak) + bakiye) < 0.02,   // işaret farkı = alacak bakiyesi, sorun değil
      fark: eslesme.bakiye === undefined ? 0 : Math.round(((borc - alacak) - bakiye) * 100) / 100,
    });
  });
  if(!kayitlar.length){ AKT.hata = 'Başlık bulundu ama veri satırı yok.'; return false; }
  AKT = { satirlar: kayitlar, eslesme, basliklar, hata: '' };
  return true;
}
function aktDurum(tip){
  const t = aktNorm(tip);
  if(t.includes('satici') || t.includes('tedarik')) return 'Tedarikçi';
  return 'Müşteri';
}
function aktMevcutBul(k){
  // 1) Cari kodu — muhasebede benzersizdir, en güvenilir anahtar
  if(k.kod){
    const v = CUSTOMERS.find(c => (c.cariKodu || '') === k.kod);
    if(v) return v;
  }
  const ad = aktNorm(k.name);
  // 2) VKN + aynı ünvan — ancak iki tarafın da kodu varsa ve kodlar farklıysa AYRI cari sayılır
  if(k.vkn){
    const v = CUSTOMERS.find(c => (c.vkn || '').replace(/\s/g, '') === k.vkn && aktNorm(c.name) === ad
      && !(k.kod && c.cariKodu && c.cariKodu !== k.kod));
    if(v) return v;
  }
  // 3) Cari kodu olmayan kartlarda ünvan eşleşmesi
  return CUSTOMERS.find(c => aktNorm(c.name) === ad && !c.cariKodu) || null;
}
function openCariAktarim(){
  AKT = { satirlar: [], eslesme: {}, basliklar: [], hata: '' };
  document.getElementById('modalBox').innerHTML = aktAdim1Html();
  showModal();
  document.getElementById('modalBox').style.maxWidth = '900px';
}
function aktAdim1Html(){
  return `
    <div class="modal-head"><h2>Excel'den Cari Aktar</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="hint" style="margin-top:0;">Zirve (ya da başka bir muhasebe programı) çıktısındaki cari listesini ROTA'ya aktarır:
      müşteri kartlarını oluşturur ve <b>açılış bakiyelerini</b> cari hareketlerine işler.</div>

        aşağıdaki kutuya yapıştırın (Ctrl+V).</div>
      <textarea id="aktYapistir" class="akt-alan" placeholder="Buraya yapıştırın…"></textarea>

      <input type="file" id="aktDosya" accept=".csv,.txt,.xlsx,.xls" onchange="aktDosyaOku(this)"
        style="font-size:12.5px;width:100%;padding:8px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface);">
    </div>
    <div id="aktDurum" class="akt-durum"></div>`;
}
function aktMetindenOku(){
  const t = document.getElementById('aktYapistir').value;
  if(!t.trim()){ showToast('Önce tabloyu yapıştırın.'); return; }
  if(aktMetniIsle(t)) aktOnizleGoster(); else aktHataGoster();
}
function aktHataGoster(){
  const d = document.getElementById('aktDurum');
  if(d) d.innerHTML = `<div class="akt-hata">⚠ ${notEsc(AKT.hata || 'Veri okunamadı.')}</div>`;
}
function aktDosyaOku(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const d = document.getElementById('aktDurum');
  if(d) d.innerHTML = '<div class="akt-bilgi">Dosya okunuyor…</div>';
  const ad = f.name.toLowerCase();
  if(ad.endsWith('.xlsx') || ad.endsWith('.xls')){
    aktXlsxOku(f);
    return;
  }
  const oku = new FileReader();
  oku.onload = () => { if(aktMetniIsle(oku.result)) aktOnizleGoster(); else aktHataGoster(); };
  oku.onerror = () => { AKT.hata = 'Dosya okunamadı.'; aktHataGoster(); };
  // Türkçe Excel CSV'si çoğunlukla Windows-1254 olur; UTF-8 bozuk çıkarsa yeniden dener
  oku.readAsText(f, 'UTF-8');
  oku.onloadend = () => {
    if(typeof oku.result === 'string' && oku.result.includes('�')){
      const o2 = new FileReader();
      o2.onload = () => { if(aktMetniIsle(o2.result)) aktOnizleGoster(); else aktHataGoster(); };
      o2.readAsText(f, 'windows-1254');
    }
  };
}
function aktXlsxOku(f){
  const calistir = () => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const wb = XLSX.read(new Uint8Array(r.result), { type: 'array' });
        const sh = wb.Sheets[wb.SheetNames[0]];
        const csv = XLSX.utils.sheet_to_csv(sh, { FS: '\t' });
        if(aktMetniIsle(csv)) aktOnizleGoster(); else aktHataGoster();
      }catch(e){ AKT.hata = 'Excel dosyası okunamadı: ' + e.message; aktHataGoster(); }
    };
    r.readAsArrayBuffer(f);
  };
  if(typeof XLSX !== 'undefined'){ calistir(); return; }
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = calistir;
  sc.onerror = () => {
    AKT.hata = 'Excel okuyucu yüklenemedi (internet erişimi kısıtlı olabilir). Lütfen 1. yolu kullanın: Excel\'de tabloyu kopyalayıp kutuya yapıştırın.';
    aktHataGoster();
  };
  document.head.appendChild(sc);
}
function aktOnizleGoster(){
  const k = AKT.satirlar;
  const yeni = k.filter(x => !aktMevcutBul(x)).length;
  const mevcut = k.length - yeni;
  const tb = k.reduce((s,x) => s + x.borc, 0), ta = k.reduce((s,x) => s + x.alacak, 0);
  const bakiyeli = k.filter(x => Math.abs(x.bakiye) >= 0.01).length;
  const uyumsuz = k.filter(x => !x.uyum).length;
  const bulunan = Object.keys(AKT.eslesme).filter(a => AKT.eslesme[a] !== undefined);
  const eksik = ['borc','alacak','vkn','address','phone'].filter(a => AKT.eslesme[a] === undefined);
  document.getElementById('modalBox').style.maxWidth = '900px';
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>Aktarım Önizleme</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="akt-ozet">
      <div><b>${k.length}</b><span>satır okundu</span></div>
      <div><b style="color:var(--ok);">${yeni}</b><span>yeni cari</span></div>
      <div><b>${mevcut}</b><span>mevcut (güncellenecek)</span></div>
      <div><b>${bakiyeli}</b><span>bakiyeli cari</span></div>
    </div>
    <div class="akt-tutar">
      <span>Toplam Borç: <b style="color:var(--risk);">${chTL(Math.round(tb * 100))}</b></span>
      <span>Toplam Alacak: <b style="color:var(--ok);">${chTL(Math.round(ta * 100))}</b></span>
      <span>Net: <b>${chTL(Math.round((tb - ta) * 100))}</b></span>
    </div>
    ${AKT.eslesme.tip !== undefined ? `<div class="hint" style="margin:6px 0;">Cari tipi: <b>${k.filter(x => aktDurum(x.tip) === 'Müşteri').length}</b> müşteri (alıcı) · <b>${k.filter(x => aktDurum(x.tip) === 'Tedarikçi').length}</b> tedarikçi (satıcı) — kartlara bu şekilde işlenecek.</div>` : ''}
    <div class="hint" style="margin:8px 0;">Eşleşen sütunlar: ${bulunan.map(a => `<b>${a}</b>`).join(', ')}${eksik.length ? ` · bulunamayan: ${eksik.join(', ')}` : ''}</div>
    ${uyumsuz ? `<div class="akt-uyari">ℹ ${uyumsuz} satırda Excel'deki <b>Bakiye</b> sütunu, Borç − Alacak farkına eşit değil.
      Bu satırlar da aktarılır; ROTA bakiyeyi her zaman <b>Borç ve Alacak</b> toplamlarından hesaplar
      (Zirve'de ara işlem/yuvarlama olan carilerde görülebilir).
      <div class="akt-uyari-liste">${k.filter(x => !x.uyum).slice(0, 6).map(x =>
        `<div>• <b>${notEsc(x.name)}</b>${x.kod ? ` <span style="opacity:.6;">${notEsc(x.kod)}</span>` : ''} —
         Borç ${chTL(Math.round(x.borc * 100))} − Alacak ${chTL(Math.round(x.alacak * 100))} =
         <b>${chTL(Math.round((x.borc - x.alacak) * 100))}</b>, Excel'de yazan: ${chTL(Math.round(x.bakiye * 100))}
         <span style="color:var(--risk);">(fark ${chTL(Math.round(Math.abs(x.fark) * 100))})</span></div>`).join('')}
        ${uyumsuz > 6 ? `<div style="opacity:.7;">… ve ${uyumsuz - 6} satır daha</div>` : ''}</div></div>` : ''}
    <div class="akt-tablo-kap">
      <table class="akt-tablo">
        <thead><tr><th>Cari</th><th>VKN</th><th class="sag">Borç</th><th class="sag">Alacak</th><th class="sag">Bakiye</th><th>Durum</th></tr></thead>
        <tbody>${k.slice(0, 12).map(x => {
          const m = aktMevcutBul(x);
          return `<tr>
            <td>${notEsc(x.name)}${x.kod ? `<div class="akt-kod">${notEsc(x.kod)}</div>` : ''}</td>
            <td style="font-family:var(--font-mono);font-size:11px;">${notEsc(x.vkn) || '—'}</td>
            <td class="sag">${x.borc ? chTL(Math.round(x.borc * 100)) : '—'}</td>
            <td class="sag">${x.alacak ? chTL(Math.round(x.alacak * 100)) : '—'}</td>
            <td class="sag" style="font-weight:700;">${x.bakiye ? chTL(Math.round(x.bakiye * 100)) : '—'}</td>
            <td>${m ? '<span class="ch-durum gri">Mevcut</span>' : '<span class="ch-durum yesil">Yeni</span>'}</td>
          </tr>`; }).join('')}</tbody>
      </table>
      ${k.length > 12 ? `<div class="akt-devam">… ve ${k.length - 12} satır daha</div>` : ''}
    </div>
    <label class="akt-secim"><input type="checkbox" id="aktKart" checked> Müşteri kartlarını oluştur / bilgilerini güncelle</label>
    <label class="akt-secim"><input type="checkbox" id="aktBakiye" checked> Açılış bakiyelerini cari hareketlerine işle</label>
    <label class="akt-secim"><input type="checkbox" id="aktSifir"> Bakiyesi sıfır olan carileri de aktar</label>
    <label class="akt-secim" style="color:var(--risk);"><input type="checkbox" id="aktTemiz">
      Önceki Excel aktarımını temizleyip baştan aktar <span style="color:var(--ink-3);font-weight:400;">(yalnızca aktarımla gelen, işi/teklifi olmayan kartlar silinir)</span></label>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn" style="flex:0 0 auto;" onclick="openCariAktarim()">← Geri</button>
      <button class="modal-submit" style="margin:0;flex:1;" onclick="aktUygula()">${k.length} Satırı Aktar</button>
    </div>`;
}
function aktUygula(){
  const kartYap = document.getElementById('aktKart').checked;
  const bakiyeYap = document.getElementById('aktBakiye').checked;
  const sifirDahil = document.getElementById('aktSifir').checked;
  const bugun = bugunTR();
  const damga = 'zirve-aktarim';
  let yeniKart = 0, guncelKart = 0, acilisYeni = 0, acilisGuncel = 0, atlanan = 0;
  const buAktarimda = new Set();      // bu çalıştırmada açılan kartlar
  const birlesenler = [];             // aynı cariye denk gelen satırlar
  let temizlenen = 0, korunan = 0;
  if(document.getElementById('aktTemiz') && document.getElementById('aktTemiz').checked){
    // Yalnız aktarımla gelen ve hiçbir teklif/işe bağlanmamış kartlar silinir
    const kullanilan = new Set([
      ...QUOTES.map(q => q.customerId),
      ...JOBS.map(j => j.customerId),
      ...GELIRLER.map(g => g.customerId),
    ].filter(Boolean));
    const silinecek = CUSTOMERS.filter(c => c.aktarimKaynak === damga && !kullanilan.has(c.id));
    korunan = CUSTOMERS.filter(c => c.aktarimKaynak === damga && kullanilan.has(c.id)).length;
    const silinenIdler = new Set(silinecek.map(c => c.id));
    CUSTOMERS = CUSTOMERS.filter(c => !silinenIdler.has(c.id));
    CARI_HAREKETLER = CARI_HAREKETLER.filter(h => !(h.aktarim === damga && silinenIdler.has(h.customerId)));
    temizlenen = silinecek.length;
  }

  AKT.satirlar.forEach(k => {
    const bakiyeVar = Math.abs(k.borc) >= 0.01 || Math.abs(k.alacak) >= 0.01;
    if(!sifirDahil && !bakiyeVar && !k.kod){ atlanan++; return; }
    let c = aktMevcutBul(k);
    if(c && buAktarimda.has(c.id)) birlesenler.push({ ad: k.name, kod: k.kod, hedef: c.name, hedefKod: c.cariKodu || '' });
    if(!c && kartYap){
      c = {
        id: benzersizId('c'),
        type: /(a\.ş|ltd|şti|san|tic|a\.s|limited|anonim)/i.test(k.name) ? 'firma' : (k.vkn && k.vkn.length === 11 ? 'sahis' : 'firma'),
        name: k.name, contact: '', phone: k.phone || '', email: k.email || '',
        address: [k.address, k.semt, k.sehir].filter(Boolean).join(', '),
        durum: aktDurum(k.tip), unvan: '', dateAdded: bugun,
      };
      CUSTOMERS.push(c);
      buAktarimda.add(c.id);
      yeniKart++;
    } else if(c && kartYap){
      let d = false;
      if(!c.phone && k.phone){ c.phone = k.phone; d = true; }
      if(!c.email && k.email){ c.email = k.email; d = true; }
      if(!c.address && (k.address || k.sehir)){ c.address = [k.address, k.semt, k.sehir].filter(Boolean).join(', '); d = true; }
      if(d) guncelKart++;
    }
    if(c){
      // Muhasebe bilgileri her hâlükârda tazelenir
      if(k.kod) c.cariKodu = k.kod;
      if(k.vkn) c.vkn = k.vkn;
      if(k.vergiDairesi) c.vergiDairesi = k.vergiDairesi;
      if(k.semt) c.semt = k.semt;
      if(k.sehir) c.sehir = k.sehir;

      c.aktarimKaynak = damga;
    }
    if(!bakiyeYap || !c) return;

    // Açılış kayıtları: aynı kaynaktan gelen önceki açılış varsa güncellenir (çift kayıt olmaz)
    const yaz = (tip, tutar) => {
      const tutarK = Math.round(tutar * 100);
      const eski = CARI_HAREKETLER.find(h => h.customerId === c.id && h.tip === tip && h.aktarim === damga && !h.iptal);
      if(tutarK <= 0){
        if(eski){ eski.iptal = { zaman: new Date().toLocaleString('tr-TR'), kim: chKullanici() }; acilisGuncel++; }

      });

    yaz('acilis-alacak', k.alacak);

  if(typeof liveMarkDirty === 'function') liveMarkDirty();   // sunucuya kayıt tetiklenir
  const beklenen = AKT.satirlar.length - atlanan;
  const olusan = yeniKart + guncelKart + birlesenler.length;
  closeModal();

  'cek-alinan':     { ad: 'Alınan Çek/Senet',        sinif: 'yesil',   yon: 'alacak' },   // müşteriden alınan çek: borcunu azaltır
  'cek-verilen':    { ad: 'Verilen Çek/Senet',       sinif: 'kirmizi', yon: 'borc'   },   // tedarikçiye verilen / ciro edilen çek: borcumuzu azaltır
};
const CH_YONTEMLER = ['Nakit','Havale','EFT','FAST','Kredi Kartı','Çek','Diğer'];

function chAdAnahtar(ad){ return 'ad:' + String(ad || '').trim().toLowerCase(); }
function chKurus(tl){ return Math.round((Number(tl) || 0) * 100); }
function chTL(k){ return (Math.abs(k) / 100).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' TL'; }
function chTarihSira(t){
  if(!t) return '';
  const m = String(t).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
  return String(t).slice(0, 10);
}
function chTarihTR(t){
  if(!t) return '—';
  return /^\d{4}-\d{2}-\d{2}/.test(t) ? formatDate(t) : String(t);
}
function chKullanici(){
  try{ if(typeof LIVE !== 'undefined' && LIVE.user && LIVE.user.email) return LIVE.user.email; }catch(e){}
  return CURRENT_ROLE || 'demo';
}
function chBelgeNo(onEk){
  const n = CARI_HAREKETLER.filter(h => (h.belgeNo || '').startsWith(onEk)).length + 1;
  return onEk + '-' + String(n).padStart(3, '0');
}

// ---- MERKEZİ SERVİS: tüm kaynaklardan birleşik hareket satırları ----
function cariTumSatirlar(){
  const satirlar = [];
  QUOTES.forEach(q => {
    if(q.status !== 'Kabul Edildi' && q.status !== 'Faturalandı') return;
    const cst = CUSTOMERS.find(x => x.id === q.customerId);
    const ad = (cst && cst.name) || q.musteriAdi || 'Müşteri seçilmedi';
    const ilk = q.items && q.items.find(it => it.title);
    satirlar.push({ key: q.customerId || chAdAnahtar(ad), ad, tip: 'satis-faturasi',
      tarih: q.date, vade: '', belgeNo: q.no || '',
      aciklama: ilk ? (ilk.title + (q.items.filter(it => it.title).length > 1 ? ' +' + (q.items.filter(it => it.title).length - 1) + ' kalem' : '')) : 'Satış',
      borcK: Math.round(quoteTotal(q) * 100), alacakK: 0,
      kaynak: { tip: 'teklif', id: q.id } });
  });
  GELIRLER.forEach(g => {
    if(!g.customerId && !g.client) return;
    satirlar.push({ key: g.customerId || chAdAnahtar(g.client), ad: g.client || '',
      tip: 'tahsilat', tarih: g.tarih, vade: '', belgeNo: g.belgeNo || '',
      aciklama: (g.tur || 'Tahsilat') + (g.hesap ? ' · ' + g.hesap : ''),
      borcK: 0, alacakK: Math.round((Number(g.tutar) || 0) * 100),
      kaynak: { tip: 'gelir', id: g.id } });
  });
  // Giderler → tedarikçi cari hareketleri (yalnızca cari seçilmiş kayıtlar)
  (GIDERLER || []).forEach(g => {
    if(!g.customerId) return;
    const tutarK = Math.round((Number(g.tutar) || 0) * 100);
    if(!tutarK) return;
    const cst = CUSTOMERS.find(x => x.id === g.customerId);
    const ad = (cst && cst.name) || g.client || '';
    // cariTip: 'odeme' → sadece ödeme (borcumuzu azaltır)
    //          'alis'  → sadece alış faturası (borç doğurur)
    //          'alis-odeme' → alış + peşin ödeme (net etkisiz, geçmiş görünür)
    const etki = g.cariTip || (g.odendi ? 'alis-odeme' : 'alis');
    if(etki !== 'odeme'){
      satirlar.push({ key: g.customerId, ad, tip: 'alis-faturasi', tarih: g.tarih, vade: g.vade || '',
        belgeNo: g.belgeNo || '', aciklama: g.tur || 'Alış',
        borcK: 0, alacakK: tutarK, kaynak: { tip: 'gider', id: g.id } });
    }
    if(etki !== 'alis'){
      satirlar.push({ key: g.customerId, ad, tip: 'odeme', tarih: g.tarih, vade: '',
        belgeNo: g.belgeNo || '', aciklama: (etki === 'odeme' ? (g.tur || 'Ödeme') : 'Ödeme') + (g.hesap ? ' · ' + g.hesap : ''),
        borcK: tutarK, alacakK: 0, kaynak: { tip: 'gider', id: g.id } });
    }
  });
  (CARI_HAREKETLER || []).forEach(h => {
    const t = CH_TURLER[h.tip]; if(!t) return;
    satirlar.push({ key: h.customerId || chAdAnahtar(h.musteriAdi), ad: h.musteriAdi || '',
      tip: h.tip, tarih: h.tarih, vade: h.vade || '', belgeNo: h.belgeNo || '',
      aciklama: h.aciklama || '', notu: h.notu || '',
      borcK: t.yon === 'borc' ? (h.tutarK || 0) : 0,
      alacakK: t.yon === 'alacak' ? (h.tutarK || 0) : 0,
      kaynak: { tip: 'manuel', id: h.id }, iptal: !!h.iptal, h });
  });
  return satirlar;
}

// Bir carinin defteri: kronolojik sıra, yürüyen bakiye, FIFO ile fatura kalanları.
// Bakiye = Toplam Borç − Toplam Alacak. Pozitif → Tahsil Edilecek, negatif → Ödeme Yapılacak.
function cariDefter(key){
  const bugun = chTarihSira(new Date().toLocaleDateString('tr-TR'));
  const rows = cariTumSatirlar().filter(r => r.key === key && (!r.iptal || chIptalGoster))
    .sort((a, b) => chTarihSira(a.tarih).localeCompare(chTarihSira(b.tarih)));
  let bakiyeK = 0, borcK = 0, alacakK = 0;
  rows.forEach(r => {
    if(r.iptal){ r.bakiyeK = bakiyeK; return; }
    bakiyeK += r.borcK - r.alacakK;
    borcK += r.borcK; alacakK += r.alacakK;
    r.bakiyeK = bakiyeK;
  });
  // FIFO: alacaklar borç satırlarına kronolojik dağıtılır → kalan + ödeme durumu
  let havuzK = alacakK;
  let vadesiGecenK = 0;
  rows.forEach(r => {
    if(r.iptal || !r.borcK) return;
    const dusen = Math.min(havuzK, r.borcK);
    r.kalanK = r.borcK - dusen;
    havuzK -= dusen;
    // Ödeme durumu yalnız alacak doğuran belgelerde anlamlı (fatura ve borç dekontu)
    if(r.tip !== 'satis-faturasi' && r.tip !== 'borc-dekontu'){ r.durum = 'İşlendi'; return; }
    const vadeGecti = r.vade && chTarihSira(r.vade) < bugun && r.kalanK > 0;
    r.durum = vadeGecti ? 'Vadesi Geçti'
      : (r.kalanK === 0 ? 'Ödendi' : (r.kalanK < r.borcK ? 'Kısmi Ödendi' : (r.vade && chTarihSira(r.vade) >= bugun ? 'Vadesi Gelmedi' : 'Ödenmedi')));
    if(vadeGecti) vadesiGecenK += r.kalanK;
  });
  // Ayna FIFO: borç satırları (ödemeler) alacak doğuran belgelere dağıtılır → tedarikçi tarafı kalanı
  let havuz2K = borcK;
  let vadesiGecenAlacakK = 0;
  rows.forEach(r => {
    if(r.iptal || !r.alacakK) return;
    const dusen = Math.min(havuz2K, r.alacakK);
    r.alacakKalanK = r.alacakK - dusen;
    havuz2K -= dusen;
    if(r.vade && chTarihSira(r.vade) < bugun && r.alacakKalanK > 0) vadesiGecenAlacakK += r.alacakKalanK;
  });
  rows.forEach(r => {
    if(r.iptal){ r.durum = 'İptal Edildi'; return; }
    if(!r.durum) r.durum = r.tip === 'tahsilat' ? 'Tahsil Edildi' : 'İşlendi';
  });
  return { rows, bakiyeK, borcK, alacakK, vadesiGecenK, vadesiGecenAlacakK };
}

// Cari listesi: tüm anahtarların özetleri (ad çözümü CUSTOMERS öncelikli)
function cariOzetListesi(hepsi){
  const map = new Map();
  cariTumSatirlar().forEach(r => {
    if(r.iptal) return;
    if(!map.has(r.key)) map.set(r.key, { key: r.key, ad: r.ad, borcK: 0, alacakK: 0 });
    const c = map.get(r.key);
    if(r.ad && (!c.ad || c.ad === 'Müşteri seçilmedi')) c.ad = r.ad;
    c.borcK += r.borcK; c.alacakK += r.alacakK;
  });
  let sonuc = [...map.values()].map(c => {
    const cst = CUSTOMERS.find(x => x.id === c.key);
    if(cst) c.ad = cst.name;
    c.bakiyeK = c.borcK - c.alacakK;
    return c;
  });
  if(hepsi){
    // Hareketi olmayan cari kartları da listeye katılır (Zirve'den gelen sıfır bakiyeli cariler dahil)
    const varOlan = new Set(sonuc.map(c => c.key));
    CUSTOMERS.forEach(cst => {
      if(varOlan.has(cst.id)) return;
      sonuc.push({ key: cst.id, ad: cst.name, borcK: 0, alacakK: 0, bakiyeK: 0, hareketsiz: true });
    });
  } else {
    sonuc = sonuc.filter(c => c.borcK || c.alacakK);
  }
  return sonuc.sort((a, b) => a.ad.localeCompare(b.ad, 'tr'));
}
function chBakiyeMetni(k){
  if(k > 0) return '<span class="ch-yon tahsil">Tahsil Edilecek</span>';
  if(k < 0) return '<span class="ch-yon odeme">Ödeme Yapılacak</span>';
  return '<span class="ch-yon notr">Kapalı</span>';
}

  let liste = cariOzetListesi(true);
  if(chListeTip){
    liste = liste.filter(c => {
      const cst = CUSTOMERS.find(x => x.id === c.key);
      const ted = !!cst && cst.durum === 'Tedarikçi';
      return chListeTip === 'tedarikci' ? ted : !ted;
    });
  }
  if(chListeSadeceBakiyeli) liste = liste.filter(c => c.bakiyeK);
  const sira = {
    tahsil: (a, b) => b.bakiyeK - a.bakiyeK,
    odeme:  (a, b) => a.bakiyeK - b.bakiyeK,
    buyuk:  (a, b) => Math.abs(b.bakiyeK) - Math.abs(a.bakiyeK),
    ad:     (a, b) => a.ad.localeCompare(b.ad, 'tr'),
  }[chListeSira] || ((a, b) => a.ad.localeCompare(b.ad, 'tr'));
  liste = [...liste].sort(sira);
  const iptalSayi = (CARI_HAREKETLER || []).filter(h => h.iptal).length;

  const odemeK  = liste.reduce((t, c) => t + (c.bakiyeK < 0 ? -c.bakiyeK : 0), 0);

  const tumSatirlar = cariTumSatirlar().filter(r => !r.iptal);
  const toplamSatisK = tumSatirlar.filter(r => r.tip === 'satis-faturasi').reduce((t, r) => t + r.borcK, 0);
  const tahsilatSatirlari = tumSatirlar.filter(r => r.tip === 'tahsilat' || r.tip === 'cek-alinan');
  const toplamTahsilatK = tahsilatSatirlari.reduce((t, r) => t + r.alacakK, 0);
  const tahsilatAdet = tahsilatSatirlari.length;
  return `
    <div class="page-head">
      <div><div class="eyebrow">ÖN MUHASEBE</div><div class="page-title">Cari Hesaplar</div>

      <div class="metric"><div class="metric-top"><span>Ödenecek</span><span class="metric-icon red">↗</span></div><strong style="color:var(--risk);">${chTL(odemeK)}</strong><small>${odemeSayi} cari</small></div>
      <div class="metric"><div class="metric-top"><span>Toplam tahsilat</span><span class="metric-icon">◎</span></div><strong>${chTL(toplamTahsilatK)}</strong><small>${tahsilatAdet} tahsilat kaydı</small></div>
      <div class="metric"><div class="metric-top"><span>Cari sayısı</span><span class="metric-icon blue">${NAV_SVG.users}</span></div><strong>${liste.length}</strong><small>${iptalSayi ? iptalSayi + ' iptal kayıt saklı' : 'aktif görünüm'}</small></div>
    </div>
    <div class="table-card">
      <div class="toolbar" style="padding:14px 16px;margin:0;border-bottom:1px solid var(--line);">
        <input class="tb-field" id="chListeAra" placeholder="Cari ara" oninput="chListeAra(this.value)">
        <select class="tb-filter" onchange="chTipSec(this.value)">
          <option value="" ${chListeTip === '' ? 'selected' : ''}>Tüm cariler</option>
          <option value="musteri" ${chListeTip === 'musteri' ? 'selected' : ''}>Müşteriler</option>
          <option value="tedarikci" ${chListeTip === 'tedarikci' ? 'selected' : ''}>Tedarikçiler</option>
        </select>
        <select class="tb-filter" onchange="chSiraSec(this.value)">
          <option value="tahsil" ${chListeSira === 'tahsil' ? 'selected' : ''}>Tahsil edilecek en üstte</option>
          <option value="odeme" ${chListeSira === 'odeme' ? 'selected' : ''}>Ödenecek en üstte</option>
          <option value="buyuk" ${chListeSira === 'buyuk' ? 'selected' : ''}>Bakiyesi büyükten küçüğe</option>
          <option value="ad" ${chListeSira === 'ad' ? 'selected' : ''}>İsme göre (A–Z)</option>
        </select>
        <label class="ch-sadece" style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);"><input type="checkbox" ${chListeSadeceBakiyeli ? 'checked' : ''} onchange="chSadeceBakiyeli(this.checked)"> Sadece bakiyeli</label>
      </div>
      <table class="data-table">
        <thead><tr><th>Cari</th><th>Tür</th><th>Yetkili / İletişim</th><th>Son hareket</th><th class="sag">Bakiye</th><th class="sag">Durum</th></tr></thead>
        <tbody>
        ${liste.length ? liste.map(c => { const cst = CUSTOMERS.find(x => x.id === c.key) || {}; const defter = cariDefter(c.key); const sonSatir = defter.rows.filter(r => !r.iptal).slice(-1)[0]; return `
          <tr class="clickable ch-cari-satir" data-ad="${notEsc(c.ad).toLowerCase()}" onclick="cariAc('${c.key.replace(/'/g, "\\'")}')">
            <td><strong>${notEsc(c.ad)}</strong>${cst.company ? `<small>${notEsc(cst.company)}</small>` : ''}</td>
            <td><span class="tag ${cst.durum === 'Tedarikçi' ? 'orange' : 'blue'}">${notEsc(cst.durum || 'Müşteri')}</span></td>
            <td>${cst.contact ? `<strong style="font-weight:600;">${notEsc(cst.contact)}</strong>` : '<span style="color:var(--ink-3);">—</span>'}${cst.phone ? `<small>${notEsc(cst.phone)}</small>` : ''}</td>
            <td>${sonSatir ? `<strong style="font-weight:600;">${chTarihTR(sonSatir.tarih)}</strong><small>${CH_TURLER[sonSatir.tip] ? CH_TURLER[sonSatir.tip].ad : sonSatir.tip}</small>` : '<span style="color:var(--ink-3);">Hareket yok</span>'}</td>
            <td class="money ${c.bakiyeK > 0 ? 'pos' : (c.bakiyeK < 0 ? 'neg' : '')}">${chTL(c.bakiyeK)}</td>
            <td class="sag">${c.bakiyeK > 0 ? '<span class="tag green">Tahsil edilecek</span>' : (c.bakiyeK < 0 ? '<span class="tag red">Ödeme yapılacak</span>' : '<span class="tag gray">Kapalı</span>')}</td>
          </tr>`; }).join('') : '<tr><td colspan="6"><div class="empty-state">Bu görünümde cari yok. “Sadece bakiyeli” seçiliyse kaldırıp tekrar deneyin.</div></td></tr>'}
        </tbody>
      </table>
      <div class="table-summary"><span>${liste.length} cari listeleniyor${iptalSayi ? ' · ' + iptalSayi + ' iptal kayıt saklı' : ''}</span>
        <strong>Net: ${chTL(tahsilK - odemeK)}</strong></div>
    </div>`;
}
function chSiraSec(v){ chListeSira = v; renderContent(); }
function chTipSec(v){ chListeTip = v; renderContent(); }
function chSadeceBakiyeli(v){ chListeSadeceBakiyeli = v; renderContent(); }
function chListeAra(v){
  const q = v.trim().toLowerCase();
  document.querySelectorAll('.ch-cari-satir').forEach(r => {
    r.style.display = !q || (r.dataset.ad || '').includes(q) ? '' : 'none';
  });
}

function chRozet(tip){
  const t = CH_TURLER[tip] || { ad: tip, sinif: 'gri' };
  return `<span class="ch-rozet ${t.sinif}">${t.ad}</span>`;
}
function chDurumRozet(d){
  const sinif = d === 'Ödendi' || d === 'Tahsil Edildi' ? 'yesil'
    : d === 'Vadesi Geçti' ? 'kirmizi'
    : d === 'Kısmi Ödendi' ? 'turuncu'
    : d === 'İptal Edildi' ? 'iptal' : 'gri';
  return `<span class="ch-durum ${sinif}">${d}</span>`;
}

function cariDefterView(){
  const key = cariSecili;
  const ozet = cariOzetListesi().find(x => x.key === key);
  const cst = CUSTOMERS.find(x => x.id === key);
  const ad = (cst && cst.name) || (ozet && ozet.ad) || 'Cari';
  const d = cariDefter(key);
  const f = chFiltre;
  // filtre uygula (bakiye kolonu tam defter üzerinden hesaplandı, satırlar sadece gizlenir)
  const gorunen = d.rows.filter(r => {
    if(f.tur && r.tip !== f.tur) return false;
    if(f.yon === 'borc' && !r.borcK) return false;
    if(f.yon === 'alacak' && !r.alacakK) return false;
    if(f.bas && chTarihSira(r.tarih) < f.bas) return false;
    if(f.bit && chTarihSira(r.tarih) > f.bit) return false;
    if(f.ara){
      const metin = (r.belgeNo + ' ' + r.aciklama + ' ' + (r.notu || '') + ' ' + (CH_TURLER[r.tip] ? CH_TURLER[r.tip].ad : '')).toLowerCase();
      if(!metin.includes(f.ara.toLowerCase())) return false;
    }
    return true;
  });
  const sirali = chYeniUstte ? [...gorunen].reverse() : gorunen;
  const filtreli = gorunen.length !== d.rows.length;
  const cid = cst ? cst.id : '';
  const govde = sirali.map(r => {
    const i = d.rows.indexOf(r);
    const tiklanir = r.kaynak.tip === 'teklif';
    return `
    <tr class="${r.iptal ? 'ch-iptal' : ''} ${tiklanir ? 'ch-tiklanir' : ''}"
      ${tiklanir ? `title="Teklifi açmak için tıklayın" onclick="chKaynagaGit('teklif','${r.kaynak.id}')"` : ''}>
      <td style="white-space:nowrap;">${chTarihTR(r.tarih)}</td>
      <td>${chRozet(r.tip)}</td>
      <td style="font-family:var(--font-mono);font-size:11.5px;">${notEsc(r.belgeNo) || '—'}</td>
      <td>${notEsc(r.aciklama)}${r.kalanK > 0 && r.kalanK < r.borcK ? ` <span style="color:var(--signal);font-size:11px;font-weight:600;">· Kalan: ${chTL(r.kalanK)}</span>` : ''}</td>
      <td style="white-space:nowrap;">${r.vade ? chTarihTR(r.vade) : '—'}</td>
      <td class="ch-sag" style="color:${r.borcK ? 'var(--risk)' : 'var(--line-strong)'};">${r.borcK ? chTL(r.borcK) : '—'}</td>
      <td class="ch-sag" style="color:${r.alacakK ? 'var(--ok)' : 'var(--line-strong)'};">${r.alacakK ? chTL(r.alacakK) : '—'}</td>
      <td class="ch-sag" style="font-weight:700;">${r.iptal ? '—' : chTL(r.bakiyeK) + (r.bakiyeK < 0 ? ' (A)' : '')}</td>
      <td>${chDurumRozet(r.durum)}</td>
      <td style="text-align:right;">
        <button class="ch-satir-btn" title="İşlemler" onclick="event.stopPropagation(); chSatirMenu(event,'${key.replace(/'/g, "\\'")}',${i})">⋯</button>
      </td>
    </tr>`; }).join('');
  const yetkili = cst ? (cst.contact || '') : '';
  const konum = cst ? [cst.durum, cst.phone, (cst.address || '').split(',').pop().trim()].filter(Boolean).join(' · ') : '';
  const acikBelge = d.rows.filter(r => !r.iptal && ((r.kalanK || 0) > 0 || (r.alacakKalanK || 0) > 0)).length;
  return `
    <div class="page-head">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <button class="back-btn" onclick="cariKapat()" title="Cari listesine dön">←</button>
        <div><div class="eyebrow">ÖN MUHASEBE</div><div class="page-title">Cari Hareketler</div>
          <div class="page-sub">Seçili cariye ait tahsilat, ödeme, fatura ve dekont hareketlerinin dökümü.</div></div>
      </div>
      <div class="action-row">
        <button class="ghost" onclick="chModalAc('borc-dekontu','${cid}')">＋ Borç Dekontu</button>
        <button class="ghost" onclick="chModalAc('alacak-dekontu','${cid}')">＋ Alacak Dekontu</button>
        <button class="ghost" onclick="chModalAc('odeme','${cid}')">－ Ödeme Ekle</button>
        <button class="primary" onclick="chModalAc('tahsilat','${cid}')">＋ Tahsilat Ekle</button>
        <button class="ghost" onclick="chCsvAktar('${key.replace(/'/g, "\\'")}')">⬇ Aktar</button>
        ${chIslemMenuHtml('chDefterMenu', cid)}
      </div>
    </div>
    <div class="account-hero">
      <div class="account-id"><span>${initials(ad)}</span>
        <div><p>SEÇİLİ CARİ</p><h2>${notEsc(ad)}</h2><small>${notEsc(konum || '—')}${yetkili ? ' · Yetkili: ' + notEsc(yetkili) : ''}</small></div></div>
      <div class="balance-block"><small>GÜNCEL BAKİYE</small><strong>${chTL(d.bakiyeK)}</strong>
        <span class="${d.bakiyeK < 0 ? 'risk' : ''}">${d.bakiyeK > 0 ? 'Tahsil edilecek (alacak bakiyesi)' : (d.bakiyeK < 0 ? 'Ödeme yapılacak (borç bakiyesi)' : 'Bakiye kapalı')}</span></div>
    </div>
    <div class="metric-grid compact">
      <div class="metric"><div class="metric-top"><span>Toplam borç</span><span class="metric-icon red">↗</span></div><strong style="color:var(--risk);">${chTL(d.borcK)}</strong><small>faturalar + borç kayıtları</small></div>
      <div class="metric"><div class="metric-top"><span>Toplam alacak</span><span class="metric-icon green">↙</span></div><strong style="color:var(--ok);">${chTL(d.alacakK)}</strong><small>tahsilat + alacak kayıtları</small></div>
      <div class="metric"><div class="metric-top"><span>Vadesi geçen</span><span class="metric-icon ${d.vadesiGecenK ? 'red' : ''}">!</span></div><strong style="color:${d.vadesiGecenK ? 'var(--risk)' : 'var(--ink)'};">${chTL(d.vadesiGecenK)}</strong><small class="${d.vadesiGecenK ? 'risk' : ''}">${d.vadesiGecenK ? 'vadesi geçmiş açık borç' : 'vadesi geçen yok'}</small></div>
      <div class="metric"><div class="metric-top"><span>Açık belge</span><span class="metric-icon blue">${NAV_SVG.file}</span></div><strong>${acikBelge}</strong><small>${d.rows.length} hareket</small></div>
    </div>
    <div class="toolbar">
      <input class="tb-field" id="chAraKutu" value="${notEsc(f.ara)}" placeholder="Belge no, açıklama, tür veya not ara" onchange="chFiltre.ara=this.value; renderContent();">
      <input class="tb-filter" type="date" value="${f.bas}" title="Başlangıç" onchange="chFiltre.bas=this.value; renderContent();">
      <input class="tb-filter" type="date" value="${f.bit}" title="Bitiş" onchange="chFiltre.bit=this.value; renderContent();">
      <select class="tb-filter" onchange="chFiltre.tur=this.value; renderContent();">
        <option value="">Hareket: Tümü</option>
        ${Object.keys(CH_TURLER).map(t => `<option value="${t}" ${f.tur === t ? 'selected' : ''}>${CH_TURLER[t].ad}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);cursor:pointer;">
        <input type="checkbox" ${chIptalGoster ? 'checked' : ''} onchange="chIptalGoster=this.checked; renderContent();" style="width:14px;height:14px;">İptaller</label>
      ${filtreli || f.ara ? `<button class="ghost" onclick="chFiltre={ara:'',tur:'',yon:'',bas:'',bit:''}; renderContent();">✕ Temizle</button>` : ''}
      <div class="segmented">
        <button class="${!f.yon ? 'active' : ''}" onclick="chFiltre.yon=''; renderContent();">Tümü</button>
        <button class="${f.yon === 'borc' ? 'active' : ''}" onclick="chFiltre.yon='borc'; renderContent();">Borç</button>
        <button class="${f.yon === 'alacak' ? 'active' : ''}" onclick="chFiltre.yon='alacak'; renderContent();">Alacak</button>
      </div>
    </div>
    <div class="cari-tablo-kap">
      <div class="cari-tablo-kaydir">
        <table class="ch-tablo">
          <thead><tr>
            <th style="cursor:pointer;" onclick="chYeniUstte=!chYeniUstte; renderContent();">Tarih ${chYeniUstte ? '↓' : '↑'}</th>
            <th>İşlem Türü</th><th>Belge No</th><th>Açıklama</th><th>Vade</th>
            <th class="ch-sag">Borç</th><th class="ch-sag">Alacak</th><th class="ch-sag">Bakiye</th><th>Durum</th><th></th>
          </tr></thead>
          <tbody>${govde || `<tr><td colspan="10"><div class="empty-state">${filtreli ? 'Filtreye uyan hareket yok.' : 'Bu cariye ait hareket yok.'}</div></td></tr>`}</tbody>
        </table>
      </div>
      <div class="table-summary">
        <span>${sirali.length} hareket gösteriliyor${filtreli ? ' (filtreli)' : ''}</span>
        <span style="display:flex;gap:18px;flex-wrap:wrap;">
          <span>Toplam Borç: <b class="money neg">${chTL(d.borcK)}</b></span>
          <span>Toplam Alacak: <b class="money pos">${chTL(d.alacakK)}</b></span>
          <strong>Dönem Bakiyesi: <span style="color:${d.bakiyeK > 0 ? 'var(--ok)' : (d.bakiyeK < 0 ? 'var(--risk)' : 'var(--ink)')};">${chTL(d.bakiyeK)} ${d.bakiyeK > 0 ? '(Tahsil Edilecek)' : (d.bakiyeK < 0 ? '(Ödeme Yapılacak)' : '')}</span></strong>
        </span>
      </div>
    </div>`;
}

// ---- MODALLAR ----
function chCariSecenekleri(secili){
  return '<option value="">Seçiniz..</option>' + CUSTOMERS.map(c =>
    `<option value="${c.id}" ${secili === c.id ? 'selected' : ''}>${notEsc(c.name)}</option>`).join('');
}
function chModalAc(tur, onCid){
  const baslik = tur === 'tahsilat' ? 'Tahsilat Ekle' : tur === 'odeme' ? 'Ödeme Ekle'
    : tur === 'borc-dekontu' ? 'Borç Dekontu Ekle'
    : tur === 'alacak-dekontu' ? 'Alacak Dekontu Ekle' : 'Açılış Bakiyesi';
  const odeme = tur === 'odeme' || tur === 'tahsilat';   // ikisinde de kasa/banka + yöntem sorulur
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-head"><h2>${baslik}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Cari</label><select id="chCari">${chCariSecenekleri(onCid)}</select></div>
    ${tur === 'acilis' ? `
    <div class="field"><label>Açılış Yönü</label><select id="chAcilisYon">
      <option value="acilis-borc">Açılış Borcu (bize borçlu başlar)</option>
      <option value="acilis-alacak">Açılış Alacağı (biz borçlu başlarız)</option></select></div>` : ''}
    <div class="field-row">
      <div class="field" style="flex:2;"><label>Tutar</label><input id="chTutar" inputmode="decimal" placeholder="0,00"></div>
      <div class="field"><label>Para Birimi</label><select id="chPara"><option>TL</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>${tur === 'tahsilat' ? 'Tahsilat Tarihi' : (tur === 'odeme' ? 'Ödeme Tarihi' : 'İşlem Tarihi')}</label><input id="chTarih" value="${bugunTR()}"></div>
      ${tur === 'borc-dekontu' ? `<div class="field"><label>Vade Tarihi</label><input id="chVade" placeholder="gg.aa.yyyy"></div>` : ''}
    </div>
    ${odeme ? `
    <div class="field-row">
      <div class="field"><label>Kasa / Banka${tur === 'odeme' ? ' / Kart' : ''} <span style="color:var(--risk);">*</span></label><select id="chHesap">${hesapSecenekleri(tur === 'odeme')}</select></div>
      <div class="field"><label>Ödeme Yöntemi</label><select id="chYontem">${CH_YONTEMLER.map(y => `<option>${y}</option>`).join('')}</select></div>
    </div>` : ''}
    <div class="field-row">
      <div class="field" style="flex:2;"><label>Açıklama</label><input id="chAciklama" placeholder="Açıklama"></div>
      <div class="field"><label>Belge No</label><input id="chBelge" placeholder="otomatik"></div>
    </div>
    ${tur === 'tahsilat' ? `<div class="field"><label>Kategori</label>${kategoriSelectHtml('chKategori','gelir','')}</div>` : ''}
    <div class="field"><label>Not</label><input id="chNot" placeholder="İç not (isteğe bağlı)"></div>
    <button class="modal-submit" onclick="chKaydet('${tur}')">Kaydet</button>`;
  showModal();
}
function chKaydet(tur, duzenlenenId){
  const cid = document.getElementById('chCari').value;
  const cst = CUSTOMERS.find(c => c.id === cid);
  const tutarK = chKurus(virgulSayi(document.getElementById('chTutar').value));
  if(!cid){ showToast('Cari seçin.'); return; }
  if(!tutarK){ showToast('Tutar girin.'); return; }
  if(tur === 'tahsilat'){
    // Tahsilat tek yerde tutulur: GELIRLER. Defter bu kaydı otomatik alacak olarak gösterir.
    const hes = document.getElementById('chHesap');
    if(hes && !hes.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
    const acik = document.getElementById('chAciklama').value.trim();
    const yontem = document.getElementById('chYontem') ? document.getElementById('chYontem').value : '';
    const yeniGelir = {
      id: benzersizId('ge'),
      customerId: cid,
      client: cst ? cst.name : 'Müşteri seçilmedi',
      hesap: hes ? hes.value : '',
      tur: acik || ('Tahsilat' + (yontem ? ' · ' + yontem : '')),
      tarih: document.getElementById('chTarih').value || bugunTR(),
      tutar: tutarK / 100,
      kategoriId: (document.getElementById('chKategori') || {}).value || null,
      belgeNo: document.getElementById('chBelge').value.trim() || chBelgeNo('THL'),
      notu: document.getElementById('chNot').value.trim(),
      olusturan: chKullanici(),
    };
    GELIRLER.unshift(yeniGelir);
    hesapBakiyeDeltaUygula(yeniGelir.hesap, gelirNakitEtkisi(yeniGelir));
    closeModal(); renderContent();
    showToast(`Tahsilat kaydedildi — ${chTL(tutarK)} (Gelirler'e de işlendi).`);
    return;
  }
  if(tur === 'odeme' && !duzenlenenId){
    // Ödeme tek yerde tutulur: GİDERLER. Defter bu kaydı otomatik borç (ödeme) olarak gösterir.
    const hes = document.getElementById('chHesap');
    if(hes && !hes.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
    const acik = document.getElementById('chAciklama').value.trim();
    const yontem = document.getElementById('chYontem') ? document.getElementById('chYontem').value : '';
    const yeniGider = {
      id: benzersizId('gi'),
      customerId: cid,
      cariTip: 'odeme',
      client: cst ? cst.name : 'Cari seçilmedi',
      hesap: hes ? hes.value : '',
      tur: acik || ('Ödeme' + (yontem ? ' · ' + yontem : '')),
      tarih: document.getElementById('chTarih').value || bugunTR(),
      tutar: tutarK / 100,
      odendi: true,
      kategoriId: null,
      belgeNo: document.getElementById('chBelge').value.trim() || chBelgeNo('ODM'),
      notu: document.getElementById('chNot').value.trim(),
      olusturan: chKullanici(),
    };
    GIDERLER.unshift(yeniGider);
    hesapBakiyeDeltaUygula(yeniGider.hesap, -giderNakitEtkisi(yeniGider));
    closeModal(); renderContent();
    showToast(`Ödeme kaydedildi — ${chTL(tutarK)} (Giderler'e de işlendi).`);
    return;
  }
  const gercekTur = tur === 'acilis' ? document.getElementById('chAcilisYon').value : tur;
  const onEk = { 'odeme':'ODM', 'borc-dekontu':'BDK', 'alacak-dekontu':'ADK', 'acilis-borc':'ACL', 'acilis-alacak':'ACL' }[gercekTur] || 'CH';
  const vadeEl = document.getElementById('chVade');
  const hesapEl = document.getElementById('chHesap');
  if(tur === 'odeme' && hesapEl && !hesapEl.value){ showToast('Kasa / Banka seçimi zorunlu.'); return; }
  const kayit = duzenlenenId ? CARI_HAREKETLER.find(h => h.id === duzenlenenId) : null;
  const h = kayit || { id: benzersizId('ch'), olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR') };
  Object.assign(h, {
    customerId: cid, musteriAdi: cst ? cst.name : '',
    tip: gercekTur, tutarK,
    para: 'TL', kur: 1,
    tarih: document.getElementById('chTarih').value || bugunTR(),
    vade: vadeEl ? vadeEl.value.trim() : (h.vade || ''),
    hesap: hesapEl ? hesapEl.value : (h.hesap || ''),
    yontem: document.getElementById('chYontem') ? document.getElementById('chYontem').value : (h.yontem || ''),
    aciklama: document.getElementById('chAciklama').value.trim(),
    belgeNo: document.getElementById('chBelge').value.trim() || h.belgeNo || chBelgeNo(onEk),
    notu: document.getElementById('chNot').value.trim(),
  });
  if(kayit){ h.guncelleyen = chKullanici(); h.guncellemeZamani = new Date().toLocaleString('tr-TR'); }
  else CARI_HAREKETLER.unshift(h);
  closeModal(); renderContent();
  showToast(`${CH_TURLER[gercekTur].ad} kaydedildi — ${chTL(tutarK)}.`);
}
function chDuzenleModal(id){
  const h = CARI_HAREKETLER.find(x => x.id === id); if(!h) return;
  const tur = h.tip.startsWith('acilis') ? 'acilis' : h.tip;

function chVirmanOnizle(){
  const kutu = document.getElementById('chVOnizle'); if(!kutu) return;
  const k = (document.getElementById('chVKaynak') || {}).value;
  const hd = (document.getElementById('chVHedef') || {}).value;
  const tutarK = chKurus(virgulSayi((document.getElementById('chVTutar') || {}).value || ''));
  if(!k || !hd || k === hd){ kutu.innerHTML = ''; return; }
  const ad = id => { const c = CUSTOMERS.find(x => x.id === id); return c ? c.name : '—'; };
  const bak = id => cariDefter(id).bakiyeK;
  const kb = bak(k), hb = bak(hd);
  const satir = (etiket, once, sonra) => `
    <div class="ch-vo-satir"><span>${notEsc(etiket)}</span>
      <span>${chTL(once)} <span style="color:var(--ink-3);">→</span> <b>${chTL(sonra)}</b></span></div>`;
  kutu.innerHTML = satir(ad(k), kb, kb - tutarK) + satir(ad(hd), hb, hb + tutarK);
}
function chVirmanKaydet(){
  const k = document.getElementById('chVKaynak').value, hd = document.getElementById('chVHedef').value;
  const tutarK = chKurus(virgulSayi(document.getElementById('chVTutar').value));
  if(!k || !hd){ showToast('Kaynak ve hedef cari seçin.'); return; }
  if(k === hd){ showToast('Kaynak ve hedef aynı olamaz.'); return; }
  if(!tutarK){ showToast('Tutar girin.'); return; }
  const kc = CUSTOMERS.find(c => c.id === k), hc = CUSTOMERS.find(c => c.id === hd);
  const virmanId = benzersizId('vr');

    belgeNo, virmanId, para: 'TL', kur: 1, tutarK,
    olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR'),
  };
  CARI_HAREKETLER.unshift(Object.assign({ id: benzersizId('ch'), customerId: k, musteriAdi: kc.name, tip: 'virman-cikis' }, ortak));
  CARI_HAREKETLER.unshift(Object.assign({ id: benzersizId('ch'), customerId: hd, musteriAdi: hc.name, tip: 'virman-giris' }, ortak));

// Finans ekranı yardımcıları — mevcut kayıtlardan yalnız gösterim amaçlı toplamlar
function finAyAnahtar(ms){ const d = new Date(ms); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function finSon6Ay(){
  const simdi = new Date(); const aylar = [];
  for(let i = 5; i >= 0; i--){ const d = new Date(simdi.getFullYear(), simdi.getMonth() - i, 1); aylar.push({ key: finAyAnahtar(d.getTime()), etiket: PLAN_AYLAR[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) }); }
  return aylar;
}
function finYaklasanIslemler(gun){
  const simdi = Date.now(); const sinir = simdi + gun * 86400000; const out = [];
  rapDefterler().forEach(c => c.d.rows.forEach(r => {
    if(r.iptal || !r.vade) return;
    const ms = new Date(chTarihSira(r.vade) + 'T00:00:00').getTime(); if(!ms || ms > sinir) return;
    if(r.tip === 'satis-faturasi' && (r.kalanK || 0) > 0) out.push({ ad: c.ad, key: c.key, tip: 'tahsilat', ms, tutarK: r.kalanK, belge: r.belgeNo });
    if(r.tip === 'alis-faturasi' && (r.alacakKalanK || 0) > 0) out.push({ ad: c.ad, key: c.key, tip: 'odeme', ms, tutarK: r.alacakKalanK, belge: r.belgeNo });
  }));
  return out.sort((x, y) => x.ms - y.ms);
}

function submitKart(id){
  const name = document.getElementById('kkName').value.trim(); if(!name){ showToast('Kart adı girin.'); return; }

  const k = id ? KREDI_KARTLARI.find(x => x.id === id) : null;
  if(k){ k.name = name; k.limit = limit; k.sonOdemeGun = gun; k.balance = -borc; }
  else KREDI_KARTLARI.push({ id: benzersizId('kk'), name, limit, sonOdemeGun: gun, balance: -borc, currency:'TL' });
  closeModal(); renderContent(); showToast(k ? 'Kart güncellendi.' : `${name} eklendi.`);
}
function deleteKart(id){
  const k = KREDI_KARTLARI.find(x => x.id === id); if(!k) return;

function openKartOdeModal(id){
  const k = KREDI_KARTLARI.find(x => x.id === id); if(!k) return;

function submitKartOde(id){
  const k = KREDI_KARTLARI.find(x => x.id === id); if(!k) return;
  const tutar = virgulSayi(document.getElementById('kkOdeTutar').value); if(!(tutar > 0)){ showToast('Tutar girin.'); return; }
  const hesap = document.getElementById('kkOdeHesap').value;
  hesapBakiyeDeltaUygula(hesap, -tutar);
  k.balance = Math.round(((Number(k.balance) || 0) + tutar) * 100) / 100;
  k.odemeler = k.odemeler || []; k.odemeler.unshift({ tarih: document.getElementById('kkOdeTarih').value || bugunTR(), tutar, hesap, kim: (typeof daKimYapti === 'function') ? daKimYapti().ad : '' });
  closeModal(); renderContent(); showToast(`${k.name} ekstresi ödendi — ${tl(tutar)} (${hesap}).`);
}

  const a = id ? hesapBul(tur, id) : null;
  document.getElementById('modalBox').innerHTML = `

function submitAccount(tur, id){
  const name = document.getElementById('accName').value.trim();
  if(!name) return;
  const currency = document.getElementById('accCurrency').value;
  const balance = Number(document.getElementById('accBalance').value) || 0;
  const a = id ? hesapBul(tur, id) : null;
  if(a){ a.name = name; a.currency = currency; a.balance = balance; }
  else {
    const type = document.getElementById('accType').value;
    (type === 'kasa' ? KASA_ACCOUNTS : BANK_ACCOUNTS).push({ id: benzersizId(type === 'kasa' ? 'ka' : 'ba'), name, balance, currency });
  }
  closeModal(); renderContent();
  showToast(a ? `${name} güncellendi.` : `${name} eklendi.`);
}
function deleteAccount(tur, id){
  const a = hesapBul(tur, id); if(!a) return;
  const uyari = a.balance ? ` Hesapta ${a.balance.toLocaleString('tr-TR')}${a.currency} bakiye görünüyor.` : '';
  if(!confirm(`"${a.name}" hesabı silinsin mi?${uyari} Geçmiş gelir/gider kayıtları silinmez.`)) return;
  if(tur === 'kasa') KASA_ACCOUNTS = KASA_ACCOUNTS.filter(x => x.id !== id);
  else BANK_ACCOUNTS = BANK_ACCOUNTS.filter(x => x.id !== id);
  renderContent();
  showToast('Hesap silindi.');
}

function csCariAd(id){ const c = CUSTOMERS.find(x => x.id === id); return c ? c.name : '—'; }
function csAlinanMi(c){ return /^Alınan/.test(c.belgeTipi || ''); }
function csTutarK(c){ return Math.round((Number(c.tutar) || 0) * 100); }
function csDurum(c){

// Çek/senet ile bağlı cari hareketleri (CARI_HAREKETLER) — alınan: müşteri alacak; verilen/ciro: cari borç
function csHareketUygula(c){
  c.hareketler = c.hareketler || {};
  const tutarK = csTutarK(c);
  const tl = !c.paraBirimi || c.paraBirimi === 'TL';
  const ortak = { para:'TL', kur:1, tutarK, tarih: c.islemTarihi ? formatDate(c.islemTarihi) : bugunTR(), vade: c.vadeTarihi ? formatDate(c.vadeTarihi) : '', belgeNo: c.belgeNo || ('CS-' + c.id.slice(-4).toUpperCase()), yontem: /Senet/.test(c.belgeTipi) ? 'Senet' : 'Çek', cekId: c.id };
  const ust = (key, cid, tip, aciklama, tarih) => {
    const h = c.hareketler[key] ? CARI_HAREKETLER.find(x => x.id === c.hareketler[key]) : null;
    const gerekli = c.cariIsle !== false && tl && cid && tutarK > 0;
    if(!gerekli){ if(h && !h.iptal) h.iptal = { zaman: new Date().toLocaleString('tr-TR'), kim: chKullanici() }; return; }
    const cst = CUSTOMERS.find(x => x.id === cid);
    if(h){ Object.assign(h, ortak, { customerId: cid, musteriAdi: cst ? cst.name : '', tip, aciklama, tarih: tarih || ortak.tarih }); if(h.iptal) delete h.iptal; h.guncelleyen = chKullanici(); h.guncellemeZamani = new Date().toLocaleString('tr-TR'); }
    else { const yeni = Object.assign({ id: benzersizId('ch'), olusturan: chKullanici(), olusturmaZamani: new Date().toLocaleString('tr-TR'), customerId: cid, musteriAdi: cst ? cst.name : '', tip, aciklama }, ortak, { tarih: tarih || ortak.tarih }); CARI_HAREKETLER.unshift(yeni); c.hareketler[key] = yeni.id; }
  };
  if(csAlinanMi(c)){
    ust('alinan', c.tedarikci, 'cek-alinan', `${c.belgeTipi}${c.belgeNo ? ' · ' + c.belgeNo : ''}${c.aciklama ? ' — ' + c.aciklama : ''}`);
    ust('ciro', c.ciroCari, 'cek-verilen', `Ciro: ${csCariAd(c.tedarikci)} çeki${c.belgeNo ? ' · ' + c.belgeNo : ''}${c.aciklama ? ' — ' + c.aciklama : ''}`, c.ciroTarihi ? formatDate(c.ciroTarihi) : '');
  } else {
    ust('ciro', null, 'cek-verilen', '');   // alınan → verilen tipine çevrildiyse eski ciro kaydı iptal
    ust('alinan', null, 'cek-alinan', '');
    ust('verilen', c.tedarikci, 'cek-verilen', `${c.belgeTipi}${c.belgeNo ? ' · ' + c.belgeNo : ''}${c.aciklama ? ' — ' + c.aciklama : ''}`);
  }
}
function csHareketIptal(c){
  Object.values(c.hareketler || {}).forEach(id => { const h = CARI_HAREKETLER.find(x => x.id === id); if(h && !h.iptal) h.iptal = { zaman: new Date().toLocaleString('tr-TR'), kim: chKullanici() }; });
}
function deleteCekSenet(id){
  const c = CEK_SENET.find(x => x.id === id); if(!c) return;
  if(!confirm(`${c.belgeTipi} · ${c.belgeNo || 'belge'} — ${Number(c.tutar).toLocaleString('tr-TR')} ${c.paraBirimi} kaydı silinsin mi?${c.hareketler && Object.keys(c.hareketler).length ? '\nBağlı cari hareketleri iptal edilir (geçmişte saklanır).' : ''}`)) return;
  csHareketIptal(c);
  CEK_SENET = CEK_SENET.filter(x => x.id !== id);
  renderContent();
  showToast('Çek/Senet kaydı silindi.');
}

function submitCekSenet(){
  const veri = {
    belgeTipi: document.getElementById('csTip').value,
    tedarikci: document.getElementById('csTedarikci').value,
    belgeNo: document.getElementById('csBelgeNo').value,
    islemTarihi: document.getElementById('csIslemTarihi').value,
    vadeTarihi: document.getElementById('csVadeTarihi').value,
    tutar: document.getElementById('csTutar').value || 0,
    paraBirimi: document.getElementById('csParaBirimi').value,
    aciklama: document.getElementById('csAciklama').value,
    ciroCari: /^Alınan/.test(document.getElementById('csTip').value) ? (document.getElementById('csCiroCari').value || '') : '',
    ciroTarihi: document.getElementById('csCiroTarihi').value || '',
    cariIsle: document.getElementById('csCariIsle').checked,
  };
  if(!veri.tedarikci){ showToast('Cari seçin.'); return; }
  if(!(Number(veri.tutar) > 0)){ showToast('Tutar girin.'); return; }
  if(veri.ciroCari && veri.ciroCari === veri.tedarikci){ showToast('Ciro edilen cari, çeki aldığınız cariyle aynı olamaz.'); return; }
  let c;
  if(cekSenetDuzenleId){
    c = CEK_SENET.find(x => x.id === cekSenetDuzenleId);
    if(c) Object.assign(c, veri);
    cekSenetDuzenleId = null;
  } else {
    c = Object.assign({ id: benzersizId('cs') }, veri);
    CEK_SENET.push(c);
  }
  if(c) csHareketUygula(c);
  if(veri.paraBirimi !== 'TL' && veri.cariIsle) showToast('Dövizli çek cari hesabına işlenmez (cari defter TL). Kayıt listede tutulur.');
  cekSenetStep = 'list';
  renderContent();
  showToast(veri.ciroCari ? `Çek kaydedildi ve ${csCariAd(veri.ciroCari)} hesabından düşüldü.` : 'Çek/Senet kaydedildi.');
}

const STAGE_COLORS = { KESIF:'#94A3B8', TASARIM:'#F59E0B', URETIM:'#FF5A1F', MONTAJ:'#3B82F6', TAHSILAT:'#10B981' };
const STAGE_LABELS_TR = { KESIF:'Keşif', TASARIM:'Tasarım', URETIM:'Üretim', MONTAJ:'Montaj', TAHSILAT:'Tahsilat' };

function departmentDonut(){
  const stages = Object.keys(STAGE_COLORS);
  const counts = stages.map(s => JOBS.filter(j=>j.stage===s).length);
  const total = counts.reduce((a,b)=>a+b,0);
  const bolen = total || 1;
  let cursor = 0;
  const stops = total ? stages.map((s,i) => {
    const start = cursor/bolen*360;
    cursor += counts[i];
    const end = cursor/bolen*360;
    return `${STAGE_COLORS[s]} ${start}deg ${end}deg`;
  }).join(', ') : 'var(--surface-sunk) 0deg 360deg';
  return `
    <div style="padding:22px; display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
      <div class="donut" style="width:168px;height:168px;background:conic-gradient(${stops}); flex-shrink:0;">
        <div class="donut-inner" style="width:114px;height:114px;">
          <b style="font-size:10px;">TOPLAM İŞ</b>
          <span style="font-size:20px;">${total}</span>
        </div>
      </div>
      <div style="flex:1; min-width:220px; display:flex; flex-direction:column; gap:2px;">
        ${stages.map((s,i) => `
          <div onclick="filterBoardByStage('${s}')" style="display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; cursor:pointer;" onmouseover="this.style.background='var(--surface-sunk)'" onmouseout="this.style.background='transparent'">
            <span style="width:10px;height:10px;border-radius:3px;background:${STAGE_COLORS[s]}; flex-shrink:0;"></span>
            <span style="flex:1; font-size:13px; font-weight:500;">${STAGE_LABELS_TR[s]}</span>
            <span style="font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--ink-2);">${counts[i]}</span>
            <span style="color:var(--ink-3); font-size:12px;">›</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Göreli zaman metni ("8 dk önce") — yalnız gösterim
function zamanFarkiMetni(ms){
  if(!ms) return '';
  const f = Date.now() - ms;
  if(f < 60000) return 'az önce';
  if(f < 3600000) return Math.round(f/60000) + ' dk önce';
  if(f < 86400000) return Math.round(f/3600000) + ' saat önce';
  if(f < 172800000) return 'Dün';
  return new Date(ms).toLocaleDateString('tr-TR', { day:'numeric', month:'short' });
}

function anaSayfaOncelikler(){
  const rows = [];
  JOBS.forEach(j => {
    if(!j.assignees || !j.assignees.length) rows.push({ sira:0, baslik:j.client, alt:`${j.desc} · ${STAGE_LABELS_TR[j.stage] || j.stage}`, etiket:'Atama bekliyor', renk:'red', onclick:`openJobDrawer('${j.id}')`, kim:'—' });

async function submitUser(){
  const pid = document.getElementById('uPersonel').value;
  const email = document.getElementById('uEmail').value.trim().toLowerCase();
  const pass = document.getElementById('uPass').value;
  const rol = document.getElementById('uRole').value;
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p){ showToast('Personel seçin.'); return; }
  if(!email){ showToast('E-posta girin.'); return; }
  if(pass.length < 6){ showToast('Şifre en az 6 karakter olmalı.'); return; }
  const btn = document.getElementById('uSubmitBtn'); btn.disabled = true; btn.textContent = 'Açılıyor…';
  const r = await liveApi('POST', '/api/users', { email, name:p.name, password:pass, role:rol });
  if(!r.ok){ btn.disabled = false; btn.textContent = 'Hesabı Aç'; showToast(r.error); return; }
  p.kullanici = { email:email, rol:rol };
  closeModal(); renderContent();
  showToast(`${p.name} için giriş hesabı açıldı (${ROLE_CONFIG[rol].label}).`);

async function removeUser(pid){
  const p = PERSONELLER.find(x => x.id === pid);
  if(!p || !p.kullanici) return;
  if(p.kullanici.rol === 'YONETICI' && USERS.filter(u => u.role === 'YONETICI').length <= 1){
    showToast('Son yönetici hesabı kaldırılamaz.'); return;
  }
  if(LIVE.user && p.kullanici.email === LIVE.user.email){ showToast('Kendi hesabınızı kaldıramazsınız.'); return; }
  const r = await liveApi('DELETE', '/api/users', { email:p.kullanici.email });
  if(!r.ok && r.status !== 404){ showToast(r.error); return; }
  delete p.kullanici; renderContent(); showToast(`${p.name} — giriş hesabı kaldırıldı.`);
}

function webUrl(v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return 'https://' + s.replace(/^\/+/, '');
}
function socialUrl(base, v){
  if(!v) return '';
  const s = String(v).trim();
  if(/^https?:\/\//i.test(s)) return s;
  return base + s.replace(/^[\/@]+/, '');
}
function telHref(v){
  const d = String(v || '').replace(/[^\d+]/g, '');
  return d ? 'tel:' + d : '';
}
function waHref(v){
  let d = String(v || '').replace(/\D/g, '').replace(/^0+/, '');
  if(!d) return '';
  if(d.length === 10) d = '90' + d;          // 5xx xxx xx xx → 90 5xx...
  return 'https://wa.me/' + d;
}
function linkOr(href, inner, cls){
  return href
    ? `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

function daysLeft(iso){
  if(!iso) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.round((d - t)/86400000);
}
function dueStatus(n){
  if(n === null)                   return { cls:'none', text:'Tarih girilmedi' };
  if(n < 0)                        return { cls:'late', text:Math.abs(n)+' gün gecikti' };
  if(n === 0)                      return { cls:'late', text:'Bugün son gün' };
  if(n <= 7)                       return { cls:'crit', text:n+' gün kaldı' };
  if(n <= VEHICLE_ALERT_WINDOW)    return { cls:'soon', text:n+' gün kaldı' };
  return { cls:'ok', text:n+' gün kaldı' };
}
function plateHtml(p, sm){
  return '<span class="plate'+(sm?' sm':'')+'"><span class="plate-tr">TR</span><span class="plate-no">'+(p||'—')+'</span></span>';
}
function vehicleLabel(v){ return [v.brand, v.model, v.year].filter(Boolean).join(' ') || 'İsimsiz araç'; }
function money(n){ return '₺'+(Number(n)||0).toLocaleString('tr-TR'); }
function canSeeVehicles(){ return (roleCfg().yonetimSubs||[]).includes('araclarim'); }

function vehicleAlerts(){
  const out = [];
  VEHICLES.forEach(v => DATE_FIELDS.forEach(f => {

    if(n === null || n > VEHICLE_ALERT_WINDOW) return;
    out.push({ v:v, f:f, n:n, st:dueStatus(n) });
  }));
  return out.sort((a,b) => a.n - b.n);
}

        ${DATE_FIELDS.map(f => {
