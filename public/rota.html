        const d = a.tarih ? new Date(a.tarih + 'T00:00:00') : null;
        const p = PERSONELLER.find(x => x.id === a.sorumluId);
        const gecikti = a.tarih && a.tarih < bugun;
        return `<div class="da-chip ${gecikti ? 'gecikti' : ''}" onclick="selectSub('gorev-yonetimi','dis-alimlar')"
          title="${DA_TURLER[a.tur].ad}${a.not ? ' — ' + notEsc(a.not) : ''}">
          <b>${DA_TURLER[a.tur].ikon} ${notEsc(a.malzeme)}</b>
          <i>${notEsc(a.tedarikci || '')}${p ? ' · ' + notEsc(p.name.split(' ')[0]) : ''}</i>
          <u>${gecikti ? 'GECİKTİ · ' : ''}${d ? GUN_KISA[d.getDay()] + ' ' + d.getDate() + ' ' + PLAN_AYLAR[d.getMonth()] : 'tarih yok'}</u>
        </div>`;
      }).join('')}
    </div>`;
}

// ---------------- BİLDİRİMLER ----------------
// Kişiye özel bildirimler (buluta kaydedilir; diğer cihazlara 15 sn içinde düşer).
// Türler: 'atama' (iş/plan/dış alım ataması), 'silme-istegi' (yönetici onayı bekler), 'bilgi'.
let BILDIRIMLER = [];
let bildirimAcik = false;

function bildirimEkle(aliciEmail, metin, tip, ekstra){
  if(!aliciEmail) return;
  BILDIRIMLER.unshift(Object.assign(
    { id: benzersizId('b'), alici: aliciEmail, metin: metin, tip: tip || 'bilgi', tarih: Date.now(), okundu: false },
    ekstra || {}));
  if(BILDIRIMLER.length > 300) BILDIRIMLER.length = 300;
  renderBildirimler();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function bildirimYoneticilere(metin, tip, ekstra){
  const benimEmail = notKullanici();
  USERS.filter(u => u.role === 'YONETICI' && u.email !== benimEmail)
       .forEach(u => bildirimEkle(u.email, metin, tip, ekstra));
}
// Personel kimliklerinden kullanıcı hesabı olanlara atama bildirimi (kendine bildirim gitmez)
function bildirimAtama(personelIds, metin, ekstra){
  (personelIds || []).forEach(pid => {
    const p = PERSONELLER.find(x => x.id === pid);
    if(p && p.kullanici && p.kullanici.email && p.kullanici.email !== notKullanici())
      bildirimEkle(p.kullanici.email, metin, 'atama', ekstra);
  });
}
function benimBildirimlerim(){ return BILDIRIMLER.filter(b => b.alici === notKullanici()); }
function bildirimAcKapa(e){
  if(e) e.stopPropagation();
  bildirimAcik = !bildirimAcik;
  if(bildirimAcik){
    let degisti = false;
    benimBildirimlerim().forEach(b => { if(!b.okundu){ b.okundu = true; degisti = true; } });
    if(degisti && typeof liveMarkDirty === 'function') liveMarkDirty();
  }
  renderBildirimler();
}
function bildirimTemizle(){
  const ben = notKullanici();
  BILDIRIMLER = BILDIRIMLER.filter(b => b.alici !== ben || (b.tip === 'silme-istegi' && !b.sonuc));
  renderBildirimler();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function bildirimSatirHtml(b){
  const IKON = { atama:'📋', 'silme-istegi':'🗑️', bilgi:'ℹ️' };
  let aksiyon = '';
  if(b.tip === 'silme-istegi' && CURRENT_ROLE === 'YONETICI'){
    if(b.sonuc === 'silindi') aksiyon = '<div class="bildirim-sonuc">✓ Teklif silindi</div>';
    else if(b.sonuc === 'red') aksiyon = '<div class="bildirim-sonuc">✕ Reddedildi</div>';
    else if(b.sonuc === 'yok') aksiyon = '<div class="bildirim-sonuc">Teklif zaten silinmiş</div>';
    else aksiyon = `<div class="bildirim-aksiyon">
      <button class="onay" onclick="event.stopPropagation(); bildirimSilmeOnayla('${b.id}')">Teklifi Sil</button>
      <button class="red" onclick="event.stopPropagation(); bildirimSilmeReddet('${b.id}')">Reddet</button></div>`;
  }
  return `<div class="bildirim-satir ${b.okundu ? '' : 'yeni'}"${b.jobId ? ` style="cursor:pointer;" title="İşi aç" onclick="bildirimIseGit('${b.jobId}')"` : ''}>
    <span class="bildirim-ikon">${IKON[b.tip] || '🔔'}</span>
    <div class="bildirim-metin">${notEsc(b.metin)}${aksiyon}
      <div class="bildirim-zaman">${notZamanStr(b.tarih)}</div></div>
  </div>`;
}
function bildirimIseGit(jobId){
  const j = JOBS.find(x => x.id === jobId);
  if(!j){ showToast('Bu iş artık bulunamıyor (silinmiş olabilir).'); return; }
  bildirimAcik = false; renderBildirimler();
  if(roleCfg().tabs.includes('gorev-yonetimi')){
    pushHistory();
    currentPage = 'gorev-yonetimi';
    gorevSub = roleCfg().gorevSubs.includes('tum-isler') ? 'tum-isler' : (roleCfg().gorevSubs[0] || 'gorevlerim');
    boardFilterStage = null; openSubmenu = 'gorev-yonetimi';
    renderNav(); renderContent();
    if(typeof menuDaralt === 'function') menuDaralt(true);
    tarayiciGecmisYaz();
  }
  openJobDrawer(jobId);
}
function renderBildirimler(){
  const wrap = document.getElementById('bildirimWrap');
  if(!wrap) return;
  wrap.classList.toggle('open', bildirimAcik);
  const benim = benimBildirimlerim();
  const rozet = document.getElementById('bildirimRozet');
  if(rozet){ const n = benim.filter(b => !b.okundu).length; rozet.textContent = n ? String(n) : ''; }
  const el = document.getElementById('bildirimListe');
  if(el) el.innerHTML = benim.length
    ? benim.slice(0, 50).map(bildirimSatirHtml).join('')
    : '<div class="bildirim-bos">Bildirim yok.<br>Size iş atandığında veya onayınız gerektiğinde burada görünür.</div>';
}
document.addEventListener('click', e => {
  if(bildirimAcik && !e.target.closest('#bildirimWrap')){ bildirimAcik = false; renderBildirimler(); }
});
// Silme isteği kararları (yalnız yönetici panelinde görünür)
function bildirimSilmeOnayla(bid){
  const b = BILDIRIMLER.find(x => x.id === bid); if(!b) return;
  const q = QUOTES.find(x => x.id === b.quoteId);
  if(!q){ b.sonuc = 'yok'; renderBildirimler(); showToast('Teklif zaten silinmiş.'); return; }
  teklifSilUygula(q.id);
  b.sonuc = 'silindi';
  if(b.isteyen) bildirimEkle(b.isteyen, `${b.quoteNo} için silme isteğiniz onaylandı — teklif silindi.`, 'bilgi');
  renderBildirimler(); renderContent();
  showToast(`${b.quoteNo} ve bağlı kayıtları silindi.`);
}
function bildirimSilmeReddet(bid){
  const b = BILDIRIMLER.find(x => x.id === bid); if(!b || b.sonuc) return;
  b.sonuc = 'red';
  if(b.isteyen) bildirimEkle(b.isteyen, `${b.quoteNo} için silme isteğiniz reddedildi.`, 'bilgi');
  renderBildirimler();
  showToast('Silme isteği reddedildi.');
}

// ---------------- NOT DEFTERİ ----------------
// Kişiye özel hızlı notlar: telefonda konuşurken yazılır, iş gibi işaretlenip kapatılır.
// NOT_DEFTERI: { kullanıcıAnahtarı: [ {id, metin, tamam, tarih} ] } — buluta kaydedilir.
let NOT_DEFTERI = {};
let notAcik = false;
let notTamamAcik = false;
let notDuzenlenen = null;

function notKullanici(){
  if(typeof LIVE !== 'undefined' && LIVE.user && LIVE.user.email) return LIVE.user.email;
  const p = personelByRol(CURRENT_ROLE);   // önizleme modunda: role bağlı hesabın e-postası
  return (p && p.kullanici && p.kullanici.email) ? p.kullanici.email : ('demo-' + CURRENT_ROLE);
}
function notlarim(){
  const k = notKullanici();
  if(!Array.isArray(NOT_DEFTERI[k])) NOT_DEFTERI[k] = [];
  return NOT_DEFTERI[k];
}
function notEsc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function notZamanStr(ms){
  const d = new Date(ms);
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function notKaydet(){
  renderNotlar();
  if(typeof liveMarkDirty === 'function') liveMarkDirty();
}
function notAcKapa(){
  notAcik = !notAcik;
  document.getElementById('notWrap').classList.toggle('open', notAcik);
  if(notAcik){ const inp = document.getElementById('notInput'); if(inp) setTimeout(() => inp.focus(), 50); }
}
function notKeydown(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); notEkle(); }
}
function notEkle(){
  const inp = document.getElementById('notInput');
  const metin = inp.value.trim();
  if(!metin) return;
  notlarim().unshift({ id:'n' + Date.now(), metin: metin, tamam:false, tarih: Date.now() });
  inp.value = '';
  notKaydet();
  inp.focus();
}
function notToggle(id){
  const n = notlarim().find(x => x.id === id);
  if(!n) return;
  n.tamam = !n.tamam;
  if(n.tamam) notTamamAcik = true;
  notKaydet();
}
function notSil(id){
  const liste = notlarim();
  const i = liste.findIndex(x => x.id === id);
  if(i >= 0){ liste.splice(i, 1); notKaydet(); }
}
function notTamamlananlariTemizle(){
  const k = notKullanici();
  NOT_DEFTERI[k] = notlarim().filter(n => !n.tamam);
  notKaydet();
}
function notDuzenle(id){
  const n = notlarim().find(x => x.id === id);
  if(!n || n.tamam) return;
  notDuzenlenen = id;
  renderNotlar();
  const ta = document.getElementById('notDuzenleAlani');
  if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function notDuzenleBitir(id, deger){
  const n = notlarim().find(x => x.id === id);
  notDuzenlenen = null;
  if(n){ const m = String(deger).trim(); if(m) n.metin = m; }
  notKaydet();
}
function notDuzenleKeydown(e, id){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.target.blur(); }
  if(e.key === 'Escape'){ notDuzenlenen = null; renderNotlar(); }
}
function notSatirHtml(n){
  const duzenleniyor = notDuzenlenen === n.id;
  const metinHtml = duzenleniyor
    ? `<textarea id="notDuzenleAlani" class="not-duzenle-alani" rows="2"
         onblur="notDuzenleBitir('${n.id}', this.value)"
         onkeydown="notDuzenleKeydown(event,'${n.id}')">${notEsc(n.metin)}</textarea>`
    : `<div class="not-metin" ${n.tamam ? '' : `onclick="notDuzenle('${n.id}')" title="Düzenlemek için tıklayın"`}>${notEsc(n.metin)}<div class="not-zaman">${notZamanStr(n.tarih)}</div></div>`;
  return `
    <div class="not-satir ${n.tamam ? 'tamam' : ''}">
      <button class="not-check" title="${n.tamam ? 'Geri al' : 'Tamamlandı işaretle'}" onclick="notToggle('${n.id}')">${n.tamam ? '✓' : ''}</button>
      ${metinHtml}
      <button class="not-sil" title="Notu sil" onclick="notSil('${n.id}')">✕</button>
    </div>`;
}
function renderNotlar(){
  const wrap = document.getElementById('notWrap');
  if(!wrap) return;
  const liste = notlarim();
  const acik = liste.filter(n => !n.tamam);
  const tamam = liste.filter(n => n.tamam);
  const sayi = document.getElementById('notSayiTab');
  if(sayi) sayi.textContent = acik.length ? String(acik.length) : '';
  const el = document.getElementById('notListe');
  if(!el) return;
  let html = '';
  if(!liste.length){
    html = '<div class="not-bos">Henüz not yok.<br>Telefonda konuşurken aklınıza geleni buraya yazın;<br>bitince ✓ ile kapatın.</div>';
  } else {
    html = acik.map(notSatirHtml).join('');
    if(!acik.length) html += '<div class="not-bos">Açık not kalmadı 🎉</div>';
    if(tamam.length){
      html += `<div class="not-bolum">
        <span style="cursor:pointer;" onclick="notTamamAcik=!notTamamAcik; renderNotlar();">${notTamamAcik ? '▾' : '▸'} Tamamlananlar (${tamam.length})</span>
        <button onclick="notTamamlananlariTemizle()">Temizle</button></div>`;
      if(notTamamAcik) html += tamam.map(notSatirHtml).join('');
    }
  }
  el.innerHTML = html;
}

// ================= CANLI KATMAN — oturum, yükleme, otomatik kayıt =================
// Tüm veri tek JSON belgesi olarak /api/state'te tutulur. Her renderContent() sonrası
// değişiklik varsa 700 ms içinde kaydedilir; 15 sn'de bir diğer cihazların kayıtları çekilir.
const LIVE = { user:null, version:0, lastSaved:'', saving:false, timer:null, pending:false, conflict:false, booted:false };

const VARSAYILAN_KATEGORILER = () => [
  { id:'kd2', ad:'Maaş',  tip:'gider', sistem:true },
  { id:'kd3', ad:'Mesai', tip:'gider', sistem:true },
  { id:'kd5', ad:'Kartlı Alışveriş', tip:'gider', sistem:true },
];

function collectState(){
  return {
    AGENCY, CUSTOMERS, JOBS, QUOTES, PRODUCT_CATALOG, DEPOLAR, PROJELER_LIST, STOK_HAREKETLERI, GOREV_RAPORU,
    PLAN_TASKS, GENERAL_TASKS, KASA_ACCOUNTS, BANK_ACCOUNTS, CEK_SENET, GELIRLER, GIDERLER, PERSONELLER,
    KATEGORILER, MESAI_RATES, MESAI_KAYIT, VEHICLES, FATURALAR, NOT_DEFTERI, DIS_ALIMLAR, DIS_ALIM_HAREKET, BILDIRIMLER,
    CARI_HAREKETLER,
    MALZEME_FIYATLARI, KURLAR, MALIYET_SABLONLARI, KREDI_KARTLARI,
  };
}
function applyState(d){
  d = d || {};
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  CUSTOMERS = arr('CUSTOMERS'); JOBS = arr('JOBS'); QUOTES = arr('QUOTES');
  PRODUCT_CATALOG = arr('PRODUCT_CATALOG');
  DEPOLAR = Array.isArray(d.DEPOLAR) && d.DEPOLAR.length ? d.DEPOLAR : [ { name:'Ana Depo', adres:'', urunSayisi:0 } ];
  PROJELER_LIST = Array.isArray(d.PROJELER_LIST) && d.PROJELER_LIST.length ? d.PROJELER_LIST : ['Genel'];
  STOK_HAREKETLERI = arr('STOK_HAREKETLERI'); GOREV_RAPORU = arr('GOREV_RAPORU');
  PLAN_TASKS = arr('PLAN_TASKS'); GENERAL_TASKS = arr('GENERAL_TASKS');
  KASA_ACCOUNTS = arr('KASA_ACCOUNTS'); BANK_ACCOUNTS = arr('BANK_ACCOUNTS'); CEK_SENET = arr('CEK_SENET');
  GELIRLER = arr('GELIRLER'); GIDERLER = arr('GIDERLER'); PERSONELLER = arr('PERSONELLER');
  KATEGORILER = Array.isArray(d.KATEGORILER) && d.KATEGORILER.length ? d.KATEGORILER : VARSAYILAN_KATEGORILER();
  MESAI_RATES = (d.MESAI_RATES && typeof d.MESAI_RATES === 'object') ? d.MESAI_RATES : { normal:50, hafta:100, resmi:100 };
  MESAI_KAYIT = (d.MESAI_KAYIT && typeof d.MESAI_KAYIT === 'object') ? d.MESAI_KAYIT : {};
  VEHICLES = arr('VEHICLES'); FATURALAR = arr('FATURALAR');
  DIS_ALIMLAR = arr('DIS_ALIMLAR'); DIS_ALIM_HAREKET = arr('DIS_ALIM_HAREKET'); BILDIRIMLER = arr('BILDIRIMLER');
  CARI_HAREKETLER = arr('CARI_HAREKETLER');
  MALZEME_FIYATLARI = Array.isArray(d.MALZEME_FIYATLARI) && d.MALZEME_FIYATLARI.length ? d.MALZEME_FIYATLARI : VARSAYILAN_MALZEMELER();
  KURLAR = (d.KURLAR && typeof d.KURLAR === 'object' && !Array.isArray(d.KURLAR)) ? d.KURLAR : { usd:0, eur:0, tarih:'', kaynak:'' };
  MALIYET_SABLONLARI = arr('MALIYET_SABLONLARI');
  KREDI_KARTLARI = arr('KREDI_KARTLARI');
  NOT_DEFTERI = (d.NOT_DEFTERI && typeof d.NOT_DEFTERI === 'object' && !Array.isArray(d.NOT_DEFTERI)) ? d.NOT_DEFTERI : {};
  window.__onarimYapildi = (typeof veriOnar === 'function') ? !!veriOnar() : false;   // çift kimlik + yetim kayıt onarımı
  if(d.AGENCY && typeof d.AGENCY === 'object'){
    // Sunucudan gelen firma bilgileri varsayılanların üzerine yazılır (logo dahil, boş değilse)
    Object.keys(d.AGENCY).forEach(k => { if(d.AGENCY[k] !== undefined && d.AGENCY[k] !== null) AGENCY[k] = d.AGENCY[k]; });
  }
  // Eski SVG yer tutucu logo sunucuda kayıtlıysa gerçek Dekant logosuyla değiştirilir
  if(!AGENCY.logo || String(AGENCY.logo).startsWith('data:image/svg+xml')){
    AGENCY.logo = (typeof DEKANT_LOGO !== 'undefined') ? DEKANT_LOGO : AGENCY.logo;
    window.__onarimYapildi = true;
  }
}

function liveSetStatus(cls, text){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  el.className = 'preview-flag ' + cls;
  el.innerHTML = '●&nbsp;' + text;
  if(typeof mxKaydetYenile === 'function') mxKaydetYenile();   // maliyet ekranındaki Kaydet düğmesi
}
function liveZaman(){ return new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }); }

async function liveApi(method, url, body){
  try{
    const r = await fetch(url, { method, headers:{ 'Content-Type':'application/json' }, body: body ? JSON.stringify(body) : undefined, cache:'no-store' });
    let data = null; try { data = await r.json(); } catch(e) {}
    if(r.status === 401){ location.href = '/login'; return { ok:false, status:401, error:'Oturum süresi doldu' }; }
    return { ok:r.ok, status:r.status, data, error:(data && data.error) || (r.ok ? '' : 'İşlem başarısız (' + r.status + ')') };
  }catch(e){
    return { ok:false, status:0, data:null, error:'Sunucuya ulaşılamadı' };
  }
}

function liveMarkDirty(){
  if(!LIVE.booted) return;
  clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(() => liveSave(), 700);
}

async function liveSave(opts){
  opts = opts || {};
  if(!LIVE.booted || LIVE.conflict) return;
  if(LIVE.saving){ LIVE.pending = true; return; }
  const json = JSON.stringify(collectState());
  if(json === LIVE.lastSaved) return;
  LIVE.saving = true;
  liveSetStatus('saving', 'Kaydediliyor…');
  try{
    const r = await fetch('/api/state', {
      method:'PUT', headers:{ 'Content-Type':'application/json' }, cache:'no-store',
      body: '{"version":' + LIVE.version + ',"data":' + json + '}',
    });
    if(r.status === 409){
      LIVE.conflict = true;
      liveSetStatus('err', 'Çakışma — sayfa yenileniyor');
      showToast('Başka bir kullanıcı aynı anda kaydetti. Son değişikliğiniz alınamadı, sayfa yenileniyor.');
      setTimeout(() => location.reload(), 2500);
      return;
    }
    if(r.status === 401){ location.href = '/login'; return; }
    if(!r.ok){
      let msg = 'Kaydedilemedi'; try { msg = (await r.json()).error || msg; } catch(e) {}
      liveSetStatus('err', msg + ' — yeniden denenecek');
      return;
    }
    const d = await r.json();
    LIVE.version = d.version;
    LIVE.lastSaved = json;
    liveSetStatus('ok', 'Kaydedildi ' + liveZaman());
  }catch(e){
    liveSetStatus('err', 'Bağlantı yok — yeniden denenecek');
  }finally{
    LIVE.saving = false;
    if(LIVE.pending){ LIVE.pending = false; liveMarkDirty(); }
  }
}

// Kullanıcı bir formun içindeyse uzaktan gelen veriyi uygulamayı erteler (yazdığı silinmesin).
function liveFormdaMi(){
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(document.getElementById('overlay').classList.contains('show')) return true;
  const steps = [typeof kisilerStep !== 'undefined' && kisilerStep, typeof teklifStep !== 'undefined' && teklifStep,
                 typeof personelStep !== 'undefined' && personelStep, typeof aracStep !== 'undefined' && aracStep,
                 typeof gelirStep !== 'undefined' && gelirStep, typeof giderStep !== 'undefined' && giderStep,
                 typeof cekSenetStep !== 'undefined' && cekSenetStep];
  return steps.some(st => st === 'form' || st === 'type');
}

async function liveTick(){
  if(!LIVE.booted || LIVE.conflict) return;
  const json = JSON.stringify(collectState());
  if(json !== LIVE.lastSaved){ liveSave(); return; }
  if(LIVE.saving) return;
  try{
    const r = await fetch('/api/state?v=' + LIVE.version, { cache:'no-store' });
    if(r.status === 401){ location.href = '/login'; return; }
    if(!r.ok) return;
    const d = await r.json();
    if(d.unchanged || d.version === LIVE.version) return;
    if(liveFormdaMi()){ return; } // bir sonraki turda tekrar denenir
    applyState(d.data || {});
    LIVE.version = d.version;
    LIVE.lastSaved = JSON.stringify(collectState());
    if(window.__onarimYapildi){ LIVE.lastSaved = ''; }
    renderNav(); renderContent();
    if(typeof renderNotlar === 'function') renderNotlar();
    if(typeof renderBildirimler === 'function') renderBildirimler();
    liveSetStatus('ok', 'Güncellendi ' + liveZaman());
  }catch(e){ /* sessiz */ }
}

async function liveBoot(){
  const msg = document.getElementById('bootMsg');
  try{
    const me = await fetch('/api/auth/me', { cache:'no-store' });
    if(me.status === 401){ location.href = '/login'; return; }
    if(!me.ok) throw new Error('me ' + me.status);
    LIVE.user = await me.json();

    const st = await fetch('/api/state', { cache:'no-store' });
    if(st.status === 401){ location.href = '/login'; return; }
    if(!st.ok) throw new Error('state ' + st.status);
    const d = await st.json();
    LIVE.version = d.version || 0;
    applyState(d.data || {});
    LIVE.lastSaved = JSON.stringify(collectState());
    LIVE.booted = true;
    if(window.__onarimYapildi){ LIVE.lastSaved = ''; liveSave(); }   // temizlenen veri sunucuya da yazılsın

    document.getElementById('bootScreen').style.display = 'none';
    doLogin(LIVE.user.role);
    liveSetStatus('ok', 'Kaydedildi');
    setInterval(liveTick, 15000);
  }catch(e){
    msg.innerHTML = 'Veriler yüklenemedi. <a href="#" onclick="location.reload();return false;" style="color:var(--ink);">Yeniden dene</a>'
      + '<div style="font-family:var(--font-mono);font-size:11px;margin-top:8px;">' + String(e.message || e) + '</div>';
  }
}

// Her ekran çiziminden sonra değişiklik kontrolü
const _renderContentOrig = renderContent;
renderContent = function(){ _renderContentOrig(); liveMarkDirty(); };

// Sekme gizlenirken / kapanırken bekleyen değişikliği gönder
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') liveSave({ force:true }); });
window.addEventListener('pagehide', () => {
  if(!LIVE.booted || LIVE.conflict) return;
  const json = JSON.stringify(collectState());
  if(json === LIVE.lastSaved) return;
  try { navigator.sendBeacon('/api/state', new Blob(['{"version":' + LIVE.version + ',"data":' + json + '}'], { type:'application/json' })); } catch(e) {}
});

liveBoot();

function toggleTheme(){
  document.documentElement.classList.toggle('dark');
}
